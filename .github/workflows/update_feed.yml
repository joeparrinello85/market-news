name: Auto Update Market Feed

on:
  schedule:
    # Runs at the top of every hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows clicking "Run workflow" manually in GitHub

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install certifi

      - name: Run RSS Scraper
        run: |
          python rss_scraper.py

      - name: Commit and push updated index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update market news feed [skip ci]" || echo "No changes to commit"
          git push
