t to use it.</p><p style='margin-bottom: 1.25em;'>A high-yield account like a Wealthfront Cash Account can be a great place to grow your uninvested cash, offering both competitive interest rates and easy access to your money when you need it.</p><p style='margin-bottom: 1.25em;'>A Wealthfront Cash Account currently offers a base APY of 3.30% through program banks and new clients can get an extra 0.75% boost during their first three months on up to $150,000 for a total variable APY of 4.05%.</p><p style='margin-bottom: 1.25em;'>That's 10 times the national deposit savings rate, according to the FDIC's July report.</p><p style='margin-bottom: 1.25em;'>Additionally, Wealthfront is offering new clients who enable direct deposit ($1,000/month minimum) to their Cash Account and open and fund a new investment account an additional 0.25% APY increase with no expiration date or balance limit, meaning your APY could be as high as 4.30%.</p><p style='margin-bottom: 1.25em;'>Earning more on the cash you already have is one way to put your money to work. Another is to start investing money that might otherwise never make it into your portfolio.</p><p style='margin-bottom: 1.25em;'>Even if you're just starting out, you don't necessarily need a large lump sum. With a platform like Acorns, you can automatically invest spare change from your everyday purchases into a diversified portfolio of ETFs managed by experts at leading investment firms like Vanguard and BlackRock.</p><p style='margin-bottom: 1.25em;'>For instance, if you buy a donut for $3.25, Acorns can round up the purchase to $4 and invest the difference. That turns an everyday purchase into a 75-cent investment without requiring you to remember to transfer money into your investment account.</p><p style='margin-bottom: 1.25em;'>Putting more of your cash to work can help you make progress toward your financial goals, but deciding where your money should go \u2014 and which accounts and tax strategies make the most sense \u2014 can get complicated.</p><p style='margin-bottom: 1.25em;'>A financial advisor can help crunch the numbers and build a plan around your savings, investments, taxes and long-term goals. They can also help you weigh decisions such as when a Roth conversion makes sense and how it could affect your tax bill.</p><p style='margin-bottom: 1.25em;'>But hiring an advisor can be a lifelong commitment, which might make or break your retirement. That's why finding reliable advisors is crucial.</p><p style='margin-bottom: 1.25em;'>This is where Advisor.com comes in, connecting you with an expert near you \u2014 for free.</p><p style='margin-bottom: 1.25em;'>Advisor.com does the heavy lifting for you, vetting advisors based on track record, client ratios and regulatory background. Plus, their network comprises fiduciaries, meaning they're legally required to act in your best interests.</p><p style='margin-bottom: 1.25em;'>Just enter a few details about your finances and goals and Advisor.com's AI-powered matching tool will connect you with a qualified expert best suited for your needs based on your unique financial goals and preferences.</p><p style='margin-bottom: 1.25em;'>Finding the right advisor isn't always easy \u2014 there's no one-size-fits-all solution. That's why Advisor.com lets you set up a free initial consultation, with no obligation to hire, to see if they're the right fit for you.</p><p style='margin-bottom: 1.25em;'>You May Also Like</p><p style='margin-bottom: 1.25em;'>A single line on your car insurance policy could be inflating your premium by up to 30% \u2014 here's what to change</p>"}, {"id": 15, "source": "Yahoo Finance", "category": "markets", "title": "\u2018Always the best time to buy\u2019: Todd Nepola says real estate builds generational wealth. 4 ways to get in from $100", "link": "https://finance.yahoo.com/real-estate/articles/always-best-time-buy-todd-121500299.html", "iso_date": "2026-08-22T12:15:00+00:00", "date_str": "Aug 22 \u2022 12:15 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>\u2018Always the best time to buy\u2019: Todd Nepola says real estate builds generational wealth. 4 ways to get in from $100</p><p style='margin-bottom: 1.25em;'>Thomas Kent</p><p style='margin-bottom: 1.25em;'>5 min read</p><p style='margin-bottom: 1.25em;'>Moneywise and Yahoo Finance LLC may earn commission or revenue through links in the content below.</p><p style='margin-bottom: 1.25em;'>Florida real estate mogul Todd Nepola has spent nearly three decades making money from shopping centers. If he had to start over with $100,000, he says he would put it straight back into income-producing property.</p><p style='margin-bottom: 1.25em;'>\"I'd go right into a commercial property,\" Nepola said in a recent interview with Hard Truths CEO, a popular TikTok account (1). \"The truth is, multifamily's the easiest one to get into.\"</p><p style='margin-bottom: 1.25em;'>JPMorgan sees gold hitting $5,000/oz by Q4 \u2014 and savvy investors are protecting their wealth with a tax-advantaged Gold IRA. Get your free guide from Priority Gold</p><p style='margin-bottom: 1.25em;'>Nepola, the owner and founder of Current Capital Group, owns and operates retail and industrial properties across Florida. He suggested using the $100,000 as a down payment on a duplex or triplex worth between $300,000 and $400,000.</p><p style='margin-bottom: 1.25em;'>The investor would initially handle the leasing, maintenance and bookkeeping, according to Nepola. After improving the property and building equity, the owner could refinance, pull out some cash and purchase another building.</p><p style='margin-bottom: 1.25em;'>His answer became even more emphatic when he was asked when people should buy.</p><p style='margin-bottom: 1.25em;'>\"It's always the best time to buy real estate,\" Nepola said. \"If it's a bad market, it's a good time to buy, and if it's a good market, it's a good time to buy.\"</p><p style='margin-bottom: 1.25em;'>That advice sounds profoundly bold at a time when parts of Florida's housing market are cooling. Miami was considered a \"buyer's market\" in August 2026, with homes selling for an average of 3.23% below their asking prices and spending a median of 82 days on the market, according to Realtor.com (2).</p><p style='margin-bottom: 1.25em;'>Commercial real estate presents a different picture. Miami-Dade's retail vacancy rate fell to 3% during the second quarter of 2026, the lowest among South Florida's major markets. The county also recorded nearly 379,000 square feet of positive net absorption, per Colliers (3).</p><p style='margin-bottom: 1.25em;'>However, favorable market conditions cannot make every property a sound investment. At least, not without time on your side.</p><p style='margin-bottom: 1.25em;'>Why it's always time to buy</p><p style='margin-bottom: 1.25em;'>Nepola's argument depends on a long investment horizon.</p><p style='margin-bottom: 1.25em;'>\"If you're going in and saying, 'I'm going to buy this property and I'm going to keep it for 10, 20, 30 years,' it's always a good time to buy,\" he said in the interview.</p><p style='margin-bottom: 1.25em;'>Over time, rent can generate cash flow, tenants can help pay down the debt, and appreciation and improvements can increase the property's value. In fact, according to the UBS Global Family Office Report 2025, U.S. family offices held an average of 18% of their portfolios in real estate (4).</p><p style='margin-bottom: 1.25em;'>Consider Nepola's example of putting $100,000 down on a $400,000 property.</p><p style='margin-bottom: 1.25em;'>If the remaining $300,000 were financed for 30 years at 6.5% and the property appreciated by 3% annually, it would be worth approximately $538,000 after 10 years, while the mortgage balance would fall to roughly $254,000.</p><p style='margin-bottom: 1.25em;'>That would leave the investor with around $284,000 in equity before taxes, transaction costs and any additional capital invested. Net rental income could also add to the return.</p><p style='margin-bottom: 1.25em;'>This combination of rent, leverage, debt repayment and appreciation helps wealthy investors compound their fortunes and purchase additional properties.</p><p style='margin-bottom: 1.25em;'>\"Nobody can time a market,\" Nepola said. \"If anybody really knew, they'd be the richest man on Earth.\"</p><p style='margin-bottom: 1.25em;'>Of course, results will vary depending on the property, location, financing, tenants, fees and market conditions. Fortunately, you don't need to purchase and operate an entire building to participate.</p><p style='margin-bottom: 1.25em;'>Whether you have $100 or $100,000 to invest, here are four ways to add income-producing real estate to your portfolio.</p><p style='margin-bottom: 1.25em;'>But getting exposure to income-producing real estate doesn't necessarily require Nepola's $100,000 down payment. Platforms such as Arrived have opened the door to investors with considerably less capital.</p><p style='margin-bottom: 1.25em;'>Backed by world-class investors, including Jeff Bezos, Arrived allows you to invest in shares of vacation and rental properties, earning a passive income stream without the extra work that comes with being a landlord of your own rental property.</p><p style='margin-bottom: 1.25em;'>Each property is held through a standalone LLC, giving investors a fractional interest in the underlying real estate \u2014 not the platform. The team at mogul selects only the top 1% of properties it evaluates, and blockchain-based fractionalization adds a layer of safety, ensuring a permanent, verifiable record of each stake.</p><p style='margin-bottom: 1.25em;'>You can create an account, browse available properties and begin building a professionally managed rental portfolio in a few clicks.</p><p style='margin-bottom: 1.25em;'>Real estate with a bigger budget</p><p style='margin-bottom: 1.25em;'>Fractional properties can make real estate accessible with a smaller allocation. That said, if you're an accredited investor ready to commit more capital, you can move further up the ladder into institutional-quality, single-asset opportunities.</p><p style='margin-bottom: 1.25em;'>Accredited investors can now tap into this opportunity through platforms such as Lightstone DIRECT, which gives accredited investors access to single-asset multifamily and industrial deals.</p><p style='margin-bottom: 1.25em;'>Lightstone DIRECT's direct-to-investor model ensures a high degree of alignment between individual investors and a vertically-integrated, institutional owner-operator \u2014 a sophisticated and streamlined option for individual investors looking to diversify into private-market real estate.</p>"}, {"id": 16, "source": "Yahoo Finance", "category": "markets", "title": "BlockchAIn Digital Infrastructure Targets AI Data Centers With 65 MW of Contracted Power", "link": "https://finance.yahoo.com/technology/ai/articles/blockchain-digital-infrastructure-targets-ai-120158645.html", "iso_date": "2026-08-22T12:01:58+00:00", "date_str": "Aug 22 \u2022 12:01 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Key Points</p><p style='margin-bottom: 1.25em;'>-       Interested in BlockchAIn Digital Infrastructure, Inc? Here are five stocks we like better.</p><p style='margin-bottom: 1.25em;'>-       BlockchAIn Digital Infrastructure is pivoting from Bitcoin mining to AI and high-performance computing hosting, using pre-powered, pre-zoned sites and modular data halls. The company has 65 MW of contracted power, about 140 MW under development and roughly 570 MW of identified capacity.</p><p style='margin-bottom: 1.25em;'>-       AIB said it has six active customer discussions, including lease negotiations for up to 65 MW of utility load and 50 MW of critical IT load. Proposed leases would generally run 10\u201312 years, with electricity passed through to tenants and annual rent escalators.</p><p style='margin-bottom: 1.25em;'>-       The company raised $63 million in the second quarter and ended June with $52.8 million in cash and no traditional debt. It plans to use project-level financing for construction rather than funding a potential 65 MW data center entirely from its corporate balance sheet.</p><p style='margin-bottom: 1.25em;'>BlockchAIn Digital Infrastructure (NYSEAMERICAN:AIB) outlined its strategy to convert powered land and former Bitcoin mining sites into facilities designed for artificial intelligence hosting and high-performance computing workloads, emphasizing secured utility capacity, modular construction and tenant-provided GPUs.</p><p style='margin-bottom: 1.25em;'>During a conference presentation, CFO Jolienne Halisky said the company follows a \"power first\" approach, meaning it does not begin development based on expected future interconnection. Instead, each site is intended to be supported by an executed energy services agreement, or ESA, and access to generation and transmission infrastructure.</p><p style='margin-bottom: 1.25em;'>\u2192 Meta Platform's Legal Issues Could Become Much More Than A Q2 Earnings Headache</p><p style='margin-bottom: 1.25em;'>Halisky said the company has 65 megawatts of contracted power, about 140 MW under development and approximately 570 MW of total identified capacity. She cited the company's view that data-center power demand is growing more quickly than grid additions, while interconnection queues in major markets can stretch five to six years.</p><p style='margin-bottom: 1.25em;'>Focus on Powered Sites and Mid-Market Development</p><p style='margin-bottom: 1.25em;'>AIB Data Centers said its facilities are designed for AI and HPC deployments, with 150 kilowatts per rack, liquid cooling and N+1 redundancy. The company targets a nine- to 10-month delivery schedule by using pre-powered, pre-zoned sites and modular 10 MW data halls, according to Halisky.</p><p style='margin-bottom: 1.25em;'>\u2192 Moderna's 177% Surge Has Investors Asking What Comes Next</p><p style='margin-bottom: 1.25em;'>VP of Sales Gary Heitz said the company is concentrating on sites ranging from 50 MW to 150 MW. He said developments of that scale can be faster to build and may be less exposed to local moratoriums than larger campuses.</p><p style='margin-bottom: 1.25em;'>\"The bottleneck is not the land,\" Heitz said. \"It is the utility agreements. It is the transmissions. It is the delivery schedules.\"</p><p style='margin-bottom: 1.25em;'>\u2192 Microsoft's Sell-Off May Be a Gift, Not a Warning</p><p style='margin-bottom: 1.25em;'>Heitz said the company's team includes personnel with experience at companies including AWS, Digital Realty, Google and Dell, while its vendors and operating partners include firms such as CBRE, JLL and T5. Halisky said CEO Jerry's background combines banking, infrastructure development, commercial real estate, power and data-center experience.</p><p style='margin-bottom: 1.25em;'>Lease Discussions and Commercial Structure</p><p style='margin-bottom: 1.25em;'>The company said it has six active counterparties in discussions across GPU cloud platforms, sovereign AI infrastructure platforms, bare-metal GPU marketplaces, AI silicon companies and hosted infrastructure platforms. One counterparty is in lease negotiations for 65 MW of utility load and 50 MW of critical IT load, Halisky said.</p><p style='margin-bottom: 1.25em;'>Under the terms AIB described, leases would generally have initial terms of 10 to 12 years, two five-year renewal options and modified net structures. Electricity would be passed through to tenants, while the company would retain certain landlord costs such as property management and taxes. Halisky said the company also seeks annual escalators of 3% or the greater of 3% and CPI, along with 12 months of prepaid rent.</p><p style='margin-bottom: 1.25em;'>Heitz said negotiations for master service agreements can take up to a year, though he said the company has advanced several discussions within three months. The company's goal is to establish broader master service agreements that can support future service orders rather than renegotiating terms for each expansion, he said.</p><p style='margin-bottom: 1.25em;'>Transition Away From Bitcoin Mining</p><p style='margin-bottom: 1.25em;'>Halisky said AIB repurposed a previously operating 40 MW Bitcoin mining site for AI and HPC use during the first quarter. In March, the company began trading on the NYSE American and signed a letter of intent to lease 26 MW at the energized site. In May, it executed an ESA that increased power access to 65 MW and subsequently entered negotiations for a lease covering the full capacity, she said.</p><p style='margin-bottom: 1.25em;'>The company de-energized substantially all Bitcoin mining operations on June 5 after determining that its power cost exceeded the price it could charge Bitcoin hosting customers. Halisky said the company had been purchasing energy at $0.066 per kilowatt-hour and reselling it at $0.063 per kilowatt-hour.</p><p style='margin-bottom: 1.25em;'>She said the site has remained de-energized, creating a revenue gap while the company pursues its AI colocation strategy. Halisky said the company underwrites AI leases using a $0.07 per kilowatt-hour energy rate, with power costs passed through to tenants.</p><p style='margin-bottom: 1.25em;'>Second-Quarter Capital Position</p><p style='margin-bottom: 1.25em;'>In the second quarter, AIB raised $63 million in a follow-on offering with institutional investors and reported net proceeds of $59 million, Halisky said. The company ended June with $52.8 million in cash and no traditional debt.</p><p style='margin-bottom: 1.25em;'>Halisky said AIB does not plan to finance construction of a 65 MW data center entirely from its corporate balance sheet. On June 23, it formed AIBCLT1 LLC as a special-purpose entity intended to hold real-property interests, contracts and potential project-level financing. Corporate cash would fund development, deposits, long-lead equipment and the development team, while project financing would support construction, she said.</p><p style='margin-bottom: 1.25em;'>The company reported approximately 76 million shares outstanding and roughly 89 million fully diluted shares. Halisky also said SG&A expense rose to $2.7 million during the quarter as the company incurred costs associated with operating as a fully public company and building its development team.</p><p style='margin-bottom: 1.25em;'>About BlockchAIn Digital Infrastructure (NYSEAMERICAN:AIB)</p><p style='margin-bottom: 1.25em;'>BlockchAIn Digital Infrastructure Inc is engaged in the digital infrastructure business, providing data center operations and high-performance computing services. The company offers power infrastructure, hosting services, and equipment leasing to customers involved in blockchain computing, artificial intelligence, and high-performance data processing. Its operations include leasing space, power capacity, and equipment within data center facilities, as well as offering modular digital asset mining containers and related hardware and support services.</p><p style='margin-bottom: 1.25em;'>This instant news alert was generated by narrative science technology and financial data from MarketBeat in order to provide readers with the fastest reporting and unbiased coverage. Please send any questions or comments about this story to contact@marketbeat.com.</p><p style='margin-bottom: 1.25em;'>The article \"BlockchAIn Digital Infrastructure Targets AI Data Centers With 65 MW of Contracted Power\" was originally published by MarketBeat.</p><p style='margin-bottom: 1.25em;'>View MarketBeat's top stocks for August 2026.</p>"}, {"id": 17, "source": "Yahoo Finance", "category": "markets", "title": "Palantir, Freeport Clear Buy Points, Lead Five Stocks To Watch", "link": "https://www.investors.com/news/palantir-stock-freeport-mcmoran-stocks-near-buy-points/?src=A00220&yptr=yahoo", "iso_date": "2026-08-22T12:00:19+00:00", "date_str": "Aug 22 \u2022 12:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Palantir and Micron Technology lead this week's list of five stocks to watch. Guardant Health attempted to clear an early entry Friday and EOG Resources tested a buy point, while Freeport-McMoRan scored a breakout. The Dow Jones Industrial Average and other major indexes climbed modestly Friday, all trading around their 21-day moving average. IBD currently recommends 40% to 60% stock\u2026</p><p style='margin-bottom: 1.25em;'>Palantir, Freeport Clear Buy Points, Lead Five Stocks To Watch</p><p style='margin-bottom: 1.25em;'>Copyright \u00a92026 Investor's Business Daily, LLC. All rights reserved. 87990cbe856818d5eddac44c7b1cdeb8</p>"}, {"id": 18, "source": "Yahoo Finance", "category": "markets", "title": "Millions of US seniors could lose full Social Security COLAs. New proposal may preserve program, but here\u2019s who loses", "link": "https://finance.yahoo.com/economy/policy/articles/millions-us-seniors-could-lose-120000693.html", "iso_date": "2026-08-22T12:00:00+00:00", "date_str": "Aug 22 \u2022 12:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Millions of US seniors could lose full Social Security COLAs. New proposal may preserve program, but here\u2019s who loses</p><p style='margin-bottom: 1.25em;'>Laura Grande and Vishesh Raisinghani</p><p style='margin-bottom: 1.25em;'>7 min read</p><p style='margin-bottom: 1.25em;'>Moneywise and Yahoo Finance LLC may earn commission or revenue through links in the content below.</p><p style='margin-bottom: 1.25em;'>Social Security is a popular but expensive program.</p><p style='margin-bottom: 1.25em;'>With the trust fund facing depletion in just a few years, experts have suggested different ways to cut costs and make the program more sustainable, including raising the full retirement age or eliminating the payroll tax cap for high-income earners.</p><p style='margin-bottom: 1.25em;'>JPMorgan sees gold hitting $5,000/oz by Q4 \u2014 and savvy investors are protecting their wealth with a tax-advantaged Gold IRA. Get your free guide from Priority Gold</p><p style='margin-bottom: 1.25em;'>Now, the Committee for a Responsible Federal Budget (CRFB), a bipartisan nonprofit, is adding another innovative solution to the mix: limiting cost-of-living adjustments (COLA) for the highest-income earners (1).</p><p style='margin-bottom: 1.25em;'>In a white paper published in October that cites calculations by the Urban Institute, the organization says the proposed change \"could be a rapid, thoughtful and progressive way to help restore solvency and put Social Security on a sustainable path.\"</p><p style='margin-bottom: 1.25em;'>The proposal is still just that \u2014 a proposal. But the timing is becoming more urgent. The latest Social Security Trustees Report, released in June 2026, says the retirement trust fund is projected to run out of reserves in the fourth quarter of 2032. If Congress does nothing, incoming revenue would then be enough to pay just 78% of scheduled retirement benefits. The combined retirement and disability trust funds are projected to last until 2034, with 83% of scheduled benefits payable after reserves are depleted (2).</p><p style='margin-bottom: 1.25em;'>If implemented, this shift could make it difficult for some beneficiaries to sustain their purchasing power later in retirement.</p><p style='margin-bottom: 1.25em;'>And that matters because Social Security recipients are about to get another COLA (3). AARP's latest estimate is 3.5%. The official adjustment is expected in October, after September's inflation data is released (4).</p><p style='margin-bottom: 1.25em;'>Here's a closer look at why this change is being proposed and how it could impact your retirement plans.</p><p style='margin-bottom: 1.25em;'>What is COLA?</p><p style='margin-bottom: 1.25em;'>COLA is a mechanism built into the Social Security system that helps protect beneficiaries from the impact of inflation.</p><p style='margin-bottom: 1.25em;'>Initially, these adjustments were done on an ad-hoc basis and needed congressional approval. But when inflation flared up in the 1970s, Congress enacted a provision to allow for automatic annual COLAs. Since then, the annual COLA is linked to the Consumer Price Index for Urban Wage Earners and Clerical Workers (CPI-W), an official measure of the monthly price change in a basket of goods and services, such as food, energy and medical care.</p><p style='margin-bottom: 1.25em;'>For 2026, the Social Security Administration pegged COLA at 2.8% (5). That increase took effect with benefits payable in January 2026.</p><p style='margin-bottom: 1.25em;'>Looking ahead, inflation has cooled somewhat, but prices are still rising. July's CPI-W was up 3.4% from a year earlier, according to the Senior Citizens League. Based on the latest data, the group estimates a 3.6% COLA for 2027 \u2014 which would be the largest annual increase since 2023 if the estimate holds (3).</p><p style='margin-bottom: 1.25em;'>Under the CRFB's new proposal, all beneficiaries will continue to receive an annual COLA (1). However, retirees with the largest benefits \u2014 and typically the highest lifetime earnings \u2014 will face a fixed-dollar cap on their annual COLA.</p><p style='margin-bottom: 1.25em;'>So if COLA is 2% in a given year, someone who receives $50,000 in total annual benefits would typically see a $1,000 bump, but would now face a potential cap at $900 instead. Beneficiaries earning less than $45,000 would still see the full adjustment.</p><p style='margin-bottom: 1.25em;'>The $45,000 figure is just an example \u2014 it isn't a proposed income cutoff. Under CRFB's model, the cap would be based on the COLA received by beneficiaries around the 75th percentile of benefits.</p><p style='margin-bottom: 1.25em;'>This cap can be calculated in a variety of ways and for its white paper, the CRFB suggested setting the cap at the COLA received by the 75th percentile beneficiary based on their primary insurance amount (PIA) \u2014 the benefit a retiree would receive if they claimed at their full retirement age (FRA).</p><p style='margin-bottom: 1.25em;'>\"As with the benefit itself, the cap would be adjusted upward or downward based on collection age,\" explained the paper (1). \"For example, the cap would be reduced by 30% for those who began collecting at age 62 and increased by 24% for those who began collecting at age 70. Similarly, the cap would be adjusted for benefit type. For example, it would be half as high for a spousal benefit.\"</p><p style='margin-bottom: 1.25em;'>Under that version, roughly the top 25% of beneficiaries could eventually get smaller annual increases than they would under current law. But they wouldn't lose their COLA altogether.</p><p style='margin-bottom: 1.25em;'>In 2055, benefits would be 6% lower for the top quintile, including 7% lower for the top 5% of earners.</p><p style='margin-bottom: 1.25em;'>The CRFB's proposal may seem radical, but it reflects the real risk of cuts that all beneficiaries currently face.</p><p style='margin-bottom: 1.25em;'>And that's why the pressure to act is growing. Social Security checks wouldn't suddenly disappear if the trust funds run dry. But without congressional action, the program wouldn't have enough money to pay the full benefits promised under current law (2).</p><p style='margin-bottom: 1.25em;'>The latest Trustees Report also points to another recent pressure on the system: the One Big Beautiful Bill Act (OBBBA), signed into law in July 2025. By reducing the amount of Social Security benefits subject to federal income tax for some recipients, the law is expected to reduce revenue flowing into the program (2).</p><p style='margin-bottom: 1.25em;'>By focusing on high-income earners, the CRFB argues it is limiting the cuts to only those who can most afford it, while preserving the system for middle- and low-income retirees who need the COLA more.</p><p style='margin-bottom: 1.25em;'>According to its estimates, imposing a hard cap on the top 25% of Social Security beneficiaries could save $115 billion over 10 years, nearly 10% of the program's 75-year funding shortfall. Alternatively, if the cap applies at the 50th percentile, half of all beneficiaries would face a limit on their COLA adjustment and the system would save $385 billion over a decade.</p><p style='margin-bottom: 1.25em;'>The think tank acknowledges that a COLA cap would do little to delay insolvency on its own and other reforms will be needed. However, since it would improve solvency, it would shrink the coming cut and actually increase payable benefits by about 2% for those in the bottom three quintiles.</p><p style='margin-bottom: 1.25em;'>That's the key point because the COLA cap wouldn't fix Social Security on its own. CRFB sees it as one piece of a broader package of tax and benefit changes aimed at shrinking the program's long-term shortfall.</p><p style='margin-bottom: 1.25em;'>What comes next</p><p style='margin-bottom: 1.25em;'>It doesn't seem like lawmakers have commented on the CRFB's proposal, suggesting it hasn't drawn much attention in Washington. And the proposal remains one of many ideas circulating as lawmakers debate how to close Social Security's funding gap.</p><p style='margin-bottom: 1.25em;'>Lawmakers are still weighing other ways to shore up Social Security. The SSA's list of solvency proposals includes the \"We Can't Wait Act of 2026,\" introduced by Sens. Susan Collins and Maggie Hassan in February, showing that there's no shortage of ideas for closing the program's funding gap (6).</p><p style='margin-bottom: 1.25em;'>For retirees, that doesn't mean it's time to panic \u2014 or change a claiming strategy based on a proposal that isn't law. But it is a good reminder that future Social Security benefits aren't guaranteed to look exactly like they do today.</p><p style='margin-bottom: 1.25em;'>Taxpayers can expect some mix of adjustments or reforms, whether through higher revenues, slower benefit growth or structural tweaks, as politicians aim to avoid an abrupt reduction in payments.</p><p style='margin-bottom: 1.25em;'>For now, a full COLA is still the law and the 2027 increase is expected in October. But proposals like CRFB's offer a glimpse at what could be on the table if Congress eventually tackles Social Security's funding gap \u2014 and higher-income beneficiaries could be asked to give up some inflation protection in the process.</p><p style='margin-bottom: 1.25em;'>Prepare your finances now</p><p style='margin-bottom: 1.25em;'>Whether you're already retired or just getting started with your career, these reforms will likely impact you.</p><p style='margin-bottom: 1.25em;'>Changes to the program may mean smaller benefits, delayed payouts or adjustments to eligibility \u2014 all of which could leave future retirees needing to fill a bigger income gap on their own.</p><p style='margin-bottom: 1.25em;'>If you want to ensure you're maximizing your retirement contributions, it could pay to speak to a qualified financial advisor.</p><p style='margin-bottom: 1.25em;'>Research from Vanguard shows that working with a financial advisor can add about 3% to net returns over time. That difference can become substantial. For example, if you started with a $50,000 portfolio, professional guidance could mean more than $1.3 million in additional growth over 30 years, depending on market conditions and your investment strategy.</p><p style='margin-bottom: 1.25em;'>Finding the right advisor is simple with Advisor.com. Their platform connects you with licensed financial professionals in your area who can provide personalized guidance.</p><p style='margin-bottom: 1.25em;'>A professional advisor can also help you determine how many years you have left to invest before retirement and assess your comfort level with market fluctuations \u2014 two key factors in building the right asset mix for your portfolio.</p><p style='margin-bottom: 1.25em;'>As you get closer to retirement, every dollar starts to matter more. Rising health care costs, uncertain markets and fixed incomes can make it harder to stretch your savings \u2014 especially if you're trying to plan for decades ahead.</p><p style='margin-bottom: 1.25em;'>You might want to consider joining senior-focused organizations like AARP for discounts on almost everything \u2014 from prescriptions and dental plans to travel, entertainment and insurance.</p><p style='margin-bottom: 1.25em;'>As one of the most trusted organizations for older Americans, AARP not only offers money-saving perks, but they can also help you make informed financial and health decisions.</p><p style='margin-bottom: 1.25em;'>AARP members get access to guides that can help you make the most of Social Security, choose the right Medicare plan and uncover other government benefits \u2014 potentially saving you thousands.</p><p style='margin-bottom: 1.25em;'>Building a portfolio that can withstand inflation is another way to protect your finances. Certain assets have historically performed well during periods of rising prices, helping investors preserve their purchasing power.</p><p style='margin-bottom: 1.25em;'>Gold, for example, has long been viewed as a hedge against inflation. Because it isn't tied to the performance of any single currency or economy, gold is often regarded as a store of value when purchasing power is reduced.</p><p style='margin-bottom: 1.25em;'>A gold IRA is one option for building up your retirement fund with an inflation-hedging asset.</p><p style='margin-bottom: 1.25em;'>Opening a gold IRA with the help of Goldco allows you to invest in gold and other precious metals in physical forms while also providing the significant tax advantages of an IRA.</p><p style='margin-bottom: 1.25em;'>Real estate can be a useful source of income in retirement, but owning a rental property comes with plenty of work. For investors who want real estate exposure without taking on those responsibilities, there are other ways to get in.</p><p style='margin-bottom: 1.25em;'>One option is to invest in shares of vacation homes and rental properties through Arrived.</p><p style='margin-bottom: 1.25em;'>Backed by world-class investors, including Jeff Bezos, Arrived allows you to invest in shares of vacation and rental properties, earning potential passive income stream without the extra work that comes with being a landlord of your own rental property.</p><p style='margin-bottom: 1.25em;'>Once you're an investor with Arrived, you'll gain access to their newly launched quarterly secondary market, where investors can buy and sell shares of individual rental and vacation rental properties directly on the platform.</p><p style='margin-bottom: 1.25em;'>This allows you to buy into properties you may have missed at the initial offering or sell shares before a property reaches the end of its hold period.</p><p style='margin-bottom: 1.25em;'>And there are other ways to get a piece of the real estate market without buying an entire property.</p><p style='margin-bottom: 1.25em;'>Rental properties have long been a proven source of steady, passive income for high-net-worth investors. It's no wonder that real estate accounts for nearly 25% of the typical family office portfolio. However, the time, effort and costs involved in managing and maintaining multiple properties prevent many from investing. So unless you're a hedge fund titan or an oil baron, you've been shut out of one of the most profitable corners of the market.</p><p style='margin-bottom: 1.25em;'>Mogul offers a possible way to bridge this gap. This real estate investment platform offers fractional ownership in blue-chip rental properties, giving investors monthly rental income, real-time appreciation and tax benefits \u2014 without the need for a hefty down payment or 3 a.m. tenant calls.</p><p style='margin-bottom: 1.25em;'>Founded by former Goldman Sachs real estate investors, the team handpicks the top 1% of single-family rental homes nationwide for you. Simply put, you can invest in institutional-quality offerings for a fraction of the usual cost.</p><p style='margin-bottom: 1.25em;'>Each property undergoes a vetting process, requiring a minimum 12% return even in downside scenarios. Across the board, the platform features an average annual IRR of 18.8%. Their cash-on-cash yields, meanwhile, average between 10% and 12% annually. Offerings often sell out in under three hours, with investments typically ranging between $15,000 and $40,000 per property.</p><p style='margin-bottom: 1.25em;'>Every investment is secured by real assets, not dependent on the platform's viability. Each property is held in a standalone Propco LLC, so investors own the property \u2014 not the platform. Blockchain-based fractionalization adds a layer of safety, ensuring a permanent, verifiable record of each stake.</p><p style='margin-bottom: 1.25em;'>Getting started is a quick and easy process. You can sign up for an account and then browse available properties. Once you verify your information with their team, you can invest like a mogul in just a few clicks.</p><p style='margin-bottom: 1.25em;'>You May Also Like</p><p style='margin-bottom: 1.25em;'>A single line on your car insurance policy could be inflating your premium by up to 30% \u2014 here's what to change</p><p style='margin-bottom: 1.25em;'>Committee for a Responsible Federal Budget (1); Social Security Administration (2), (5); The Senior Citizens League (3); AARP (4); Social Security Actuarial Services (6).</p><p style='margin-bottom: 1.25em;'>This article provides information only and should not be construed as advice. It is provided without warranty of any kind.</p>"}, {"id": 19, "source": "Yahoo Finance", "category": "markets", "title": "S&P 500 dividend yield hits record low near 1% and it has some retirees rethinking their strategies", "link": "https://finance.yahoo.com/markets/stocks/articles/p-500-dividend-yield-hits-113500363.html", "iso_date": "2026-08-22T11:35:00+00:00", "date_str": "Aug 22 \u2022 11:35 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>S&P 500 dividend yield hits record low near 1% and it has some retirees rethinking their strategies</p><p style='margin-bottom: 1.25em;'>Aditi Ganguly</p><p style='margin-bottom: 1.25em;'>6 min read</p><p style='margin-bottom: 1.25em;'>Moneywise and Yahoo Finance LLC may earn commission or revenue through links in the content below.</p><p style='margin-bottom: 1.25em;'>Retirees have long depended on dividend stocks for a reason: The payouts show up whether or not you sell a single share.</p><p style='margin-bottom: 1.25em;'>Unfortunately, that plan is now getting harder to pull off because the S&P 500's dividend yield has been running just above 1%, the lowest reading on record, according to Charlie Bilello, chief market strategist at Creative Planning (1).</p><p style='margin-bottom: 1.25em;'>JPMorgan sees gold hitting $5,000/oz by Q4 \u2014 and savvy investors are protecting their wealth with a tax-advantaged Gold IRA. Get your free guide from Priority Gold</p><p style='margin-bottom: 1.25em;'>The payouts themselves haven't shrunk, but yield is dividends measured against price and prices have climbed far faster than payouts. The index crossed 7,700 for the first time in early August and because it weighs companies by market value, it now leans heavily on megacap tech names that pay little or nothing (2).</p><p style='margin-bottom: 1.25em;'>Steven Yedlin, a 75-year-old retired doctor in East Grand Rapids, Mich., has witnessed this firsthand. He told the Wall Street Journal (WSJ) that he built his portfolio around dividend ETFs and by the time he stopped working, his taxable account was split evenly between dividend funds and S&P 500 index funds (3).</p><p style='margin-bottom: 1.25em;'>\"Not much you can do about the yields,\" Yedlin said.</p><p style='margin-bottom: 1.25em;'>What he could do was change where the money goes. He shut off automatic reinvestment and the payouts now land in high-yield money-market funds \u2014 or he gives them to his kids.</p><p style='margin-bottom: 1.25em;'>Dividends can disappear overnight</p><p style='margin-bottom: 1.25em;'>Papa John's and UWM Holdings proved this possibility within two days of each other last week, scrapping their payouts. A dividend will last only as long as the board allows.</p><p style='margin-bottom: 1.25em;'>The pizza chain told the SEC on Aug. 6 that its board voted to suspend the quarterly dividend beginning in the third quarter, redirecting the cash toward franchise incentives, new point-of-sale technology and supply chain work (4). And looking closely, you'll see that the decision came out of a rough quarter \u2014 revenue fell 8.8% to $482.4 million and North America comparable sales dropped 8.3% \u2014 with CEO Todd Penegor conceding the turnaround is \"taking longer than anticipated\" (5). The board says it will revisit dividends and buybacks once the strategy delivers.</p><p style='margin-bottom: 1.25em;'>In a similar vein, the parent of United Wholesale Mortgage reported an Aug. 5 second-quarter net loss of $451.9 million on $888 million in revenue, alongside a $2.05 billion investment from Oaktree Capital Management and SFS Group Capital, a vehicle owned by the family of CEO Mat Ishbia (6). That money came in as preferred stock carrying a 10% cash dividend \u2014 13% if paid in kind (7). Shares fell about 35% the next day, CNBC reported (8).</p><p style='margin-bottom: 1.25em;'>Even when the checks from dividends keep coming, plenty of investors misread what those payments represent.</p><p style='margin-bottom: 1.25em;'>Finance professors Samuel Hartzmark and David Solomon named the mistake the \"free dividend fallacy\" (9): Treating a payout as bonus money layered on top of the share price.</p><p style='margin-bottom: 1.25em;'>In reality, when a company pays $ 1 per share, the stock drops by roughly $1 (10). Collect a $1,000 dividend or sell $1,000 of stock \u2014 once taxes and trading costs are counted, you're in nearly the same place.</p><p style='margin-bottom: 1.25em;'>Chasing yield anyway has a price, Hartzmark told the WSJ. Those investors tend to end up less diversified, with bigger tax bills, holding dividend stocks they overpaid for (3).</p><p style='margin-bottom: 1.25em;'>When stock prices climb faster than dividends, retirees relying on dividend stocks for income can find themselves in an awkward position. Their portfolios may be worth more, but the income they generate hasn't necessarily kept up.</p><p style='margin-bottom: 1.25em;'>That's where cash can play a bigger role.</p><p style='margin-bottom: 1.25em;'>While dividend yields have been shrinking, interest rates have remained relatively elevated as the Federal Reserve continues to weigh inflation and the risk of renewed price pressures. The Fed's July meeting minutes, released in mid-August, also showed that policymakers were considering raising rates as geopolitical tensions in the Middle East threaten to push energy prices higher again.</p><p style='margin-bottom: 1.25em;'>\"Many participants assessed that policy tightening would likely be necessary if inflation did not decline,\" stated the summary of the meeting. \"Some participants commented that financial conditions might not currently be sufficiently restrictive to facilitate a return of inflation to 2 percent\" (10).</p><p style='margin-bottom: 1.25em;'>For retirees, it creates an opportunity without taking on additional stock-market risk. A high-yield savings account can offer a place to park emergency savings or other cash while still earning interest and maintaining access to the money.</p><p style='margin-bottom: 1.25em;'>Open a high-yield account</p><p style='margin-bottom: 1.25em;'>A high-yield account like a Wealthfront Cash Account can be a great place to grow your uninvested cash, offering both competitive interest rates and easy access to your money when you need it.</p><p style='margin-bottom: 1.25em;'>A Wealthfront Cash Account currently offers a base APY of 3.30% through program banks and new clients can get an extra 0.75% boost during their first three months on up to $150,000 for a total variable APY of 4.05%.</p><p style='margin-bottom: 1.25em;'>That's ten times the national deposit savings rate, according to the FDIC's March report.</p><p style='margin-bottom: 1.25em;'>Additionally, Wealthfront is offering new clients who enable direct deposit ($1,000/month minimum) to their Cash Account and open and fund a new investment account an additional 0.25% APY increase with no expiration date or balance limit, meaning your APY could be as high as 4.30%.</p><p style='margin-bottom: 1.25em;'>After covering your emergency savings, consider whether some of your remaining cash could be set aside for a longer period. A certificate of deposit (CD) allows you to lock in an interest rate for a predetermined term, giving you a clearer picture of how much your money could earn.</p><p style='margin-bottom: 1.25em;'>That's different from a high-yield savings account, where the rate can change as the Federal Reserve moves interest rates. With a CD, you're trading some flexibility for greater certainty. For retirees who are already concerned about squeezed dividend yields, that predictability can be valuable.</p><p style='margin-bottom: 1.25em;'>For those seeking predictable, reliable growth, a platform like CD Valet can help you find higher-yield options that work for you, whether you're saving for something soon or building a cushion for the long haul.</p><p style='margin-bottom: 1.25em;'>The bigger lesson for retirees may be that income doesn't have to come from just one place. It can help to build multiple income streams rather than relying entirely on dividends or returns on savings accounts.</p><p style='margin-bottom: 1.25em;'>The goal isn't necessarily to abandon dividend stocks \u2014 it's to avoid making any one income source do all the heavy lifting.</p><p style='margin-bottom: 1.25em;'>Passive income can help create that cushion. Having money coming in from multiple sources could reduce the amount you need to withdraw from your investment portfolio each month, particularly during a market downturn when selling stocks may be less appealing.</p><p style='margin-bottom: 1.25em;'>Real estate has long been popular among investors looking for income. Rental properties can generate regular cash flow and rents may rise over time, potentially helping income keep pace with inflation.</p><p style='margin-bottom: 1.25em;'>The catch? Owning a rental property can be anything but passive. Repairs, vacancies, insurance, property taxes and tenant issues can quickly turn a passive income stream into a second job.</p><p style='margin-bottom: 1.25em;'>For retirees who want exposure to real estate without becoming landlords, crowdfunding platforms such as Arrived let you own shares of rental properties for as little as $100.</p><p style='margin-bottom: 1.25em;'>Arrived distributes any rental income generated by properties to investors monthly, allowing you to potentially set up a passive income stream without the extra work that comes with being a landlord of your own rental property.</p><p style='margin-bottom: 1.25em;'>Investors with larger portfolios can expand their real estate portfolio further.</p><p style='margin-bottom: 1.25em;'>Accredited investors can now tap into this opportunity through platforms such as Lightstone DIRECT, which gives accredited investors access to single-asset multifamily and industrial deals.</p><p style='margin-bottom: 1.25em;'>Lightstone DIRECT's direct-to-investor model ensures a high degree of alignment between individual investors and a vertically-integrated, institutional owner-operator \u2014 a sophisticated and streamlined option for individual investors looking to diversify into private-market real estate.</p><p style='margin-bottom: 1.25em;'>Charlie Bilello Blog (1), (2); The Wall Street Journal (3); U.S. Securities and Exchange Commission (4); Papa John's Investor Relations (5); UWM Holdings Investor Relations (6); Stock Titan (7); CNBC (8), (10); Chicago Booth Review (9)</p><p style='margin-bottom: 1.25em;'>This article provides information only and should not be construed as advice. It is provided without warranty of any kind.</p>"}, {"id": 20, "source": "Yahoo Finance", "category": "markets", "title": "Billionaire Leon Cooperman says today's AI boom echoes a big bust from the 1970s \u2014 a lesson from the 'Nifty Fifty' crash", "link": "https://finance.yahoo.com/markets/stocks/articles/billionaire-leon-cooperman-says-todays-113000015.html", "iso_date": "2026-08-22T11:30:00+00:00", "date_str": "Aug 22 \u2022 11:30 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Billionaire Leon Cooperman says today's AI boom echoes a big bust from the 1970s \u2014 a lesson from the 'Nifty Fifty' crash</p><p style='margin-bottom: 1.25em;'>Billionaire Leon Cooperman is issuing a stark warning for investors, laying out a troubling outlook for the U.S. economy that includes a recession sometime within the next year.</p><p style='margin-bottom: 1.25em;'>Speaking to CNBC, the famed investor and former Goldman Sachs CEO said today's market is reminiscent of past boom-and-bust cycles, including the 1970s Nifty Fifty era crash.</p><p style='margin-bottom: 1.25em;'>Must Read</p><p style='margin-bottom: 1.25em;'>-       Jeff Bezos backs a platform that lets anyone invest in rental homes for as little as $100 \u2014 6 ways to build wealth like a landlord without actually being one</p><p style='margin-bottom: 1.25em;'>-       Dave Ramsey warns nearly 50% of Americans are making 1 big Social Security mistake. Here's what it is and 3 simple steps to fix it ASAP</p><p style='margin-bottom: 1.25em;'>-       The tax breaks in Trump's 'big beautiful bill' expire after 2028. Here are 4 moves to make before the window closes</p><p style='margin-bottom: 1.25em;'>\"I think that we're going to have a recession sometime next year, and that will probably bring the market down,\" Cooperman told CNBC, according to Business Insider, adding that he thinks earnings estimates for the S&P 500 are mispriced.</p><p style='margin-bottom: 1.25em;'>Cooperman says signs indicate that the current economic cycle is coming to an end and stocks could be hit as AI hype begins to die down.</p><p style='margin-bottom: 1.25em;'>A journey back to the Nifty Fifty crash</p><p style='margin-bottom: 1.25em;'>Cooperman told CNBC that investors are ignoring the key threat of higher inflation, specifically the recent increase in oil prices. On Aug. 17, Brent crude \u2014 the international benchmark for oil \u2014 was trading 22% higher from levels prior to the start of the Iran war.</p><p style='margin-bottom: 1.25em;'>Cooperman argued higher inflation poses a risk to stock prices \u2014 drawing a comparison to the Nifty Fifty crash.</p><p style='margin-bottom: 1.25em;'>The Nifty Fifty was a group of 50 stocks considered that were, during the 1950s and 1960s, considered infallible. Household names like McDonald's, Polaroid and Disney were so attractive to investors that they believed they should always be bought and never sold, regardless of price.</p><p style='margin-bottom: 1.25em;'>Then the U.S. stock market entered a bear market between 1973 to 1974. Inflation was on the rise, interest rates were increasing and an oil crisis hit. The Nifty 50 significantly underperformed, with some stocks in the group dropping as much as 80% to 90%.</p><p style='margin-bottom: 1.25em;'>\"The three most dangerous words in investment land vocabulary are: 'It's different this time,'\" Cooperman told CNBC, referring to the current investment landscape. He also said he was \"negative\" on markets overall and is avoiding tech stocks in particular.</p><p style='margin-bottom: 1.25em;'>How Wall Street is feeling</p><p style='margin-bottom: 1.25em;'>Cooperman's comments come as the S&P 500 continues to trade near record highs. According to the latest update from FactSet, the benchmark index is on track to post year-over-year earnings growth of over 50% for the second quarter. If it happens, that would be the highest pace of earnings growth since 2021, amid the pandemic boom.</p>"}, {"id": 21, "source": "Yahoo Finance", "category": "markets", "title": "The ETF industry's newest asset class is absurdity: Chart of the Day", "link": "https://finance.yahoo.com/markets/article/the-etf-industrys-newest-asset-class-is-absurdity-chart-of-the-day-111704930.html", "iso_date": "2026-08-22T11:17:04+00:00", "date_str": "Aug 22 \u2022 11:17 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Wall Street will turn almost anything into an ETF these days. Your hockey team could be next.</p><p style='margin-bottom: 1.25em;'>CME announced plans last week for the first futures tied to the on-ice performance of individual NHL teams. Three days later, Volatility Shares filed for 32 ETFs designed to trade them \u2014 one for every team in the league. The underlying futures aren't even scheduled to start trading until Sept. 28, pending regulatory review.</p><p style='margin-bottom: 1.25em;'>And hockey is hardly alone.</p><p style='margin-bottom: 1.25em;'>More than 900 ETFs have already launched this year through Aug. 5, according to Baird Strategas, putting 2026 within striking distance of last year's record with nearly five months to go.</p><p style='margin-bottom: 1.25em;'>\"This is getting difficult to keep up with,\" Baird Strategas ETF strategist Todd Sohn wrote in an Aug. 11 note.</p><p style='margin-bottom: 1.25em;'>Then came last week's filings.</p><p style='margin-bottom: 1.25em;'>What Wall Street wants to turn into ETFs</p><p style='margin-bottom: 1.25em;'>These are registrations, not guarantees that any of the funds will ultimately launch. Sohn wrote that Baird \"highly doubt[s]\" the hockey ETFs will arrive anytime soon.</p><p style='margin-bottom: 1.25em;'>But ridiculous names don't necessarily mean ridiculous ideas.</p><p style='margin-bottom: 1.25em;'>The ETF has become a universal front-end for financial exposure. If Wall Street can define a trade, increasingly it can package it.</p><p style='margin-bottom: 1.25em;'>The Jensen fund pushes that idea in a genuinely new direction. Its proposed strategy would review a rolling 30-day body of Huang's public remarks and use them to identify investment themes for a portfolio of roughly 15 to 40 stocks. The filing even flags the possibility that Huang might speak less frequently as a risk to the strategy.</p><p style='margin-bottom: 1.25em;'>Oscar Wilde wrote that \"literature always anticipates life.\" On Wall Street, the meme increasingly anticipates the financial product.</p><p style='margin-bottom: 1.25em;'>Consider the \"Magnificent Seven.\" Wall Street already turned that nickname into the Roundhill Magnificent Seven ETF (MAGS). Now, after Tesla (TSLA) badly lagged the rest of the group over the past year, Global X has filed for a Magnificent Six ETF that simply leaves Tesla out.</p><p style='margin-bottom: 1.25em;'>The same proliferation has already hit thematic ETFs, where several funds can wind up chasing essentially the same narrow idea.</p><p style='margin-bottom: 1.25em;'>That brings the story back to hockey.</p><p style='margin-bottom: 1.25em;'>CME says its team-performance futures could give sponsors, broadcasters, arena operators, retailers, and other businesses a way to hedge economic exposure to how a team performs. But putting those futures inside an ETF doesn't guarantee somebody will always want the other side of the trade.</p><p style='margin-bottom: 1.25em;'>Sohn raises basic questions about how market makers would hedge the funds, how closely ETF prices would track their underlying value, and what happens during the offseason when there are no games.</p><p style='margin-bottom: 1.25em;'>Baird raises basic questions about how market makers would hedge the hockey funds, how closely ETF prices would track their underlying value, and what happens during the offseason when there are no games.</p><p style='margin-bottom: 1.25em;'>\"Launching an ETF is easier than ever. But the question someone has to ask themselves is a) what are they trying to solve for? And b) what is their distribution plan?\" Sohn told Yahoo Finance.</p><p style='margin-bottom: 1.25em;'>\"Attracting assets in a super competitive, perhaps saturated market is extremely challenging without firm plans for both of those.\"</p><p style='margin-bottom: 1.25em;'>Making a ticker is easier than making a market.</p><p style='margin-bottom: 1.25em;'>Jared Blikre is the global markets and data editor for Yahoo Finance. Follow him on X at @SPYJared or email him at jaredblikre@yahooinc.com.</p>"}, {"id": 22, "source": "Yahoo Finance", "category": "markets", "title": "\u2018I\u2019m really disgusted\u2019: Ohio pair worth $40M want a lake house HELOC \u2014 Dave Ramsey says to change their advisor instead", "link": "https://finance.yahoo.com/small-business/articles/m-really-disgusted-ohio-pair-111000109.html", "iso_date": "2026-08-22T11:10:00+00:00", "date_str": "Aug 22 \u2022 11:10 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>\u2018I\u2019m really disgusted\u2019: Ohio pair worth $40M want a lake house HELOC \u2014 Dave Ramsey says to change their advisor instead</p><p style='margin-bottom: 1.25em;'>Moneywise</p><p style='margin-bottom: 1.25em;'>5 min read</p><p style='margin-bottom: 1.25em;'>Moneywise and Yahoo Finance LLC may earn commission or revenue through links in the content below.</p><p style='margin-bottom: 1.25em;'>If you own a home and need money, a home equity line of credit (HELOC) allows you to borrow against your home's equity, typically at a lower interest rate than other loan types. It can be a useful tool for disciplined borrowers facing a large expense. The potential downside is that you could lose your home, which is used as collateral.</p><p style='margin-bottom: 1.25em;'>According to Dave Ramsey, a HELOC should be off the table when you have a net worth of $40 million.</p><p style='margin-bottom: 1.25em;'>JPMorgan sees gold hitting $5,000/oz by Q4 \u2014 and savvy investors are protecting their wealth with a tax-advantaged Gold IRA. Get your free guide from Priority Gold</p><p style='margin-bottom: 1.25em;'>Ashley from Columbus, Ohio, called into The Ramsey Show and told the namesake host she and her well-to-do husband were contemplating a HELOC on their vacation home to supplement their income on the advice of their financial advisor.</p><p style='margin-bottom: 1.25em;'>\"There's no possible way that borrowing on your lake house is a good idea when you have $40 million,\" Ramsey said in a clip (1) posted on August 18. \"I'm really disgusted at how pitiful your financial advisor is. This is just asinine.\"</p><p style='margin-bottom: 1.25em;'>As it turns out, the couple's money problems go far deeper than a quirky financial advisor.</p><p style='margin-bottom: 1.25em;'>Why a couple worth $40 million wants to borrow money</p><p style='margin-bottom: 1.25em;'>Ashley explained that part of the problem is that approximately $30 million of the couple's net worth is tied up in a business her husband co-owns. However, her husband isn't on the board of directors and has no control over redemptions of shares. The board has been restrictive about redemptions, Ashley said/. This means the couple can't freely access the money.</p><p style='margin-bottom: 1.25em;'>But that still leaves $10 million, Ramsey pointed out, so what's the deal? Ashley revealed $4 million had been tucked away for retirement. She says that the remainder and her husband's estimated $400,000 in annual income is not enough to support their lifestyle.</p><p style='margin-bottom: 1.25em;'>What type of lifestyle were they living? Apparently, the kind that includes maintaining two homes, house staff, a horse farm, chartered yachts and private jets. Ashley also alluded to alimony payments being made to an ex-wife. She admitted the couple spent upwards of $1.5 million in a year but has since reigned in their spending.</p><p style='margin-bottom: 1.25em;'>Ramsey said the answer to their problems, rather than borrowing money, was for the couple to learn to live within their (substantial) means.</p><p style='margin-bottom: 1.25em;'>\"The last thing you people need to do is to go into debt by renting a yacht,\" he insisted. \"Cut your freaking lifestyle.\"</p><p style='margin-bottom: 1.25em;'>It's important to live within your means, no matter your income. In Ashley's case, that could mean keeping both homes but traveling more frugally and keeping other costs down.</p><p style='margin-bottom: 1.25em;'>Tapping into tax-advantaged investment opportunities rather than your home equity might be a better way to grow your wealth.</p><p style='margin-bottom: 1.25em;'>For instance, Ashley and her husband could consider investing in commercial real estate, which has major tax benefits, including the ability to depreciate the property's value annually and list this amount as an expense on their property's income statement \u2013 reducing their taxable income and leading to long-term tax savings.</p><p style='margin-bottom: 1.25em;'>Additionally, they may want to consider divesting from her husband's business as Ramsey suggested. This could free up the equity so they can invest it in real estate elsewhere for passive income without needing to borrow against their current vacation property.</p><p style='margin-bottom: 1.25em;'>And the couple doesn't have to leverage their own lake house as a rental or buy new property outright, which may come with additional costs and management issues.</p><p style='margin-bottom: 1.25em;'>Mogul is a real estate investment platform offering fractional ownership in blue-chip rental properties, giving investors monthly rental income, real-time appreciation and tax benefits \u2014 without the need for a hefty down payment or 3 a.m. tenant calls.</p><p style='margin-bottom: 1.25em;'>Each property undergoes a vetting process, requiring a minimum 12% return even in downside scenarios. Across the board, the platform features an average annual IRR of 18.8%. Their cash-on-cash yields, meanwhile, average between 10 to 12% annually. Offerings often sell out in under three hours, with investments typically ranging between $15,000 and $40,000 per property.</p><p style='margin-bottom: 1.25em;'>Every investment is secured by real assets, not dependent on the platform's viability. Each property is held in a standalone Propco LLC, so investors own the property \u2014 not the platform. Blockchain-based fractionalization adds a layer of safety, ensuring a permanent, verifiable record of each stake.</p><p style='margin-bottom: 1.25em;'>Getting started is a quick and easy process. You can sign up for an account and then browse available properties. Once you verify your information with their team, you can invest like a mogul in just a few clicks.</p><p style='margin-bottom: 1.25em;'>Don't let your financial advisor lead you astray</p><p style='margin-bottom: 1.25em;'>As for the financial advisor who suggested a HELOC, the host recommended the couple hire a new one.</p><p style='margin-bottom: 1.25em;'>\"This one's an idiot,\" Ramsey said.</p><p style='margin-bottom: 1.25em;'>Working with a financial advisor could help those in Ashley's situation meet near- and long-term goals. And for investors with portfolios of $250,000 or more, financial decisions often become increasingly nuanced.</p><p style='margin-bottom: 1.25em;'>In these cases, working with a financial advisor can help reduce costly mistakes.</p><p style='margin-bottom: 1.25em;'>For those with portfolios of $250,000 or more, platforms like WiserAdvisor can connect you with vetted professionals who specialize in this kind of planning.</p><p style='margin-bottom: 1.25em;'>Simply answer a few questions about your savings, retirement timeline and overall investment portfolio.</p><p style='margin-bottom: 1.25em;'>From there, WiserAdvisor reviews its network to match you \u2014 for free \u2014 with up to three vetted, reputable advisors aligned with your specific needs.</p><p style='margin-bottom: 1.25em;'>WiserAdvisor is a matching service and does not provide financial advice directly. All matched advisors are third parties, and specific financial results are not guaranteed.</p><p style='margin-bottom: 1.25em;'>Ultimately, Ashley acknowledged the couple's spending was out of control and that they need to take a more hands-on approach to their finances. What the couple really needs isn't a HELOC, but a lifestyle adjustment and a way to boost their wealth while maintaining their budget.</p><p style='margin-bottom: 1.25em;'>- With files from Maurie Backman.</p><p style='margin-bottom: 1.25em;'>You May Also Like</p><p style='margin-bottom: 1.25em;'>A single line on your car insurance policy could be inflating your premium by up to 30% \u2014 here's what to change</p>"}, {"id": 23, "source": "Yahoo Finance", "category": "markets", "title": "Airbnb Just Hit a Four-Year High. The Downgrade Says That\u2019s the Problem.", "link": "https://finance.yahoo.com/markets/stocks/articles/airbnb-just-hit-four-high-110129364.html", "iso_date": "2026-08-22T11:01:29+00:00", "date_str": "Aug 22 \u2022 11:01 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Airbnb, Inc. (NASDAQ:ABNB) did everything bulls wanted. The company's Q2 revenue, reported on August 6, 2026, highlighted a 17% rise in revenue to $3.6 billion, a 16% increase in gross booking value to $27.2 billion, and a net income of $816 million. Its management lifted full-year guidance on both revenue and margins, reflecting the AI story in its numbers. The stock ran to a four-year high near $184, up 32% year to date. Then, on August 11, Phillip Securities's Paul Chew downgraded the stock to Reduce even as he raised his target to $158 \u2014 still about 14% below the price. This contradiction gives a whole new story.</p><p style='margin-bottom: 1.25em;'>The Quarter Was Real. That's the Point.</p><p style='margin-bottom: 1.25em;'>Under the microscope, there is nothing to nitpick in the print. But that is exactly why the downgrade matters. The AI payoff is tangible. An AI assistant now resolves nearly 45% of issues without human intervention. Subsequently, the customer-support cost per booking fell 16%. Additionally, the pace of product shipping in the first half ran roughly 80% ahead of the same period last year while cutting concept-to-launch time by up to 60%. Adjusted EBITDA margin guidance moved up to approximately 35.5%. With such a great quarter, an already expensive stock is made more expensive.</p><p style='margin-bottom: 1.25em;'>30x Is the Whole Debate</p><p style='margin-bottom: 1.25em;'>Airbnb trades near 30.9 times earnings, above its own two-year-plus-one-standard-deviation of 29.6x, and on a trailing basis closer to 41.7x. Let's compare this against the peers. Yahoo Finance currently puts Booking Holdings at roughly 20 times forward earnings and Expedia near 17 times, versus about 35 times for Airbnb. It means that Airbnb premium is substantial even with less than half of Booking's scale. Meanwhile, the premium-assumed growth is cooling at the edges. Nights and Seats Booked grew 10%, trailing the 17% revenue gain, and take rate was flat at 13.2%. Instead of an upside, the reacceleration and the AI payoff are becoming assumptions baked into the price.</p><p style='margin-bottom: 1.25em;'>Everyone's Already Long</p><p style='margin-bottom: 1.25em;'>Positioning confirms the market concentration on the stock. Insider Monkey database recorded 87 funds holding ownership in the first quarter of 2026 \u2013 up from 80 in Q4 2025. Short interest sits at just 3.39% of float as of mid-August. Q3 revenue guidance of $4.69 billion to $4.77 billion provides the next test.</p><p style='margin-bottom: 1.25em;'>Bottom Line</p><p style='margin-bottom: 1.25em;'>Airbnb, Inc. (NASDAQ:ABNB)'s second quarter is excellent. But the downgrade is a tell that easy money has been made. With earnings two or three times its competitors and with its long side already packed, the risk-reward is flipping. Do not chase the four-year high. Use the core metrics like take rates and room-night growth against the Q3 guide of $4.69\u20134.77 billion to determine if the stock really deserves the premium.</p>"}, {"id": 24, "source": "Yahoo Finance", "category": "markets", "title": "Intuitive Machines Misses Big on Earnings. Stifel Upgrades It Anyway", "link": "https://finance.yahoo.com/markets/stocks/articles/intuitive-machines-misses-big-earnings-105201031.html", "iso_date": "2026-08-22T10:52:01+00:00", "date_str": "Aug 22 \u2022 10:52 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Intuitive Machines, Inc. (NASDAQ:LUNR) recently released one of its messier quarterly reports as a public company, missing revenue and earnings by significant percentages. Stifel responded by upgrading the stock.</p><p style='margin-bottom: 1.25em;'>A Wide Miss</p><p style='margin-bottom: 1.25em;'>Shares of the company plunged as much as 13% on August 13 when it released second-quarter earnings indicating an adjusted loss of $0.29 per share, far exceeding the $0.09 loss analysts had predicted, resulting in a negative surprise of more than 200%. Revenue came in at $206.2 million, more than quadrupling from $50.3 million the previous year, but still behind the $224 million consensus. Adjusted EBITDA was a $13.8 million loss, compared to forecasts of a $2.8 million profit.</p><p style='margin-bottom: 1.25em;'>The Backlog Behind the Upgrade</p><p style='margin-bottom: 1.25em;'>Despite the miss, Stifel upgraded Intuitive Machines, Inc. (NASDAQ:LUNR) to Buy from Hold, and reduced its price objective to $26 from $32. The firm's argument relied on backlog: Intuitive's order book increased $707 million during the quarter, from $1.05 billion to $1.76 billion, up from $213.1 million at the end of 2025, with a book-to-bill ratio of 4.5x. More than $600 million of the increase came from three commercial geostationary satellite agreements, while a July deal covering 18 spacecraft for the Golden Dome missile-defense network highlighted the company's expansion beyond the lunar-lander missions that initially grabbed investor interest.</p><p style='margin-bottom: 1.25em;'>What Went Wrong</p><p style='margin-bottom: 1.25em;'>The earnings miss was fairly specific and, according to Stifel, largely explainable. The EBITDA shortfall was caused by a negative estimate-at-completion adjustment on the IM-4 lunar lander program, an accounting catch-up representing higher estimated costs which is reportedly linked to a $14.7 million charge for mid-development payload revisions.</p><p style='margin-bottom: 1.25em;'>Management remained firm on its guidance. Despite the setback, CEO Steve Altemus described the quarter as positive, highlighting revenue that was more than four times more than the previous year, exceptional bookings, and a backlog that positions the company for its next growth phase. In that vein, the company reiterated its full-year revenue range for 2026 of $900 million to $1 billion, as well as its expectation for positive adjusted EBITDA.</p><p style='margin-bottom: 1.25em;'>Institutional Positioning</p><p style='margin-bottom: 1.25em;'>Leading up to the announcement, institutional sentiment showed resilience. Hedge fund holdings increased from 28 in Q4 to 30 in Q1and 32 in Q2. Short interest, on the other hand, is at a high 25.46% of the float, indicating concern about execution and contract profitability.</p>"}, {"id": 25, "source": "Yahoo Finance", "category": "markets", "title": "A stolen wallet gives thieves access to your identity and finances \u2014 here's what to do before the damage spreads", "link": "https://finance.yahoo.com/markets/articles/stolen-wallet-gives-thieves-access-100000938.html", "iso_date": "2026-08-22T10:00:00+00:00", "date_str": "Aug 22 \u2022 10:00 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>A stolen wallet gives thieves access to your identity and finances \u2014 here's what to do before the damage spreads</p><p style='margin-bottom: 1.25em;'>In April 2026, wallets, purses, and other belongings started disappearing out of cars parked around fitness centers across Fairfax County in Alexandria, Virginia, according to The Alexandria Brief. In late June, the Alexandria Police Department arrested a man who they say was taking these belongings from unlocked cars and using stolen credit cards to purchase gift cards at nearby retailers before the victims realized their things had been stolen.</p><p style='margin-bottom: 1.25em;'>While cash and credit cards are the obvious targets in wallet theft, your personal identification may be even more valuable in the wrong hands. Documents often found in your wallet, like your social security card, driver's license, and health insurance card can give thieves access to your identity and finances. If left unchecked, you could be liable for the damage someone else causes in your name.</p><p style='margin-bottom: 1.25em;'>Must Read</p><p style='margin-bottom: 1.25em;'>-       Jeff Bezos backs a platform that lets anyone invest in rental homes for as little as $100 \u2014 6 ways to build wealth like a landlord without actually being one</p><p style='margin-bottom: 1.25em;'>-       Dave Ramsey warns nearly 50% of Americans are making 1 big Social Security mistake. Here's what it is and 3 simple steps to fix it ASAP</p><p style='margin-bottom: 1.25em;'>-       The tax breaks in Trump's 'big beautiful bill' expire after 2028. Here are 4 moves to make before the window closes</p><p style='margin-bottom: 1.25em;'>Here's what to do if your wallet is stolen and how to mitigate the risks of identity theft.</p><p style='margin-bottom: 1.25em;'>What to do if your wallet is stolen</p><p style='margin-bottom: 1.25em;'>How you react to a stolen or lost wallet will depend on what you carry in it. Regardless, time is of the essence.</p><p style='margin-bottom: 1.25em;'>If you report your debit card missing before any unauthorized charges are made, you are not responsible for any of those charges. You'll be responsible for up to $50 if you report a missing debit card within two business days of an unauthorized charge, according to the Federal Trade Commission (FTC). After two business days, but within 60 calendar days after your statement is sent to you, you'll be responsible for up to $500 of unauthorized charges. Beyond 60 calendar days, any money in your accounts is unprotected. Someone with your debit card could clean out your account \u2014 and possibly any accounts linked to your debit \u2014 and you'll be left with no recourse.</p><p style='margin-bottom: 1.25em;'>You have more protections with unauthorized credit card charges. You're only responsible for up to $50 under the Fair Credit Billing Act. However, most credit cards and some debit cards have zero-liability fraud protection, which means cardholders aren't responsible for unauthorized charges as long as they report it.</p><p style='margin-bottom: 1.25em;'>Even if you think you just misplaced your wallet, it may still be worth your time to notify your issuers and freeze your cards.</p>"}, {"id": 26, "source": "Yahoo Finance", "category": "markets", "title": "Best CD rates today, Saturday, August 22, 2026: Best CD account earns 4.35% APY", "link": "https://finance.yahoo.com/personal-finance/banking/article/best-cd-rates-today-saturday-august-22-2026-best-cd-account-earns-435-apy-100000592.html", "iso_date": "2026-08-22T10:00:00+00:00", "date_str": "Aug 22 \u2022 10:00 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Some offers on this page are from advertisers who pay us, which may affect which products we write about, but not our recommendations. See our Advertiser Disclosure.</p><p style='margin-bottom: 1.25em;'>Find out how much you could earn by locking in a high CD rate today. The Federal Reserve cut its federal funds rate three times in 2025. So far in 2026, the Fed has left interest rates alone, and so now could be your last chance to lock in a competitive CD rate before rates move further. CD rates vary widely across financial institutions, so it's important to ensure you're getting the best rate possible when shopping around for a CD.</p><p style='margin-bottom: 1.25em;'>The following is a breakdown of CD rates today and where to find the best offers.</p><p style='margin-bottom: 1.25em;'>CD rates today, Saturday, August 22, 2026</p><p style='margin-bottom: 1.25em;'>Generally, the best CD rates today are offered on shorter terms of around one year or less. Online banks and credit unions, in particular, offer the top CD rates.</p><p style='margin-bottom: 1.25em;'>Today, Saturday, August 22, 2026, the highest CD rate is 4.35%. This rate is offered by Sallie Mae on its 3-year CD.</p><p style='margin-bottom: 1.25em;'>Here is a look at some of the best CD rates available today:</p><p style='margin-bottom: 1.25em;'>How much interest can I earn with a CD?</p><p style='margin-bottom: 1.25em;'>The amount of interest you can earn from a CD depends on the annual percentage rate (APY). This is a measure of your total earnings after one year, taking into account the base interest rate and how often interest compounds (CD interest typically compounds daily or monthly).</p><p style='margin-bottom: 1.25em;'>Say you invest $1,000 in a one-year CD with 1.52% APY, and interest compounds monthly. At the end of that year, your balance would grow to $1,015.20 \u2014 your initial $1,000 deposit, plus $15.20 in interest.</p><p style='margin-bottom: 1.25em;'>Now let's say you choose a one-year CD that offers 4% APY instead. In this case, your balance would grow to $1,040.74 over the same period, which includes $40.74 in interest.</p><p style='margin-bottom: 1.25em;'>The more you deposit in a CD, the more you stand to earn. If we used the same example of a one-year CD at 4% APY but deposited $10,000, your total balance when the CD matures would be $10,407.42, meaning you'd earn $407.42 in interest.</p><p style='margin-bottom: 1.25em;'>Read more: What is a good CD rate?</p><p style='margin-bottom: 1.25em;'>Types of CDs</p><p style='margin-bottom: 1.25em;'>When choosing a CD, the interest rate is usually top of mind. However, the rate isn't the only factor you should consider. There are several types of CDs that offer different benefits, though you may need to accept a slightly lower interest rate in exchange for more flexibility. Here's a look at some of the common types of CDs you can consider beyond traditional CDs:</p><p style='margin-bottom: 1.25em;'>-       Bump-up CD: This type of CD allows you to request a higher interest rate if your bank's rates go up during the account's term. However, you're usually allowed to \"bump up\" your rate just once.</p><p style='margin-bottom: 1.25em;'>-       No-penalty CD: Also known as a liquid CD, this type of CD allows you to withdraw funds before maturity without penalty.</p><p style='margin-bottom: 1.25em;'>-       Jumbo CD: These CDs require a higher minimum deposit (usually $100,000 or more), and often offer a higher interest rate in return. In today's CD rate environment, however, the difference between traditional and jumbo CD rates may not be much.</p><p style='margin-bottom: 1.25em;'>-       Brokered CD: As the name suggests, these CDs are purchased through a brokerage rather than directly from a bank. Brokered CDs can sometimes offer higher rates or more flexible terms, but they also carry more risk and might not be FDIC-insured.</p>"}, {"id": 27, "source": "Investing.com Indicators", "category": "economy", "ti
