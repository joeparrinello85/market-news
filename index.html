 restore confidence in bond markets, compress risk premiums and reduce safe-haven demand for gold despite lower yields.</p><p style='margin-bottom: 1.25em;'>History also suggests such policies can be difficult to maintain. The US experience in the 1940s eventually collided with rising inflation and questions over Federal Reserve independence. Even so, Palmberg believes the broader investment case for gold remains intact.</p><p style='margin-bottom: 1.25em;'>\u201cThe debt mountain concern . . . remains one of the pillars of gold demand and any attempts to manage that burden not involving a reduction of debt or deficits are likely to continue favouring gold.\u201d</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 49, "source": "Cointelegraph", "category": "crypto", "title": "Solana cuts blockchain slot time to 350 milliseconds", "link": "https://cointelegraph.com/news/solana-cuts-blockchain-slot-time-350-milliseconds?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T13:45:13+00:00", "date_str": "Aug 21 \u2022 01:45 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Solana cuts blockchain slot time to 350 milliseconds</p><p style='margin-bottom: 1.25em;'>Solana reduced its slot time for the first time since genesis as it works toward a 200-millisecond target aimed at reducing network latency.</p><p style='margin-bottom: 1.25em;'>Solana reduced its slot time to 350 milliseconds, marking the first such reduction since the inception of the network, according to the Solana Foundation\u2019s vice president of technology, Jacob Creech.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019re in a new era of 350ms. Next stop, 300ms,\u201d Creech said in a Friday X post.</p><p style='margin-bottom: 1.25em;'>Average slot times on Solana stood at 360ms at press time, down from the network\u2019s original 400ms target, according to the Solana slot time explorer.</p><p style='margin-bottom: 1.25em;'>In June, the Solana Foundation shared plans to reduce slot times from 400ms to 200ms, arguing that it would improve latency and accelerate confirmations on the blockchain network. Three further 50ms reductions are planned.</p><p style='margin-bottom: 1.25em;'>All four stages are targeted for mainnet activation in Agave v4.2, a validator client developed by Anza, though the schedule is tentative.</p><p style='margin-bottom: 1.25em;'>SIMD-0525, the proposal establishing the shorter slot times, was approved and merged on May 14.</p><p style='margin-bottom: 1.25em;'>Magazine: Efforts to bulletproof Ethereum are paying off in user metrics</p>"}, {"id": 50, "source": "Cointelegraph", "category": "crypto", "title": "Laser Digital gets Japan\u2019s first crypto exchange approval in 4 years", "link": "https://cointelegraph.com/news/nomuras-laser-digital-japans-first-crypto-exchange-4-years?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T13:08:12+00:00", "date_str": "Aug 21 \u2022 01:08 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Laser Digital gets Japan\u2019s first crypto exchange approval in 4 years</p><p style='margin-bottom: 1.25em;'>Nomura-backed Laser Digital Japan received registration to provide domestic liquidity before expanding into institutional crypto trading.</p><p style='margin-bottom: 1.25em;'>Nomura Group\u2019s digital asset subsidiary, Laser Digital, received authorization to operate as a crypto asset exchange service provider under Japan\u2019s Payment Services Act (PSA)</p><p style='margin-bottom: 1.25em;'>A list issued by Japan\u2019s Financial Services Agency (FSA) on Friday showed that Laser Digital received the country\u2019s first crypto exchange license in four years. The last platform to receive FSA authorization was Binance Japan in October 2022.</p><p style='margin-bottom: 1.25em;'>Japan\u2019s crypto market is entering a \u201cnew phase of maturity,\u201d creating a need for \u201ctrusted counterparties and infrastructure\u201d as \u201cinstitutional investors increase their interest in this asset class,\u201d Jez Mohideen, co-founder and CEO of Laser Digital, said in a Friday press release.</p><p style='margin-bottom: 1.25em;'>In July, Japan\u2019s parliament passed revisions that classify crypto assets as financial assets under Japan\u2019s Financial Instruments and Exchange Act (FIEA).</p><p style='margin-bottom: 1.25em;'>The revisions will move regulation of crypto transactions away from the PSA, where digital assets are currently treated primarily as payment instruments, and introduce insider trading rules and stronger oversight for crypto businesses. The crypto provisions will take effect on a date set by Cabinet order within one year of the amendments\u2019 July 23 promulgation.</p><p style='margin-bottom: 1.25em;'>Japanese Finance Minister Satsuki Katayama signaled the intent to bring crypto under the same umbrella as traditional finance assets in January, to ensure that citizens will \u201cbenefit from digital and blockchain-based assets.\u201d</p><p style='margin-bottom: 1.25em;'>Magazine: How Hong Kong is turning tokenized bonds into real market infrastructure</p>"}, {"id": 51, "source": "Cointelegraph", "category": "crypto", "title": "Binance says employees questioned in UAE cleared and released", "link": "https://cointelegraph.com/news/binance-employees-questioned-uae-released?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T12:48:04+00:00", "date_str": "Aug 21 \u2022 12:48 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Binance says employees questioned in UAE cleared and released</p><p style='margin-bottom: 1.25em;'>Binance\u2019s employees were cleared and released after providing statements to UAE authorities about third-party fund flows through a company client account, a spokesperson told Cointelegraph.</p><p style='margin-bottom: 1.25em;'>Binance employees detained in the United Arab Emirates were cleared and released after providing statements about third-party fund flows through a company client money account, a spokesperson for the exchange told Cointelegraph.</p><p style='margin-bottom: 1.25em;'>The New York Times reported Thursday that two Binance employees were detained after being stopped at airports in the UAE amid police inquiries into possible financial crimes involving the exchange.</p><p style='margin-bottom: 1.25em;'>The employees were not the targets or subjects of what Binance described as \u201croutine inquiries.\u201d</p><p style='margin-bottom: 1.25em;'>\u201cCryptocurrency and the mechanics of institutional client money accounts remain emerging concepts in many jurisdictions; we are working constructively with Dubai Police and authorities across other Emirates to establish clear, appropriate coordination procedures,\u201d the spokesperson said.</p><p style='margin-bottom: 1.25em;'>In 2024, Nigerian authorities detained Tigran Gambaryan, then Binance\u2019s head of financial crime compliance, for eight months while he faced money laundering charges.</p><p style='margin-bottom: 1.25em;'>By October 2024, the Nigerian government had dopped all charges against Gambaryan.</p><p style='margin-bottom: 1.25em;'>Magazine: How the EU\u2019s crypto tax rules are expected to work for users and platforms</p>"}, {"id": 52, "source": "Mining.com", "category": "metals", "title": "Bunker Hill to buy Silver47 in $163M all-stock deal", "link": "https://www.mining.com/bunker-hill-to-buy-silver47-in-163m-all-stock-deal/", "iso_date": "2026-08-21T12:12:00+00:00", "date_str": "Aug 21 \u2022 12:12 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bunker Hill to buy Silver47 in $163M all-stock deal</p><p style='margin-bottom: 1.25em;'>Bunker Hill Mining (TSX: BNKR; OTCQB: BHLL) is buying Silver47 Exploration (TSX-V: AGA; OTCQX: AAGA) in an all-stock deal valued at about $163 million, creating a larger US-focused silver and critical minerals company.</p><p style='margin-bottom: 1.25em;'>Silver47 shareholders will receive 0.1724 Bunker Hill common shares for each share held, Bunker Hill said Friday. The offer represents a 38% premium to Silver47\u2019s Thursday close and about a 30% premium to its 20-day volume-weighted average price.</p><p style='margin-bottom: 1.25em;'>\u201cAs Bunker Hill advances towards commercial production targeted in the fourth quarter of 2026, we are very excited to partner with Silver47,\u201d Bunker Hill executive chairman Richard Williams said. \u201cThis is a \u2018Made in America\u2019 transaction at a time when the US domestic mining industry, its investors and the users of US metals need new, ambitious leaders capable of safely building and operating profitable mines.\u201d</p><p style='margin-bottom: 1.25em;'>The transaction pairs Bunker Hill\u2019s namesake mine in Idaho\u2019s Silver Valley with Silver47\u2019s exploration and development portfolio spanning Alaska, Nevada and New Mexico. It comes as Bunker Hill works towards commercial production later this year and Silver47 shares remain under pressure, having fallen nearly 36% since the start of 2026.</p><p style='margin-bottom: 1.25em;'>Growth platform</p><p style='margin-bottom: 1.25em;'>The combined company will be named Bunker Hill Silver, with existing Bunker Hill shareholders owning 57% and Silver47 investors holding the remaining 43%.</p><p style='margin-bottom: 1.25em;'>Silver47 executive chairman Gary Thompson said combining his company\u2019s exploration portfolio and capabilities with Bunker Hill\u2019s mine-building and operating track record would provide a strong foundation for the growth-focused company.</p><p style='margin-bottom: 1.25em;'>Silver47 shares closed Thursday at C$0.67 ($0.49), setting the reference price for Bunker Hill\u2019s takeover premium.</p><p style='margin-bottom: 1.25em;'>The companies expect to complete the transaction in November, after which the combined company is expected to continue trading on the Toronto Stock Exchange.</p><p style='margin-bottom: 1.25em;'>Fresh funding</p><p style='margin-bottom: 1.25em;'>Bunker Hill has also secured about $11 million in new financing from existing partners as it moves towards commercial production.</p><p style='margin-bottom: 1.25em;'>The funding includes a $10-million concentrate prepayment facility with Ocean Partners UK and a $1-million draw under Bunker Hill\u2019s standby facility with Teck Resources.</p><p style='margin-bottom: 1.25em;'>The financing gives Bunker Hill additional capital ahead of the proposed merger while the enlarged company positions its Idaho mine and Silver47\u2019s US exploration assets as a broader domestic silver and critical minerals platform.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 53, "source": "Cointelegraph", "category": "crypto", "title": "Standard Chartered wavers on $100K Bitcoin year-end call, says it may be \u2018too low\u2019", "link": "https://cointelegraph.com/news/standard-chartered-100k-bitcoin-2026-prediction-low?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T11:58:10+00:00", "date_str": "Aug 21 \u2022 11:58 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Standard Chartered wavers on $100K Bitcoin year-end call, says it may be \u2018too low\u2019</p><p style='margin-bottom: 1.25em;'>Standard Chartered\u2019s Geoff Kendrick said Bitcoin could move toward its $126,000 all-time high after Oct. 6 as spot Bitcoin ETF inflows recover.</p><p style='margin-bottom: 1.25em;'>Bitcoin may move toward its all-time high of $126,000 before the end of the year, with the recovery potentially accelerating after Oct. 6, according to Geoff Kendrick, global head of digital asset research at Standard Chartered.</p><p style='margin-bottom: 1.25em;'>Kendrick said in a Friday note shared with Cointelegraph that the latest rally has been driven largely by short liquidations, while inflows into spot Bitcoin exchange-traded funds have also started to recover. He said low open interest could leave room for more investors to return as prices rise.</p><p style='margin-bottom: 1.25em;'>\u201cFor the first time this year there is now a risk my end year forecast (of USD100k) is too low,\u201d Kendrick wrote.</p><p style='margin-bottom: 1.25em;'>In a Feb. 12 report, Kendrick cut Standard Chartered\u2019s year-end Bitcoin target to $100,000 from $150,000 and its Ether target to $4,000 from $7,500. At the time, he expected Bitcoin to fall to around $50,000 and Ether to $1,400 before recovering during the rest of the year.</p><p style='margin-bottom: 1.25em;'>Other industry watchers have also pointed to signs that the bear market may be nearing an end. Swan Bitcoin CEO Cory Klippsten said Bitcoin may bottom in October, while 10x Research founder Markus Thielen said an August close above $63,000 could confirm a bear-market bottom.</p><p style='margin-bottom: 1.25em;'>Bitcoin traded at $76,844 at the time of writing, up 24% over the past week, according to CoinGecko data.</p><p style='margin-bottom: 1.25em;'>Magazine: How Bitcoin and gold reacted differently to the Iran war shock</p>"}, {"id": 54, "source": "Mining.com", "category": "metals", "title": "Metals Exploration locks in $27M as La India first gold nears", "link": "https://www.mining.com/metals-exploration-locks-in-27m-as-la-india-first-gold-nears/", "iso_date": "2026-08-21T11:08:00+00:00", "date_str": "Aug 21 \u2022 11:08 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Metals Exploration locks in $27M as La India first gold nears</p><p style='margin-bottom: 1.25em;'>Metals Exploration (AIM:MTL) has secured $27 million in equipment financing as its La India gold project in Nicaragua closes in on first production, targeted for December 2026.</p><p style='margin-bottom: 1.25em;'>The company has already drawn $20.2 million from the five-year Banco de America Central facility, replenishing cash used to buy its Caterpillar mining fleet as construction advances towards the December target.</p><p style='margin-bottom: 1.25em;'>It said it will use the remaining $6.8 million as additional equipment arrives in Nicaragua.</p><p style='margin-bottom: 1.25em;'>\u201cConstruction at La India continues to make strong progress, with installation of the process plant advancing across multiple fronts,\u201d CEO Darren Bowden said. \u201cThe ball mill is in its final position, the SAG mill is ready to follow, and the CIL tank fit-out is nearing completion.\u201d</p><p style='margin-bottom: 1.25em;'>The financing gives Metals Exploration additional liquidity as it pushes La India towards commissioning while continuing to generate gold from its Runruno mine in the Philippines. Runruno is expected to produce near the upper end of its 40,000-48,000-oz. 2026 guidance because of higher-grade ore from the Stage 5 pit.</p><p style='margin-bottom: 1.25em;'>Build advances</p><p style='margin-bottom: 1.25em;'>Structural, mechanical, piping and electrical installation at La India is about 50% complete, the company said. The grinding building is structurally finished and the ball mill is in its final position, while the SAG mill is being prepared to be lifted into place.</p><p style='margin-bottom: 1.25em;'>Installation of the carbon-in-leach tank rings has reached 53 of 60, or 88%, with the leach tanks about 80% complete and detox tanks roughly 70% finished. All 10 CIL agitators and both detox agitators have been assembled.</p><p style='margin-bottom: 1.25em;'>Bulk earthworks are 93% complete and civil foundations have reached 92%, while pre-stripping of the open pit is 71% finished.</p><p style='margin-bottom: 1.25em;'>Metals Exploration has stockpiled about 244,000 tonnes of ore on the run-of-mine pad ahead of commissioning.</p><p style='margin-bottom: 1.25em;'>Site infrastructure is also nearing completion. The mine and heavy mobile equipment offices are operating, the water treatment plant is finished and camp installation is about 90% complete, the company said. Industrial buildings are roughly 88% complete, while the explosives magazine is awaiting an operating permit.</p><p style='margin-bottom: 1.25em;'>Construction of the tailings storage facility has reached about 60%. A 2-MW grid connection to Nicaragua\u2019s national electricity transmission company ENATREL has been energized and is available for operations and commissioning. The main sub-station remains scheduled for completion in December.</p><p style='margin-bottom: 1.25em;'>Shipping risks</p><p style='margin-bottom: 1.25em;'>Metals Exploration said disruption to international shipping linked to the conflict in Iran has delayed some imported equipment and materials, creating a potential scheduling risk as La India approaches commissioning.</p><p style='margin-bottom: 1.25em;'>The company noted it has managed the impact within the overall construction program so far and is assessing alternative logistics arrangements to reduce the risk of further delays.</p><p style='margin-bottom: 1.25em;'>The financing provides additional flexibility against those pressures. The facility carries an initial annual interest rate of 7%, with a 6.85% floor, and matures on Aug. 17, 2031.</p><p style='margin-bottom: 1.25em;'>Metals Exploration receives a 12-month grace period on principal before repaying the loan over 48 equal monthly instalments plus interest.</p><p style='margin-bottom: 1.25em;'>The company has paid S$30.5 million for its CAT mining fleet, with another $700,000 due next month. The fleet investment sits outside La India\u2019s development and construction budget.</p><p style='margin-bottom: 1.25em;'>With major plant components moving into place and mining already building an ore stockpile, Metals Exploration\u2019s December target increasingly hinges on completing the remaining infrastructure and keeping outstanding equipment deliveries on schedule.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 55, "source": "Cointelegraph", "category": "crypto", "title": "Coldcard strengthens seed generation with firmware update", "link": "https://cointelegraph.com/news/coldcard-upgrade-strengthen-seed-phrase-generation?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T10:13:23+00:00", "date_str": "Aug 21 \u2022 10:13 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Coldcard strengthens seed generation with firmware update</p><p style='margin-bottom: 1.25em;'>Coinkite urged Coldcard users to generate new seed phrases, warning that existing vulnerable seeds remain unsafe despite the security upgrade.</p><p style='margin-bottom: 1.25em;'>Coinkite released a new security upgrade to strengthen seed phrase generation by requiring user-supplied entropy mixed with improved device randomness.</p><p style='margin-bottom: 1.25em;'>Coinkite announced firmware 5.6.1 for Coldcard Mk4 and Mk5 devices and 1.5.1Q for the Coldcard Q in a Thursday blog post.</p><p style='margin-bottom: 1.25em;'>The release requires newly generated seeds to include user-supplied entropy through at least 65 keypresses with unpredictable timing, 50 rolls of a six-sided die or 128 coin flips. That input is combined with randomness from multiple device sources, including its secure elements and hardware random-number generator (RNG).</p><p style='margin-bottom: 1.25em;'>The combined randomness is used to create the wallet\u2019s seed phrase and is intended to keep its private keys unpredictable even if one of the device\u2019s entropy sources fails.</p><p style='margin-bottom: 1.25em;'>Coinkite told users to upgrade immediately, emphasizing that existing seed phrases remain vulnerable even after upgrading and must be replaced with new seeds before migrating funds.</p><p style='margin-bottom: 1.25em;'>Confirmed losses from the Coldcard exploit reached 1,778 Bitcoin (BTC), worth about $112 million, according to an Aug. 14 report by Galaxy Research. This makes the Coldcard hack the third-largest cryptocurrency exploit of 2026, according to data aggregated by DefiLlama.</p><p style='margin-bottom: 1.25em;'>Coldcard adds transaction and USB safeguards</p><p style='margin-bottom: 1.25em;'>The company\u2019s July 31 firmware update had already fixed the seed-generation failure for newly created wallets. Thursday\u2019s release follows three weeks of broader security review and also adds safeguards around USB data handling, transaction signing and hardware randomness.</p><p style='margin-bottom: 1.25em;'>Coinkite said the update addresses a theoretical attack involving a compromised computer USB port by re-verifying transactions immediately before signing. The firmware also introduces additional hardware RNG checks and a boot-time test designed to verify that the wallet is using its intended hardware path.</p><p style='margin-bottom: 1.25em;'>Related: Cybersecurity firm unveils crypto phishing campaign targeting 885,000 phone numbers</p><p style='margin-bottom: 1.25em;'>Other changes restrict USB downloads to the device\u2019s most recent output and require an encrypted session, while certain Bitcoin signature hash modes that allow transaction outputs to remain modifiable are now blocked by default.</p><p style='margin-bottom: 1.25em;'>Coinspect launches weak-seed detection tool</p><p style='margin-bottom: 1.25em;'>Other companies are also launching software to identify wallets potentially exposed by weak seed generation.</p><p style='margin-bottom: 1.25em;'>Blockchain security company Coinspect revealed Unlukey, a free public tool for identifying wallet addresses generated from weak seed phrases. The first iteration of the tool aims to reproduce known weak seed generation and check whether public addresses belong to the affected dataset, Coinspect said in a Friday X post.</p><p style='margin-bottom: 1.25em;'>Weak seed phrase generation was one of the main vulnerabilities that led to the Coldcard exploit. TRM Labs said that a firmware bug from March 2021 weakened seed randomness on some Coldcard wallets, reducing key strength from 128 bits to 40 bits and making them \u201cbrute-forceable without physical access.\u201d</p><p style='margin-bottom: 1.25em;'>Magazine: Inside the \u2018fake police raid\u2019 that forced a $1M Bitcoin transfer</p>"}, {"id": 56, "source": "Cointelegraph", "category": "crypto", "title": "Strategy Bitcoin treasury hits breakeven point as BTC price passes $77K", "link": "https://cointelegraph.com/markets/strategy-bitcoin-treasury-hits-breakeven-point-as-btc-price-passes-77k?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T08:48:52+00:00", "date_str": "Aug 21 \u2022 08:48 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Strategy Bitcoin treasury hits breakeven point as BTC price passes $77K</p><p style='margin-bottom: 1.25em;'>Bitcoin gains 20% in two days as Strategy sees its BTC treasury climb out of the red.</p><p style='margin-bottom: 1.25em;'>Bitcoin (BTC) hit $77,000 on Friday as business intelligence company Strategy\u2019s corporate treasury returned to profit.</p><p style='margin-bottom: 1.25em;'>Key points:</p><p style='margin-bottom: 1.25em;'>- Bitcoin reaches its highest level since May 26 as it revisits $77,000.</p><p style='margin-bottom: 1.25em;'>- Price returns above the cost basis for Strategy\u2019s BTC corporate treasury at $75,385.</p><p style='margin-bottom: 1.25em;'>- Around 11% of the BTC supply constitutes a new band of support below $68,000.</p><p style='margin-bottom: 1.25em;'>Strategy out of the red with Bitcoin at highest since May</p><p style='margin-bottom: 1.25em;'>Data from TradingView showed new local highs above $77,400 prior to the week\u2019s final Wall Street open.</p><p style='margin-bottom: 1.25em;'>BTC/USD one-day chart. Source: Cointelegraph/TradingView</p><p style='margin-bottom: 1.25em;'>Now up around 20% in 48 hours, BTC/USD saw little by way of consolidation as it reclaimed a key level for Strategy, the world\u2019s largest corporate Bitcoin treasury company. Data from monitoring resource BitcoinTreasuries puts the cost basis for Strategy\u2019s holdings of 840,447 BTC at $75,385, currently with a year-to-date gain of approximately $450 million.</p><p style='margin-bottom: 1.25em;'>Strategy Bitcoin treasury cost basis data. Source: BitcoinTreasuries</p><p style='margin-bottom: 1.25em;'>As Cointelegraph reported, between Aug. 3 and Aug. 9, Strategy opted to sell a small portion of its treasury worth 1,690 BTC to repurchase 1.15 million shares of its STRC preferred stock for $108.6 million. The move represented the company\u2019s fourth Bitcoin sale of 2026.</p><p style='margin-bottom: 1.25em;'>Concerns over the long-term viability of the company\u2019s Bitcoin investment thesis accompanied the sales, something that the subsequent BTC price run-up should help alleviate, independent crypto analyst William Clemente suggested.</p><p style='margin-bottom: 1.25em;'>\u201cNot only should Saylor/Strategy fears have been abated for a while once he showed that he was willing to sell BTC to rebuy STRC, but now after this price impulse they are even more over-collateralized by their BTC holdings,\u201d he wrote on X, referring to former CEO Michael Saylor.</p><p style='margin-bottom: 1.25em;'>In an interview with Fox News earlier in August, current CEO Phong Le stated that Strategy would return to buying Bitcoin before the end of the year.</p><p style='margin-bottom: 1.25em;'>New BTC buy wall sits below $68,000</p><p style='margin-bottom: 1.25em;'>Amid misgivings over the durability of Bitcoin\u2019s volatile upside move, analysis from onchain analytics platform Glassnode revealed a new safety net forming below $70,000.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin has \u2018largely purged\u2019 froth that preceded 50% drop from $126K: BlackRock</p><p style='margin-bottom: 1.25em;'>Some 3.44 million BTC now have an onchain cost basis, also known as realized price, between $58,000 and $67,000. Of this, 2.23 million BTC \u2014 equal to around 11% of the total supply \u2014 was added over the past 11 weeks.</p><p style='margin-bottom: 1.25em;'>\u201cIt\u2019s the densest cost-basis cluster below spot \u2014 a key potential support zone on any retracement,\u201d Glassnode cofounder Rafael Schultze-Kraft commented on X.</p><p style='margin-bottom: 1.25em;'>Bitcoin UTXO realized price distribution data. Source: Rafael Schultze-Kraft on X.com</p><p style='margin-bottom: 1.25em;'>BTC/USD broke through several key resistance levels this week, including its 200-day simple moving average (SMA) at $68,967, a key target to reclaim to end the long-term BTC price downtrend.</p>"}, {"id": 57, "source": "Cointelegraph", "category": "crypto", "title": "Bitcoin ETFs draw $608M as Ether ETFs see largest inflow since October", "link": "https://cointelegraph.com/markets/bitcoin-etfs-ether-etfs-largest-inflow-october?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T07:50:01+00:00", "date_str": "Aug 21 \u2022 07:50 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitcoin ETFs draw $608M as Ether ETFs see largest inflow since October</p><p style='margin-bottom: 1.25em;'>Bitcoin ETF inflows pushed August\u2019s total to a 2026 high of $2.07 billion as Bitcoin traded above $75,000 and Ether climbed to $2,357.</p><p style='margin-bottom: 1.25em;'>US spot Bitcoin exchange-traded funds (ETFs) drew $608.3 million in net inflows on Thursday, lifting weekly inflows above $1.6 billion, while spot Ether ETFs logged their largest single-day intake since October.</p><p style='margin-bottom: 1.25em;'>The Bitcoin funds extended their positive streak to four straight sessions after attracting $297.6 million on Monday, $189.3 million on Tuesday and $517.2 million on Wednesday,SoSoValue data shows.</p><p style='margin-bottom: 1.25em;'>August net inflows reached $2.07 billion through Thursday, already surpassing April\u2019s $1.97 billion, the previous monthly high for 2026, with seven trading sessions remaining. Cumulative net inflows stood at $53.4 billion.</p><p style='margin-bottom: 1.25em;'>The inflows accompanied a continued rally in crypto markets as Bitcoin traded at $75,133 at the time of writing on Friday, up 7.9% over the previous 24 hours, according to CoinGecko. Ether gained 4.6% to about $2,357.</p><p style='margin-bottom: 1.25em;'>Spot Ether ETFs attracted $220.8 million on Thursday, their largest daily net inflow across 203 trading sessions spanning 296 calendar days. The funds last recorded a larger intake on Oct. 28, 2025, when they drew about $246 million.</p><p style='margin-bottom: 1.25em;'>The funds have taken in approximately $512.2 million across four trading sessions this week, lifting their August net inflows to about $754.9 million. Total net assets reached $13.58 billion.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin breaks above 200-day moving average for first time since November</p>"}, {"id": 58, "source": "Cointelegraph", "category": "crypto", "title": "South Korean lawmakers seek expanded FIU powers over unregistered crypto firms", "link": "https://cointelegraph.com/news/south-korea-fiu-unregistered-crypto-firms-bill?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T05:47:16+00:00", "date_str": "Aug 21 \u2022 05:47 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>South Korean lawmakers seek expanded FIU powers over unregistered crypto firms</p><p style='margin-bottom: 1.25em;'>The proposal would let the FIU investigate suspected violations and refer unregistered crypto operators directly to law enforcement.</p><p style='margin-bottom: 1.25em;'>A group of South Korean lawmakers has introduced a bill to amend an existing financial law and expand the Financial Intelligence Unit\u2019s (FIU) authority to investigate unregistered crypto businesses.</p><p style='margin-bottom: 1.25em;'>On Thursday, People Power Party lawmaker Eom Tae-young and nine other lawmakers filed the bill, which aims to add a new provision to the Act on Reporting and Using Specified Financial Transaction Information.</p><p style='margin-bottom: 1.25em;'>Under the proposal, anyone could report suspected violations of the law to the FIU. The agency could investigate and analyze alleged violations, file complaints with the relevant authorities, request criminal investigations or provide information to investigators.</p><p style='margin-bottom: 1.25em;'>The bill remains at the introduction stage and must pass the National Assembly before it can amend the existing law.</p><p style='margin-bottom: 1.25em;'>Under the current system, the FIU identifies suspected unregistered operators but relies on police and other authorities to pursue investigations.</p><p style='margin-bottom: 1.25em;'>Police suspended investigations or preliminary inquiries into 23 of 25 unregistered virtual asset service providers referred by the FIU between August 2022 and August 2025, according to Yonhap. The companies and related individuals were reportedly based overseas.</p><p style='margin-bottom: 1.25em;'>Crypto companies serving South Korean customers must register with the FIU. The regulator said in June that 28 providers were registered and that it had referred 40 suspected illegal operators to investigative authorities.</p><p style='margin-bottom: 1.25em;'>Related: South Korea drops Travel Rule threshold for crypto transfers</p>"}, {"id": 59, "source": "Cointelegraph", "category": "crypto", "title": "MANTRA token sinks 18% to record low amid blockchain halt", "link": "https://cointelegraph.com/markets/mantra-token-record-low-blockchain-halt?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T05:04:52+00:00", "date_str": "Aug 21 \u2022 05:04 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>MANTRA token sinks 18% to record low amid blockchain halt</p><p style='margin-bottom: 1.25em;'>The token recovered to about $0.0044 after setting a new low, while exchanges paused deposits and withdrawals from the halted MANTRA Chain.</p><p style='margin-bottom: 1.25em;'>MANTRA\u2019s native token sank 18.5% from its 24-hour high to a record low shortly before MANTRA Chain stopped producing blocks and its team announced a precautionary halt over an unexplained incident.</p><p style='margin-bottom: 1.25em;'>According to CoinGecko, MANTRA fell from $0.005060 to an all-time low of $0.004126 around 11:00 pm UTC on Thursday. It later recovered to about $0.0044 but remained down roughly 10% over 24 hours, while trading volume climbed nearly 600% to $24 million.</p><p style='margin-bottom: 1.25em;'>MANTRA said Friday it was \u201caware of an incident affecting MANTRA Chain\u201d and had halted the network as a precaution while it investigated. \u201cWe don\u2019t have a root cause or timeline to share yet,\u201d the project said, adding that all endpoints and transactions were frozen.</p><p style='margin-bottom: 1.25em;'>The halt prevents assets from moving on MANTRA Chain and has prompted affected exchanges to pause deposits and withdrawals, with no timeline given for either service to resume.</p><p style='margin-bottom: 1.25em;'>MANTRA\u2019s 24-hour price chart. Source: CoinGecko</p><p style='margin-bottom: 1.25em;'>MANTRA Chain remains halted as investigation continues</p><p style='margin-bottom: 1.25em;'>MANTRA\u2019s status page classified the incident as a full outage affecting public endpoints, validators, bridge migration operations and MANTRA-managed Inter-Blockchain Communication relays. The team said it would not restart the network until it was confident it was safe.</p><p style='margin-bottom: 1.25em;'>The network\u2019s public RPC listed block 17,449,398, produced at 11:13 pm UTC on Thursday, as its latest block. MANTRA posted its initial incident notice at 11:44 pm, while CoinGecko showed the token reaching its low around 11:10 pm.</p><p style='margin-bottom: 1.25em;'>MANTRA has not said whether the price movement was related to the incident or whether any assets were lost or placed at risk.</p><p style='margin-bottom: 1.25em;'>Cointelegraph contacted the MANTRA team for additional information but did not receive a response by publication.</p><p style='margin-bottom: 1.25em;'>Related: Mantra says CEO has begun the process of burning his 150M OM tokens</p><p style='margin-bottom: 1.25em;'>The latest decline follows the April 2025 collapse of MANTRA\u2019s former OM token, which plunged more than 90% from about $6.30 to below $0.50 and erased more than $5 billion in market value.</p><p style='margin-bottom: 1.25em;'>In June, Inveniam Capital Partners announced plans to acquire MANTRA after investing $20 million in the project in 2025. The acquisition followed January layoffs and restructuring after CEO John Patrick Mullin described 2025 as the project\u2019s most challenging year.</p><p style='margin-bottom: 1.25em;'>Magazine: 200,000 fake AI \u2018victims\u2019 deployed to scam bait online fraudsters</p>"}, {"id": 60, "source": "Cointelegraph", "category": "crypto", "title": "Capital.com plans UAE spot crypto services after affiliate wins licence", "link": "https://cointelegraph.com/news/capital-com-uae-spot-crypto-license?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T03:33:11+00:00", "date_str": "Aug 21 \u2022 03:33 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Capital.com plans UAE spot crypto services after affiliate wins licence</p><p style='margin-bottom: 1.25em;'>UAE clients will be able to buy and hold crypto through Capital.com\u2019s app, expanding beyond price exposure through contracts for difference.</p><p style='margin-bottom: 1.25em;'>Trading platform and contracts for difference (CFD) broker Capital.com plans to offer spot crypto services to clients in the United Arab Emirates after its affiliate, Capital Vault, secured a virtual-asset license from the country\u2019s Capital Market Authority (CMA).</p><p style='margin-bottom: 1.25em;'>According to an announcement sent to Cointelegraph, the license allows Capital Vault to deal in virtual assets as an agent or matching principal and provide custody on behalf of clients.</p><p style='margin-bottom: 1.25em;'>Once the service goes live, UAE clients will be able to buy and hold actual crypto through the Capital.com app, with Capital Vault providing execution, custody and settlement. This differs from Capital.com\u2019s CFDs, which provide price exposure without ownership of the underlying crypto.</p><p style='margin-bottom: 1.25em;'>Capital Vault operates as a separate regulated entity, with its governance, custody and risk arrangements separated from Capital.com\u2019s other businesses. The affiliate has opened an office in Abu Dhabi and is building a local virtual-asset team.</p><p style='margin-bottom: 1.25em;'>The approval follows the CMA\u2019s introduction of a virtual-asset regulatory framework in April, which expanded the number of regulated activities from three to eight. The framework also established requirements covering business conduct, alternative trading systems, anti-money laundering controls and prudential standards.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin.com integrates UAE-registered US dollar stablecoin into self-custodial wallet</p>"}, {"id": 61, "source": "Mining.com", "category": "metals", "title": "Lassonde-backed Cadillac drilling points to more Ontario gold", "link": "https://www.mining.com/lassonde-backed-cadillac-drilling-points-to-more-ontario-gold/", "iso_date": "2026-08-20T23:45:00+00:00", "date_str": "Aug 20 \u2022 11:45 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Lassonde-backed Cadillac drilling points to more Ontario gold</p><p style='margin-bottom: 1.25em;'>Canadian developer Cadillac Mines (TSX: CADY) says new drilling at its past-producing Kerr-Addison property in Ontario could open the door to a larger open-pit gold resource. The stock rose.</p><p style='margin-bottom: 1.25em;'>Standout hole KAD26-428T cut about 23 metres grading 3.08 gold per tonne from 259 metres downhole, including 6.4 metres of 5.26 grams gold from 260 metres, Cadillac said late Wednesday in a statement. Hole KAD26-397, meanwhile, returned 2.13 grams gold over 38 metres from 192 metres downhole.</p><p style='margin-bottom: 1.25em;'>Toronto-based Cadillac is almost two-thirds of the way through a planned 17,850-metre infill drilling program within the Kerr-Addison open-pit resource. The latest release includes assay results from the first 29 infill diamond drill holes.</p><p style='margin-bottom: 1.25em;'>\u201cWe view the results positively as they demonstrate continuity within the open pit shell and intersect mineralization beyond the current limits, supporting potential resource conversion, expansion and grade upside\u201d ahead of a preliminary economic assessment that\u2019s targeted for next year\u2019s third quarter, Desjardins Securities mining analyst Bryce Adams said Thursday in a note.</p><p style='margin-bottom: 1.25em;'>Greenstone belt</p><p style='margin-bottom: 1.25em;'>Cadillac shares rose 2.3% to C$8 Thursday morning in Toronto trading, valuing the company at about C$2.2 billion ($1.5 billion). The stock has traded between C$6.90 and C$10.01 in the past year.</p><p style='margin-bottom: 1.25em;'>Franco-Nevada (TSX, NYSE: FNV) co-founder Pierre Lassonde is one of Cadillac\u2019s biggest shareholders, in addition to serving as chairman. He owns 14% of the company\u2019s equity, while Franco-Nevada owns 2% and Pan American Silver (TSX, NYSE: PAAS) owns a 6% stake.</p><p style='margin-bottom: 1.25em;'>Located 40 km east of Kirkland Lake, Ont., Kerr-Addison is Cadillac\u2019s main project. It sits on the prolific Cadillac-Larder Lake fault in the Abitibi Greenstone belt, which has produced more than 200 million oz. gold over the past century.</p><p style='margin-bottom: 1.25em;'>Formerly known as Gold Candle, Cadillac owns one of the largest land positions on the belt, including about 40 km of strike length.</p><p style='margin-bottom: 1.25em;'>Big opportunity</p><p style='margin-bottom: 1.25em;'>Other notable intersections include hole KAD25-386, which cut 13 metres of 1.52 grams gold from 62 metres depth, Cadillac said. Hole KAD26-476 returned 1.94 grams gold over 9.2 metres from 66 metres downhole.</p><p style='margin-bottom: 1.25em;'>Cadillac is targeting several lesser-drilled footwall zones within the Kerr-Addison open pit. The structures had historically received less attention than the main break, which has accounted for more than 10 million oz. of historical production, Cadillac says.</p><p style='margin-bottom: 1.25em;'>\u201cThese initial drill results continue to highlight the significant opportunity we have to add additional high-quality mineral resources within the Kerr open pit,\u201d CEO Rick Howes said in the statement.</p><p style='margin-bottom: 1.25em;'>\u201cOur 2026 drill optimization program at Kerr will continue to target new areas and better define known footwall structures within the pit, as well as targeting new ounces and mineralization in our step-out program immediately to the northeast of known resource blocks.\u201d</p><p style='margin-bottom: 1.25em;'>Eleven rigs</p><p style='margin-bottom: 1.25em;'>Cadillac plans to complete the current infill program by mid-September. Eleven diamond rigs are operating across its properties, with most focused on Kerr-Addison infill and expansion drilling.</p><p style='margin-bottom: 1.25em;'>Management has budgeted about $65 million for exploration this year. It plans to drill about 145,000 metres across its portfolio, which includes the Larder and Galloway properties.</p><p style='margin-bottom: 1.25em;'>Kerr-Addison holds 78.5 million indicated tonnes grading 1.34 grams gold for contained metal of 3.38 million oz. gold, according to a February 2026 resource. It also holds 25.9 million tonnes grading 2.66 grams gold for contained metal of 2.21 million oz. gold.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 62, "source": "Cointelegraph", "category": "crypto", "title": "Bitcoin breaks above 200-day moving average for first time since November", "link": "https://cointelegraph.com/markets/bitcoin-breaks-200-day-moving-average?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-20T21:03:21+00:00", "date_str": "Aug 20 \u2022 09:03 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitcoin breaks above 200-day moving average for first time since November</p><p style='margin-bottom: 1.25em;'>The BTC price reclaimed its 200-day moving average for the first time in nine months as its rally gained momentum after the US Treasury expanded its bond buybacks.</p><p style='margin-bottom: 1.25em;'>Bitcoin\u2019s latest rally has pushed the cryptocurrency above a key long-term technical indicator for the first time in about nine months, offering a potential signal that its broader downtrend is losing momentum.</p><p style='margin-bottom: 1.25em;'>Charting platform Barchart highlighted on Thursday that Bitcoin\u2019s (BTC) price had crossed above its 200-day moving average for the first time since November 2025, roughly a month after BTC reached an all-time high above $126,000.</p><p style='margin-bottom: 1.25em;'>The 200-day moving average is widely used to gauge longer-term market trends, with moves above the indicator often viewed as a sign of bullish momentum. A sustained break above the level could therefore suggest that Bitcoin\u2019s months-long downtrend is beginning to weaken.</p><p style='margin-bottom: 1.25em;'>The move came as Bitcoin climbed to nearly $73,000 on Thursday, according to TradingView data.</p><p style='margin-bottom: 1.25em;'>Source: Barchart</p><p style='margin-bottom: 1.25em;'>Bitcoin has gained more than 13% since Wednesday, when the US Treasury Department announced it would at least double the size of liquidity-support buybacks for longer-dated Treasury securities, raising the maximum from $2 billion to at least $4 billion per operation beginning Sept. 9.</p><p style='margin-bottom: 1.25em;'>The operation aims to improve liquidity at the long end of the Treasury market and initially pushed long-term yields lower, helping bolster risk appetite across financial markets.</p><p style='margin-bottom: 1.25em;'>Following the Treasury\u2019s announcement, Standard Chartered\u2019s Geoff Kendrick said the move could help fuel a broader Bitcoin rally toward $100,000 by year-end.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin ETFs draw $517M in largest one-day inflow since early May</p>"}, {"id": 63, "source": "Mining.com", "category": "metals", "title": "High-grade Ima resource boosts Idaho tungsten revival", "link": "https://www.mining.com/high-grade-ima-resource-boosts-idaho-tungsten-revival/", "iso_date": "2026-08-20T20:40:00+00:00", "date_str": "Aug 20 \u2022 08:40 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>High-grade Ima resource boosts Idaho tungsten revival</p><p style='margin-bottom: 1.25em;'>An initial resource for American Tungsten\u2019s (TSXV: TUNG; US-OTC: TUNGF) Ima project in northeast Idaho positions it as the state\u2019s highest grade tungsten project where the critical metal is in the primary commodity. Shares rose.</p><p style='margin-bottom: 1.25em;'>The resource outlines 316,000 indicated tonnes grading 0.55% tungsten trioxide (WO\u2083) for 1,747 tonnes of WO\u2083 and 404,000 oz. of silver, the company reported Thursday. Inferred resources total 2.1 million inferred tonnes at 0.55% WO\u2083, containing 11,933 tonnes of WO\u2083 and 1.8 million oz. of silver.</p><p style='margin-bottom: 1.25em;'>The report also covers resources in surface tailings from past mining at the site, which comprise 267,000 indicated tonnes at 0.15% WO\u2083, for 413 tonnes of WO\u2083 and 79,000 ounces.</p><p style='margin-bottom: 1.25em;'>\u201cThis mineral resource is a transformational milestone for American Tungsten and validates our view that Ima mine hosts a high-grade tungsten system with meaningful scale and growth potential,\u201d American Tungsten CEO Ali Haji said in a release.</p><p style='margin-bottom: 1.25em;'>\u201cAt a time when the United States and its allies are prioritizing secure domestic sources of critical minerals, Ima\u2019s combination of grade, historical production, existing underground infrastructure and a surface tailings resource creates a differentiated path toward potential near-term production.\u201d</p><p style='margin-bottom: 1.25em;'>Eyes on Idaho</p><p style='margin-bottom: 1.25em;'>The estimate comes as Chinese export controls on tungsten and a lack of U.S. mine production intensify efforts to establish domestic supplies of the metal, renewing interest in Idaho\u2019s cluster of past-producing mines and exploration projects.</p><p style='margin-bottom: 1.25em;'>The dense metal, designated as a critical mineral by the Canadian and U.S. governments, is used in armour-piercing ammunition, cutting tools and wear-resistance industrial alloys.</p><p style='margin-bottom: 1.25em;'>Company shares gained almost 4% to C$1.67 apiece on Thursday morning in Toronto, for a market capitalization of C$111 million ($80.4 million). The stock has traded in a 12-month range of C$1.27 to C$2.51.</p><p style='margin-bottom: 1.25em;'>\u201cThe focus remains on advancing Ima through a two track development strategy: Phase I tailings evaluation and potential processing, and Phase II underground drilling, rehabilitation, and restart planning,\u201d Stonegate Capital Partners said in a June note.</p><p style='margin-bottom: 1.25em;'>\u201cManagement continues to position IMA as a potential U.S.-based tungsten supply source, but the near-term story now appears more clearly tied to tailings resource definition, metallurgy, permitting, and continued drill results.\u201d</p><p style='margin-bottom: 1.25em;'>Tungsten resources</p><p style='margin-bottom: 1.25em;'>Ima provides one of Idaho\u2019s only current tungsten resources. A 2015 technical report for Idaho Copper\u2019s (NYSE-A: COPR) CuMo project estimated a significantly larger tungsten inventory, but Idaho Copper doesn\u2019t quantify tungsten in its latest resource statement.</p><p style='margin-bottom: 1.25em;'>The Ima mine was in operation from the early 1900s until 1958, during which about 722,400 tons of ore were mined and made into tungsten and silver-copper concentrates, American Tungsten said.</p><p style='margin-bottom: 1.25em;'>The Ima resource is based more than 5,180 metres of drilling done since last December, as well as historical data. Surface and underground drilling are ongoing at the site, aimed at converting inferred resources to higher confidence categories and ultimately for advancing a preliminary economic assessment.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 64, "source": "Federal Reserve - Releases", "category": "economy", "title": "Federal Reserve Board announces approval of application by National Westminster Bank Plc", "link": "https://www.federalreserve.gov/newsevents/pressreleases/orders20260820a.htm", "iso_date": "2026-08-20T20:00:00+00:00", "date_str": "Aug 20 \u2022 08:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>August 20, 2026</p><p style='margin-bottom: 1.25em;'>Federal Reserve Board announces approval of application by National Westminster Bank Plc</p><p style='margin-bottom: 1.25em;'>For release at 4:00 p.m. EDT</p><p style='margin-bottom: 1.25em;'>The Federal Reserve Board on Thursday announced its approval of the application by National Westminster Bank Plc, of London, England, to establish a representative office in Stamford, Connecticut.</p><p style='margin-bottom: 1.25em;'>For media inquiries, please email [email protected] or call 202-452-2955.</p>"}, {"id": 65, "source": "Mining.com", "category": "metals", "title": "BHP, MIT spinout to trial copper recovery tech at historic Arizona mine", "link": "https://www.mining.com/bhp-mit-spinout-to-trial-copper-recovery-tech-at-historic-arizona-mine/", "iso_date": "2026-08-20T19:03:56+00:00", "date_str": "Aug 20 \u2022 07:03 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>BHP, MIT spinout to trial copper recovery tech at historic Arizona mine</p><p style='margin-bottom: 1.25em;'>MIT-spinout SiTration and BHP announced Thursday the launch of two pilot deployments to trial SiTration\u2019s valorization technology in the Globe-Miami mining district in Arizona at BHP\u2019s Copper Cities site.</p><p style='margin-bottom: 1.25em;'>Copper Cities is a historic former copper mine that operated from the 1950s to the early 1980s, producing nearly 400,000 tonnes of copper.</p><p style='margin-bottom: 1.25em;'>The initiative will begin in August with an initial small-scale pilot designed to validate the continuous, autonomous production of copper from legacy mining water over one month.</p><p style='margin-bottom: 1.25em;'>A larger deployment planned for later this year will seek to produce up to two tonnes of commercial scale copper cathodes over a two-month period, SiTration said, adding that the companies see opportunity to recover value from legacy mining assets, with the potential to create new pathways for increasing domestic US copper supply.</p><p style='margin-bottom: 1.25em;'>SiTration and BHP have executed an agreement establishing a framework for collaboration on the pilot program and evaluation of future opportunities that may arise from successful pilot outcomes.</p><p style='margin-bottom: 1.25em;'>Through bench-scale testing using real feedstock from the site, SiTration said it has already demonstrated LME Grade A copper production. Without using any chemicals or generating new waste products, preliminary tests have yielded energy consumption below 3-4 kWh/kg to recover copper from the diluted legacy mining water.</p><p style='margin-bottom: 1.25em;'>\u201cThe American Southwest houses legacy mining water containing billions of dollars\u2019 worth of copper,\u201d SiTration CEO Brendan Smith said in a news release.</p><p style='margin-bottom: 1.25em;'>\u201cWith global copper demand projected to grow by around 70% by 2050 to support the rapid buildout of energy infrastructure and data centers, tapping into these resources is an excellent pathway to bolster domestic supply chains while producing copper at the bottom of the global cost curve,\u201d Smith said.</p><p style='margin-bottom: 1.25em;'>\u201cThe Copper Cities pilot provides an opportunity to evaluate an innovative approach to recover copper from mining-impacted water while generating valuable technical and operational insights,\u201d BHP\u2019s General Manager, legacy assets Kevin Ramsay added.</p><p style='margin-bottom: 1.25em;'>\u201cWe are excited to work with SiTration to test this technology under real operating conditions and better understand its potential to recover value from legacy mining water sources.\u201d</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 66, "source": "Mining.com", "category": "metals", "title": "Government cash reshapes mining\u2019s capital: study", "link": "https://www.mining.com/government-cash-reshapes-minings-capital-study/", "iso_date": "2026-08-20T18:04:37+00:00", "date_str": "Aug 20 \u2022 06:04 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Government cash reshapes mining\u2019s capital: study</p><p style='margin-bottom: 1.25em;'>As the US announces more investments in mining and processing, the public and mining companies need to be more aware of how that is shifting the government\u2019s role in the sector, its economy and control, a new GEM Consulting study shows.</p><p style='margin-bottom: 1.25em;'>Governments are moving beyond regulating critical-mineral projects to become lenders, investors and customers, reshaping how mining companies finance projects and who ultimately holds influence over their output, the consultancy said.</p><p style='margin-bottom: 1.25em;'>The shift means that companies seeking public funding must compete on more than geology, costs and conventional bankability. They increasingly need to meet government requirements covering product origin and qualification, domestic or allied content, workforce, reporting and security of supply.</p><p style='margin-bottom: 1.25em;'>An August US critical-minerals package illustrates the scale and variety of that involvement. It included a conditional loan of about $1.4 billion for Sila, roughly $400 million for Sunrise Energy Metals and about $150 million for Niron Magnetics, alongside smaller commitments for Strategic Bauxite, Westwater Resources, Global Advanced Metals and Harena pilot work. More than $180 million was earmarked for mining education.</p><p style='margin-bottom: 1.25em;'>This nearly $2 billion investment in mining shows how federal support can\u2019t be considered the same thing for all beneficiaries, as all of them will have different goals, purposes and rights, GEM said.</p><p style='margin-bottom: 1.25em;'>The study argues that all these different types and quantities of government funds will yield different results in the long term. A large loan, for example, can lower the cost of capital for a project moving toward commercial scale, while a much smaller grant could prove more consequential if pilot testing or customer qualification unlocks substantially more private financing. Education funding doesn\u2019t directly increase mine production but could ease workforce shortages affecting multiple projects, GEM said.</p><p style='margin-bottom: 1.25em;'>Global models</p><p style='margin-bottom: 1.25em;'>The US isn\u2019t alone. Canada, Australia, the European Union and Japan have developed their own approaches to financing mining and critical-mineral supply chains, but GEM\u2019s comparison shows that no major system relies on a single funding tool.</p><p style='margin-bottom: 1.25em;'>The US uses the broadest mix of loans, equity, grants, purchase rights and stockpiles, while Canada puts greater emphasis on infrastructure and equity participation. Australia combines financing with output rights and strategic inventories, the European Union emphasizes public credit, grants and permitting coordination, while Japan focuses on financing, offtake and deployable stockpiles.</p><p style='margin-bottom: 1.25em;'>GEM emphasized how important it is to make this information readily available to the public through a credible public database.</p><p style='margin-bottom: 1.25em;'>Guarantees and insurance should be reported as contingent exposure rather than money already spent, while repayments, fees, equity value and recovered rights should also be disclosed.</p><p style='margin-bottom: 1.25em;'>Matching funds</p><p style='margin-bottom: 1.25em;'>GEM advised that mining projects should choose a jurisdiction not by how much capital they offer, but which one can help them solve their issues and what comes with it.</p><p style='margin-bottom: 1.25em;'>Canada, for instance, may be particularly suited to remote projects requiring corridors and shared infrastructure, while European Union programs may better fit integrated mining and processing projects supplying EU customers. Japan\u2019s system is geared toward overseas supply linked to Japanese users, while Australia\u2019s approach suits projects that can provide allied supply and strategic reserve services.</p><p style='margin-bottom: 1.25em;'>Governments should try to manage the capital they are planning to invest in the sector as a portfolio and make support staged and conditional, GEM said.</p><p style='margin-bottom: 1.25em;'>These models can be replicated in other countries, as long as a similar framework is used, aiming to convert a credible project into qualified and reliable supply.</p><p style='margin-bottom: 1.25em;'>The study\u2019s final test is whether government involvement produces development that wouldn\u2019t otherwise occur. Without that additionality, public financing risks merely replacing private capital or granting governments strategic rights over projects that would have proceeded anyway.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 67, "source": "Mining.com", "category": "metals", "title": "Gold miners climb as US Treasury yields rebound", "link": "https://www.mining.com/gold-miners-climb-as-us-treasury-yields-rebound/", "iso_date": "2026-08-20T17:42:28+00:00", "date_str": "Aug 20 \u2022 05:42 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Gold miners climb as US Treasury yields rebound</p><p style='margin-bottom: 1.25em;'>Gold miners extended their August rally Thursday even as long-term US Treasury yields rebounded and bullion edged lower, highlighting investors\u2019 appetite for precious-metals equities amid mounting fiscal concerns.</p><p style='margin-bottom: 1.25em;'>The VanEck Gold Miners ETF (NYSE Arca: GDX) gained 2.3% by 12:40 p.m. ET, while Agnico Eagle Mines (TSX, NYSE: AEM) rose 2%, Newmont (NYSE: NEM; TSX: NGT) advanced 2.2% and Barrick Mining (NYSE: B)(TSX: ABX) added 2.1%. Spot gold traded near $4,509, down marginally.</p><p style='margin-bottom: 1.25em;'>The gains came as the 30-year Treasury yield climbed as high as 5.27% before easing to about 5.25%, erasing much of the decline that followed the Treasury\u2019s decision Wednesday to at least double buybacks of longer-dated bonds.</p><p style='margin-bottom: 1.25em;'>The moves suggest investors remain unconvinced that the Treasury\u2019s latest intervention can contain long-term borrowing costs as US public debt surpasses $40 trillion. Persistent fiscal pressure and elevated yields strengthen gold\u2019s appeal as a hedge, while miners offer leveraged exposure to high bullion prices.</p><p style='margin-bottom: 1.25em;'>Treasury toolkit</p><p style='margin-bottom: 1.25em;'>Treasury Secretary Scott Bessent moved quickly to address the bond market\u2019s reaction, telling CNBC Thursday that buybacks \u201ccould be more than the $4 billion\u201d planned for next month and that the administration would unveil a fiscal consolidation plan by the end of this week or early next week.</p><p style='margin-bottom: 1.25em;'>Bessent pointed to potential savings from a fraud task force and suggested programs \u201cfrittered away\u201d at the state level could face cuts. He dismissed the latest 24-hour moves in yields as \u201cnoise,\u201d and said the Treasury has \u201ca big toolkit,\u201d arguing there is a \u201cvery good chance\u201d the fiscal deficit has peaked.</p><p style='margin-bottom: 1.25em;'>Bond strategists remained skeptical that larger buybacks would alter the underlying trajectory.</p><p style='margin-bottom: 1.25em;'>George Catrambone, head of fixed income at DWS Americas, called the intervention \u201cthe equivalent of tossing paper towel into a tsunami.\u201d</p><p style='margin-bottom: 1.25em;'>Molly Brooks, US rates strategist at TD Securities, said the yield increase \u201cis actually driven by oil\u201d and described the buyback shift as \u201cmore of a Band-Aid for Treasury\u2019s long-end.\u201d</p><p style='margin-bottom: 1.25em;'>George Goncalves at MUFG characterized the move as \u201cincremental and tactical,\u201d aimed at buying time, while Andrew Canobi at Franklin Templeton pointed to \u201ca synchronicity of forces arguing for higher yields\u201d across developed markets as fiscal pressures and stubborn inflation weigh on demand for long-term government debt.</p><p style='margin-bottom: 1.25em;'>The skepticism underscores the challenge facing the Treasury. Buybacks can support liquidity and demand at the long end, but they do not by themselves resolve the fiscal pressures pushing investors to demand higher yields.</p><p style='margin-bottom: 1.25em;'>Gold leverage</p><p style='margin-bottom: 1.25em;'>For gold miners, that uncertainty may be precisely the attraction.</p><p style='margin-bottom: 1.25em;'>The US government is buying back long-dated bonds as it confronts a debt load above $40 trillion and a deficit approaching $2 trillion. If those measures fail to restrain longer-term yields, concerns over debt sustainability and fiscal credibility could reinforce demand for gold as a hedge.</p><p style='margin-bottom: 1.25em;'>Mining equities can magnify moves in bullion because higher gold prices can expand producers\u2019 margins and cash flow faster than the underlying metal rises. That operating leverage helps explain why miners can advance even during sessions when bullion itself pauses or retreats.</p><p style='margin-bottom: 1.25em;'>The divergence Thursday \u2014 miners gaining while spot gold slipped and long-term yields rebounded \u2014 suggests investors are looking beyond the day-to-day moves in bullion and bonds toward the broader fiscal backdrop.</p><p style='margin-bottom: 1.25em;'>The risk is that persistently higher yields eventually strengthen competing returns available from government debt or tighten financial conditions enough to pressure gold and equities. For now, however, miners are signalling that investors remain willing to bet that Washington\u2019s struggle with debt and borrowing costs will continue supporting the gold trade.</p><p style='margin-bottom: 1.25em;'>(With files from Bloomberg)</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 68, "source": "Mining.com", "category": "metals", "title": "British Columbia First Nation rescinds support for Seabridge\u2019s KSM gold project", "link": "https://www.mining.com/british-columbia-first-nation-rescinds-support-for-seabridges-ksm-gold-project/", "iso_date": "2026-08-20T17:35:10+00:00", "date_str": "Aug 20 \u2022 05:35 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>British Columbia First Nation rescinds support for Seabridge\u2019s KSM gold project</p><p style='margin-bottom: 1.25em;'>The Gitxsan Huwilp government withdrew its support for Seabridge Gold\u2019s (TSX: SEA, NYSE: SA) KSM mine in northwestern British Columbia on Thursday.</p><p style='margin-bottom: 1.25em;'>The news follows years of petitions and challenges in opposition to the mine\u2019s development, with the Tsetsaut Skii km Lax Ha Nation (TSKLH) saying it was not properly consulted on the environmental risks the potential toxic waste poses to waterways on TSKLH\u2019s traditional territory. B.C.\u2019s supreme court ruled in favour of the First Nation in June 2026. As reported by CBC, Justice Emily Burke said the province breached its constitutional duty to consult the TSKLH Nation.</p><p style='margin-bottom: 1.25em;'>The Hereditary Chiefs of the Gitxsan Huwilp government, which has supported KSM\u2019s development since 2013, decided via unanimous vote to withdraw its support on Aug. 13, 2026 in solidarity with the TSKLH Nation.</p><p style='margin-bottom: 1.25em;'>\u201cHaving the support of our First Nations neighbours as we seek to uphold our role as stewards of the land is truly meaningful and sends a strong message to the province,\u201d said Darlene Simpson, the chief of TSKLH .</p><p style='margin-bottom: 1.25em;'>The Gitxsan Huwilp government says it has delivered its decision to the provincial and federal government, calling on it and Seabridge for, what it calls, \u201ctrue consultation.\u201d</p><p style='margin-bottom: 1.25em;'>\u201cGitxsan Hereditary Chiefs are looking far beyond the court order to real economic partnerships with collaboration and shared decision-making,\u201d said Gitxsan Huwilp government co-chairs Brian Williams and Norman Moore in a joint statement. \u201cFirst Nations are an essential fourth pillar of a strong northwest BC economy, with investors, corporate citizens and government being the other three.\u201d</p><p style='margin-bottom: 1.25em;'>Located 65 km northwest of Stewart, B.C., KSM is one of the world\u2019s largest undeveloped gold projects, according to Seabridge. A 2022 preliminary feasibility study (PFS) estimated reserves totalling 47.3 million ounces of gold and 7.3 billion pounds of copper, with a net present value (NPV) of $5.8 billion (C$8 billion).</p><p style='margin-bottom: 1.25em;'>One of TSKLH\u2019s primary concerns is that the mine\u2019s location threatens the Nass and Unuk river sheds, which support several species of Pacific salmon and eulachon.</p><p style='margin-bottom: 1.25em;'>\u201cTSKLH is not anti-development, as evidenced by our history of partnership with the resource industry,\u201d added Simpson. \u201cWhat we are is deeply concerned about the environmental and cultural impacts of putting the toxic waste dump for the largest gold mine in the world on our exclusive territory, next to pristine waterways we and wildlife rely on.\u201d</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 69, "source": "Mining.com", "category": "metals", "title": "Op-Ed: Europe wants critical minerals, just not the mines", "link": "https://www.mining.com/op-ed-europe-wants-critical-minerals-just-not-the-mines/", "iso_date": "2026-08-20T16:22:45+00:00", "date_str": "Aug 20 \u2022 04:22 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Op-Ed: Europe wants critical minerals, just not the mines</p><p style='margin-bottom: 1.25em;'>Europe has spent years designing a strategy to secure critical minerals, but its hardest problem may be one Brussels cannot legislate away: finding communities willing to host the mines and processing plants needed to make that strategy work.</p><p style='margin-bottom: 1.25em;'>Opposition to Serbia\u2019s Jadar lithium project rose from 55.5% in mid-2024 to 63.5% by March 2025, according to the EU Institute for Security Studies. Serbia isn\u2019t an EU member, but Brussels has designated Jadar a strategic project because of its potential importance to Europe\u2019s lithium supply chain. Many of the people who would live alongside it want it stopped.</p><p style='margin-bottom: 1.25em;'>The EU\u2019s Critical Raw Materials Act already sets ambitious benchmarks for 2030: 10% of strategic raw materials extracted domestically, 40% processed in the bloc and 25% recycled, while limiting dependence on any single foreign supplier to 65%. Setting those targets was the straightforward part. Finding somewhere to put the mine, smelter or tailings facility is considerably harder.</p><p style='margin-bottom: 1.25em;'>The problem isn\u2019t simply permitting. It is social licence \u2014 the continuing acceptance of a project by the communities affected by it. Europe can shorten administrative timelines and subsidize investment, but neither guarantees that people will accept an industrial operation next door.</p><p style='margin-bottom: 1.25em;'>Trust deficit</p><p style='margin-bottom: 1.25em;'>That resistance isn\u2019t irrational. Mining consumes land and water, creates waste and can leave environmental damage long after production ends. Communities also have ample reason to scrutinize promises from mining companies rather than accept them on faith.</p><p style='margin-bottom: 1.25em;'>But that is precisely why treating Europe\u2019s minerals problem primarily as an administrative bottleneck misses an important constraint.</p><p style='margin-bottom: 1.25em;'>Much of the debate about Europe\u2019s materials gap focuses on slow permitting and decades of allowing extraction and processing to migrate to countries including Chile, the Democratic Republic of Congo, Indonesia and China. Both contributed to today\u2019s dependence. Neither eliminates the political problem governments encounter when they try to bring those activities home.</p><p style='margin-bottom: 1.25em;'>China illustrates the contrast, although not as absolutely as it is sometimes portrayed. The country has experienced environmental protests and local opposition to industrial projects. The difference is institutional: China\u2019s political system gives opponents fewer avenues to delay or stop projects the state considers strategically important.</p><p style='margin-bottom: 1.25em;'>Beijing spent decades building the mines, refineries and smelters that helped establish its dominant position in several critical-mineral supply chains. Europe shouldn\u2019t want China\u2019s political model, and removing a community\u2019s ability to challenge a project isn\u2019t a policy worth importing. But the difference in how much institutional friction local opposition can generate helps explain why China could build mineral-processing capacity much faster.</p><p style='margin-bottom: 1.25em;'>The US offers a more useful comparison. American mines also face lawsuits, environmental challenges and opposition from local and Indigenous communities. Washington has responded by using federal financing, strategic authorities and efforts to accelerate permitting rather than eliminating legal challenges altogether.</p><p style='margin-bottom: 1.25em;'>America also has advantages Europe cannot easily reproduce: more sparsely populated mining regions and communities where resource extraction remains part of the local economy. Nevada has space that Saxony doesn\u2019t.</p><p style='margin-bottom: 1.25em;'>That makes social licence particularly important for Europe.</p><p style='margin-bottom: 1.25em;'>The term is well established across the global mining industry, including Europe, but obtaining that licence varies enormously between jurisdictions. Research into European lithium projects has found little major opposition to Finland\u2019s Keliber development, for example, while projects in France and Portugal have attracted substantially more controversy.</p><p style='margin-bottom: 1.25em;'>Finland never abandoned mining to the same extent as much of Western Europe. Familiarity doesn\u2019t guarantee acceptance, but it can influence how communities judge a new project. Trust is easier to establish where mining remains part of the economy than where the industry disappeared generations ago.</p><p style='margin-bottom: 1.25em;'>Mining companies also determine how much trust they deserve.</p><p style='margin-bottom: 1.25em;'>Rio Tinto\u2019s destruction in 2020 of the 46,000-year-old Juukan Gorge rock shelters in Western Australia, despite their cultural significance to the Puutu Kunti Kurrama and Pinikura people, became a global example of how quickly an industry\u2019s social licence can collapse. The fallout ultimately cost senior executives their jobs.</p><p style='margin-bottom: 1.25em;'>The lesson wasn\u2019t that communities are unreasonable to distrust mining. It was that trust is an asset companies can build \u2014 and destroy.</p><p style='margin-bottom: 1.25em;'>Europe therefore faces something more complicated than an image problem. Modern mines can be automated, remotely monitored and subjected to environmental standards unimaginable to previous generations, but none of that makes mining impact-free. New operations still consume land, use water and generate waste.</p><p style='margin-bottom: 1.25em;'>The contradiction is that Europe\u2019s energy transition requires enormous quantities of materials while many Europeans remain reluctant to accept the industrial activity required to produce them.</p><p style='margin-bottom: 1.25em;'>Europe wants the battery. It is much less comfortable with the mine behind it.</p><p style='margin-bottom: 1.25em;'>No substitute</p><p style='margin-bottom: 1.25em;'>Recycling won\u2019t resolve that contradiction soon enough.</p><p style='margin-bottom: 1.25em;'>The International Energy Agency expects manufacturing scrap to account for about two-thirds of available battery-recycling feedstock in 2030. Large volumes of end-of-life EV batteries won\u2019t become available until later as today\u2019s vehicle fleet ages, leaving recycling plants competing for limited material in the meantime.</p><p style='margin-bottom: 1.25em;'>The financial consequences are already visible. Battery recycler Ascend Elements filed for Chapter 11 protection in April 2026 after raising substantial private and public funding. Li-Cycle also ran into severe financial trouble after securing a $375-million US Department of Energy loan facility for its Rochester recycling hub.</p><p style='margin-bottom: 1.25em;'>Those companies faced their own operational and financial problems, but the broader constraint remains: recycling capacity cannot recover metals from batteries that haven\u2019t reached the end of their lives.</p><p style='margin-bottom: 1.25em;'>That makes the EU\u2019s 25% recycling benchmark useful as a long-term objective, but recycling cannot substitute for primary mining quickly enough to solve Europe\u2019s immediate supply problem.</p><p style='margin-bottom: 1.25em;'>Europe still faces permitting delays, skills shortages, high costs and difficult project economics. Social opposition isn\u2019t the only constraint, but it may be the one industrial policy is least equipped to solve. A government can change a permitting deadline. Changing how a community thinks about a mine takes years of credibility, consultation and demonstrated environmental performance.</p><p style='margin-bottom: 1.25em;'>That means local consent shouldn\u2019t be treated as an inconvenience standing in the way of industrial policy. It is what allows industrial policy to survive contact with reality.</p><p style='margin-bottom: 1.25em;'>Europe\u2019s choice ultimately isn\u2019t between mining and no mining. It is increasingly between mining more of the materials it consumes at home or relying on mines, refineries and communities somewhere else.</p><p style='margin-bottom: 1.25em;'>Europe will get its lithium, copper and rare earths either from projects such as Jadar, Barroso and Beauvoir or through supply chains controlled elsewhere, often on somebody else\u2019s terms.</p><p style='margin-bottom: 1.25em;'>It can\u2019t have both the mine it refuses and the independence it wants.</p><p style='margin-bottom: 1.25em;'>* Tobias Rossi is a founding partner of Atlas Strategy, a consulting firm specializing in geopolitics, business sustainability, and strategic intelligence. He has held prominent roles in the Office of the Secretary-General at the OECD, the Cabinet of UNESCO\u2019s Assistant Director-General for Social and Human Sciences, and Forrester Research. He is a graduate of the London School of Economics.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom:
