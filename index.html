it-spinout-to-trial-copper-recovery-tech-at-historic-arizona-mine/", "date_str": "Aug 20 \u2022 07:03 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>BHP, MIT spinout to trial copper recovery tech at historic Arizona mine</p><p style='margin-bottom: 1.25em;'>MIT-spinout SiTration and BHP announced Thursday the launch of two pilot deployments to trial SiTration\u2019s valorization technology in the Globe-Miami mining district in Arizona at BHP\u2019s Copper Cities site.</p><p style='margin-bottom: 1.25em;'>Copper Cities is a historic former copper mine that operated from the 1950s to the early 1980s, producing nearly 400,000 tonnes of copper.</p><p style='margin-bottom: 1.25em;'>The initiative will begin in August with an initial small-scale pilot designed to validate the continuous, autonomous production of copper from legacy mining water over one month.</p><p style='margin-bottom: 1.25em;'>A larger deployment planned for later this year will seek to produce up to two tonnes of commercial scale copper cathodes over a two-month period, SiTration said, adding that the companies see opportunity to recover value from legacy mining assets, with the potential to create new pathways for increasing domestic US copper supply.</p><p style='margin-bottom: 1.25em;'>SiTration and BHP have executed an agreement establishing a framework for collaboration on the pilot program and evaluation of future opportunities that may arise from successful pilot outcomes.</p><p style='margin-bottom: 1.25em;'>Through bench-scale testing using real feedstock from the site, SiTration said it has already demonstrated LME Grade A copper production. Without using any chemicals or generating new waste products, preliminary tests have yielded energy consumption below 3-4 kWh/kg to recover copper from the diluted legacy mining water.</p><p style='margin-bottom: 1.25em;'>\u201cThe American Southwest houses legacy mining water containing billions of dollars\u2019 worth of copper,\u201d SiTration CEO Brendan Smith said in a news release.</p><p style='margin-bottom: 1.25em;'>\u201cWith global copper demand projected to grow by around 70% by 2050 to support the rapid buildout of energy infrastructure and data centers, tapping into these resources is an excellent pathway to bolster domestic supply chains while producing copper at the bottom of the global cost curve,\u201d Smith said.</p><p style='margin-bottom: 1.25em;'>\u201cThe Copper Cities pilot provides an opportunity to evaluate an innovative approach to recover copper from mining-impacted water while generating valuable technical and operational insights,\u201d BHP\u2019s General Manager, legacy assets Kevin Ramsay added.</p><p style='margin-bottom: 1.25em;'>\u201cWe are excited to work with SiTration to test this technology under real operating conditions and better understand its potential to recover value from legacy mining water sources.\u201d</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 63, "source": "Mining.com", "category": "metals", "title": "Government cash reshapes mining\u2019s capital: study", "link": "https://www.mining.com/government-cash-reshapes-minings-capital-study/", "date_str": "Aug 20 \u2022 06:04 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Government cash reshapes mining\u2019s capital: study</p><p style='margin-bottom: 1.25em;'>As the US announces more investments in mining and processing, the public and mining companies need to be more aware of how that is shifting the government\u2019s role in the sector, its economy and control, a new GEM Consulting study shows.</p><p style='margin-bottom: 1.25em;'>Governments are moving beyond regulating critical-mineral projects to become lenders, investors and customers, reshaping how mining companies finance projects and who ultimately holds influence over their output, the consultancy said.</p><p style='margin-bottom: 1.25em;'>The shift means that companies seeking public funding must compete on more than geology, costs and conventional bankability. They increasingly need to meet government requirements covering product origin and qualification, domestic or allied content, workforce, reporting and security of supply.</p><p style='margin-bottom: 1.25em;'>An August US critical-minerals package illustrates the scale and variety of that involvement. It included a conditional loan of about $1.4 billion for Sila, roughly $400 million for Sunrise Energy Metals and about $150 million for Niron Magnetics, alongside smaller commitments for Strategic Bauxite, Westwater Resources, Global Advanced Metals and Harena pilot work. More than $180 million was earmarked for mining education.</p><p style='margin-bottom: 1.25em;'>This nearly $2 billion investment in mining shows how federal support can\u2019t be considered the same thing for all beneficiaries, as all of them will have different goals, purposes and rights, GEM said.</p><p style='margin-bottom: 1.25em;'>The study argues that all these different types and quantities of government funds will yield different results in the long term. A large loan, for example, can lower the cost of capital for a project moving toward commercial scale, while a much smaller grant could prove more consequential if pilot testing or customer qualification unlocks substantially more private financing. Education funding doesn\u2019t directly increase mine production but could ease workforce shortages affecting multiple projects, GEM said.</p><p style='margin-bottom: 1.25em;'>Global models</p><p style='margin-bottom: 1.25em;'>The US isn\u2019t alone. Canada, Australia, the European Union and Japan have developed their own approaches to financing mining and critical-mineral supply chains, but GEM\u2019s comparison shows that no major system relies on a single funding tool.</p><p style='margin-bottom: 1.25em;'>The US uses the broadest mix of loans, equity, grants, purchase rights and stockpiles, while Canada puts greater emphasis on infrastructure and equity participation. Australia combines financing with output rights and strategic inventories, the European Union emphasizes public credit, grants and permitting coordination, while Japan focuses on financing, offtake and deployable stockpiles.</p><p style='margin-bottom: 1.25em;'>GEM emphasized how important it is to make this information readily available to the public through a credible public database.</p><p style='margin-bottom: 1.25em;'>Guarantees and insurance should be reported as contingent exposure rather than money already spent, while repayments, fees, equity value and recovered rights should also be disclosed.</p><p style='margin-bottom: 1.25em;'>Matching funds</p><p style='margin-bottom: 1.25em;'>GEM advised that mining projects should choose a jurisdiction not by how much capital they offer, but which one can help them solve their issues and what comes with it.</p><p style='margin-bottom: 1.25em;'>Canada, for instance, may be particularly suited to remote projects requiring corridors and shared infrastructure, while European Union programs may better fit integrated mining and processing projects supplying EU customers. Japan\u2019s system is geared toward overseas supply linked to Japanese users, while Australia\u2019s approach suits projects that can provide allied supply and strategic reserve services.</p><p style='margin-bottom: 1.25em;'>Governments should try to manage the capital they are planning to invest in the sector as a portfolio and make support staged and conditional, GEM said.</p><p style='margin-bottom: 1.25em;'>These models can be replicated in other countries, as long as a similar framework is used, aiming to convert a credible project into qualified and reliable supply.</p><p style='margin-bottom: 1.25em;'>The study\u2019s final test is whether government involvement produces development that wouldn\u2019t otherwise occur. Without that additionality, public financing risks merely replacing private capital or granting governments strategic rights over projects that would have proceeded anyway.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 64, "source": "Mining.com", "category": "metals", "title": "Gold miners climb as US Treasury yields rebound", "link": "https://www.mining.com/gold-miners-climb-as-us-treasury-yields-rebound/", "date_str": "Aug 20 \u2022 05:42 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Gold miners climb as US Treasury yields rebound</p><p style='margin-bottom: 1.25em;'>Gold miners extended their August rally Thursday even as long-term US Treasury yields rebounded and bullion edged lower, highlighting investors\u2019 appetite for precious-metals equities amid mounting fiscal concerns.</p><p style='margin-bottom: 1.25em;'>The VanEck Gold Miners ETF (NYSE Arca: GDX) gained 2.3% by 12:40 p.m. ET, while Agnico Eagle Mines (TSX, NYSE: AEM) rose 2%, Newmont (NYSE: NEM; TSX: NGT) advanced 2.2% and Barrick Mining (NYSE: B)(TSX: ABX) added 2.1%. Spot gold traded near $4,509, down marginally.</p><p style='margin-bottom: 1.25em;'>The gains came as the 30-year Treasury yield climbed as high as 5.27% before easing to about 5.25%, erasing much of the decline that followed the Treasury\u2019s decision Wednesday to at least double buybacks of longer-dated bonds.</p><p style='margin-bottom: 1.25em;'>The moves suggest investors remain unconvinced that the Treasury\u2019s latest intervention can contain long-term borrowing costs as US public debt surpasses $40 trillion. Persistent fiscal pressure and elevated yields strengthen gold\u2019s appeal as a hedge, while miners offer leveraged exposure to high bullion prices.</p><p style='margin-bottom: 1.25em;'>Treasury toolkit</p><p style='margin-bottom: 1.25em;'>Treasury Secretary Scott Bessent moved quickly to address the bond market\u2019s reaction, telling CNBC Thursday that buybacks \u201ccould be more than the $4 billion\u201d planned for next month and that the administration would unveil a fiscal consolidation plan by the end of this week or early next week.</p><p style='margin-bottom: 1.25em;'>Bessent pointed to potential savings from a fraud task force and suggested programs \u201cfrittered away\u201d at the state level could face cuts. He dismissed the latest 24-hour moves in yields as \u201cnoise,\u201d and said the Treasury has \u201ca big toolkit,\u201d arguing there is a \u201cvery good chance\u201d the fiscal deficit has peaked.</p><p style='margin-bottom: 1.25em;'>Bond strategists remained skeptical that larger buybacks would alter the underlying trajectory.</p><p style='margin-bottom: 1.25em;'>George Catrambone, head of fixed income at DWS Americas, called the intervention \u201cthe equivalent of tossing paper towel into a tsunami.\u201d</p><p style='margin-bottom: 1.25em;'>Molly Brooks, US rates strategist at TD Securities, said the yield increase \u201cis actually driven by oil\u201d and described the buyback shift as \u201cmore of a Band-Aid for Treasury\u2019s long-end.\u201d</p><p style='margin-bottom: 1.25em;'>George Goncalves at MUFG characterized the move as \u201cincremental and tactical,\u201d aimed at buying time, while Andrew Canobi at Franklin Templeton pointed to \u201ca synchronicity of forces arguing for higher yields\u201d across developed markets as fiscal pressures and stubborn inflation weigh on demand for long-term government debt.</p><p style='margin-bottom: 1.25em;'>The skepticism underscores the challenge facing the Treasury. Buybacks can support liquidity and demand at the long end, but they do not by themselves resolve the fiscal pressures pushing investors to demand higher yields.</p><p style='margin-bottom: 1.25em;'>Gold leverage</p><p style='margin-bottom: 1.25em;'>For gold miners, that uncertainty may be precisely the attraction.</p><p style='margin-bottom: 1.25em;'>The US government is buying back long-dated bonds as it confronts a debt load above $40 trillion and a deficit approaching $2 trillion. If those measures fail to restrain longer-term yields, concerns over debt sustainability and fiscal credibility could reinforce demand for gold as a hedge.</p><p style='margin-bottom: 1.25em;'>Mining equities can magnify moves in bullion because higher gold prices can expand producers\u2019 margins and cash flow faster than the underlying metal rises. That operating leverage helps explain why miners can advance even during sessions when bullion itself pauses or retreats.</p><p style='margin-bottom: 1.25em;'>The divergence Thursday \u2014 miners gaining while spot gold slipped and long-term yields rebounded \u2014 suggests investors are looking beyond the day-to-day moves in bullion and bonds toward the broader fiscal backdrop.</p><p style='margin-bottom: 1.25em;'>The risk is that persistently higher yields eventually strengthen competing returns available from government debt or tighten financial conditions enough to pressure gold and equities. For now, however, miners are signalling that investors remain willing to bet that Washington\u2019s struggle with debt and borrowing costs will continue supporting the gold trade.</p><p style='margin-bottom: 1.25em;'>(With files from Bloomberg)</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 65, "source": "Mining.com", "category": "metals", "title": "British Columbia First Nation rescinds support for Seabridge\u2019s KSM gold project", "link": "https://www.mining.com/british-columbia-first-nation-rescinds-support-for-seabridges-ksm-gold-project/", "date_str": "Aug 20 \u2022 05:35 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>British Columbia First Nation rescinds support for Seabridge\u2019s KSM gold project</p><p style='margin-bottom: 1.25em;'>The Gitxsan Huwilp government withdrew its support for Seabridge Gold\u2019s (TSX: SEA, NYSE: SA) KSM mine in northwestern British Columbia on Thursday.</p><p style='margin-bottom: 1.25em;'>The news follows years of petitions and challenges in opposition to the mine\u2019s development, with the Tsetsaut Skii km Lax Ha Nation (TSKLH) saying it was not properly consulted on the environmental risks the potential toxic waste poses to waterways on TSKLH\u2019s traditional territory. B.C.\u2019s supreme court ruled in favour of the First Nation in June 2026. As reported by CBC, Justice Emily Burke said the province breached its constitutional duty to consult the TSKLH Nation.</p><p style='margin-bottom: 1.25em;'>The Hereditary Chiefs of the Gitxsan Huwilp government, which has supported KSM\u2019s development since 2013, decided via unanimous vote to withdraw its support on Aug. 13, 2026 in solidarity with the TSKLH Nation.</p><p style='margin-bottom: 1.25em;'>\u201cHaving the support of our First Nations neighbours as we seek to uphold our role as stewards of the land is truly meaningful and sends a strong message to the province,\u201d said Darlene Simpson, the chief of TSKLH .</p><p style='margin-bottom: 1.25em;'>The Gitxsan Huwilp government says it has delivered its decision to the provincial and federal government, calling on it and Seabridge for, what it calls, \u201ctrue consultation.\u201d</p><p style='margin-bottom: 1.25em;'>\u201cGitxsan Hereditary Chiefs are looking far beyond the court order to real economic partnerships with collaboration and shared decision-making,\u201d said Gitxsan Huwilp government co-chairs Brian Williams and Norman Moore in a joint statement. \u201cFirst Nations are an essential fourth pillar of a strong northwest BC economy, with investors, corporate citizens and government being the other three.\u201d</p><p style='margin-bottom: 1.25em;'>Located 65 km northwest of Stewart, B.C., KSM is one of the world\u2019s largest undeveloped gold projects, according to Seabridge. A 2022 preliminary feasibility study (PFS) estimated reserves totalling 47.3 million ounces of gold and 7.3 billion pounds of copper, with a net present value (NPV) of $5.8 billion (C$8 billion).</p><p style='margin-bottom: 1.25em;'>One of TSKLH\u2019s primary concerns is that the mine\u2019s location threatens the Nass and Unuk river sheds, which support several species of Pacific salmon and eulachon.</p><p style='margin-bottom: 1.25em;'>\u201cTSKLH is not anti-development, as evidenced by our history of partnership with the resource industry,\u201d added Simpson. \u201cWhat we are is deeply concerned about the environmental and cultural impacts of putting the toxic waste dump for the largest gold mine in the world on our exclusive territory, next to pristine waterways we and wildlife rely on.\u201d</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 66, "source": "Mining.com", "category": "metals", "title": "Op-Ed: Europe wants critical minerals, just not the mines", "link": "https://www.mining.com/op-ed-europe-wants-critical-minerals-just-not-the-mines/", "date_str": "Aug 20 \u2022 04:22 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Op-Ed: Europe wants critical minerals, just not the mines</p><p style='margin-bottom: 1.25em;'>Europe has spent years designing a strategy to secure critical minerals, but its hardest problem may be one Brussels cannot legislate away: finding communities willing to host the mines and processing plants needed to make that strategy work.</p><p style='margin-bottom: 1.25em;'>Opposition to Serbia\u2019s Jadar lithium project rose from 55.5% in mid-2024 to 63.5% by March 2025, according to the EU Institute for Security Studies. Serbia isn\u2019t an EU member, but Brussels has designated Jadar a strategic project because of its potential importance to Europe\u2019s lithium supply chain. Many of the people who would live alongside it want it stopped.</p><p style='margin-bottom: 1.25em;'>The EU\u2019s Critical Raw Materials Act already sets ambitious benchmarks for 2030: 10% of strategic raw materials extracted domestically, 40% processed in the bloc and 25% recycled, while limiting dependence on any single foreign supplier to 65%. Setting those targets was the straightforward part. Finding somewhere to put the mine, smelter or tailings facility is considerably harder.</p><p style='margin-bottom: 1.25em;'>The problem isn\u2019t simply permitting. It is social licence \u2014 the continuing acceptance of a project by the communities affected by it. Europe can shorten administrative timelines and subsidize investment, but neither guarantees that people will accept an industrial operation next door.</p><p style='margin-bottom: 1.25em;'>Trust deficit</p><p style='margin-bottom: 1.25em;'>That resistance isn\u2019t irrational. Mining consumes land and water, creates waste and can leave environmental damage long after production ends. Communities also have ample reason to scrutinize promises from mining companies rather than accept them on faith.</p><p style='margin-bottom: 1.25em;'>But that is precisely why treating Europe\u2019s minerals problem primarily as an administrative bottleneck misses an important constraint.</p><p style='margin-bottom: 1.25em;'>Much of the debate about Europe\u2019s materials gap focuses on slow permitting and decades of allowing extraction and processing to migrate to countries including Chile, the Democratic Republic of Congo, Indonesia and China. Both contributed to today\u2019s dependence. Neither eliminates the political problem governments encounter when they try to bring those activities home.</p><p style='margin-bottom: 1.25em;'>China illustrates the contrast, although not as absolutely as it is sometimes portrayed. The country has experienced environmental protests and local opposition to industrial projects. The difference is institutional: China\u2019s political system gives opponents fewer avenues to delay or stop projects the state considers strategically important.</p><p style='margin-bottom: 1.25em;'>Beijing spent decades building the mines, refineries and smelters that helped establish its dominant position in several critical-mineral supply chains. Europe shouldn\u2019t want China\u2019s political model, and removing a community\u2019s ability to challenge a project isn\u2019t a policy worth importing. But the difference in how much institutional friction local opposition can generate helps explain why China could build mineral-processing capacity much faster.</p><p style='margin-bottom: 1.25em;'>The US offers a more useful comparison. American mines also face lawsuits, environmental challenges and opposition from local and Indigenous communities. Washington has responded by using federal financing, strategic authorities and efforts to accelerate permitting rather than eliminating legal challenges altogether.</p><p style='margin-bottom: 1.25em;'>America also has advantages Europe cannot easily reproduce: more sparsely populated mining regions and communities where resource extraction remains part of the local economy. Nevada has space that Saxony doesn\u2019t.</p><p style='margin-bottom: 1.25em;'>That makes social licence particularly important for Europe.</p><p style='margin-bottom: 1.25em;'>The term is well established across the global mining industry, including Europe, but obtaining that licence varies enormously between jurisdictions. Research into European lithium projects has found little major opposition to Finland\u2019s Keliber development, for example, while projects in France and Portugal have attracted substantially more controversy.</p><p style='margin-bottom: 1.25em;'>Finland never abandoned mining to the same extent as much of Western Europe. Familiarity doesn\u2019t guarantee acceptance, but it can influence how communities judge a new project. Trust is easier to establish where mining remains part of the economy than where the industry disappeared generations ago.</p><p style='margin-bottom: 1.25em;'>Mining companies also determine how much trust they deserve.</p><p style='margin-bottom: 1.25em;'>Rio Tinto\u2019s destruction in 2020 of the 46,000-year-old Juukan Gorge rock shelters in Western Australia, despite their cultural significance to the Puutu Kunti Kurrama and Pinikura people, became a global example of how quickly an industry\u2019s social licence can collapse. The fallout ultimately cost senior executives their jobs.</p><p style='margin-bottom: 1.25em;'>The lesson wasn\u2019t that communities are unreasonable to distrust mining. It was that trust is an asset companies can build \u2014 and destroy.</p><p style='margin-bottom: 1.25em;'>Europe therefore faces something more complicated than an image problem. Modern mines can be automated, remotely monitored and subjected to environmental standards unimaginable to previous generations, but none of that makes mining impact-free. New operations still consume land, use water and generate waste.</p><p style='margin-bottom: 1.25em;'>The contradiction is that Europe\u2019s energy transition requires enormous quantities of materials while many Europeans remain reluctant to accept the industrial activity required to produce them.</p><p style='margin-bottom: 1.25em;'>Europe wants the battery. It is much less comfortable with the mine behind it.</p><p style='margin-bottom: 1.25em;'>No substitute</p><p style='margin-bottom: 1.25em;'>Recycling won\u2019t resolve that contradiction soon enough.</p><p style='margin-bottom: 1.25em;'>The International Energy Agency expects manufacturing scrap to account for about two-thirds of available battery-recycling feedstock in 2030. Large volumes of end-of-life EV batteries won\u2019t become available until later as today\u2019s vehicle fleet ages, leaving recycling plants competing for limited material in the meantime.</p><p style='margin-bottom: 1.25em;'>The financial consequences are already visible. Battery recycler Ascend Elements filed for Chapter 11 protection in April 2026 after raising substantial private and public funding. Li-Cycle also ran into severe financial trouble after securing a $375-million US Department of Energy loan facility for its Rochester recycling hub.</p><p style='margin-bottom: 1.25em;'>Those companies faced their own operational and financial problems, but the broader constraint remains: recycling capacity cannot recover metals from batteries that haven\u2019t reached the end of their lives.</p><p style='margin-bottom: 1.25em;'>That makes the EU\u2019s 25% recycling benchmark useful as a long-term objective, but recycling cannot substitute for primary mining quickly enough to solve Europe\u2019s immediate supply problem.</p><p style='margin-bottom: 1.25em;'>Europe still faces permitting delays, skills shortages, high costs and difficult project economics. Social opposition isn\u2019t the only constraint, but it may be the one industrial policy is least equipped to solve. A government can change a permitting deadline. Changing how a community thinks about a mine takes years of credibility, consultation and demonstrated environmental performance.</p><p style='margin-bottom: 1.25em;'>That means local consent shouldn\u2019t be treated as an inconvenience standing in the way of industrial policy. It is what allows industrial policy to survive contact with reality.</p><p style='margin-bottom: 1.25em;'>Europe\u2019s choice ultimately isn\u2019t between mining and no mining. It is increasingly between mining more of the materials it consumes at home or relying on mines, refineries and communities somewhere else.</p><p style='margin-bottom: 1.25em;'>Europe will get its lithium, copper and rare earths either from projects such as Jadar, Barroso and Beauvoir or through supply chains controlled elsewhere, often on somebody else\u2019s terms.</p><p style='margin-bottom: 1.25em;'>It can\u2019t have both the mine it refuses and the independence it wants.</p><p style='margin-bottom: 1.25em;'>* Tobias Rossi is a founding partner of Atlas Strategy, a consulting firm specializing in geopolitics, business sustainability, and strategic intelligence. He has held prominent roles in the Office of the Secretary-General at the OECD, the Cabinet of UNESCO\u2019s Assistant Director-General for Social and Human Sciences, and Forrester Research. He is a graduate of the London School of Economics.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 67, "source": "Federal Reserve - Releases", "category": "economy", "title": "Federal Reserve Board issues enforcement action with SouthPoint Bancshares, Inc. and announces termination of enforcement action with Deutsche Bank AG, DB USA Corporation, and Deutsche Bank AG New York Branch", "link": "https://www.federalreserve.gov/newsevents/pressreleases/enforcement20260820b.htm", "date_str": "Aug 20 \u2022 03:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>August 20, 2026</p><p style='margin-bottom: 1.25em;'>Federal Reserve Board issues enforcement action with SouthPoint Bancshares, Inc. and announces termination of enforcement action with Deutsche Bank AG, DB USA Corporation, and Deutsche Bank AG New York Branch</p><p style='margin-bottom: 1.25em;'>For release at 11:00 a.m. EDT</p><p style='margin-bottom: 1.25em;'>The Federal Reserve Board on Thursday announced the execution of the following enforcement action listed below:</p><p style='margin-bottom: 1.25em;'>SouthPoint Bancshares, Inc., Birmingham, Alabama</p><p style='margin-bottom: 1.25em;'>Written Agreement dated August 14, 2026</p><p style='margin-bottom: 1.25em;'>The Federal Reserve Board also announced the termination of the enforcement action listed below:</p><p style='margin-bottom: 1.25em;'>Deutsche Bank AG, Frankfurt am Main, Germany, DB USA Corporation, New York, New York, and Deutsche Bank AG New York Branch, New York, New York</p><p style='margin-bottom: 1.25em;'>Cease and Desist Order dated April 20, 2017 (PDF)</p><p style='margin-bottom: 1.25em;'>Terminated August 13, 2026</p><p style='margin-bottom: 1.25em;'>Additional enforcement actions can be searched for here.</p><p style='margin-bottom: 1.25em;'>For media inquiries, please email [email protected] or call 202-452-2955.</p>"}, {"id": 68, "source": "Federal Reserve - Releases", "category": "economy", "title": "Federal Reserve Board issues enforcement actions with former employee of Regions Bank and former employee of United Community Bank", "link": "https://www.federalreserve.gov/newsevents/pressreleases/enforcement20260820a.htm", "date_str": "Aug 20 \u2022 03:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>August 20, 2026</p><p style='margin-bottom: 1.25em;'>Federal Reserve Board issues enforcement actions with former employee of Regions Bank and former employee of United Community Bank</p><p style='margin-bottom: 1.25em;'>For release at 11:00 a.m. EDT</p><p style='margin-bottom: 1.25em;'>The Federal Reserve Board on Thursday announced the execution of the enforcement actions listed below:</p><p style='margin-bottom: 1.25em;'>Consent prohibition against Stephanie R. Kilbert</p><p style='margin-bottom: 1.25em;'>Former employee of Regions Bank, Birmingham, Alabama</p><p style='margin-bottom: 1.25em;'>Misappropriation of customer funds</p><p style='margin-bottom: 1.25em;'>Consent prohibition against Crystal A. Wykle</p><p style='margin-bottom: 1.25em;'>Former employee of United Community Bank, Greenville, South Carolina</p><p style='margin-bottom: 1.25em;'>Misappropriation of customer funds</p><p style='margin-bottom: 1.25em;'>Additional enforcement actions can be searched for here.</p><p style='margin-bottom: 1.25em;'>For media inquiries, please email [email protected] or call 202-452-2955.</p>"}, {"id": 69, "source": "Mining.com", "category": "metals", "title": "Colombia gold mine collapse kills 13 workers", "link": "https://www.mining.com/colombia-gold-mine-collapse-kills-13-worker/", "date_str": "Aug 20 \u2022 02:03 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Colombia gold mine collapse kills 13 workers</p><p style='margin-bottom: 1.25em;'>At least 13 workers have been killed and another seven injured in a landslide at an open pit gold mine in southwestern Colombia, in one of the country\u2019s latest deadly mining accidents.</p><p style='margin-bottom: 1.25em;'>The incident happened on Wednesday night when a slope collapse at the mine located in a rural area of Policarpa, in Nari\u00f1o department, according to local authorities. Firefighters, residents and emergency crews using excavators searched the site until about 2 a.m. Thursday, when officials said all those reported missing had been found.</p><p style='margin-bottom: 1.25em;'>Authorities initially received reports of an explosion, but later determined that a landslide had caused the disaster, according to Radio Caracol. The Nari\u00f1o governor\u2019s office has not said whether the gold operation held mining permits or was operating illegally, an important distinction in a region where authorities regularly target unauthorized mines linked to armed groups and environmental damage.</p><p style='margin-bottom: 1.25em;'>Witnesses said four of those killed belonged to the same Indigenous family. Residents said about 50 people, most of them members of the Quillacinga Indigenous group, regularly worked at the mine near Policarpa.</p><p style='margin-bottom: 1.25em;'>Informal mining</p><p style='margin-bottom: 1.25em;'>Deadly accidents are a recurring risk in Colombia\u2019s mining sector, particularly at unlicensed operations where workers extract precious metals without formal oversight or safety controls. An estimated 200,000 to 400,000 people participate in artisanal mining across the country, with many families relying on sales of gold and gemstones for income.</p><p style='margin-bottom: 1.25em;'>Illegal gold production presents a broader challenge. Criminal organizations, including armed groups and drug cartels, have used gold mining as a source of revenue, moving production through intermediaries and disguising its origins with apparently legitimate documentation before it enters international supply chains.</p><p style='margin-bottom: 1.25em;'>The risks extend beyond mine sites. A recent New York Times investigation found that Colombian gold linked to criminal networks entered the supply chain of the US Mint, which under federal law must use US-mined gold for its investor-grade coins.</p><p style='margin-bottom: 1.25em;'>Previous investigations and enforcement actions have also traced Latin American gold, including supplies originating in Peru and Ecuador, to North American refiners and traders after illicit material was mixed with legitimate production or exported using falsified documents.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 70, "source": "Mining.com", "category": "metals", "title": "Las Bambas halt adds to South America copper woes", "link": "https://www.mining.com/las-bambas-halt-adds-to-south-america-copper-woes/", "date_str": "Aug 20 \u2022 12:10 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Las Bambas halt adds to South America copper woes</p><p style='margin-bottom: 1.25em;'>MMG Ltd. (HKG: 1208) has suspended operations at its Las Bambas mine in Peru after an accident killed two workers, adding another disruption to South American copper supply as concentrate availability remains tight.</p><p style='margin-bottom: 1.25em;'>The accident occurred Aug. 18 during pump replacement work at a clarification pond about 9 km from the processing plant, killing two workers and injuring three others. MMG, a subsidiary of state-owned China Minmetals Corp., said.</p><p style='margin-bottom: 1.25em;'>Peru\u2019s labour inspection authority, Sunafil, has opened its own investigation and sent inspectors to the site to determine the circumstances surrounding the accident.</p><p style='margin-bottom: 1.25em;'>MMG expects operations to restart progressively from Aug. 21 and has not announced a change to its 2026 copper production guidance. The timetable suggests the interruption could be relatively brief.</p><p style='margin-bottom: 1.25em;'>Las Bambas is one of Peru\u2019s largest copper mines and produced 410,829 tonnes of copper in 2025, according to the country\u2019s Ministry of Energy and Mines data. That was about 28% above its 2024 output and represented roughly 2% of global mined supply.</p><p style='margin-bottom: 1.25em;'>Supply pressure</p><p style='margin-bottom: 1.25em;'>The shutdown comes as other disruptions in South America are adding to concerns about copper availability. Lundin Mining (TSX: LUN) recently lowered its annual copper production guidance in Chile by 10,000 tonnes because of weather-related interruptions.</p><p style='margin-bottom: 1.25em;'>Las Bambas has also endured repeated disruptions since ramping up in 2015-16, largely because of protests and road blockades involving communities along the roughly 450-km route used to transport concentrate to the Port of Matarani.</p><p style='margin-bottom: 1.25em;'>Operations were disrupted for more than 100 days in 2019 as communities along the transport corridor sought action from MMG and the Peruvian government over truck emissions and the loss of farmland.</p><p style='margin-bottom: 1.25em;'>The mine shut completely for more than a month in 2022 after two communities that had previously sold land for the project re-entered the properties. One was later evicted, while Huancuire remained on the property, according to MMG.</p><p style='margin-bottom: 1.25em;'>Market impact</p><p style='margin-bottom: 1.25em;'>The latest suspension stems from a workplace accident rather than the social conflicts behind many previous stoppages, giving the disruption a different risk profile.</p><p style='margin-bottom: 1.25em;'>Its significance extends beyond the mine. Peru is the world\u2019s third-largest copper producer, while Las Bambas accounts for a meaningful share of global mined output. Any extension of the shutdown could therefore compound supply pressure from other interruptions across the region.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 71, "source": "Mining.com", "category": "metals", "title": "Fortescue keeps executive at work during sex-harassment probe", "link": "https://www.mining.com/fortescue-keeps-executive-at-work-during-harassment-probe/", "date_str": "Aug 20 \u2022 10:45 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Fortescue keeps executive at work during sex-harassment probe</p><p style='margin-bottom: 1.25em;'>Fortescue (ASX: FMG) is keeping an unnamed senior executive at work while external lawyers investigate allegations of sexual harassment and bullying, energy chief Gus Pichot said Thursday.</p><p style='margin-bottom: 1.25em;'>The Australian miner hired law firm MinterEllison to investigate the allegations, first reported by the Australian Financial Review earlier this month. The inquiry comes as Fortescue faces a separate class action alleging workplace misconduct and continued scrutiny over its handling of harassment complaints.</p><p style='margin-bottom: 1.25em;'>\u201cWe have taken extensive external legal and governance advice so we are quite confident we are following the proper process,\u201d Pichot said during an earnings call discussing the company\u2019s annual results.</p><p style='margin-bottom: 1.25em;'>The allegations put renewed attention on workplace culture at Fortescue, Australia\u2019s third-largest miner, as Western Australia\u2019s resources industry continues to grapple with sexual harassment and assault allegations at remote operations. A 2022 parliamentary report documented widespread problems and prompted the state to strengthen its response to misconduct at mine sites.</p><p style='margin-bottom: 1.25em;'>The latest investigation follows an earlier dispute with Western Australian authorities over Fortescue\u2019s handling of alleged misconduct. The miner avoided charges for failing to provide documents concerning dozens of alleged sexual harassment cases after settling the matter in late 2023.</p><p style='margin-bottom: 1.25em;'>Under that settlement, Fortescue agreed to spend A$1.4 million ($1 million) on strategies aimed at addressing inappropriate workplace behaviour across the mining industry.</p><p style='margin-bottom: 1.25em;'>The company faces separate legal pressure after law firm JGA Saddler filed a class action in June alleging workplace misconduct, including sexual harassment and sex discrimination. Potential damages have not been specified.</p><p style='margin-bottom: 1.25em;'>JGA Saddler also launched similar class actions against Rio Tinto (ASX: RIO) and BHP (ASX: BHP) in late 2024. Those cases remain before the courts.</p><p style='margin-bottom: 1.25em;'>Industry scrutiny</p><p style='margin-bottom: 1.25em;'>Fortescue reported 98 \u201cpsychosocial\u201d breaches in its latest financial year, down 20% from the previous year. The category includes sexual harassment, ethics violations and other incidents.</p><p style='margin-bottom: 1.25em;'>The company, which employs 16,154 people, dismissed 11 workers for code-of-conduct breaches related to discrimination and sexual harassment. It recorded 13 cases of inappropriate sexual contact, 10 of sexual harassment and one of sexual assault.</p><p style='margin-bottom: 1.25em;'>Fortescue is not alone in confronting misconduct allegations as Australia\u2019s biggest miners disclose hundreds of workplace complaints and disciplinary actions.</p><p style='margin-bottom: 1.25em;'>BHP said in its annual report this week that it terminated 109 employees for sexual harassment and another 22 for racial harassment during the past year. The company, which has 84,309 employees and contractors worldwide, recorded 380 sexual harassment reports in fiscal 2026, an 11% decline, while racial harassment reports fell 17% to 86.</p><p style='margin-bottom: 1.25em;'>Rio Tinto recorded 702 incidents reported to its employee care hub in 2025, a 24% increase. The service supports workers dealing with disrespectful or harmful workplace behaviour, including harassment.</p><p style='margin-bottom: 1.25em;'>Western Australia\u2019s WorkSafe regulator recorded 28 incidents related to sexual assault and harassment during the first six months of this year, compared with 113 for all of last year and a peak of 421 in 2022.</p><p style='margin-bottom: 1.25em;'>WorkSafe attributed the decline to a specialist team established after the state\u2019s inquiry increased its capacity to respond to sexual harassment complaints.</p><p style='margin-bottom: 1.25em;'>The falling number of reports suggests conditions may be improving across Western Australian mine sites, but the investigation at Fortescue and continuing class actions show workplace conduct remains a significant legal and governance issue for the country\u2019s largest miners.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 72, "source": "Mining.com", "category": "metals", "title": "Ramaco\u00a0Resources, Indium Corp ink gallium and germanium supply deal for Brook mine", "link": "https://www.mining.com/ramaco-resources-indium-corp-ink-gallium-and-germanium-supply-deal-for-brook-mine/", "date_str": "Aug 19 \u2022 11:52 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Ramaco Resources, Indium Corp ink gallium and germanium supply deal for Brook mine</p><p style='margin-bottom: 1.25em;'>Ramaco Resources (NASDAQ: METC, METCB) said Wednesday it has entered into a non-binding memorandum of understanding (MOU) with Indium Corporation for supply of gallium and germanium from Ramaco\u2019s Brook mine rare earth and critical-mineral project in Wyoming.</p><p style='margin-bottom: 1.25em;'>Ramaco is developing critical minerals and rare earth elements at Brook mine, which it says holds what is believed to be the nation\u2019s largest unconventional deposit of rare earth elements and critical minerals sourced from coal and carbonaceous ore.</p><p style='margin-bottom: 1.25em;'>Brook is America\u2019s first new rare earth element and critical mineral mine in over 70 years, and it will be initially focused on the vertically integrated production of commercial oxides. Full-scale mining and construction of a pilot processing facility are underway at the mine located near Sheridan.</p><p style='margin-bottom: 1.25em;'>Clinton, New York headquartered Indium Corporation is a global materials refiner, smelter, and manufacturer. It supplies specialized metals, solders, and thermal management products used to build electronics, semiconductors, electric vehicles, aerospace and defense systems.</p><p style='margin-bottom: 1.25em;'>The company specializes in refining, alloy development, and manufacture of high-performance materials, including gallium- and germanium-based products used throughout the semiconductor value chain.</p><p style='margin-bottom: 1.25em;'>Under the MOU, Ramaco and Indium Corporation agree to negotiate the potential supply of gallium and germanium from the Brook Mine project.</p><p style='margin-bottom: 1.25em;'>\u201cWe believe this MOU demonstrates a promising opportunity to introduce Brook Mine gallium and germanium into established domestic and allied supply chains,\u201d Ramaco Resources CEO Randall Atkins said in a news release.</p><p style='margin-bottom: 1.25em;'>\u201cBy combining Ramaco\u2019s potential domestic resource base with Indium Corporation\u2019s\u2026established presence in advanced technology manufacturing, we believe this proposed relationship could strengthen and diversify the supply of materials that are increasingly critical to the U.S. electronics, semiconductor, and advanced manufacturing industries,\u201d Atkins said.</p><p style='margin-bottom: 1.25em;'>Ramaco Resources\u2019 stock closed the day up 3.97% on the NASDAQ. The company has a $698.8 million market capitalization.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}];

            <span class="time-label">${a.date_str}</span>
          </div>
          <div class="row-title">${a.title}</div>
        `;
        headlineStream.appendChild(row);
      });

      if (!filtered.some(a => a.id === selectedId) && filtered.length > 0) {
        selectArticle(filtered[0].id);
      }
    }

    function selectArticle(id) {
      selectedId = id;
      const article = articles.find(a => a.id === id);
      if (!article) return;

      renderStream();

      detailPane.innerHTML = `
        <div class="reader-container">
          <div class="detail-meta">
            <span class="badge badge-${article.category}">${article.category.toUpperCase()}</span>
            <span class="source-label" style="font-size: 12px; font-weight: 600;">${article.source}</span>
            <span class="time-label">• ${article.date_str}</span>
          </div>
          <h2 class="detail-title">${article.title}</h2>
          <div class="detail-body">${article.full_text}</div>
          <div class="action-bar">
            <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="primary-btn">
              Open Original Source ↗
            </a>
          </div>
        </div>
      `;
      detailPane.scrollTop = 0;
    }

    function filterCategory(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.tab-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderStream();
    }

    searchInput.addEventListener('input', () => {
      currentSearch = searchInput.value.toLowerCase().trim();
      renderStream();
    });

    renderStream();
    if (articles.length > 0) {
      selectArticle(articles[0].id);
    }
  </script>
</body>
</html>
