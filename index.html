  <style>
    :root {
      --bg-body: #07090e;
      --bg-surface: #0e131f;
      --bg-surface-hover: #151c2e;
      --bg-active: #1a233a;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #8492a6;
      --accent-economy: #10b981;
      --accent-markets: #38bdf8;
      --accent-crypto: #a855f7;
      --accent-metals: #eab308;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .live-indicator {
      width: 7px;
      height: 7px;
      background: var(--accent-economy);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-economy);
    }

    .search-bar {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      width: 260px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--accent-markets);
    }

    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 49px);
      overflow: hidden;
    }

    /* Master Stream: 38% width */
    .master-pane {
      width: 38%;
      min-width: 360px;
      max-width: 520px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background: var(--bg-body);
      flex-shrink: 0;
    }

    .filter-bar {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(14, 19, 31, 0.7);
    }

    .tab-pill {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-pill:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .tab-pill.active {
      background: var(--text-main);
      color: var(--bg-body);
      border-color: var(--text-main);
    }

    .headline-stream {
      flex: 1;
      overflow-y: auto;
    }

    .headline-row {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .headline-row:hover {
      background: var(--bg-surface-hover);
    }

    .headline-row.active {
      background: var(--bg-active);
      border-left: 3px solid var(--accent-markets);
    }

    .row-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .row-tags {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 8.5px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 5px;
      border-radius: 3px;
      letter-spacing: 0.4px;
    }

    .badge-economy { background: rgba(16, 185, 129, 0.15); color: var(--accent-economy); }
    .badge-markets { background: rgba(56, 189, 248, 0.15); color: var(--accent-markets); }
    .badge-crypto  { background: rgba(168, 85, 247, 0.15); color: var(--accent-crypto); }
    .badge-metals  { background: rgba(234, 179, 8, 0.15); color: var(--accent-metals); }

    .source-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .time-label {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .row-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Detail Pane: Expansive Reader */
    .detail-pane {
      flex: 1;
      padding: 40px 60px;
      overflow-y: auto;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
    }

    .reader-container {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .detail-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 24px;
      color: #ffffff;
      letter-spacing: -0.4px;
    }

    .detail-body {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 18px;
      line-height: 1.8;
      color: #d1d5db;
      margin-bottom: 40px;
      white-space: pre-line;
    }

    .action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      margin-bottom: 60px;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-markets);
      color: #040914;
      font-weight: 600;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      padding: 9px 16px;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    @media (max-width: 860px) {
      .workspace { flex-direction: column; }
      .master-pane { width: 100%; max-width: none; height: 45%; }
      .detail-pane { height: 55%; padding: 24px 20px; }
      .detail-title { font-size: 20px; }
      .detail-body { font-size: 16px; }
    }
  </style>

  <script>
    const articles = [{"id": 0, "source": "Yahoo Finance", "category": "markets", "title": "He Sold Nothing in the 2022 Crash. He Swapped Into a Similar Fund for a Week, Booked $90,000 of Losses, and Hasn\u2019t Paid Capital-Gains Tax Since.", "link": "https://finance.yahoo.com/markets/options/articles/sold-nothing-2022-crash-swapped-224702668.html", "date_str": "Aug 22 \u2022 10:47 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>He Sold Nothing in the 2022 Crash. He Swapped Into a Similar Fund for a Week, Booked $90,000 of Losses, and Hasn\u2019t Paid Capital-Gains Tax Since.</p><p style='margin-bottom: 1.25em;'>Quick Read</p><p style='margin-bottom: 1.25em;'>-       Tax-loss harvesting lets investors sell a losing fund, instantly swap into a similar one, and bank realized losses to offset capital gains for years.</p><p style='margin-bottom: 1.25em;'>-       Losses offset capital gains dollar-for-dollar, then cut ordinary income by up to $3,000 annually, with any unused amount carrying forward indefinitely.</p><p style='margin-bottom: 1.25em;'>-       The wash-sale rule kills the deduction if you, a spouse, or an IRA buys a substantially identical security within 30 days of the sale.</p><p style='margin-bottom: 1.25em;'>-       Are you ahead, or behind on retirement? SmartAsset's free tool can match you with a financial advisor in minutes to help you answer that today. Each advisor has been carefully vetted, and must act in your best interests. Don't waste another minute; learn more here.</p><p style='margin-bottom: 1.25em;'>If you hold stocks or funds in a regular taxable brokerage account, there is a legal move sitting inside it that the IRS wrote into the code itself: tax-loss harvesting. You sell a position that is underwater, immediately buy a similar (but not identical) fund to stay invested, and keep the paper loss as a tax asset you can spend for years. Investors who applied this approach during the 2022 drawdown, when the S&P 500 fell 19.95% between January 3 and December 30 of that year, stayed invested by switching tickers, realized the paper loss, and could draw it down against gains in later years.</p><p style='margin-bottom: 1.25em;'>_________________________________</p><p style='margin-bottom: 1.25em;'>What's Your Number...?</p><p style='margin-bottom: 1.25em;'>Here's a question most people 5y from retirement can't answer: at your current savings rate, how much do you need, and how long will it actually last? A good advisor can put a date on that in a single meeting. SmartAsset's free quiz matches you with up to three fiduciary advisors serving your area, so you can get YOUR retirement number now (sponsor)</p><p style='margin-bottom: 1.25em;'>__________________________________________</p><p style='margin-bottom: 1.25em;'>How the Swap Actually Works</p><p style='margin-bottom: 1.25em;'>The mechanic works like this. A taxpayer sells Fund A at a loss. Within seconds, a purchase of Fund B follows, a fund that tracks a different index or a different slice of the market but moves almost in lockstep with Fund A. Think of a total market fund instead of an S&P 500 fund, or a large\u2011cap value ETF instead of a large\u2011cap blend ETF. The loss is now \"realized\" for tax purposes, even though the economic exposure barely blinked. That realized loss first offsets any capital gains taken during the year, dollar for dollar. Anything left over then reduces ordinary income by up to $3,000 per year. Whatever remains unused rolls forward indefinitely, year after year, until death.</p><p style='margin-bottom: 1.25em;'>Where the Rule Lives in the Code</p><p style='margin-bottom: 1.25em;'>The netting and carryforward rules come straight from the Internal Revenue Code. Section 1211(b) caps the annual ordinary\u2011income offset, while Section 1212(b) lets individuals carry unused capital losses forward indefinitely with no expiration date. The guardrail on the swap itself is Section 1091, better known as the wash\u2011sale rule, which disallows a loss if a \"substantially identical\" security is purchased within 30 days before or after the sale. IRS Publication 550 walks through both the netting order and the wash\u2011sale definition in plain, readable language.</p>"}, {"id": 1, "source": "Yahoo Finance", "category": "markets", "title": "The Hidden Cost Of Home Insurance", "link": "https://finance.yahoo.com/video/hidden-cost-home-insurance-223201978.html", "date_str": "Aug 22 \u2022 10:32 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>The Hidden Cost Of Home Insurance The Hustle Sat, August 22, 2026 at 4:32 PM MDT The Hidden Cost Of Home Insurance View Comments Terms and Privacy Policy Your Privacy Choices Utah Privacy Notice More Info</p>"}, {"id": 2, "source": "Yahoo Finance", "category": "markets", "title": "Apple Announced Its Largest-Ever Stock Buyback Under Tim Cook's Leadership. Here's Why the Size of the Repurchase Program Matters for Shareholders.", "link": "https://finance.yahoo.com/markets/stocks/articles/apple-announced-largest-ever-stock-222000154.html", "date_str": "Aug 22 \u2022 10:20 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Apple Announced Its Largest-Ever Stock Buyback Under Tim Cook's Leadership. Here's Why the Size of the Repurchase Program Matters for Shareholders.</p><p style='margin-bottom: 1.25em;'>When Tim Cook became CEO of Apple (NASDAQ: AAPL) in 2011, one of his biggest strategic shifts was returning capital to shareholders. He reinstated the company's dividend in 2012 and, more importantly, launched a massive stock buyback program.</p><p style='margin-bottom: 1.25em;'>Apple has spent more than any other company on stock buybacks over the last 10 years, according to research by The Motley Fool. Here's a closer look at how much it has spent and why this benefits shareholders.</p><p style='margin-bottom: 1.25em;'>Missed Nvidia in 2009? This Rare Signal Is Flashing Again. In 2009, a \"Double Down\" signal flashed for a little-known chipmaker called Nvidia. For the first time in years, that same \"Total Conviction\" signal is flashing for a company 1/100th the size of Nvidia. Continue \u00bb</p><p style='margin-bottom: 1.25em;'>Apple's stock buybacks during Tim Cook's tenure</p><p style='margin-bottom: 1.25em;'>Cook has been part of multiple record-breaking share buybacks while CEO of Apple. Near the beginning of his tenure, the board authorized a $10 billion buyback for its fiscal 2013, but later raised that to $60 billion, the largest single share-repurchase authorization in history. It authorized repurchases of $100 billion in 2018 and $110 billion in 2024, with the latter still being its largest-ever buyback. In 2025 and 2026, it authorized $100 billion in buybacks.</p><p style='margin-bottom: 1.25em;'>A buyback authorization only means a company can spend up to that amount, not that it will. Apple normally uses most of it, though, and has bought back a whopping $877 billion in shares under Cook's leadership.</p><p style='margin-bottom: 1.25em;'>A (mostly) positive move for Apple shareholders</p><p style='margin-bottom: 1.25em;'>After Apple buys back shares, it retires them. With fewer shares in circulation, every shareholder owns a larger slice of the company. Over a quarter or even a year, this is a relatively minor change. At Apple's market cap of $4.6 trillion (as of Aug. 19), a $100 billion repurchase authorization means buying back a little over 2% of the company.</p><p style='margin-bottom: 1.25em;'>But for a long-term investor, it makes a significant difference. Case in point, when Cook took over, Apple had about 26 billion split-adjusted outstanding shares. It reported 14.6 billion outstanding shares as of July 2026, so the share count has fallen by about 44%. A share purchased at the start of Cook's tenure now owns nearly 80% more than it did then.</p><p style='margin-bottom: 1.25em;'>The caveat here is that Apple's valuation has risen significantly since the early days of its buyback program. It traded between 12 and 18 times earnings for much of the 2010s. It trades at 36 times trailing earnings as of this writing, while Apple and other top tech stocks have seen considerable price appreciation. Buying back shares at a higher valuation means less added value for shareholders.</p>"}, {"id": 3, "source": "Yahoo Finance", "category": "markets", "title": "The Gas Turbine Shortage Just Became AI\u2019s Biggest Constraint", "link": "https://finance.yahoo.com/energy/articles/gas-turbine-shortage-just-became-210000180.html", "date_str": "Aug 22 \u2022 09:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Order a heavy-duty gas turbine from GE Vernova today and it won't arrive until 2031. That's the company's actual production schedule, confirmed on its July 22 earnings call, and it's the fact sitting underneath every AI data center power plan announced in the last two years. It comes up far less often than the announcements do.</p><p style='margin-bottom: 1.25em;'>Goldman Sachs put hard numbers on the demand side in May. U.S. data center power demand climbs from 31 gigawatts in 2025 to 41 GW this year and 66 GW in 2027. Year-over-year capacity additions accelerate from 8.5 GW actually realized last year to 13.6 GW scheduled for 2026 and 36.3 GW scheduled for 2027. By then data centers would take 8.5% of total U.S. peak summer demand, up from 4.1% today.</p><p style='margin-bottom: 1.25em;'>The equipment meant to generate that power is on a completely different clock.</p><p style='margin-bottom: 1.25em;'>The Big Three Are Booked Solid Into the 2030s</p><p style='margin-bottom: 1.25em;'>GE Vernova closed the second quarter with 116 GW of gas power equipment backlog and slot reservation agreements, up from 100 GW three months earlier and 83 GW at the end of 2025. It expects at least 125 GW under contract by December. CEO Scott Strazik told analysts the company is taking reservations for 2031 delivery and should be more than halfway contracted for that year by the end of 2026. Its production plan: roughly 20 GW annualized this quarter, 24 GW by 2028, and a push toward 30 GW by 2030.</p><p style='margin-bottom: 1.25em;'>Siemens Energy ended its fiscal third quarter on June 30 with a 69 GW gas turbine backlog after booking 15 GW and shipping six. Lead times run three years or more. CEO Christian Bruch told analysts the addressable market could reach 120 GW a year, roughly half of it American.</p><p style='margin-bottom: 1.25em;'>Mitsubishi Heavy Industries reported a 35 GW large-frame backlog on Aug. 6, up from 23 GW a year earlier. That figure covers Mitsubishi's fiscal first quarter, which runs March through June, so it lags roughly a month behind the calendar-quarter numbers above. CFO Hiroshi Nishio said orders booked during the quarter are scheduled for delivery between 2028 and 2030, and that the company is \"being selective in the projects we contract.\"</p><p style='margin-bottom: 1.25em;'>Add the three headline numbers and you get 220 GW, which overstates the case, because none of them is counting the same thing. Of GE Vernova's 116 GW, only 53 GW is firm equipment backlog; the other 63 GW is slot reservations, paid options that haven't converted to orders yet. Siemens' 69 GW is firm backlog with no reservations mixed in. Mitsubishi's 35 GW covers large-frame turbines only, leaving out its aeroderivative and mid-size lines. None of the three would explain what the other two mean by \"backlog\" without a footnote.</p><p style='margin-bottom: 1.25em;'>What all three agree on, regardless of how each counts it, is direction and scale. Global orders in the second quarter hit a record 38 GW, up 71% year on year, with the U.S. accounting for half. Wood Mackenzie puts worldwide manufacturing capacity at 60 to 70 GW a year against roughly 110 GW of orders.</p><p style='margin-bottom: 1.25em;'>One Year of AI Demand Outstrips the Entire Industry's Output</p><p style='margin-bottom: 1.25em;'>That 36.3 GW figure from Goldman is the one that matters most, because it's larger than what the entire turbine industry can plausibly deliver in a single year. Everything GE Vernova builds annually, worldwide, for every customer on the planet, is about 20 GW. Only a fifth of the gigawatts under contract are earmarked for data centers in the first place. The rest goes to utilities replacing coal, Middle East power and desalination projects, industrial load and grid reliability work queued up long before anyone was talking about inference clusters.</p><p style='margin-bottom: 1.25em;'>Even in a fantasy where GE Vernova pointed its entire global output at American AI campuses, it wouldn't cover one year of the Goldman curve. And it couldn't, because those slots were sold years ago.</p><p style='margin-bottom: 1.25em;'>The turbines running data centers in 2027 were ordered in 2023 and 2024. Turbines ordered this month land somewhere around 2030 or 2031. Everything in between is either already spoken for, coming from something other than a new gas plant, or not happening.</p><p style='margin-bottom: 1.25em;'>This is also the part of the supply chain that scales worst. Hot-section castings, the blades and vanes that sit in a 1,000-degree gas path, come from a thin bench of specialized foundries, and the welders and machinists who assemble these machines were laid off a decade ago and never replaced. Even where a slot exists, there aren't enough qualified contractors to install the thing. Average lead times for a new combined-cycle plant have gone from three and a half years in 2023 to roughly five now, and seven for some heavy-duty frames.</p><p style='margin-bottom: 1.25em;'>PJM Paid Top Dollar and Still Came Up Short</p><p style='margin-bottom: 1.25em;'>PJM's capacity auction on July 14 is the clearest read available on what the gap costs.</p><p style='margin-bottom: 1.25em;'>The auction for the 2028/2029 delivery year cleared at $325 per megawatt-day, the FERC-approved cap, for the third consecutive year. It procured 138,318 MW of unforced capacity, which left the system 6,831 MW below PJM's own reliability requirement. New generation and uprates that cleared: 525 MW.</p><p style='margin-bottom: 1.25em;'>The largest wholesale power market in the country paid the maximum price its rules allow, came up nearly 7 GW short and attracted about half a gigawatt of new supply in return. PJM's own modeling showed that without the cap, the RTO would have cleared at $554.72 per megawatt-day and the ComEd zone at $776.69.</p><p style='margin-bottom: 1.25em;'>PJM has proposed a one-time Reliability Backstop Procurement targeting roughly 14.9 GW of new capacity, split between bilateral contracts starting this September and a pay-as-bid auction next March. Whether that fills a hole gas turbine makers can't touch inside three years is the open question.</p><p style='margin-bottom: 1.25em;'>Turbine Prices Have Nearly Doubled, and Gas Isn't the Reason</p><p style='margin-bottom: 1.25em;'>Prices have moved accordingly. BloombergNEF put the average combined-cycle project at $2,157 per kilowatt last year, up from under $1,500 in 2023. A GridLab review of actual project filings found plants due to finish in 2026 and 2027 reported $1,116 to $1,427 per kW, while projects targeting 2030 and 2031 routinely report $2,000 per kW or more. Wood Mackenzie expects turbine prices alone to reach $600 per kW by the end of 2027, a 195% jump from 2019.</p><p style='margin-bottom: 1.25em;'>The fuel itself has nothing to do with it. Henry Hub spot gas was trading around $2.79 per MMBtu in mid-August, and government trackers put the 2026 average near $3.31, both unremarkable by the last five years' standards. The bottleneck sits entirely in castings, welders and factory slots, not in the molecule being burned.</p><p style='margin-bottom: 1.25em;'>GE Vernova is collecting on the hardware side of it. First-half 2026 equipment orders were priced more than 20% above fourth-quarter 2025 orders. Second-quarter free cash flow hit $5.1 billion, helped by a $6.4 billion working capital benefit from customer down payments tied to slot reservations. Year-to-date free cash flow is running near $9.9 billion, already more than the company generated in all of 2025.</p><p style='margin-bottom: 1.25em;'>GE Vernova Is Getting Paid for Turbines It May Never Build</p><p style='margin-bottom: 1.25em;'>That down-payment structure is also the smartest thing the turbine makers have done this cycle, and it comes straight out of the last one.</p><p style='margin-bottom: 1.25em;'>All three lived through the last gas boom. Cheap shale in the 2000s pulled in a wave of merchant developers, the market saturated, orders were canceled, factories closed and skilled labor scattered. The industry spent the 2010s treating gas turbines as a cash cow rather than a growth business, and capacity stayed flat while electricity demand quietly started climbing again.</p><p style='margin-bottom: 1.25em;'>Nobody wants that hangover twice, so rather than bet the factory on hyperscaler forecasts, the OEMs built an instrument that makes the customer carry the risk. A slot reservation agreement is a paid option on future production. If the data center gets built, the customer converts it to a firm order. If it doesn't, the manufacturer keeps the deposit and resells the slot into a market that's short anyway.</p><p style='margin-bottom: 1.25em;'>GE Vernova's balance sheet is currently being financed, in part, by down payments on turbines that may never be needed. It's a good position to be in, and it explains why the capacity expansions are so measured relative to the size of the order book.</p><p style='margin-bottom: 1.25em;'>Exelon and Texas Are Quietly Walking Back Their Numbers</p><p style='margin-bottom: 1.25em;'>There's an honest counterargument here, and it keeps getting stronger.</p><p style='margin-bottom: 1.25em;'>Exelon cut its \"high probability\" data center load from roughly 18 GW to about 11 GW on July 30, a drop of nearly 40%. Its broader interconnection pipeline fell from about 43 GW to 25 GW in a single quarter. Only about 4 GW carries signed transmission service agreements backed by $1 billion in posted collateral. \"We now weed out speculative projects,\" CFO Jeanne Jones said, \"and it gives us proactive insight into what is real.\"</p><p style='margin-bottom: 1.25em;'>Texas went further. Gov. Greg Abbott ordered an audit of every data center in the ERCOT interconnection queue on Aug. 3 after requests swelled to roughly 474 GW, about 90% of it data centers and more than five times the state's record peak demand. ERCOT suspended its Batch Zero large-load process within hours and, on Aug. 10, formally asked the Public Utility Commission for a good-cause exception covering the missed classification deadline; the audit itself is expected to run several months, with scope and timing due at the PUCT's Aug. 20 open meeting. BloombergNEF estimates the pause puts nearly 50 GW at risk of delay, about a fifth of the national pipeline. New York had already halted new approvals in July.</p><p style='margin-bottom: 1.25em;'>Goldman itself assumes only 50% to 60% of the data center capacity scheduled over the next two years shows up on time.</p><p style='margin-bottom: 1.25em;'>Read the 116 GW order book one way and it's the leading edge of the biggest power buildout since the 1970s. Read it the other way and it's a queue stuffed with options on projects that were never financed, held by developers who'd rather forfeit a deposit than miss a slot.</p><p style='margin-bottom: 1.25em;'>This Bottleneck Gets Solved by Governors, Not Factories</p><p style='margin-bottom: 1.25em;'>It barely matters which reading is right, because the 2027 timeline holds either way.</p><p style='margin-bottom: 1.25em;'>If the demand is real, the turbines can't arrive fast enough and the shortfall gets covered by whatever can be delivered inside 24 to 36 months, mostly reciprocating engines. That's why Caterpillar and W\u00e4rtsil\u00e4 are now selling prime power into AI campuses, and why their own order books are full into 2028 too. Fuel cells fill in around the edges. Existing plants run harder. Coal units that were supposed to retire stay open instead. And a meaningful share of the load that's currently on paper simply doesn't get built.</p><p style='margin-bottom: 1.25em;'>If the demand isn't real, the correction shows up as canceled slot reservations in 2028 and 2029, long after this year's capacity auctions have already repriced power for 67 million people in PJM.</p><p style='margin-bottom: 1.25em;'>Either way, the bottleneck doesn't clear on a factory floor. It clears in state capitals: governors in Austin and Albany, regulators writing separate rate classes for data centers, utilities demanding collateral before they'll even run an interconnection study. Almost nobody selling the AI buildout has priced in how much of that demand will have to shrink before the equipment can catch up.</p><p style='margin-bottom: 1.25em;'>By Michael Kern for Oilprice.com</p><p style='margin-bottom: 1.25em;'>More Top Reads From Oilprice.com</p><p style='margin-bottom: 1.25em;'>Oilprice Intelligence brings you the signals before they become front-page news. This is the same expert analysis read by veteran traders and political advisors. Get it free, twice a week, and you'll always know why the market is moving before everyone else.</p><p style='margin-bottom: 1.25em;'>You get the geopolitical intelligence, the hidden inventory data, and the market whispers that move billions - and we'll send you $389 in premium energy intelligence, on us, just for subscribing. Join 400,000+ readers today. Get access immediately by clicking here.</p>"}, {"id": 4, "source": "Investing.com Indicators", "category": "economy", "title": "Iran lets Iraqi oil tankers pass Hormuz as Trump claims \"total control\"", "link": "https://www.investing.com/news/economy-news/us-iran-trade-warnings-as-new-sanctions-loom-and-hormuz-oil-flows-stall-4872251", "date_str": "Aug 22 \u2022 08:56 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 5, "source": "Yahoo Finance", "category": "markets", "title": "Is Alphabet\u2019s Search Risk Really Priced In? Stress-Testing Rosenblatt\u2019s $410 Thesis", "link": "https://finance.yahoo.com/technology/ai/articles/alphabet-search-risk-really-priced-195602365.html", "date_str": "Aug 22 \u2022 07:56 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Has Wall Street stopped panicking about AI chatbots destroying Alphabet Inc.'s (NASDAQ:GOOGL)'s traditional search business? On August 19, Analyst Scott Devitt initiated coverage on the stock with a Buy rating, noting how concerns around Search have largely played out. However, declaring a multi-year risk narrative to be effectively over is a bold assertion worth stress testing.</p><p style='margin-bottom: 1.25em;'>What the Data Shows</p><p style='margin-bottom: 1.25em;'>The data shows Google controls 90% of the search market. However, the risk still looms as people often turn to chatbots to search for information. Against this backdrop, the company has redesigned the search box for the first time in 25 years, placing the \"AI Mode\" button directly in the box.</p><p style='margin-bottom: 1.25em;'>To discuss things deeper, Alphabet's (NASDAQ: GOOGL) second-quarter report earlier buried the search figure under two louder storylines. These include a $99 billion paper gain on its equity stakes, and an increase in capital spending plans. However, the numbers are there to decipher.</p><p style='margin-bottom: 1.25em;'>In the second quarter, Google Search & other revenue grew 17% year over year to $63.3 billion, down from 19% growth in the prior quarter and slightly behind expectations. Search was on a growth streak previously, accelerating from 10% in the first quarter of 2025 to 12% in the second quarter, 15% in the third, 17% in the fourth, and 19% in the first quarter of 2026. However, second quarter of 2026 snapped it.</p><p style='margin-bottom: 1.25em;'>\"Considering Google's search revenue for the second quarter came in at $63.3 billion, slightly behind Wall Street's expectations of $63.4 billion, and investors will likely be scrutinizing the business in the third quarter.\"</p><p style='margin-bottom: 1.25em;'>17% is still a great number though, which doesn't really prove that Search is slowing down. The argument is more about the coming years. Google isn't letting its customers migrate anyway. Its AI overviews, AI Mode, and Gemini have been expanding the type of queries its ecosystem handles.</p><p style='margin-bottom: 1.25em;'>Google's Gemini traffic has surged, surpassing 1 billion monthly active users by August 2026 and becoming the fastest growing product in its history.</p><p style='margin-bottom: 1.25em;'>Cloud: The Stronger Part of the Thesis</p><p style='margin-bottom: 1.25em;'>Google's Cloud revenue surged 82% year-over-year to $24.8 billion, while segment operating income more than tripled from $2.8 billion to $8.8 billion. No wonder Rosenblatt believes Cloud will sustain momentum and that it will support the next leg of multiple expansion. The firm sees capacity expansion and greater TPU monetization beyond 2027 helping to scale operating profit dollars ahead of expectations.</p><p style='margin-bottom: 1.25em;'>In effect, it sees Cloud deceleration as a key risk rather than any new Search risk that may arise.</p>"}, {"id": 6, "source": "Yahoo Finance", "category": "markets", "title": "Snowflake (SNOW) Stock: AI Growth Is Real, But Is the Valuation Already Priced In?", "link": "https://finance.yahoo.com/markets/stocks/articles/snowflake-snow-stock-ai-growth-194107701.html", "date_str": "Aug 22 \u2022 07:41 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Snowflake (NYSE:SNOW) is heading into its September 2 earnings report with a strong growth narrative. Prior to earnings, on August 20, TD Cowen raised its price target on the stock to $370 from $300 while maintaining a Buy rating.</p><p style='margin-bottom: 1.25em;'>The firm is not alone, Deutsche Bank, Truist, Bofa, and UBS have all raised their targets recently. Almost everyone is talking about Cortex Code, an AI-powered coding agent built directly into the Snowflake data cloud.</p><p style='margin-bottom: 1.25em;'>Branded as CoCo, the AI coding tool has driven Snowflake's best sequential growth in its history. We know that AI is improving Snowflake's growth story, but how much of the improvement is already priced in?</p><p style='margin-bottom: 1.25em;'>Growth is Already Reaccelerating</p><p style='margin-bottom: 1.25em;'>For the first quarter of fiscal 2027, Snowflake achieved revenue of $1.39 billion, representing 33% year-over-year growth. According to CEO Sridhar Ramaswamy, the milestone quarter reported product revenue of $1.33 billion, up 34% year-over-year, marking the strongest sequential dollar growth in company history.</p><p style='margin-bottom: 1.25em;'>Remaining performance obligations were $9.21 billion, representing 38% year-over-year growth. Cortex Code and Snowflake Intelligence, in particular, are becoming central for Snowflake's vision of the Agentic Enterprise.</p><p style='margin-bottom: 1.25em;'>For the full-year of fiscal 2027, management raised product revenue outlook to $5,840 million, representing 31% year-over-year growth, and up from previous guidance of $5,660 million. These numbers suggest how Snowflake's long growth slowdown may be finally reversing.</p><p style='margin-bottom: 1.25em;'>Two Catalysts for Snowflake</p><p style='margin-bottom: 1.25em;'>TD Cowen highlighted two growth catalysts for Snowflake. The first is CoCo, the AI coding agent introduced previously as Cortex Code. According to the firm, the coding agent is unleashing many new AI accelerants.</p><p style='margin-bottom: 1.25em;'>Another potential catalyst working in favor of Snowflake is its Cortex AI gateway, a centralized control plane and governance layer for enterprise AI agents. The product enables enterprises to manage AI agents and monitor AI consumption costs. It allows the company to move deeper into AI operations and security, enabling a robust Snowflake ecosystem.</p><p style='margin-bottom: 1.25em;'>Together, the two catalysts could help drive another strong quarter of growth acceleration.</p><p style='margin-bottom: 1.25em;'>The Catch: The Stock Already Knows This</p><p style='margin-bottom: 1.25em;'>Despite the catalysts, Snowflake (NYSE:SNOW) stock is already 48% up year-to-date. This means that the stock is already up before the price targets caught it. Since good news tends to move up stock only when the market didn't expect it, it's hard to say whether Snowflake's quarter will make the stock budge if it's good and not great.</p>"}, {"id": 7, "source": "Yahoo Finance", "category": "markets", "title": "Clean Energy Spending Tracking Toward Record $180 Billion in 2026", "link": "https://finance.yahoo.com/energy/articles/clean-energy-spending-tracking-toward-190000970.html", "date_str": "Aug 22 \u2022 07:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Donald Trump is accidentally overseeing a massive buildout of the country's renewable energy capacity and infrastructure. Not only are investments in renewable technologies soaring to new highs, the national energy grid is rapidly transforming to accommodate an increasingly solar- and wind-powered energy mix.</p><p style='margin-bottom: 1.25em;'>Despite massive rollbacks of Biden- and Obama-era clean energy incentives and financial supports, investment in clean energy tech keeps soaring to new heights, buoyed by market forces far outside of the federal government's control. Clean energy capital expenditures already reached $74 billion in the first half of 2026, and they're on track to reach a record $180 billion by the end of the year, according to fintech firm Crux's State of Clean Energy Finance: 2026 Mid-Year Market Intelligence Report.</p><p style='margin-bottom: 1.25em;'>\"The market is proving resilient,\" Crux CEO and co-founder Alfred Johnson was recently quoted by Politico's E&E News. \"We're seeing a significant amount of investment subsequent to the tax law changes of last year.\"</p><p style='margin-bottom: 1.25em;'>The insatiable energy demand coming from data center hyperscalers and the artificial intelligence boom has spurred a tidal wave of investment into all kinds of energy projects, and especially renewables due to their noted advantages when it comes to energy security and affordability. These advantages have been underscored in recent months by extreme volatility in fossil fuel markets thanks to the war in Iran and resultant supply chain vulnerabilities. \"Renewables and storage continue to be the fastest way to get new electrons on the grid until additional gas-fired generation can be built,\" NextEra Energy CEO John Ketchum was recently quoted by Reuters.</p><p style='margin-bottom: 1.25em;'>As a result, we are currently \"living in what arguably is one of the best periods to invest in renewables in the US over the last 20 years\" according to Miguel Stilwell d'Andrade, chief executive officer of Portuguese electric utilities company EDP. Accordingly, EDP is directing approximately USD $5.3 billion \u2013 more than half of its capital expenditures \u2013 toward United States renewables projects over the next three years.</p><p style='margin-bottom: 1.25em;'>All of that renewable energy buildout is being accompanied by a massive and unprecedented uptick in battery storage buildout, resulting in a rapid transformation of the nation's energy grid. Over the past three years, utility-scale battery storage capacity increased at a blistering rate of 70 percent per year on average to reach 52 gigawatts (GW) today. Nearly 16 percent of that \u2013 8.3 GW \u2013 was added in the first half of this year alone.</p>"}, {"id": 8, "source": "Yahoo Finance", "category": "markets", "title": "Paramount and California to hold preliminary talks on Warner Bros deal, NYT reports", "link": "https://finance.yahoo.com/media-advertising/articles/paramount-california-hold-preliminary-talks-185659000.html", "date_str": "Aug 22 \u2022 06:56 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Aug 22 (Reuters) - Paramount and California state officials are set to meet on Monday to discuss a potential settlement path of the state's lawsuit aimed at stopping Paramount's acquisition of Warner Bros. Discovery, the New York Times reported on Saturday citing sources familiar with the discussions. Here's what to know:</p><p style='margin-bottom: 1.25em;'>\u2022 The talks are preliminary, and there is no assurance that they will lead to meaningful negotiations toward a settlement, the report said, adding that Paramount requested the meeting.</p><p style='margin-bottom: 1.25em;'>\u2022 Reuters couldn't immediately verify the report. Paramount didn't immediately respond to a request for comment outside regular business hours.</p><p style='margin-bottom: 1.25em;'>\u2022 The meeting, which will include senior executives and lawyers from each side, has been in the works for a little over a week, NYT added, citing one of the people.</p><p style='margin-bottom: 1.25em;'>\u2022 Last month, California and 11 states sued to block Paramount's $110 billion acquisition of Warner Bros. Discovery, alleging the deal would lessen competition in film distribution and cable television, harming theaters and pay TV distributors.</p><p style='margin-bottom: 1.25em;'>\u2022 States including New York, Arizona and Minnesota argued the deal would harm theaters and television distributors, raise prices for consumers and make wages less competitive for workers.</p><p style='margin-bottom: 1.25em;'>(Reporting by Disha Mishra in Bengaluru, Editing by Franklin Paul)</p>"}, {"id": 9, "source": "Yahoo Finance", "category": "markets", "title": "U.S. Steel Stocks Nucor, Steel Dynamics: Big Winners As Canada Trade Talks Collapse?", "link": "https://www.investors.com/news/u-s-steel-stocks-nucor-steel-dynamics-canada-trade-talks-collapse/?src=A00220&yptr=yahoo", "date_str": "Aug 22 \u2022 06:15 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Nucor, Steel Dynamics, Cleveland-Cliffs and Century Aluminum could be winners from U.S.-Canada trade talks breaking down. Last week those stocks tumbled on the prospect of a Canada trade deal that would lower U.S. tariffs on steel and aluminum. New 50% tariffs on a $20 billion worth of Canadian goods, including liquor, electrical equipment and hockey gear, took effect on Saturday.\u2026</p><p style='margin-bottom: 1.25em;'>U.S. Steel Stocks Nucor, Steel Dynamics: Big Winners As Canada Trade Talks Collapse?</p><p style='margin-bottom: 1.25em;'>Copyright \u00a92026 Investor's Business Daily, LLC. All rights reserved. 87990cbe856818d5eddac44c7b1cdeb8</p>"}, {"id": 10, "source": "Yahoo Finance", "category": "markets", "title": "Stock Market Week Ahead: A Choppy Market Heads For Nvidia Earnings, Jackson Hole", "link": "https://www.investors.com/research/investing-action-plan/stock-market-week-ahead-a-choppy-market-heads-for-nvidia-earnings-jackson-hole/?src=A00220&yptr=yahoo", "date_str": "Aug 22 \u2022 05:49 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Friday ended with both the Nasdaq and the S&P 500 posted their first weekly decline in four weeks. Each kept their year-to-date gains above 12%. And both indexes also undercut the low of their Aug. 4 follow through days. A key difference is that, in addition, the Nasdaq ended Friday's session below its 21-day exponential moving average, while the S&P\u2026</p><p style='margin-bottom: 1.25em;'>Stock Market Week Ahead: A Choppy Market Heads For Nvidia Earnings, Jackson Hole</p><p style='margin-bottom: 1.25em;'>Copyright \u00a92026 Investor's Business Daily, LLC. All rights reserved. 87990cbe856818d5eddac44c7b1cdeb8</p>"}, {"id": 11, "source": "Investing.com Indicators", "category": "economy", "title": "Canada to match U.S. tariffs dollar for dollar after trade talks collapse", "link": "https://www.investing.com/news/economy-news/canada-to-match-us-tariffs-dollar-for-dollar-after-trade-talks-collapse-4872372", "date_str": "Aug 22 \u2022 04:10 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 12, "source": "Yahoo Finance", "category": "markets", "title": "Mohamed El-Erian says 30-year Treasury yield at 5.27% signals a structural shift that will make America more expensive", "link": "https://finance.yahoo.com/economy/policy/articles/mohamed-el-erian-says-30-160000225.html", "date_str": "Aug 22 \u2022 04:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Mohamed El-Erian says 30-year Treasury yield at 5.27% signals a structural shift that will make America more expensive</p><p style='margin-bottom: 1.25em;'>For economist Mohamed El-Erian, sky-high interest rates on U.S. bonds are the harbinger of an even greater affordability crisis.</p><p style='margin-bottom: 1.25em;'>\"This is no ordinary bond-market sell-off,\" El-Erian announced in his latest opinion piece for The New York Times. The former PIMCO CEO argued that, if selling pressure on bonds continues, \"it could mark the beginning of a structural economic shift more enduring and more globally consequential than most previous episodes of market volatility.\"</p><p style='margin-bottom: 1.25em;'>Must Read</p><p style='margin-bottom: 1.25em;'>-       Jeff Bezos backs a platform that lets anyone invest in rental homes for as little as $100 \u2014 6 ways to build wealth like a landlord without actually being one</p><p style='margin-bottom: 1.25em;'>-       Dave Ramsey warns nearly 50% of Americans are making 1 big Social Security mistake. Here's what it is and 3 simple steps to fix it ASAP</p><p style='margin-bottom: 1.25em;'>-       The tax breaks in Trump's 'big beautiful bill' expire after 2028. Here are 4 moves to make before the window closes</p><p style='margin-bottom: 1.25em;'>Despite the U.S. Treasury's announcement to ramp up its long-term bond buyback sizes to $4 billion, selling hasn't abated. Currently, the U.S. 30-year Treasury has a yield of 5.27%, a level El-Erian notes was last seen in 2007. The 10-year and five-year bonds are also both climbing, currently at 4.736% and 4.426%, respectively.</p><p style='margin-bottom: 1.25em;'>With the national debt crossing the $40 trillion threshold, those high percentages translate to humungous piles of money.</p><p style='margin-bottom: 1.25em;'>According to the latest data from the Congressional Budget Office (CBO), net interest on public debt for fiscal year 2026 is now $963 billion. That makes paying off interest second only to Social Security in yearly government spending.</p><p style='margin-bottom: 1.25em;'>El-Erian added: \"That means more federal revenue goes to service the debt \u2014 nearly 20% \u2014 leaving less available for, say, defense or health care.\" The longer this issue festers, the more likely there will be \"considerable risks to our well-being.\"</p><p style='margin-bottom: 1.25em;'>An \"unsettling\" environment</p><p style='margin-bottom: 1.25em;'>It's not just the size of bond yields and the national debt that has El-Erian worried. In his post, he walks through the unique causes driving the current bond chaos \u2014 causes he feels make it nearly impossible for policymakers to offer a quick fix.</p><p style='margin-bottom: 1.25em;'>Unlike bond yield spikes in the past, El-Erian doesn't believe \"runaway inflation\" is the key cause. In El-Erian's mind, \"what has surged is the real yield, or the extra, inflation-adjusted compensation that investors demand to bear the risk of buying debt in a more volatile world.\" Because of that, he believes that \"it's unsettling out there right now.\"</p><p style='margin-bottom: 1.25em;'>On the one hand, El-Erian pointed to intense borrowing from hyperscalers furiously building their AI data centers. Citing stats from Goldman Sachs, El-Erian writes these Big Tech companies have \"already sold almost $500 billion in bonds this year and will probably borrow a minimum of another $300 billion by year's end.\"</p>"}, {"id": 13, "source": "Yahoo Finance", "category": "markets", "title": "McDonald\u2019s Just Started Selling Energy Drinks. How to Play MCD Stock Here.", "link": "https://finance.yahoo.com/markets/stocks/articles/mcdonald-just-started-selling-energy-153002015.html", "date_str": "Aug 22 \u2022 03:30 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>McDonald's (MCD) just entered the energy-drink market, but the bigger question for investors is whether the move can help revive the stock after a difficult year. The company began selling its Red Bull Dragonberry Energizer across U.S. restaurants on Aug. 17, marking McDonald's first entry into energy drinks.</p><p style='margin-bottom: 1.25em;'>The timing is interesting because McDonald's recently delivered a mixed second-quarter report. Adjusted earnings came in at $3.38 per share, beating the $3.32 consensus estimate, while revenue of roughly $7.1 billion fell slightly short of the $7.14 billion estimate.</p><p style='margin-bottom: 1.25em;'>More News from Barchart</p><p style='margin-bottom: 1.25em;'>-       Google Lost About $186 Billion After 4 of Its Top AI Researchers Left, but Sundar Pichai Says Google Will Be 'A Founding Investor' Anyway</p><p style='margin-bottom: 1.25em;'>-       Microsoft vs. Broadcom: One Has 85% Upside, But I'm Picking the Other</p><p style='margin-bottom: 1.25em;'>-       Rocket Lab and AST SpaceMobile Are Priced for the Big Bang. One Space Stock Already Delivered.</p><p style='margin-bottom: 1.25em;'>-       Markets move fast. Keep up by reading our FREE midday Barchart Brief newsletter for exclusive charts, analysis, and headlines.</p><p style='margin-bottom: 1.25em;'>That makes the new drink more than just another menu item. Investors are looking for ways McDonald's can increase customer visits, improve sales, and capture spending from younger consumers.</p><p style='margin-bottom: 1.25em;'>MCD Stock Has Struggled This Year</p><p style='margin-bottom: 1.25em;'>McDonald's stock has been under pressure even as the broader market has remained strong. Shares of MCD have fallen over 11% so far in 2026.</p><p style='margin-bottom: 1.25em;'>This weakness shows concerns about slower comparable-store sales, consumer pressure, and execution problems in the U.S. In the second quarter, U.S. comparable sales increased only 0.8%, while global comparable sales rose 1.3%. Consolidated revenue increased 4%, and systemwide sales climbed 5% to $37 billion.</p><p style='margin-bottom: 1.25em;'>The energy drink launch could, therefore, give McDonald's another way to generate traffic. The company is targeting consumers who may visit restaurants specifically for beverages, potentially creating additional purchases alongside food.</p><p style='margin-bottom: 1.25em;'>McDonald's Valuation Is Not Cheap</p><p style='margin-bottom: 1.25em;'>Despite the decline, investors should not assume McDonald's has become a bargain. The company has a market capitalization of roughly $189 billion, while its trailing price-to-earnings (P/E) ratio is about 22.</p><p style='margin-bottom: 1.25em;'>Those numbers show why MCD stock needs earnings growth to justify a sustained rebound. McDonald's is not being valued like a struggling restaurant chain. Investors are still paying a premium for its powerful brand, franchise-heavy model, global scale, and strong cash generation.</p><p style='margin-bottom: 1.25em;'>That creates both an opportunity and a risk. If beverage sales, loyalty engagement, and value promotions help accelerate comparable-store sales, the stock could regain some of the ground lost from its 52-week high. But if U.S. traffic remains weak, a roughly 21-times forward earnings multiple leaves less room for disappointment.</p>"}, {"id": 14, "source": "Yahoo Finance", "category": "markets", "title": "Dow Jones Futures: Market Rally Repairs Some Damage As Nvidia Looms; New Trump Tariffs On Canada", "link": "https://www.investors.com/market-trend/stock-market-today/dow-jones-futures-market-rally-nvidia-crowdstrike-warsh/?src=A00220&yptr=yahoo", "date_str": "Aug 22 \u2022 03:25 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Dow Jones futures will open Sunday evening, along with S&P 500 futures and Nasdaq futures. Nvidia earnings take center stage with CrowdStrike leading several cybersecurity reports. Federal Reserve Chairman Kevin Warsh will give his first Jackson Hole speech. The stock market rally took damage this past week, but did a little repair work on Friday. Mining stocks and crypto plans\u2026</p><p style='margin-bottom: 1.25em;'>Dow Jones Futures: Market Rally Repairs Some Damage As Nvidia Looms; New Trump Tariffs On Canada</p><p style='margin-bottom: 1.25em;'>Copyright \u00a92026 Investor's Business Daily, LLC. All rights reserved. 87990cbe856818d5eddac44c7b1cdeb8</p>"}, {"id": 15, "source": "Cointelegraph", "category": "crypto", "title": "MiCA is coming for DeFi vaults, but regulation will be difficult", "link": "https://cointelegraph.com/magazine/mica-is-coming-for-defi-vaults-but-regulation-will-be-difficult?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 22 \u2022 01:30 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>MiCA is coming for DeFi vaults, but regulation will be difficult</p><p style='margin-bottom: 1.25em;'>Brussels is reviewing whether crypto lending should fall under MiCA, but DeFi lending vaults are making it harder to determine who, exactly, should be regulated.</p><p style='margin-bottom: 1.25em;'>MiCA left crypto lending outside its original rulebook \u2014 but now Brussels is considering whether to bring it in.</p><p style='margin-bottom: 1.25em;'>On May 20, 2026, the European Commission asked stakeholders to weigh in on areas left outside the original Markets in Crypto Assets (MiCA) framework. These include issues around decentralized finance (DeFi) and crypto lending and borrowing.</p><p style='margin-bottom: 1.25em;'>One area of contention involves lending vaults, which can channel billions of dollars into onchain credit markets without looking like conventional lending. Their legal status currently depends on non binding interpretations that they fall outside of MiCA and EU fund rules.</p><p style='margin-bottom: 1.25em;'>Yuriy Brisov, an EU digital assets lawyer and partner at Digital & Analogue Partners, tells Magazine the law pertaining to vaults at present is unclear:</p><p style='margin-bottom: 1.25em;'>\u201cEU law has no category called a \u2018vault.\u2019 A lawyer therefore defines it the way a regulator would qualify it: by function, not by label.\u201d</p><p style='margin-bottom: 1.25em;'>That\u2019s just one of myriad regulatory problems, since vaults can perform the economic functions of lending while spreading other functions over smart contracts and multiple participants rather than a single company.</p><p style='margin-bottom: 1.25em;'>If Brussels decides lending should come inside the regulatory perimeter, what does that mean for DeFi, and where does it leave the people and protocols behind these vaults?</p><p style='margin-bottom: 1.25em;'>Morpho puts the problem into practice</p><p style='margin-bottom: 1.25em;'>Decentralized lending protocol Morpho\u2019s lending infrastructure gives some clues as to why this question will be so hard to answer. The way its vaults are set up and managed does not neatly map on to any existing regulatory model.</p><p style='margin-bottom: 1.25em;'>Targeted consultation on the review of Regulation on the Markets in Crypto Assets (MiCA). Source: European Comission</p><p style='margin-bottom: 1.25em;'>Its Vault V2 architecture divides responsibilities between an owner, curator, allocator and sentinel. The curator configures strategy and risk parameters, while the allocator executes allocations and the sentinel has powers intended to reduce risk.</p><p style='margin-bottom: 1.25em;'>While none of this establishes any of these participants as providing a regulated lending service under MiCA, it does show why identifying the relevant \u201cprovider\u201d is less straightforward than with a conventional lender.</p><p style='margin-bottom: 1.25em;'>Related: Bitwise to launch onchain vaults via Morpho</p><p style='margin-bottom: 1.25em;'>Jonathan Galea, a partner at Cahill Gordon & Reindel, explored the issue in a recent client update on lending vaults and their position under EU financial regulation. His analysis looks at how vault structures can sit across MiCA, stablecoin rules and European fund law.</p><p style='margin-bottom: 1.25em;'>Galea says policymakers should be careful about treating lending vaults as a single category, telling Magazine, \u201clending vaults solve more practical problems than they create.\u201d</p><p style='margin-bottom: 1.25em;'>He says lending vaults help direct fragmented liquidity into lending markets, while other vaults may buy and sell crypto assets and should be treated differently:</p><p style='margin-bottom: 1.25em;'>\u201cBring \u2018DeFi lending\u2019 into the perimeter as a single label, and structures that deserve opposite answers risk ending up captured together.\u201d</p><p style='margin-bottom: 1.25em;'>That would be important if Brussels decides to regulate lending, since a broad category covering \u201cDeFi lending\u201d could capture structures with very different economic functions\u2014and people exercising control over them.</p><p style='margin-bottom: 1.25em;'>Who should actually be regulated?</p><p style='margin-bottom: 1.25em;'>MiCA currently excludes crypto asset services that are provided in a \u201cfully decentralized manner,\u201d although it can apply where only part of an activity is performed in a decentralized way.</p><p style='margin-bottom: 1.25em;'>Morpho\u2019s Vault V2 architecture. Source: Morpho</p><p style='margin-bottom: 1.25em;'>One possible solution would be to make decentralization the dividing line, but Galea argues that could disadvantage newer protocols. He says:</p><p style='margin-bottom: 1.25em;'>\u201cDecentralization is a spectrum and a function of time: a test built on it would penalize newer, more novel protocols while entrenching mature incumbents that have had years to distribute control.\u201d</p><p style='margin-bottom: 1.25em;'>Brisov says the focus should instead be on the structure of the vault and the control people have over it:</p><p style='margin-bottom: 1.25em;'>\u201cThe safer ground is structural: there is no undertaking, no appointed manager, the holder has a direct coded claim on the pool, and the user can exit before any parameter change takes effect.\u201d</p><p style='margin-bottom: 1.25em;'>He says if Brussels decides that lending and borrowing warrant regulation, they should be explicitly added to the list of regulated crypto asset services rather than broadening the definition of a crypto asset service provider itself.</p><p style='margin-bottom: 1.25em;'>Related: \u2018DeFi doesn\u2019t exist anymore,\u2019 just onchain finance: Andre Cronje</p><p style='margin-bottom: 1.25em;'>Curve Finance founder Michael Egorov argues that the rules also need to account for the differences between decentralized lending and conventional finance. He says:</p><p style='margin-bottom: 1.25em;'>\u201cIf DeFi lending is ever brought into the scope of regulation, it should be treated completely differently. DeFi doesn\u2019t need some of the safeguards which traditional lending requires, and yet, at the same time, it may need others.\u201d</p><p style='margin-bottom: 1.25em;'>Egorov says regulation should be approached \u201creally carefully,\u201d and that a dedicated framework could improve safety and open DeFi lending to new users, while avoiding rules that some protocols cannot comply with because of how they\u2019re built.</p><p style='margin-bottom: 1.25em;'>The Commission\u2019s consultation closes Sept. 30, and what follows could determine whether lending vaults remain outside MiCA or become subject to a new regulatory framework.</p><p style='margin-bottom: 1.25em;'>For Brussels, the challenge is not simply whether to regulate DeFi lending; it\u2019s how to write rules that distinguish between very different forms of onchain lending and the people (if any) that actually exercise control over them.</p><p style='margin-bottom: 1.25em;'>Magazine: 200,000 fake AI \u2018victims\u2019 deployed to scam bait online fraudsters</p>"}, {"id": 16, "source": "Yahoo Finance", "category": "markets", "title": "Mortgage and refinance interest rates today, Saturday, August 22, 2026: Bond market sends rates scrambling", "link": "https://finance.yahoo.com/personal-finance/mortgages/article/mortgage-and-refinance-interest-rates-today-saturday-august-22-2026-bond-market-sends-rates-scrambling-100000981.html", "date_str": "Aug 22 \u2022 10:00 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Some offers on this page are from advertisers who pay us, which may affect which products we write about, but not our recommendations. See our Advertiser Disclosure.</p><p style='margin-bottom: 1.25em;'>According to average rates from the Zillow lender marketplace, mortgage rates are extremely volatile heading into the weekend. Two popular loan terms rose dramatically while another slid lower. A nervous bond market has mortgage rates scrambling.</p><p style='margin-bottom: 1.25em;'>The current 30-year fixed rate today, Saturday, August 22, 2026, rose 14 basis points to 6.64%; the 15-year fixed rate fell 12 basis points to 5.88%; and the 5/1 ARM rose a whopping 49 basis points to 6.74%.</p><p style='margin-bottom: 1.25em;'>Read more: Weekly survey of mortgage lenders with the lowest rates: Small moves in rates and fees</p><p style='margin-bottom: 1.25em;'>Today's mortgage rates</p><p style='margin-bottom: 1.25em;'>Here are the current mortgage rates today, Saturday, August 22, 2026, according to the latest Zillow data:</p><p style='margin-bottom: 1.25em;'>-       30-year fixed: 6.64%</p><p style='margin-bottom: 1.25em;'>-       20-year fixed: 6.37%</p><p style='margin-bottom: 1.25em;'>-       15-year fixed: 5.88%</p><p style='margin-bottom: 1.25em;'>-       5/1 ARM: 6.74%</p><p style='margin-bottom: 1.25em;'>-       7/1 ARM: 6.30%</p><p style='margin-bottom: 1.25em;'>-       30-year VA: 6.14%</p><p style='margin-bottom: 1.25em;'>-       15-year VA: 5.59%</p><p style='margin-bottom: 1.25em;'>-       5/1 VA: 5.84%</p><p style='margin-bottom: 1.25em;'>Remember, these are the national averages and are rounded to the nearest hundredth.</p><p style='margin-bottom: 1.25em;'>Today's mortgage refinance rates</p><p style='margin-bottom: 1.25em;'>These are today's mortgage refinance rates, Saturday, August 22, 2026, according to the latest Zillow data:</p><p style='margin-bottom: 1.25em;'>-       30-year fixed: 6.64%</p><p style='margin-bottom: 1.25em;'>-       20-year fixed: 6.61%</p><p style='margin-bottom: 1.25em;'>-       15-year fixed: 5.99%</p><p style='margin-bottom: 1.25em;'>-       5/1 ARM: 6.50%</p><p style='margin-bottom: 1.25em;'>-       7/1 ARM: 6.51%</p><p style='margin-bottom: 1.25em;'>-       30-year VA: 6.02%</p><p style='margin-bottom: 1.25em;'>-       15-year VA: 5.70%</p><p style='margin-bottom: 1.25em;'>-       5/1 VA: 5.63%</p><p style='margin-bottom: 1.25em;'>Again, the numbers provided are national averages rounded to the nearest hundredth. Mortgage refinance rates are often higher than rates when you buy a house, although that's not always the case.</p><p style='margin-bottom: 1.25em;'>Read more: Want to refinance your mortgage in 2026? Here's what to do.</p><p style='margin-bottom: 1.25em;'>Free mortgage calculator</p><p style='margin-bottom: 1.25em;'>Use the mortgage calculator below to see how today's interest rates would affect your monthly mortgage payments.</p><p style='margin-bottom: 1.25em;'>You can bookmark the Yahoo Finance mortgage payment calculator and keep it handy for future use, as you shop for homes and the best mortgage lenders. You also have the option to enter costs for private mortgage insurance (PMI) and homeowners' association dues, if applicable. These details result in a more accurate monthly payment estimate than if you simply calculated your mortgage principal and interest.</p><p style='margin-bottom: 1.25em;'>30-year fixed mortgage rates: Pros and cons</p><p style='margin-bottom: 1.25em;'>There are two main advantages to a 30-year fixed mortgage: Your payments are lower, and your monthly payments are predictable.</p><p style='margin-bottom: 1.25em;'>A 30-year fixed-rate mortgage has relatively low monthly payments because you're spreading your repayment out over a longer period of time than with, say, a 15-year mortgage. Your payments are predictable because, unlike with an adjustable-rate mortgage (ARM), your rate isn't going to change from year to year. Most years, the only things that might affect your monthly payment are any changes to your homeowners insurance or property taxes.</p><p style='margin-bottom: 1.25em;'>The main disadvantage of 30-year fixed mortgage rates is the mortgage interest, both in the short and long term.</p><p style='margin-bottom: 1.25em;'>A 30-year fixed term comes with a higher rate than a shorter fixed term, and it's higher than the intro rate to a 30-year ARM. The higher your rate, the higher your monthly payment. You'll also pay much more in interest over the life of your loan due to both the higher rate and the longer term.</p><p style='margin-bottom: 1.25em;'>15-year fixed mortgage rates: Pros and cons</p><p style='margin-bottom: 1.25em;'>The pros and cons of 15-year fixed mortgage rates are basically swapped with those of the 30-year rates. Yes, your monthly payments will still be predictable, but another advantage is that shorter terms come with lower interest rates. Not to mention, you'll pay off your mortgage 15 years sooner. So you could save hundreds of thousands of dollars in interest over the life of your loan.</p><p style='margin-bottom: 1.25em;'>However, because you're paying off the same amount in half the time, your monthly payments will be higher than if you choose a 30-year term.</p><p style='margin-bottom: 1.25em;'>Learn more: Dig deeper into 15-year vs. 30-year mortgages</p><p style='margin-bottom: 1.25em;'>Adjustable mortgage rates: Pros and cons</p><p style='margin-bottom: 1.25em;'>Adjustable-rate mortgages lock in your rate for a predetermined period, then adjust it periodically. For example, with a 5/1 ARM, your rate stays the same for the first five years and then goes up or down once per year for the remaining 25 years.</p><p style='margin-bottom: 1.25em;'>The main advantage is that the introductory rate is usually lower than what you'll get with a 30-year fixed rate, so your monthly payments will be lower. (Current average rates might not necessarily reflect this, though \u2014 in some cases, fixed rates are actually lower. Talk to your lender before deciding between a fixed or adjustable rate.)</p><p style='margin-bottom: 1.25em;'>With an ARM, you have no idea what mortgage rates will be like once the intro-rate period ends, so you risk your rate increasing later. This could ultimately end up costing more, and your monthly payments are unpredictable from year to year.</p><p style='margin-bottom: 1.25em;'>But if you plan to move before the intro-rate period is over, you could reap the benefits of a low rate without risking a rate increase down the road.</p><p style='margin-bottom: 1.25em;'>Read more: Learn whether now is a good time to get an adjustable-rate mortgage</p><p style='margin-bottom: 1.25em;'>Is now a good time to buy a house?</p><p style='margin-bottom: 1.25em;'>First of all, now is a good time to buy a house compared to a couple of years ago. Home prices aren't spiking like they were during the height of the COVID-19 pandemic. So, if you want or need to buy a house soon, you should feel pretty good about the current housing market.</p><p style='margin-bottom: 1.25em;'>Plus, despite the recent uptick, mortgage rates are lower than they were this time last year.</p><p style='margin-bottom: 1.25em;'>The best time to buy is typically whenever it makes sense for your stage of life. Trying to time the real estate market can be as futile as timing the stock market \u2014 buy when it's the right time for you.</p><p style='margin-bottom: 1.25em;'>Learn more: Which is more important, your home price or mortgage rate?</p><p style='margin-bottom: 1.25em;'>Today's mortgage rates: FAQs</p><p style='margin-bottom: 1.25em;'>Why do 30-year mortgage rates vary by the source reporting them?</p><p style='margin-bottom: 1.25em;'>According to Zillow, the national average 30-year mortgage rate is 6.64% right now. Why are Zillow's rates usually different than those reported by Freddie Mac (which reported 6.65% this week) and elsewhere? Each source compiles rates by different methods, and rates are reported for different time frames. Zillow obtains rates from its lender marketplace and reports them daily, while Freddie Mac pulls information from loan applications submitted to its underwriting system and averages them for the week. However, mortgage rates vary by state and even ZIP code, by lender, loan type, and many other factors. That's why it's so important to shop with multiple mortgage lenders.</p><p style='margin-bottom: 1.25em;'>Are interest rates expected to go down?</p><p style='margin-bottom: 1.25em;'>According to the latest available forecasts, the MBA expects the 30-year mortgage rate to be 6.5% through 2026. Fannie Mae predicts a 30-year rate near 6.8% through the end of the year.</p><p style='margin-bottom: 1.25em;'>Are mortgage rates dropping?</p><p style='margin-bottom: 1.25em;'>Rates remain jumpy. The current 30-year fixed rate today, Saturday, August 22, 2026, rose 14 basis points to 6.64%, the 15-year fixed rate fell 12 basis points to 5.88%, and the 5/1 ARM soared 49 basis points to 6.74%.</p><p style='margin-bottom: 1.25em;'>How do I get the lowest refinance rate?</p><p style='margin-bottom: 1.25em;'>In many ways, securing a low mortgage refinance rate is similar to the process you used when you bought your home. Try to improve your credit score and lower your debt-to-income ratio (DTI). Refinancing into a shorter term will also land you a lower rate, though your monthly mortgage payments will be higher.</p>"}, {"id": 17, "source": "Yahoo Finance", "category": "markets", "title": "Best CD rates today, Saturday, August 22, 2026: Best CD account earns 4.35% APY", "link": "https://finance.yahoo.com/personal-finance/banking/article/best-cd-rates-today-saturday-august-22-2026-best-cd-account-earns-435-apy-100000592.html", "date_str": "Aug 22 \u2022 10:00 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Some offers on this page are from advertisers who pay us, which may affect which products we write about, but not our recommendations. See our Advertiser Disclosure.</p><p style='margin-bottom: 1.25em;'>Find out how much you could earn by locking in a high CD rate today. The Federal Reserve cut its federal funds rate three times in 2025. So far in 2026, the Fed has left interest rates alone, and so now could be your last chance to lock in a competitive CD rate before rates move further. CD rates vary widely across financial institutions, so it's important to ensure you're getting the best rate possible when shopping around for a CD.</p><p style='margin-bottom: 1.25em;'>The following is a breakdown of CD rates today and where to find the best offers.</p><p style='margin-bottom: 1.25em;'>CD rates today, Saturday, August 22, 2026</p><p style='margin-bottom: 1.25em;'>Generally, the best CD rates today are offered on shorter terms of around one year or less. Online banks and credit unions, in particular, offer the top CD rates.</p><p style='margin-bottom: 1.25em;'>Today, Saturday, August 22, 2026, the highest CD rate is 4.35%. This rate is offered by Sallie Mae on its 3-year CD.</p><p style='margin-bottom: 1.25em;'>Here is a look at some of the best CD rates available today:</p><p style='margin-bottom: 1.25em;'>How much interest can I earn with a CD?</p><p style='margin-bottom: 1.25em;'>The amount of interest you can earn from a CD depends on the annual percentage rate (APY). This is a measure of your total earnings after one year, taking into account the base interest rate and how often interest compounds (CD interest typically compounds daily or monthly).</p><p style='margin-bottom: 1.25em;'>Say you invest $1,000 in a one-year CD with 1.52% APY, and interest compounds monthly. At the end of that year, your balance would grow to $1,015.20 \u2014 your initial $1,000 deposit, plus $15.20 in interest.</p><p style='margin-bottom: 1.25em;'>Now let's say you choose a one-year CD that offers 4% APY instead. In this case, your balance would grow to $1,040.74 over the same period, which includes $40.74 in interest.</p><p style='margin-bottom: 1.25em;'>The more you deposit in a CD, the more you stand to earn. If we used the same example of a one-year CD at 4% APY but deposited $10,000, your total balance when the CD matures would be $10,407.42, meaning you'd earn $407.42 in interest.</p><p style='margin-bottom: 1.25em;'>Read more: What is a good CD rate?</p><p style='margin-bottom: 1.25em;'>Types of CDs</p><p style='margin-bottom: 1.25em;'>When choosing a CD, the interest rate is usually top of mind. However, the rate isn't the only factor you should consider. There are several types of CDs that offer different benefits, though you may need to accept a slightly lower interest rate in exchange for more flexibility. Here's a look at some of the common types of CDs you can consider beyond traditional CDs:</p><p style='margin-bottom: 1.25em;'>-       Bump-up CD: This type of CD allows you to request a higher interest rate if your bank's rates go up during the account's term. However, you're usually allowed to \"bump up\" your rate just once.</p><p style='margin-bottom: 1.25em;'>-       No-penalty CD: Also known as a liquid CD, this type of CD allows you to withdraw funds before maturity without penalty.</p><p style='margin-bottom: 1.25em;'>-       Jumbo CD: These CDs require a higher minimum deposit (usually $100,000 or more), and often offer a higher interest rate in return. In today's CD rate environment, however, the difference between traditional and jumbo CD rates may not be much.</p><p style='margin-bottom: 1.25em;'>-       Brokered CD: As the name suggests, these CDs are purchased through a brokerage rather than directly from a bank. Brokered CDs can sometimes offer higher rates or more flexible terms, but they also carry more risk and might not be FDIC-insured.</p>"}, {"id": 18, "source": "Investing.com Indicators", "category": "economy", "title": "Ukrainian drones hit Ozon warehouse as Russia reports major overnight attack", "link": "https://www.investing.com/news/economy-news/ukrainian-drones-hit-ozon-warehouse-as-russia-reports-major-overnight-attack-4872319", "date_str": "Aug 22 \u2022 08:50 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 19, "source": "Investing.com Indicators", "category": "economy", "title": "Where are central banks keeping their gold?", "link": "https://www.investing.com/news/economy-news/where-are-central-banks-keeping-their-gold-4872312", "date_str": "Aug 22 \u2022 08:03 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 20, "source": "Investing.com Indicators", "category": "economy", "title": "Vatican plans \u20ac100 million agrivoltaic energy plant near Rome", "link": "https://www.investing.com/news/economy-news/vatican-plans-100-million-agrivoltaic-energy-plant-near-rome-4872309", "date_str": "Aug 22 \u2022 07:27 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 21, "source": "Investing.com Indicators", "category": "economy", "title": "U.S. judge strikes down immigrant visa suspension covering 75 countries", "link": "https://www.investing.com/news/economy-news/us-judge-strikes-down-immigrant-visa-suspension-covering-75-countries-4872307", "date_str": "Aug 22 \u2022 06:56 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 22, "source": "Investing.com Indicators", "category": "economy", "title": "China\u2019s robot games evolve from science fair to strategic showcase", "link": "https://www.investing.com/news/economy-news/chinas-robot-games-evolve-from-science-fair-to-strategic-showcase-4872305", "date_str": "Aug 22 \u2022 06:15 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 23, "source": "Investing.com Indicators", "category": "economy", "title": "Reform UK infighting complicates Farage\u2019s push to prepare party to govern", "link": "https://www.investing.com/news/economy-news/reform-uk-infighting-complicates-farages-push-to-prepare-party-to-govern-4872304", "date_str": "Aug 22 \u2022 05:56 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 24, "source": "Investing.com Indicators", "category": "economy", "title": "Pentagon removes Stars and Stripes newspaper leadership", "link": "https://www.investing.com/news/economy-news/pentagon-removes-stars-and-stripes-newspaper-leadership-4872300", "date_str": "Aug 22 \u2022 04:40 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 25, "source": "Investing.com Indicators", "category": "economy", "title": "U.S. tariffs on Canada take effect after trade talks collapse", "link": "https://www.investing.com/news/economy-news/us-tariffs-on-canada-take-effect-after-trade-talks-collapse-4872296", "date_str": "Aug 22 \u2022 04:15 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 26, "source": "Yahoo Finance", "category": "markets", "title": "Bill Gates pulls $818M from Berkshire to buy this giant", "link": "https://finance.yahoo.com/markets/stocks/articles/bill-gates-pulls-818m-berkshire-030700591.html", "date_str": "Aug 22 \u2022 03:07 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>If there's a habit I've picked up from watching markets, it's that when everyone is looking at the loudest trade, I start wondering what's happening in the quiet corners.</p><p style='margin-bottom: 1.25em;'>The biggest clues aren't always found in a soaring stock that's already overvalued or a famous analyst calling for a breakout. Sometimes they're buried somewhere else that investors never bother to open. I'd put this one in the last category.</p><p style='margin-bottom: 1.25em;'>The latest 13F filing from the Bill & Melinda Gates Foundation Trust shows a new $352.7 million position in The Home Depot (HD). At the same time, the trust cut its stake in Berkshire Hathaway by about $818 million.</p><p style='margin-bottom: 1.25em;'>That's not pocket change, and it's certainly not the kind of portfolio move I'd scroll past without asking why.</p><p style='margin-bottom: 1.25em;'>Why? This is big money moving from one of the market's most iconic investments into a home-improvement giant. There must be a story hiding underneath the numbers. The trust just bought the shares while everyone else seems to be waiting for the housing market to come back to life.</p><p style='margin-bottom: 1.25em;'>The trust now holds 1 million shares of The Home Depot. That's a meaningful opening position for a p
