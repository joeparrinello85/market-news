  <style>
    :root {
      --bg-body: #07090e;
      --bg-surface: #0e131f;
      --bg-surface-hover: #151c2e;
      --bg-active: #1a233a;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #8492a6;
      --accent-economy: #10b981;
      --accent-markets: #38bdf8;
      --accent-crypto: #a855f7;
      --accent-metals: #eab308;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .live-indicator {
      width: 7px;
      height: 7px;
      background: var(--accent-economy);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-economy);
    }

    .search-bar {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      width: 260px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--accent-markets);
    }

    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 49px);
      overflow: hidden;
    }

    /* Master Stream: 38% width */
    .master-pane {
      width: 38%;
      min-width: 360px;
      max-width: 520px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background: var(--bg-body);
      flex-shrink: 0;
    }

    .filter-bar {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(14, 19, 31, 0.7);
    }

    .tab-pill {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-pill:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .tab-pill.active {
      background: var(--text-main);
      color: var(--bg-body);
      border-color: var(--text-main);
    }

    .headline-stream {
      flex: 1;
      overflow-y: auto;
    }

    .headline-row {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .headline-row:hover {
      background: var(--bg-surface-hover);
    }

    .headline-row.active {
      background: var(--bg-active);
      border-left: 3px solid var(--accent-markets);
    }

    .row-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .row-tags {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 8.5px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 5px;
      border-radius: 3px;
      letter-spacing: 0.4px;
    }

    .badge-economy { background: rgba(16, 185, 129, 0.15); color: var(--accent-economy); }
    .badge-markets { background: rgba(56, 189, 248, 0.15); color: var(--accent-markets); }
    .badge-crypto  { background: rgba(168, 85, 247, 0.15); color: var(--accent-crypto); }
    .badge-metals  { background: rgba(234, 179, 8, 0.15); color: var(--accent-metals); }

    .source-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .time-label {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .row-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Detail Pane: Expansive Reader */
    .detail-pane {
      flex: 1;
      padding: 40px 60px;
      overflow-y: auto;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
    }

    .reader-container {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .detail-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 24px;
      color: #ffffff;
      letter-spacing: -0.4px;
    }

    .detail-body {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 18px;
      line-height: 1.8;
      color: #d1d5db;
      margin-bottom: 40px;
      white-space: pre-line;
    }

    .action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      margin-bottom: 60px;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-markets);
      color: #040914;
      font-weight: 600;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      padding: 9px 16px;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    @media (max-width: 860px) {
      .workspace { flex-direction: column; }
      .master-pane { width: 100%; max-width: none; height: 45%; }
      .detail-pane { height: 55%; padding: 24px 20px; }
      .detail-title { font-size: 20px; }
      .detail-body { font-size: 16px; }
    }

  <script>
    const articles = [{"id": 0, "source": "Investing.com Indicators", "category": "economy", "title": "Iran warns neighbours against joining U.S. sanctions as Hormuz stays closed", "link": "https://www.investing.com/news/economy-news/iran-warns-neighbours-against-joining-us-sanctions-as-hormuz-stays-closed-4872428", "iso_date": "2026-08-23T12:46:47+00:00", "date_str": "Aug 23 \u2022 12:46 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 1, "source": "Investing.com Indicators", "category": "economy", "title": "Could Canada fully supply the U.S. with aluminium?", "link": "https://www.investing.com/news/economy-news/could-canada-fully-supply-the-us-with-aluminium-4872433", "iso_date": "2026-08-23T08:51:28+00:00", "date_str": "Aug 23 \u2022 08:51 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 2, "source": "Yahoo Finance", "category": "markets", "title": "91-year-old supermarket chain closes stores, lays off employees", "link": "https://finance.yahoo.com/economy/articles/91-old-supermarket-chain-closes-231700441.html", "iso_date": "2026-08-22T23:17:00+00:00", "date_str": "Aug 22 \u2022 11:17 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Major supermarket chains, including Kroger, Stop & Shop, and The Raley's Companies, are in the middle of a downsizing mode that began in 2025 and will continue for some companies through 2027.</p><p style='margin-bottom: 1.25em;'>Kroger said it expected to close approximately 60 stores across its portfolio by the end of 2026, according to the company's first-quarter fiscal 2025 earnings call. Giant Ahold Delhaize's Stop & Shop chain confirmed in July that it will close store locations in Basking Ridge and Westfield, N.J., also in 2026</p><p style='margin-bottom: 1.25em;'>And now Raley's has said that it will close another Northern California store located in Petaluma, Calif., on Jan. 26, 2027, affecting 48 workers' jobs.</p><p style='margin-bottom: 1.25em;'>Raley's closes 7 stores</p><p style='margin-bottom: 1.25em;'>The closures are part of Raley's regional downsizing plan that calls for seven store closings in California and Nevada. Raley's said it will offer transfer opportunities to as many affected employees as possible, KSRO radio reported.</p><p style='margin-bottom: 1.25em;'>The Raley's Companies cited local market conditions and long-term financial sustainability for the downsizing.</p><p style='margin-bottom: 1.25em;'>The West Sacramento, Calif., grocery store chain began its downsizing plan with the closing of its Raley's store in Roseville, Calif., in January 2026, followed by the closure of its store in Antioch, Calif., in April. The chain had allowed both store leases to expire.</p><p style='margin-bottom: 1.25em;'>The supermarket chain continued closing stores by shuttering a Nob Hill Foods store in Mountain View, Calif., on May 29, 2026, affecting 50 employees.</p><p style='margin-bottom: 1.25em;'>Underperforming store leads to closure</p><p style='margin-bottom: 1.25em;'>Raley's followed up its Mountain View closure with the announcement that it will close its Nob Hill Foods store in Los Gatos, Calif., when its lease expires in June 2027, after reviewing the store's performance and current economic conditions, the company's Chief Marketing Officer Carol Barsotti said.</p><p style='margin-bottom: 1.25em;'>The company also plans to close its Raley's store in Brentwood, Calif., on Nov. 3, 2026, and an Elko, Nev., location in December 2026, according to SFGate.</p><p style='margin-bottom: 1.25em;'>\"Thoughtful stewardship sometimes means opening stores and sometimes it means making difficult decisions to close them,\" The Raley's Companies spokesperson Chelsea Carbahal told SFGate.</p><p style='margin-bottom: 1.25em;'>Foot traffic, sales impacted</p><p style='margin-bottom: 1.25em;'>Raley's brick-and mortar locations have faced more competition with online marketplaces and changing customer preferences, which impacted store foot traffic and overall sales, Carbahal said.</p><p style='margin-bottom: 1.25em;'>Despite the downsizing plan, Raley's plans to open a new store in March 2027 in the Central Valley city of Madera, Calif.</p><p style='margin-bottom: 1.25em;'>Raley's opened its first grocery store in Placerville, Calif., in 1935 and grew in California and Nevada before expanding to more states through grocery store acquisitions.</p>"}, {"id": 3, "source": "OilPrice Commodities", "category": "metals", "title": "Europe Dodges a Rhine Crisis for the Worst Possible Reason", "link": "https://oilprice.com/Energy/Energy-General/Europe-Dodges-a-Rhine-Crisis-for-the-Worst-Possible-Reason.html", "iso_date": "2026-08-22T23:00:00+00:00", "date_str": "Aug 22 \u2022 11:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>The Rhine has slightly risen from its mid-August record low (when Kaub\u2019s water level gauge \u2013 at the river\u2019s decisive chokepoint \u2013 was below 10 cm), but the relief is mostly optical. Barges still cannot carry normal loads through it, leaving the industrial corridor from Rotterdam and Antwerp to southern Germany, eastern France and Switzerland short of transport capacity. The immediate result is expensive freight, constrained chemical production and uneven fuel supply. However, the more troubling conclusion is that Europe is avoiding a deeper disruption only because its factories and consumers are already demanding less. This way, the Rhine\u2019s low-water crisis is a stress test for an industrial system built around cheap, high-volume river transport, and a reminder that pipelines, railways and roads cannot quickly reproduce what the Rhine does.</p><p style='margin-bottom: 1.25em;'>Kaub, on the Middle Rhine, determines how much cargo can move between the Amsterdam-Rotterdam-Antwerp (ARA) hub and industrial centres farther south. When its navigable water depth fell below 10 centimetres in mid-August, the waterway was roughly 1.2 metres deep (in comparison, just a year ago water depth was around 2.3 meters). The level has since recovered to about 45 centimetres, but that remains below the 77-centimetre benchmark \u2013 far from a return to normal commercial traffic. At the lowest levels, only specialised low-draft barges can cross Kaub, and while the Lower Rhine may remain open, the route to the Upper Rhine is effectively shut for most vessels, fragmenting what normally functions as one market.</p><p style='margin-bottom: 1.25em;'>The chemical industry feels that fracture first. Several of Germany\u2019s largest steam crackers are located along the Rhine corridor and are affected by restrictions at Kaub. The BASF, INEOS, LyondellBasell and Shell sites in this area have around 3.1 million t/y of combined ethylene capacity. BASF\u2019s Ludwigshafen complex is particularly exposed because it lies south of Kaub and moves about 40% of all incoming and outgoing goods by river.</p><p style='margin-bottom: 1.25em;'>Naphtha supply is not much of a problem \u2013 most of Germany\u2019s naphtha moves by pipeline, offering protection against a river bottleneck. But pipelines do not redistribute the broad range of finished products made by a cracker, and if those materials cannot leave, storage fills, and operators must curb runs. With low water levels continuing to limit the normal movement on the river, barges are forced to carry smaller loads, while specialised chemical vessels are limited. Related: U.S. Billionaires Are Piling Into Argentina\u2019s Vaca Muerta Shale</p><p style='margin-bottom: 1.25em;'>The effects can spread quickly into smaller downstream markets. LyondellBasell\u2019s force majeure at its 170,000 t/y Wesseling butadiene unit followed restricted feedstock flows to its crackers and a resulting decline in crude C4 production. Crude C4 is produced during the steam cracking of naphtha alongside ethylene and is then processed to extract butadiene. A relatively small reduction in cracker output can therefore cause a much larger squeeze in the smaller butadiene market \u2013 and other co-products that are difficult to reroute, such as pyrolysis gasoline, face similar pressure.</p><p style='margin-bottom: 1.25em;'>This restricted inland movements of chemical products contributed to naphtha inventories in ARA reaching 598,000 tonnes in mid-August (75% more than a month earlier). However, the problem is not only in the movement restrictions: weaker cracker operations have overall reduced naphtha consumption by the crackers even before the Rhine\u2019s levels became an issue \u2013 the crackers have been running at 70% due to weak demand on their production across the wider European market.</p><p style='margin-bottom: 1.25em;'>The same effect is emerging in refining. Most inland German refineries receive crude through pipelines, so the Rhine does not automatically force crude runs lower. Their exposure lies in intermediate feedstocks, blending components and, above all, moving gasoline, diesel and heating oil to customers.</p><p style='margin-bottom: 1.25em;'>Karlsruhe illustrates the issue. Road trucks have been shuttling to and from the Miro refinery (320,000 b/d capacity) to collect fuel, but the site also normally ships products by barge both toward ARA and upstream to Switzerland. With movements restricted in both directions, Karlsruhe must hold surplus refined products in its storage facilities, while markets farther away pay shortage premiums.</p><p style='margin-bottom: 1.25em;'>The Rhine\u2019s freight rates reflect this physical imbalance. The assessed ARA-Karlsruhe barge rate rose five-fold to \u20ac215/t currently from about \u20ac45/t at the end of June, while ARA-Basel reached \u20ac275/t in mid-August. At extreme low water, even those assessments become partly theoretical because few normal cargoes can pass.</p><p style='margin-bottom: 1.25em;'>Road and rail offer relief, but not replacement. Chemicals require appropriate tankers and transportation conditions, while the volumes involved overwhelm available vehicles and infrastructure. One fully loaded barge carrying 2,400 tonnes of diesel is equivalent to 90 trucks. Germany\u2019s temporary relaxation of Sunday and public-holiday restrictions for heavy vehicles may improve flexibility, but it cannot manufacture tank cars, specialist trailers, drivers or road capacity.</p><p style='margin-bottom: 1.25em;'>Yet the constraints extend even beyond crackers and refineries. Covestro declared force majeure on polyether polyols made at Dormagen, while Salzgitter shifted coal from Rotterdam to rail for its HKM steelmaking division. Such workarounds keep selected flows moving, but they also compete for the same scarce trains and trucks needed elsewhere. The disruption is therefore cumulative: every industry solving its own bottleneck makes the alternatives tighter for the next.</p><p style='margin-bottom: 1.25em;'>Nor is this only a German problem. Eastern France has experienced localised gasoline shortages as barges serving Strasbourg carried a fraction of their normal loads. Switzerland faces higher import costs and the possibility of drawing on strategic stocks. Rotterdam and Antwerp remain supplied by sea, yet congestion and slower terminal turnover spread costs across the wider northwest European market. This way, low water does not create a single European shortage but rather creates a dispersed issue of trapped supply and local shortages.</p><p style='margin-bottom: 1.25em;'>For now, weak demand is preventing isolated local shortages and oversupplies from becoming a broader crisis. European crackers were operating at only about 70% in July, after years of pressure from expensive energy, weak construction and automotive demand, and cheaper imports from Asian competitors. Fuel consumption in inland Germany has also been decreasing. However, if chemical plants and fuel markets were operating near normal levels, the shortage of river capacity would be much harder to absorb. A recovery in manufacturing, higher diesel demand or winter stockpiling could therefore intensify the disruption even if water levels improve modestly.</p><p style='margin-bottom: 1.25em;'>The Rhine may have risen slightly, but Europe\u2019s industrial margin of safety has not. This summer\u2019s lesson is that weak demand can cushion a logistics failure, but it cannot solve one. When (or if) the economy rebounds and supply chains are once again required to handle normal volumes, the problem will extend far beyond the river itself.</p><p style='margin-bottom: 1.25em;'>And besides, this summer should not be mistaken for a worst-case scenario. A super El Ni\u00f1o could bring a warmer winter, less Alpine snow and a weaker meltwater buffer. If another hot, dry summer follows, Rhine levels in July and August 2027 could fall even lower than this year\u2019s records.</p><p style='margin-bottom: 1.25em;'>By Natalia Katona for Oilprice.com</p><p style='margin-bottom: 1.25em;'>More Top Reads From Oilprice.com</p>"}, {"id": 4, "source": "OilPrice Commodities", "category": "metals", "title": "The Gas Turbine Shortage Just Became AI\u2019s Biggest Constraint", "link": "https://oilprice.com/Energy/Energy-General/The-Gas-Turbine-Shortage-Just-Became-AIs-Biggest-Constraint.html", "iso_date": "2026-08-22T21:00:00+00:00", "date_str": "Aug 22 \u2022 09:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Order a heavy-duty gas turbine from GE Vernova today and it won\u2019t arrive until 2031. That\u2019s the company\u2019s actual production schedule, confirmed on its July 22 earnings call, and it\u2019s the fact sitting underneath every AI data center power plan announced in the last two years. It comes up far less often than the announcements do.</p><p style='margin-bottom: 1.25em;'>Goldman Sachs put hard numbers on the demand side in May. U.S. data center power demand climbs from 31 gigawatts in 2025 to 41 GW this year and 66 GW in 2027. Year-over-year capacity additions accelerate from 8.5 GW actually realized last year to 13.6 GW scheduled for 2026 and 36.3 GW scheduled for 2027. By then data centers would take 8.5% of total U.S. peak summer demand, up from 4.1% today.</p><p style='margin-bottom: 1.25em;'>The equipment meant to generate that power is on a completely different clock.</p><p style='margin-bottom: 1.25em;'>The Big Three Are Booked Solid Into the 2030s</p><p style='margin-bottom: 1.25em;'>GE Vernova closed the second quarter with 116 GW of gas power equipment backlog and slot reservation agreements, up from 100 GW three months earlier and 83 GW at the end of 2025. It expects at least 125 GW under contract by December. CEO Scott Strazik told analysts the company is taking reservations for 2031 delivery and should be more than halfway contracted for that year by the end of 2026. Its production plan: roughly 20 GW annualized this quarter, 24 GW by 2028, and a push toward 30 GW by 2030.</p><p style='margin-bottom: 1.25em;'>Siemens Energy ended its fiscal third quarter on June 30 with a 69 GW gas turbine backlog after booking 15 GW and shipping six. Lead times run three years or more. CEO Christian Bruch told analysts the addressable market could reach 120 GW a year, roughly half of it American.</p><p style='margin-bottom: 1.25em;'>Mitsubishi Heavy Industries reported a 35 GW large-frame backlog on Aug. 6, up from 23 GW a year earlier. That figure covers Mitsubishi\u2019s fiscal first quarter, which runs March through June, so it lags roughly a month behind the calendar-quarter numbers above. CFO Hiroshi Nishio said orders booked during the quarter are scheduled for delivery between 2028 and 2030, and that the company is \u201cbeing selective in the projects we contract.\u201d</p><p style='margin-bottom: 1.25em;'>Add the three headline numbers and you get 220 GW, which overstates the case, because none of them is counting the same thing. Of GE Vernova\u2019s 116 GW, only 53 GW is firm equipment backlog; the other 63 GW is slot reservations, paid options that haven\u2019t converted to orders yet. Siemens\u2019 69 GW is firm backlog with no reservations mixed in. Mitsubishi\u2019s 35 GW covers large-frame turbines only, leaving out its aeroderivative and mid-size lines. None of the three would explain what the other two mean by \u201cbacklog\u201d without a footnote.</p><p style='margin-bottom: 1.25em;'>What all three agree on, regardless of how each counts it, is direction and scale. Global orders in the second quarter hit a record 38 GW, up 71% year on year, with the U.S. accounting for half. Wood Mackenzie puts worldwide manufacturing capacity at 60 to 70 GW a year against roughly 110 GW of orders.</p><p style='margin-bottom: 1.25em;'>One Year of AI Demand Outstrips the Entire Industry's Output</p><p style='margin-bottom: 1.25em;'>That 36.3 GW figure from Goldman is the one that matters most, because it\u2019s larger than what the entire turbine industry can plausibly deliver in a single year. Everything GE Vernova builds annually, worldwide, for every customer on the planet, is about 20 GW. Only a fifth of the gigawatts under contract are earmarked for data centers in the first place. The rest goes to utilities replacing coal, Middle East power and desalination projects, industrial load and grid reliability work queued up long before anyone was talking about inference clusters.</p><p style='margin-bottom: 1.25em;'>Even in a fantasy where GE Vernova pointed its entire global output at American AI campuses, it wouldn\u2019t cover one year of the Goldman curve. And it couldn\u2019t, because those slots were sold years ago.</p><p style='margin-bottom: 1.25em;'>The turbines running data centers in 2027 were ordered in 2023 and 2024. Turbines ordered this month land somewhere around 2030 or 2031. Everything in between is either already spoken for, coming from something other than a new gas plant, or not happening.</p><p style='margin-bottom: 1.25em;'>This is also the part of the supply chain that scales worst. Hot-section castings, the blades and vanes that sit in a 1,000-degree gas path, come from a thin bench of specialized foundries, and the welders and machinists who assemble these machines were laid off a decade ago and never replaced. Even where a slot exists, there aren\u2019t enough qualified contractors to install the thing. Average lead times for a new combined-cycle plant have gone from three and a half years in 2023 to roughly five now, and seven for some heavy-duty frames.</p><p style='margin-bottom: 1.25em;'>PJM Paid Top Dollar and Still Came Up Short</p><p style='margin-bottom: 1.25em;'>PJM\u2019s capacity auction on July 14 is the clearest read available on what the gap costs.</p><p style='margin-bottom: 1.25em;'>The auction for the 2028/2029 delivery year cleared at $325 per megawatt-day, the FERC-approved cap, for the third consecutive year. It procured 138,318 MW of unforced capacity, which left the system 6,831 MW below PJM\u2019s own reliability requirement. New generation and uprates that cleared: 525 MW.</p><p style='margin-bottom: 1.25em;'>The largest wholesale power market in the country paid the maximum price its rules allow, came up nearly 7 GW short and attracted about half a gigawatt of new supply in return. PJM\u2019s own modeling showed that without the cap, the RTO would have cleared at $554.72 per megawatt-day and the ComEd zone at $776.69.</p><p style='margin-bottom: 1.25em;'>PJM has proposed a one-time Reliability Backstop Procurement targeting roughly 14.9 GW of new capacity, split between bilateral contracts starting this September and a pay-as-bid auction next March. Whether that fills a hole gas turbine makers can\u2019t touch inside three years is the open question.</p><p style='margin-bottom: 1.25em;'>Turbine Prices Have Nearly Doubled, and Gas Isn't the Reason</p><p style='margin-bottom: 1.25em;'>Prices have moved accordingly. BloombergNEF put the average combined-cycle project at $2,157 per kilowatt last year, up from under $1,500 in 2023. A GridLab review of actual project filings found plants due to finish in 2026 and 2027 reported $1,116 to $1,427 per kW, while projects targeting 2030 and 2031 routinely report $2,000 per kW or more. Wood Mackenzie expects turbine prices alone to reach $600 per kW by the end of 2027, a 195% jump from 2019.</p><p style='margin-bottom: 1.25em;'>The fuel itself has nothing to do with it. Henry Hub spot gas was trading around $2.79 per MMBtu in mid-August, and government trackers put the 2026 average near $3.31, both unremarkable by the last five years\u2019 standards. The bottleneck sits entirely in castings, welders and factory slots, not in the molecule being burned.</p><p style='margin-bottom: 1.25em;'>GE Vernova is collecting on the hardware side of it. First-half 2026 equipment orders were priced more than 20% above fourth-quarter 2025 orders. Second-quarter free cash flow hit $5.1 billion, helped by a $6.4 billion working capital benefit from customer down payments tied to slot reservations. Year-to-date free cash flow is running near $9.9 billion, already more than the company generated in all of 2025.</p><p style='margin-bottom: 1.25em;'>GE Vernova Is Getting Paid for Turbines It May Never Build</p><p style='margin-bottom: 1.25em;'>That down-payment structure is also the smartest thing the turbine makers have done this cycle, and it comes straight out of the last one.</p><p style='margin-bottom: 1.25em;'>All three lived through the last gas boom. Cheap shale in the 2000s pulled in a wave of merchant developers, the market saturated, orders were canceled, factories closed and skilled labor scattered. The industry spent the 2010s treating gas turbines as a cash cow rather than a growth business, and capacity stayed flat while electricity demand quietly started climbing again.</p><p style='margin-bottom: 1.25em;'>Nobody wants that hangover twice, so rather than bet the factory on hyperscaler forecasts, the OEMs built an instrument that makes the customer carry the risk. A slot reservation agreement is a paid option on future production. If the data center gets built, the customer converts it to a firm order. If it doesn\u2019t, the manufacturer keeps the deposit and resells the slot into a market that\u2019s short anyway.</p><p style='margin-bottom: 1.25em;'>GE Vernova\u2019s balance sheet is currently being financed, in part, by down payments on turbines that may never be needed. It\u2019s a good position to be in, and it explains why the capacity expansions are so measured relative to the size of the order book.</p><p style='margin-bottom: 1.25em;'>Exelon and Texas Are Quietly Walking Back Their Numbers</p><p style='margin-bottom: 1.25em;'>There\u2019s an honest counterargument here, and it keeps getting stronger.</p><p style='margin-bottom: 1.25em;'>Exelon cut its \u201chigh probability\u201d data center load from roughly 18 GW to about 11 GW on July 30, a drop of nearly 40%. Its broader interconnection pipeline fell from about 43 GW to 25 GW in a single quarter. Only about 4 GW carries signed transmission service agreements backed by $1 billion in posted collateral. \u201cWe now weed out speculative projects,\u201d CFO Jeanne Jones said, \u201cand it gives us proactive insight into what is real.\u201d</p><p style='margin-bottom: 1.25em;'>Texas went further. Gov. Greg Abbott ordered an audit of every data center in the ERCOT interconnection queue on Aug. 3 after requests swelled to roughly 474 GW, about 90% of it data centers and more than five times the state\u2019s record peak demand. ERCOT suspended its Batch Zero large-load process within hours and, on Aug. 10, formally asked the Public Utility Commission for a good-cause exception covering the missed classification deadline; the audit itself is expected to run several months, with scope and timing due at the PUCT\u2019s Aug. 20 open meeting. BloombergNEF estimates the pause puts nearly 50 GW at risk of delay, about a fifth of the national pipeline. New York had already halted new approvals in July.</p><p style='margin-bottom: 1.25em;'>Goldman itself assumes only 50% to 60% of the data center capacity scheduled over the next two years shows up on time.</p><p style='margin-bottom: 1.25em;'>Read the 116 GW order book one way and it\u2019s the leading edge of the biggest power buildout since the 1970s. Read it the other way and it\u2019s a queue stuffed with options on projects that were never financed, held by developers who\u2019d rather forfeit a deposit than miss a slot.</p><p style='margin-bottom: 1.25em;'>This Bottleneck Gets Solved by Governors, Not Factories</p><p style='margin-bottom: 1.25em;'>It barely matters which reading is right, because the 2027 timeline holds either way.</p><p style='margin-bottom: 1.25em;'>If the demand is real, the turbines can\u2019t arrive fast enough and the shortfall gets covered by whatever can be delivered inside 24 to 36 months, mostly reciprocating engines. That\u2019s why Caterpillar and W\u00e4rtsil\u00e4 are now selling prime power into AI campuses, and why their own order books are full into 2028 too. Fuel cells fill in around the edges. Existing plants run harder. Coal units that were supposed to retire stay open instead. And a meaningful share of the load that\u2019s currently on paper simply doesn\u2019t get built.</p><p style='margin-bottom: 1.25em;'>If the demand isn\u2019t real, the correction shows up as canceled slot reservations in 2028 and 2029, long after this year\u2019s capacity auctions have already repriced power for 67 million people in PJM.</p><p style='margin-bottom: 1.25em;'>Either way, the bottleneck doesn\u2019t clear on a factory floor. It clears in state capitals: governors in Austin and Albany, regulators writing separate rate classes for data centers, utilities demanding collateral before they\u2019ll even run an interconnection study. Almost nobody selling the AI buildout has priced in how much of that demand will have to shrink before the equipment can catch up.</p><p style='margin-bottom: 1.25em;'>By Michael Kern for Oilprice.com</p><p style='margin-bottom: 1.25em;'>More Top Reads From Oilprice.com</p><p style='margin-bottom: 1.25em;'>- IEA: Southeast Asia Needs Grid Investment to Nearly Quadruple by 2050</p><p style='margin-bottom: 1.25em;'>- Every Chokepoint That Isn't Hormuz</p><p style='margin-bottom: 1.25em;'>- Clean Energy Spending Tracking Toward Record $180 Billion in 2026</p>"}, {"id": 5, "source": "Investing.com Indicators", "category": "economy", "title": "Iran lets Iraqi oil tankers pass Hormuz as Trump claims \"total control\"", "link": "https://www.investing.com/news/economy-news/us-iran-trade-warnings-as-new-sanctions-loom-and-hormuz-oil-flows-stall-4872251", "iso_date": "2026-08-22T20:56:13+00:00", "date_str": "Aug 22 \u2022 08:56 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 6, "source": "OilPrice Commodities", "category": "metals", "title": "Clean Energy Spending Tracking Toward Record $180 Billion in 2026", "link": "https://oilprice.com/Energy/Energy-General/Clean-Energy-Spending-Tracking-Toward-Record-180-Billion-in-2026.html", "iso_date": "2026-08-22T19:00:00+00:00", "date_str": "Aug 22 \u2022 07:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Donald Trump is accidentally overseeing a massive buildout of the country\u2019s renewable energy capacity and infrastructure. Not only are investments in renewable technologies soaring to new highs, the national energy grid is rapidly transforming to accommodate an increasingly solar- and wind-powered energy mix.</p><p style='margin-bottom: 1.25em;'>Despite massive rollbacks of Biden- and Obama-era clean energy incentives and financial supports, investment in clean energy tech keeps soaring to new heights, buoyed by market forces far outside of the federal government\u2019s control. Clean energy capital expenditures already reached $74 billion in the first half of 2026, and they\u2019re on track to reach a record $180 billion by the end of the year, according to fintech firm Crux\u2019s State of Clean Energy Finance: 2026 Mid-Year Market Intelligence Report.</p><p style='margin-bottom: 1.25em;'>\u201cThe market is proving resilient,\u201d Crux CEO and co-founder Alfred Johnson was recently quoted by Politico\u2019s E&E News. \u201cWe\u2019re seeing a significant amount of investment subsequent to the tax law changes of last year.\u201d</p><p style='margin-bottom: 1.25em;'>The insatiable energy demand coming from data center hyperscalers and the artificial intelligence boom has spurred a tidal wave of investment into all kinds of energy projects, and especially renewables due to their noted advantages when it comes to energy security and affordability. These advantages have been underscored in recent months by extreme volatility in fossil fuel markets thanks to the war in Iran and resultant supply chain vulnerabilities. \u201cRenewables and storage continue to be the fastest way to get new electrons on the grid until additional gas-fired generation can be built,\u201d NextEra Energy CEO John Ketchum was recently quoted by Reuters.</p><p style='margin-bottom: 1.25em;'>As a result, we are currently \u201cliving in what arguably is one of the best periods to invest in renewables in the US over the last 20 years\u201d according to Miguel Stilwell d\u2019Andrade, chief executive officer of Portuguese electric utilities company EDP. Accordingly, EDP is directing approximately USD $5.3 billion \u2013 more than half of its capital expenditures \u2013 toward United States renewables projects over the next three years.</p><p style='margin-bottom: 1.25em;'>All of that renewable energy buildout is being accompanied by a massive and unprecedented uptick in battery storage buildout, resulting in a rapid transformation of the nation\u2019s energy grid. Over the past three years, utility-scale battery storage capacity increased at a blistering rate of 70 percent per year on average to reach 52 gigawatts (GW) today. Nearly 16 percent of that \u2013 8.3 GW \u2013 was added in the first half of this year alone.</p><p style='margin-bottom: 1.25em;'>\u201cThis expansion depends mostly on co-locating batteries with solar photovoltaic (PV) plants to capitalize on wholesale price arbitrage across major energy markets,\u201d Interesting Engineering reported earlier this week. Connecting battery packs directly to solar farms allows the farms\u2019 operators to store excess clean energy at peak production hours until the evening hours, when production wanes, demand rises, and rates reach a premium. \u201cThis lucrative business model has sparked a massive construction boom across solar-heavy states, turning temporary energy storage into a primary driver of modern grid infrastructure,\u201d Interesting Engineering goes on to report.</p><p style='margin-bottom: 1.25em;'>As stunning as this year\u2019s figures are, the battery storage revolution is just getting started. Grid operators already have plans to add another 54 GW of battery capacity by the end of 2028. That means that the nation\u2019s energy storage capacity will double again by 2030, compared to current levels.</p><p style='margin-bottom: 1.25em;'>And the United States is not alone \u2013 the energy storage renaissance is proving to be a global trend. China is leading buildout by a wide margin, controlling more than half of global capacity. But other major global leaders are hurrying to get a foothold into the rapidly expanding market. Just this month, the European Union formalized a plan to triple the bloc\u2019s energy storage capacity by 2030. European Leaders are banking on energy storage \u2013 alongside renewable energy expansion \u2013 to steady the continent\u2019s energy markets and protect member states from the next energy crisis.</p><p style='margin-bottom: 1.25em;'>By Haley Zaremba for Oilprice.com</p><p style='margin-bottom: 1.25em;'>More Top Reads From Oilprice.com</p><p style='margin-bottom: 1.25em;'>- China's New Five-Year Plan Preps the Nation for Peak Oil</p><p style='margin-bottom: 1.25em;'>- IEA: Southeast Asia Needs Grid Investment to Nearly Quadruple by 2050</p><p style='margin-bottom: 1.25em;'>- Every Chokepoint That Isn't Hormuz</p>"}, {"id": 7, "source": "Yahoo Finance", "category": "markets", "title": "Iconic fast-food fried chicken chain closes over 300 restaurants", "link": "https://finance.yahoo.com/small-business/articles/iconic-fast-food-fried-chicken-184700958.html", "iso_date": "2026-08-22T18:47:00+00:00", "date_str": "Aug 22 \u2022 06:47 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Iconic fast-food fried chicken chain closes over 300 restaurants</p><p style='margin-bottom: 1.25em;'>Daniel Kline</p><p style='margin-bottom: 1.25em;'>5 min read</p><p style='margin-bottom: 1.25em;'>The fast-food fried chicken space has several contenders vying for the throne. Chick-fil-A has been a market leader, but Popeyes has competed with its once-viral chicken sandwich, while Raising Cane's has grown quickly, fueled by its cult fanbase and simple menu.</p><p style='margin-bottom: 1.25em;'>It's an incredibly competitive space where it's hard to differentiate your product.</p><p style='margin-bottom: 1.25em;'>The chicken category increased 5.3% in 2025, down from 9.1% in 2024 and more than 12% in 2023, according to Technomic data shared with Nation's Restaurant News.</p><p style='margin-bottom: 1.25em;'>\"Last year, the category was especially impacted by slowing momentum for the biggest players. Chick-fil-A's sales grew 5.2% year-over-year, compared to 5.4% in 2024, for instance,\" NRN reported.</p><p style='margin-bottom: 1.25em;'>Two of the biggest names in the space actually saw sales drop.</p><p style='margin-bottom: 1.25em;'>\"Popeyes' sales fell 0.5% in 2025, versus 3.9% growth in 2024. KFC had a tough 2025, with sales down 4.6%, while in 2024, its sales were down 5.2%,\" the data showed.</p><p style='margin-bottom: 1.25em;'>That's a significant drop over a two-year period for KFC, which may explain why the chain has been closing stores.</p><p style='margin-bottom: 1.25em;'>KFC has closed 300 stores in a year</p><p style='margin-bottom: 1.25em;'>While much of the attention has been focused on KFC's former sister brand, Pizza Hut, which was sold by Yum Brands in June, the chicken brand has also been struggling, but it has shown signs of a significant turnaround.</p><p style='margin-bottom: 1.25em;'>\"KFC delivered 6% system sales growth driven by 7% unit growth and 2% same-store sales growth. Around the world, KFC teams are advancing our Raise the B.A.R. priorities, beginning with improving menu relevance,\" Yum Brands CEO Christopher Turner said during the chain's second-quarter earnings call.</p><p style='margin-bottom: 1.25em;'>Closing underperforming stores can also improve a chain's overall sales performance by removing weaker locations.</p><p style='margin-bottom: 1.25em;'>\"An analysis of KFC finds that at least 312 of its U.S. restaurants have permanently closed between July 15, 2025, and July 6, 2026, a 7.64% reduction in the size of the chain's American footprint,\" according to Local Falcon.</p><p style='margin-bottom: 1.25em;'>Local Falcon, a local AI search visibility platform, compared KFC's public store locator at the start and end of the period. Each restaurant listing that had been removed and returned a 404 error was then independently verified against Google Maps.</p><p style='margin-bottom: 1.25em;'>KFC needs an identity boost</p><p style='margin-bottom: 1.25em;'>KFC's struggles come partially because its rivals including Chick-fil-A, Popeyes, and Raising Cane's have staked out distinctive brand positions. That's something KFC has abandoned, according to RTM Nexus CEO Dominik Miserandino.</p><p style='margin-bottom: 1.25em;'>\"For decades, KFC relied on a legacy model: selling heavy, family-sized buckets of bone-in chicken for dinner. But consumer habits shifted fast toward portable, single-serve convenience,\" he told TheStreet.</p><p style='margin-bottom: 1.25em;'>That allowed other chains to usurp its market-leading position.</p><p style='margin-bottom: 1.25em;'>\"Chick-fil-A dominated that shift by perfecting drive-thru speed, customer service, and the classic chicken sandwich. Then Popeyes swooped in and proved you could deliver high-flavor, premium-tier fried chicken with speed and scale,\" he added.</p><p style='margin-bottom: 1.25em;'>It was also a matter of brand connection and staying ahead of what customers wanted.</p><p style='margin-bottom: 1.25em;'>\"While Chick-fil-A and Popeyes built fanatical followings, KFC stayed stuck in the past with slow, complex bucket meals and outdated stores. By the time KFC tried to pivot to chicken sandwiches and nuggets, the category leaders had already locked up consumer loyalty. KFC got squeezed into the background because they treated chicken like a Sunday family dinner while their competitors treated it like a fast, daily habit,\" he shared.</p><p style='margin-bottom: 1.25em;'>KFC has made changes</p><p style='margin-bottom: 1.25em;'>Turner has been leading a turnaround effort at KFC. That includes a visual reboot for restaurants, as well as the launch of the Saucy sister brand. Lessons learned from the fledgling chain are being applied to the flagship brand.</p><p style='margin-bottom: 1.25em;'>\"If you think about battling for the future consumer, just a couple of months ago, we introduced the new brand visual identity. You're going to be seeing that come to life in our imaging and as the brand presents itself around the globe,\" he said.</p><p style='margin-bottom: 1.25em;'>Turner also promised improvements in the chain's food.</p><p style='margin-bottom: 1.25em;'>\"You've heard us talk about leveraging the learnings from Saucy to improve our tender formulation. We're going to have larger tenders, more craveable tenders. We're bringing the range of sauces, dips, drips and, sorry, sauces, dips and rubs to life to give more flavors to our consumers,\" he added.</p><p style='margin-bottom: 1.25em;'>Restaurant consultant Jeffrey Summers wrote in his LinkedIn page that KFC went from seven consecutive quarters of negative same-store sales to back-to-back positive quarters, but cautioned that the improvement was still modest.</p><p style='margin-bottom: 1.25em;'>\"The turnaround required: a new president, a new CMO, a new chief growth officer, a national campaign admitting failure, the return of Potato Wedges, a viral social media moment, a tiered value architecture borrowed from Taco Bell, and two years of work,\" he posted.</p><p style='margin-bottom: 1.25em;'>That brought the chain a 1% gain in same-store sales.</p><p style='margin-bottom: 1.25em;'>\"I am not saying that to diminish what Catherine Tan-Gillespie and her team accomplished. Turning a $5 billion brand with 3,500 locations is genuinely hard work. The admission that Colonel Sanders would not be happy about where the brand had gone was honest and brave and it worked,\" he added.</p><p style='margin-bottom: 1.25em;'>KFC, however, does face a challenging market.</p><p style='margin-bottom: 1.25em;'>\"The total number of chicken chain locations has surged by 46% over the last decade, reflecting a net increase of nearly 6,200 units \u2014 a market response to a clear demand for the protein,\" NRN reported.</p>"}, {"id": 8, "source": "Investing.com Indicators", "category": "economy", "title": "Canada to match U.S. tariffs dollar for dollar after trade talks collapse", "link": "https://www.investing.com/news/economy-news/canada-to-match-us-tariffs-dollar-for-dollar-after-trade-talks-collapse-4872372", "iso_date": "2026-08-22T16:10:13+00:00", "date_str": "Aug 22 \u2022 04:10 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 9, "source": "Yahoo Finance", "category": "markets", "title": "Nvidia Might Deliver Another \u2018Beat and Raise\u2019 Quarter, But Its Financing Deals Could Be the Bigger Driver of NVDA Stock", "link": "https://finance.yahoo.com/markets/stocks/articles/nvidia-might-deliver-another-beat-134502581.html", "iso_date": "2026-08-22T13:45:02+00:00", "date_str": "Aug 22 \u2022 01:45 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Nvidia Might Deliver Another \u2018Beat and Raise\u2019 Quarter, But Its Financing Deals Could Be the Bigger Driver of NVDA Stock</p><p style='margin-bottom: 1.25em;'>Nvidia Corporation (NVDA) will release its fiscal Q2 2027 earnings on Aug. 26 after the close of markets. The stock is heading into the confessional on a relatively calm note, down 3.33% over the last five days and trading 8.5% below the record highs it hit in May, days before its Q1 earnings report. Nvidia's Q1 earnings were the \"usual\" stuff, with earnings blowing past estimates and the company's own guidance. The Q2 forecast also came in ahead of Wall Street's estimates, but NVDA stock closed in the red despite a strong performance.</p><p style='margin-bottom: 1.25em;'>NVDA Q2 Earnings Estimates</p><p style='margin-bottom: 1.25em;'>Consensus estimates call for Nvidia's Q2 revenues to nearly double year-over-year (YOY) to $92.01 billion. Nvidia has forecast Q2 revenues at $91 billion, plus or minus 2%, and the current estimates are toward the upper end of the company's guidance. As for the bottom line, analysts expect Nvidia's Q2 earnings per share (EPS) to more than double to $2.01. Nvidia does not provide EPS guidance but forecasted GAAP gross margins between 74.4% and 75.4%.</p><p style='margin-bottom: 1.25em;'>More News from Barchart</p><p style='margin-bottom: 1.25em;'>-       Nvidia Q2 Preview: Strong Earnings and Low Valuation Set the Stage for Upside</p><p style='margin-bottom: 1.25em;'>-       Third Point Starts to Raise Alarm Bells on Broadcom After Dumping AVGO Stock in Q2</p><p style='margin-bottom: 1.25em;'>-       A $28.7 Billion Reason to Buy SK hynix Stock Now</p><p style='margin-bottom: 1.25em;'>-       Get exclusive insights with the FREE Barchart Brief newsletter. Subscribe now for quick, incisive midday market analysis you won't find anywhere else.</p><p style='margin-bottom: 1.25em;'>NVDA Stock Forecast</p><p style='margin-bottom: 1.25em;'>Wall Street is bullish on NVDA stock heading into the Q2 earnings, and Stifel analyst Ruben Roy expects a \"Beat and Raise,\" which basically means that he expects Nvidia to beat Q2 earnings estimates and raise its annual guidance. TD Cowen's Joshua Buchalter believes investors expect another \"Beat and Raise\" quarter but does not see big moves in NVDA stock following the report. UBS also expects a significant revenue beat from Nvidia and sees it exceeding its revenue guidance by up to $4 billion while forecasting that the October quarter guidance will land well above Street estimates.</p><p style='margin-bottom: 1.25em;'>Bank of America's Vivek Arya finds NVDA's valuations \"compelling\" and is not too perturbed by the company's off-balance sheet commitments. Notably, Nvidia has agreed to provide guarantees for up to $105 billion for OpenAI's Ohio data center, which is a potential risk not captured in the balance sheet. To be sure, this is not the first instance of \"circular financing\" that we have seen in the AI ecosystem, and there have been multiple instances of companies investing in their customers in what is seen as instances of vendor financing, or put bluntly, buying revenues.</p>"}, {"id": 10, "source": "Cointelegraph", "category": "crypto", "title": "MiCA is coming for DeFi vaults, but regulation will be difficult", "link": "https://cointelegraph.com/magazine/mica-is-coming-for-defi-vaults-but-regulation-will-be-difficult?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-22T13:30:00+00:00", "date_str": "Aug 22 \u2022 01:30 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>MiCA is coming for DeFi vaults, but regulation will be difficult</p><p style='margin-bottom: 1.25em;'>Brussels is reviewing whether crypto lending should fall under MiCA, but DeFi lending vaults are making it harder to determine who, exactly, should be regulated.</p><p style='margin-bottom: 1.25em;'>MiCA left crypto lending outside its original rulebook \u2014 but now Brussels is considering whether to bring it in.</p><p style='margin-bottom: 1.25em;'>On May 20, 2026, the European Commission asked stakeholders to weigh in on areas left outside the original Markets in Crypto Assets (MiCA) framework. These include issues around decentralized finance (DeFi) and crypto lending and borrowing.</p><p style='margin-bottom: 1.25em;'>One area of contention involves lending vaults, which can channel billions of dollars into onchain credit markets without looking like conventional lending. Their legal status currently depends on non binding interpretations that they fall outside of MiCA and EU fund rules.</p><p style='margin-bottom: 1.25em;'>Yuriy Brisov, an EU digital assets lawyer and partner at Digital & Analogue Partners, tells Magazine the law pertaining to vaults at present is unclear:</p><p style='margin-bottom: 1.25em;'>\u201cEU law has no category called a \u2018vault.\u2019 A lawyer therefore defines it the way a regulator would qualify it: by function, not by label.\u201d</p><p style='margin-bottom: 1.25em;'>That\u2019s just one of myriad regulatory problems, since vaults can perform the economic functions of lending while spreading other functions over smart contracts and multiple participants rather than a single company.</p><p style='margin-bottom: 1.25em;'>If Brussels decides lending should come inside the regulatory perimeter, what does that mean for DeFi, and where does it leave the people and protocols behind these vaults?</p><p style='margin-bottom: 1.25em;'>Morpho puts the problem into practice</p><p style='margin-bottom: 1.25em;'>Decentralized lending protocol Morpho\u2019s lending infrastructure gives some clues as to why this question will be so hard to answer. The way its vaults are set up and managed does not neatly map on to any existing regulatory model.</p><p style='margin-bottom: 1.25em;'>Targeted consultation on the review of Regulation on the Markets in Crypto Assets (MiCA). Source: European Comission</p><p style='margin-bottom: 1.25em;'>Its Vault V2 architecture divides responsibilities between an owner, curator, allocator and sentinel. The curator configures strategy and risk parameters, while the allocator executes allocations and the sentinel has powers intended to reduce risk.</p><p style='margin-bottom: 1.25em;'>While none of this establishes any of these participants as providing a regulated lending service under MiCA, it does show why identifying the relevant \u201cprovider\u201d is less straightforward than with a conventional lender.</p><p style='margin-bottom: 1.25em;'>Related: Bitwise to launch onchain vaults via Morpho</p><p style='margin-bottom: 1.25em;'>Jonathan Galea, a partner at Cahill Gordon & Reindel, explored the issue in a recent client update on lending vaults and their position under EU financial regulation. His analysis looks at how vault structures can sit across MiCA, stablecoin rules and European fund law.</p><p style='margin-bottom: 1.25em;'>Galea says policymakers should be careful about treating lending vaults as a single category, telling Magazine, \u201clending vaults solve more practical problems than they create.\u201d</p><p style='margin-bottom: 1.25em;'>He says lending vaults help direct fragmented liquidity into lending markets, while other vaults may buy and sell crypto assets and should be treated differently:</p><p style='margin-bottom: 1.25em;'>\u201cBring \u2018DeFi lending\u2019 into the perimeter as a single label, and structures that deserve opposite answers risk ending up captured together.\u201d</p><p style='margin-bottom: 1.25em;'>That would be important if Brussels decides to regulate lending, since a broad category covering \u201cDeFi lending\u201d could capture structures with very different economic functions\u2014and people exercising control over them.</p><p style='margin-bottom: 1.25em;'>Who should actually be regulated?</p><p style='margin-bottom: 1.25em;'>MiCA currently excludes crypto asset services that are provided in a \u201cfully decentralized manner,\u201d although it can apply where only part of an activity is performed in a decentralized way.</p><p style='margin-bottom: 1.25em;'>Morpho\u2019s Vault V2 architecture. Source: Morpho</p><p style='margin-bottom: 1.25em;'>One possible solution would be to make decentralization the dividing line, but Galea argues that could disadvantage newer protocols. He says:</p><p style='margin-bottom: 1.25em;'>\u201cDecentralization is a spectrum and a function of time: a test built on it would penalize newer, more novel protocols while entrenching mature incumbents that have had years to distribute control.\u201d</p><p style='margin-bottom: 1.25em;'>Brisov says the focus should instead be on the structure of the vault and the control people have over it:</p><p style='margin-bottom: 1.25em;'>\u201cThe safer ground is structural: there is no undertaking, no appointed manager, the holder has a direct coded claim on the pool, and the user can exit before any parameter change takes effect.\u201d</p><p style='margin-bottom: 1.25em;'>He says if Brussels decides that lending and borrowing warrant regulation, they should be explicitly added to the list of regulated crypto asset services rather than broadening the definition of a crypto asset service provider itself.</p><p style='margin-bottom: 1.25em;'>Related: \u2018DeFi doesn\u2019t exist anymore,\u2019 just onchain finance: Andre Cronje</p><p style='margin-bottom: 1.25em;'>Curve Finance founder Michael Egorov argues that the rules also need to account for the differences between decentralized lending and conventional finance. He says:</p><p style='margin-bottom: 1.25em;'>\u201cIf DeFi lending is ever brought into the scope of regulation, it should be treated completely differently. DeFi doesn\u2019t need some of the safeguards which traditional lending requires, and yet, at the same time, it may need others.\u201d</p><p style='margin-bottom: 1.25em;'>Egorov says regulation should be approached \u201creally carefully,\u201d and that a dedicated framework could improve safety and open DeFi lending to new users, while avoiding rules that some protocols cannot comply with because of how they\u2019re built.</p><p style='margin-bottom: 1.25em;'>The Commission\u2019s consultation closes Sept. 30, and what follows could determine whether lending vaults remain outside MiCA or become subject to a new regulatory framework.</p><p style='margin-bottom: 1.25em;'>For Brussels, the challenge is not simply whether to regulate DeFi lending; it\u2019s how to write rules that distinguish between very different forms of onchain lending and the people (if any) that actually exercise control over them.</p><p style='margin-bottom: 1.25em;'>Magazine: 200,000 fake AI \u2018victims\u2019 deployed to scam bait online fraudsters</p>"}, {"id": 11, "source": "Yahoo Finance", "category": "markets", "title": "How to Play Beyond Meat Stock After Its 30-for-1 Reverse Split", "link": "https://finance.yahoo.com/markets/stocks/articles/play-beyond-meat-stock-30-130002425.html", "iso_date": "2026-08-22T13:00:02+00:00", "date_str": "Aug 22 \u2022 01:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Beyond Meat (BYND) investors are entering a critical new chapter after the company completed its 1-for-30 reverse stock split, with split-adjusted trading beginning Aug. 14. The move was primarily aimed at helping the plant-based meat maker regain compliance with Nasdaq's $1 minimum bid-price requirement after a prolonged slide in its stock. Additionally, Beyond Meat needs to maintain a closing bid of at least $1 for 10 consecutive business days before the Aug. 31 deadline.</p><p style='margin-bottom: 1.25em;'>Each 30 pre-split shares were consolidated into one share, while Beyond Meat also reduced its authorized common shares from 3 billion to 100 million.</p><p style='margin-bottom: 1.25em;'>BYND remains a high-risk, high-volatility name, making post-split price action particularly important. Shares initially gained more than 10% on Aug. 14, closing at $13.47, but the stock subsequently faced renewed selling pressure.</p><p style='margin-bottom: 1.25em;'>Meanwhile, the reverse split does not change Beyond Meat's underlying fundamentals. The company continues to face weak demand, declining revenue and significant financial pressure. Given this backdrop, it remains to be seen whether the stock can hold its post-split gains, regain Nasdaq compliance and, more importantly, whether management can stabilize the underlying business.</p><p style='margin-bottom: 1.25em;'>About Beyond Meat Stock</p><p style='margin-bottom: 1.25em;'>Beyond Meat is a plant-based food company focused on developing and selling meat alternatives made from plant-based proteins, including burgers, sausages, nuggets, and other products. The company is headquartered in El Segundo, California, where it operates its corporate, research, and innovation facilities. Following its recent 1-for-30 reverse stock split and sharp share-price volatility, the company's market cap is now $241.9 million.</p><p style='margin-bottom: 1.25em;'>BYND has been under heavy pressure over the past year, reflecting a combination of weak demand, declining sales, and concerns about the company's financial position. The stock is down 42.89% year-to-date (YTD) and 80.57% over the past 52 weeks. The decline has been driven by continued weakness in the plant-based meat category, with reduced distribution and softer consumer demand weighing on sales.</p><p style='margin-bottom: 1.25em;'>The stock's collapse also pushed it below Nasdaq's $1 minimum bid requirement, prompting the company to execute a 1-for-30 reverse stock split effective Aug. 14.</p><p style='margin-bottom: 1.25em;'>Volatility has remained extreme since the split. BYND jumped 10.32% on Aug. 14 to $13.47, plunged 13.66% on Aug. 17 to $11.63 and rebounded 9.54% on Aug. 18 to $12.74. With shares still 93.8% below their 52-week high, BYND remains firmly in speculative-trading territory.</p><p style='margin-bottom: 1.25em;'>The stock is currently trading at just 0.73 times sales, which is a discount compared to industry peers and its own historical average.</p><p style='margin-bottom: 1.25em;'>Weak Financial Standing</p><p style='margin-bottom: 1.25em;'>Beyond Meat reported its second-quarter 2026 financial results on Aug. 5, for the quarter ended June 27. Net revenue fell 8.2% year-over-year (YOY) to $68.8 million. U.S. foodservice revenue declined 27.6% to $8 million from $11.1 million, as product volume fell 27.4% amid weak category demand and fewer distribution points. International retail provided a bright spot, with revenue rising 16.5% to $18.5 million from $15.9 million, driven by stronger burger and chicken sales in Europe and the U.K. and higher ground-beef sales in Canada.</p><p style='margin-bottom: 1.25em;'>Profitability remained challenging. Gross profit declined to $5.9 million from $7.9 million, while gross margin contracted to 8.5% from 10.6%. The operating loss improved to $30.8 million from $37.5 million, narrowing the operating margin to -44.8% from -50.0%. However, adjusted EBITDA loss widened to $27.7 million from $24.7 million, with the margin deteriorating to -40.2% from -33.0%.</p><p style='margin-bottom: 1.25em;'>The company swung to $16.4 million of net income, versus a $31.8 million net loss in Q2 2025, primarily because of a $57.7 million non-cash gain on debt extinguishment related to conversions of its 2030 Notes. Its EPS was a $0.06 loss, compared with a $0.42 loss a year earlier. Cash and restricted cash totaled $186.1 million, while debt stood at $323.8 million at quarter-end. For the six months, operating cash burn improved substantially to $23.2 million from $58.0 million, while capital expenditures fell to $4.0 million from $6.4 million.</p><p style='margin-bottom: 1.25em;'>For the third quarter, management provided a limited outlook because of elevated uncertainty and volatility, forecasting net revenue of approximately $60 million to $65 million. The range implies another sequential decline from Q2 and highlights the continuing challenges facing the core plant-based meat business.</p><p style='margin-bottom: 1.25em;'>Analysts forecast loss per share to improve 90% YOY to $13.81 for fiscal 2026, followed by an 8.7% improvement to $12.61 in 2027.</p><p style='margin-bottom: 1.25em;'>What Do Analysts Expect for Beyond Meat Stock?</p><p style='margin-bottom: 1.25em;'>Overall, BYND has a consensus \"Moderate Sell\" rating. Of the six analysts covering the stock, three analysts are on the sidelines, giving it a \"Hold\" rating, and three recommend a \"Strong Sell.\"</p><p style='margin-bottom: 1.25em;'>BYND's average analyst price target of $18.34 indicates an upside of 27.8%, while the Street-high target price of $30.03 suggests that the stock could rally as much as 109.3%.</p><p style='margin-bottom: 1.25em;'>On the date of publication, Subhasree Kar did not have (either directly or indirectly) positions in any of the securities mentioned in this article. All information and data in this article is solely for informational purposes. This article was originally published on Barchart.com</p>"}, {"id": 12, "source": "Yahoo Finance", "category": "markets", "title": "The Bond King Goes Bananas Over Nvidia's $500 Billion Move. How It May Be Affecting Your Portfolio.", "link": "https://finance.yahoo.com/markets/stocks/articles/bond-king-goes-bananas-over-130002636.html", "iso_date": "2026-08-22T13:00:02+00:00", "date_str": "Aug 22 \u2022 01:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>The title of the \"Bond King\" is somewhat in contention. Many would give it to Bill Gross, though over the years, a younger Jeffrey Gundlach has at least shared the title. In any case, when Gundlach posts something like this, it is worth . . . peeling back, shall we say?</p><p style='margin-bottom: 1.25em;'>Gundlach took aim at Wall Street's newest financial engineering trend. His beef? Nvidia's (NVDA) agreement with major private credit and asset management firms such as Apollo, BlackRock, Blackstone, KKR, and Goldman Sachs.</p><p style='margin-bottom: 1.25em;'>More News from Barchart</p><p style='margin-bottom: 1.25em;'>-       Nvidia Q2 Preview: Strong Earnings and Low Valuation Set the Stage for Upside</p><p style='margin-bottom: 1.25em;'>-       Third Point Starts to Raise Alarm Bells on Broadcom After Dumping AVGO Stock in Q2</p><p style='margin-bottom: 1.25em;'>-       A $28.7 Billion Reason to Buy SK hynix Stock Now</p><p style='margin-bottom: 1.25em;'>-       Tired of missing midday reversals? The FREE Barchart Brief newsletter keeps you in the know. Sign up now!</p><p style='margin-bottom: 1.25em;'>The consortium's goal is to fund massive artificial intelligence (AI) data center infrastructure and chip purchases by issuing long-term debt backed by the chips themselves as collateral. Gundlach calls out a glaring duration and depreciation mismatch.</p><p style='margin-bottom: 1.25em;'>And, while time will tell if he is right, I repeat to my audience weekly my own concerns that AI compute spending has reached the point where lofty expectations (via stock prices) cannot possibly be met. But hey, that's just the outcome, not the current excitement. There's a big difference, as we learned in both the dot-com bubble and more recently in the aftermath of the cryptocurrency runup.</p><p style='margin-bottom: 1.25em;'>Breaking Down Gundlach's Argument</p><p style='margin-bottom: 1.25em;'>At the heart of Gundlach's critique is that this is the type of collateral that spoils like bananas. That is, Nvidia's GPU product refresh cycles run on a fast 18-month to 24-month round trip.</p><p style='margin-bottom: 1.25em;'>Thus, issuing long-dated debt secured by hardware that may be technologically obsolete or vastly diminished in value in a few years creates a huge mismatch. One which, in the short attention span zone we all seem to live in nowadays, is going to be a big problem for tech investors \u2014 even if it's not right now. That is why Gundlach sarcastically compared securitizing GPUs to issuing a 30-year bond backed by \"warehouses of newly engineered bananas.\"</p><p style='margin-bottom: 1.25em;'>Gundlach noted in subsequent comments that when market tops form, they rarely ring a bell. Instead, they showcase financial innovation relying on dubious ratings to turn speculative tech capital expenditures into a pseudo-safe asset class.</p><p style='margin-bottom: 1.25em;'>Mark Cuban responded to that post in agreement, noting that \"chips as an asset class will be the new crypto.\" To me, it smacks of both 2008 and 1987, whereby financial magic turned into, well, rotten bananas.</p>"}, {"id": 13, "source": "Yahoo Finance", "category": "markets", "title": "India Leaves the Door Ajar for China\u2019s Investors", "link": "https://finance.yahoo.com/economy/policy/articles/india-leaves-door-ajar-china-123300050.html", "iso_date": "2026-08-22T12:33:00+00:00", "date_str": "Aug 22 \u2022 12:33 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>THE GIST</p><p style='margin-bottom: 1.25em;'>Our analysts just identified a stock with the potential to be the next Nvidia. Tell us how you invest and we'll show you why it's our #1 pick. Tap here.</p><p style='margin-bottom: 1.25em;'>New Delhi received 29 foreign direct investment proposals worth $500 million with one move: It decided to auto-approve investors from neighboring countries, like China, to hold non-controlling stakes of up to 10%.</p><p style='margin-bottom: 1.25em;'>WHAT HAPPENED</p><p style='margin-bottom: 1.25em;'>India's commerce and industry ministry said the 29 approved proposals, worth 48.95 billion rupees or about $511 million, span across a range of industries including information technology, artificial intelligence, manufacturing, pharmaceuticals, data centers and transport services.</p><p style='margin-bottom: 1.25em;'>A government decision in May allowed an automatic-approval route for investors from land-bordering countries holding non-controlling stakes of up to 10%.</p><p style='margin-bottom: 1.25em;'>Previously, any investment tied to a beneficial owner in a bordering nation, a rule aimed squarely at China after the 2020 border clashes, required full government sign-off, regardless of stake size.</p><p style='margin-bottom: 1.25em;'>Concurrently, New Delhi's forex reserve jump marked the third consecutive weekly increase. Foreign currency assets, the largest component, rose $7.2 billion to $581.9 billion, while gold reserves added $2.7 billion to $111.4 billion. A large contributor was foreign-currency deposit and swap scheme, which the government launched in June, and that scheme drew over $50 billion so far.</p><p style='margin-bottom: 1.25em;'>WHY IT MATTERS</p><p style='margin-bottom: 1.25em;'>One stock. Nvidia-level potential. 30M+ investors trust Moby to find it first. Get the pick. Tap here.</p><p style='margin-bottom: 1.25em;'>Both data points reflect the same underlying goal: deepening India's access to foreign capital without abandoning strategic caution. Reserves above $716 billion give the RBI substantially more room to defend the rupee against external shocks. This forex reserve rebuild follows a rough stretch.</p><p style='margin-bottom: 1.25em;'>Reserves had fallen from a record $728.5 billion in late February, as Middle East-driven oil volatility pressured the rupee and forced the RBI to sell dollars.</p><p style='margin-bottom: 1.25em;'>The FDI relaxation addresses a narrower but symbolically loaded problem. Chinese investment in India totaled just $2.5 billion between 2000 and 2025, even if India's trade deficit with China surpassed an estimated $116 billion in 2025.</p><p style='margin-bottom: 1.25em;'>After five years of blanket screening kept the Chinese capital mostly locked out, New Delhi suddenly turned around and realized that it was doing nothing to slow the flow of Chinese goods into India. It is now hoping that the 10%-stake captures some of that capital \u2014 particularly in manufacturing and tech supply chains \u2014 without reopening the door to control-seeking acquisitions.</p>"}, {"id": 14, "source": "Yahoo Finance", "category": "markets", "title": "The tax loophole that turns a Trump Account into tax-free millions \u2014 do you know how to exploit it?", "link": "https://finance.yahoo.com/economy/policy/articles/tax-loophole-turns-trump-account-123000413.html", "iso_date": "2026-08-22T12:30:00+00:00", "date_str": "Aug 22 \u2022 12:30 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>The tax loophole that turns a Trump Account into tax-free millions \u2014 do you know how to exploit it?</p><p style='margin-bottom: 1.25em;'>Clay Halton</p><p style='margin-bottom: 1.25em;'>6 min read</p><p style='margin-bottom: 1.25em;'>Moneywise and Yahoo Finance LLC may earn commission or revenue through links in the content below.</p><p style='margin-bottom: 1.25em;'>Trump Accounts officially went live this summer, giving millions of American children a new way to start investing before they're old enough to earn their first paycheck.</p><p style='margin-bottom: 1.25em;'>Created under President Donald Trump's 2025 One Big Beautiful Bill Act, the accounts began accepting contributions on July 4. Parents, guardians and other authorized adults can open one for any child under the age of 18 with a Social Security number, while U.S. citizen children born from 2025 through 2028 are also eligible for a one-time $1,000 contribution from the federal government (1).</p><p style='margin-bottom: 1.25em;'>JPMorgan sees gold hitting $5,000/oz by Q4 \u2014 and savvy investors are protecting their wealth with a tax-advantaged Gold IRA. Get your free guide from Priority Gold</p><p style='margin-bottom: 1.25em;'>Families and employers can generally contribute up to $5,000 per year, including as much as $2,500 from an employer. During the child's early years, the money must be invested in low-cost mutual funds or ETFs that track U.S. stock indexes, giving it years \u2014 potentially decades \u2014 to compound (2).</p><p style='margin-bottom: 1.25em;'>But not everyone is convinced Trump Accounts are the best place to put additional money.</p><p style='margin-bottom: 1.25em;'>Personal finance personality Dave Ramsey has called the accounts a \"political stunt\" and said they're \"not as revolutionary as the original Roth.\" His concerns include their limited investment choices, restrictions on accessing the money before adulthood and, perhaps most importantly, their tax treatment.</p><p style='margin-bottom: 1.25em;'>Unlike a Roth IRA, a Trump Account isn't automatically tax-free. Family contributions are generally made with after-tax dollars, but investment earnings grow tax-deferred. Government and employer contributions can also be taxable when the money eventually comes out.</p><p style='margin-bottom: 1.25em;'>There is, however, a way to potentially turn that early head start into decades of tax-free growth. The key is what happens when the child reaches adulthood.</p><p style='margin-bottom: 1.25em;'>How a Trump Account could become a tax-free fortune</p><p style='margin-bottom: 1.25em;'>Under IRS guidance, the special rules governing Trump Accounts largely disappear beginning Jan. 1 of the year the account holder turns 18. From that point, traditional IRA rules generally apply and the money can be transferred or rolled into another eligible retirement account (2).</p><p style='margin-bottom: 1.25em;'>That opens the door to a potentially powerful move: converting the money to a Roth IRA.</p><p style='margin-bottom: 1.25em;'>The IRS allows money in a traditional IRA to be converted to a Roth IRA through a rollover, trustee-to-trustee transfer or transfer within the same financial institution (3). Unlike making a normal Roth IRA contribution, a conversion doesn't require the account holder to have earned income and isn't subject to the usual Roth contribution income limits.</p><p style='margin-bottom: 1.25em;'>That distinction could make Trump Accounts particularly valuable.</p><p style='margin-bottom: 1.25em;'>Ordinarily, children without jobs can't contribute to an IRA because they don't have earned income. A Trump Account effectively allows investing to begin years earlier. Then, once traditional IRA rules take effect, some or all of that balance could potentially be converted to a Roth.</p><p style='margin-bottom: 1.25em;'>There is a catch: A Roth conversion can generate a tax bill. The portion of the account that hasn't already been taxed, including investment gains and certain government or employer contributions, is generally taxable when converted.</p><p style='margin-bottom: 1.25em;'>The goal, therefore, isn't necessarily to convert everything the moment the child turns 18. It's to find the years when converting is cheapest.</p><p style='margin-bottom: 1.25em;'>A teenager or young adult who has little taxable income could be in a much lower tax bracket than they will be later in their career. Families could potentially convert portions of the account over several low-income years rather than triggering a large tax bill all at once.</p><p style='margin-bottom: 1.25em;'>But there's another wrinkle to watch: the \"kiddie tax.\" Under current rules, more than $2,700 of unearned income can be subject to the parents' tax rate for children under 18, some 18-year-olds and certain full-time students under 24.</p><p style='margin-bottom: 1.25em;'>Because taxable retirement-account income can fall within the IRS definition of unearned income, making an aggressive Roth conversion while the kiddie tax still applies could wipe out much of the advantage of converting at the child's lower rate.</p><p style='margin-bottom: 1.25em;'>If the strategy works, however, the payoff can be enormous.</p><p style='margin-bottom: 1.25em;'>Consider a child whose family contributes $5,000 annually for 18 years. That's $90,000 in family contributions before counting the $1,000 government deposit or investment gains. The Wall Street Journal modeled a similar strategy and found that $90,000 invested during childhood could ultimately grow to more than $3 million by age 59\u00bd with a properly timed Roth conversion (5).</p><p style='margin-bottom: 1.25em;'>Once inside the Roth, qualified withdrawals in retirement can be tax-free. That means the biggest advantage may not be the $1,000 that Washington puts into an eligible child's account at birth. It could be using the account to give that child something ordinary retirement accounts generally can't provide: a nearly two-decade head start on retirement investing, followed by decades more of potentially tax-free compounding.</p><p style='margin-bottom: 1.25em;'>Using a Roth conversion to make the most of a Trump Account is one way to give your child a financial head start. But there are plenty of ways to make your money work harder in the meantime \u2014 whether that means getting more from your savings, putting spare cash to work in the market or getting expert help with your long-term financial plan.</p><p style='margin-bottom: 1.25em;'>Put your uninvested cash to work</p><p style='margin-bottom: 1.25em;'>One place to start putting your money to work is the cash you're not ready to invest. The money you're keeping for emergencies, upcoming expenses or other short-term needs doesn't have to sit in an account earning little interest while you wai
