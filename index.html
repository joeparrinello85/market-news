ntact or with the industry. Youth that didn\u2019t grow up in a resource community might still see mining as pickaxes and environmental destruction, while the reality is mines today use high technology and put an effort into being more socially and environmentally responsible.</p><p style='margin-bottom: 1.25em;'>\u201cYou don\u2019t have a new group of people coming in at the same time as metal prices are taking off and everybody wants to build a mine. So there\u2019s intense competition for labor right now,\u201d McEwen said.</p><p style='margin-bottom: 1.25em;'>Mining education</p><p style='margin-bottom: 1.25em;'>While there are still many programs and incentives to study mining, many students don\u2019t seem to see it as something they\u2019d like to pursue and build a career in.</p><p style='margin-bottom: 1.25em;'>MiHR reports that for the past 14 years, there has been a decline in enrollments in Canadian mining related programs, going from 1,400 in 2014 to 800 in 2020. From 2016 to 2020 enrollments continue to decrease 10% annually.</p><p style='margin-bottom: 1.25em;'>\u201cOur educational system is discouraging people from entering the industry. They view mining as a very environmentally destructive industry and should be shunned. So enrollment in mining schools, anything related to mining and geology fell precipitously in the last 20 years,\u201d McEwen said.</p><p style='margin-bottom: 1.25em;'>As youth unemployment sits at 12.6% in Canada, a career in mining might become more attractive to the rising generation that wants to beat those statistics.</p><p style='margin-bottom: 1.25em;'>The sector is expected to grow even more as demand grows for critical minerals, rare earth elements and battery metals to support innovation in many different areas, generating more job opportunities, especially for those who are just starting out and are interested in working in the sector for years to come.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 39, "source": "Cointelegraph", "category": "crypto", "title": "Digital Asset, Paul Ryan foundation target US state benefits with Canton pilot", "link": "https://cointelegraph.com/news/paul-ryan-foundation-digital-asset-plan-blockchain-based-benefits-pilot-on-canton?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 04:25 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Digital Asset, Paul Ryan foundation target US state benefits with Canton pilot</p><p style='margin-bottom: 1.25em;'>The RISE program would use the Canton Network to combine and distribute state-administered benefits across three US states beginning in 2027.</p><p style='margin-bottom: 1.25em;'>Digital Asset, the creator of the Canton Network, and former US House Speaker Paul Ryan\u2019s American Idea Foundation plan to pilot a blockchain-based system for distributing state-administered benefits across three US states using the Canton Network.</p><p style='margin-bottom: 1.25em;'>The RISE program is expected to launch in the first quarter of 2027 and would combine multiple benefits into monthly or twice-monthly payments, with spending rules applied to categories including food, child care and cash.</p><p style='margin-bottom: 1.25em;'>According to Friday\u2019s announcement, the system would automatically adjust benefit levels as household income changes and allow participating agencies to track payments, balances, spending and compliance data through Canton. Digital Asset said Canton would coordinate the rules, permissions and transactions used to distribute benefits while limiting access to sensitive information.</p><p style='margin-bottom: 1.25em;'>Ryan said the pilot is intended to reduce penalties that can occur as benefit recipients\u2019 incomes rise:</p><p style='margin-bottom: 1.25em;'>By combining fragmented benefits, reducing penalties as families earn more, and rigorously measuring results, these pilots can help show what a modern safety net should look like.</p><p style='margin-bottom: 1.25em;'>The companies did not name the participating states or specify which benefit programs would be included, and said the pilots remain subject to federal approval.</p><p style='margin-bottom: 1.25em;'>Related: FalconX, Interstice Connect Canton to Ethereum, Solana and Robinhood Chain</p><p style='margin-bottom: 1.25em;'>Canton expands government-linked use cases</p><p style='margin-bottom: 1.25em;'>The RISE program could add a public-benefits use case to Canton, whose recent growth has largely centered on institutional finance, including projects involving government securities.</p><p style='margin-bottom: 1.25em;'>In April, Japan Securities Clearing Corporation, Mizuho, Nomura and Digital Asset launched a proof of concept using Canton to test Japanese government bonds as digital collateral, including for real-time, cross-border transactions. The project was selected for support under Japan\u2019s Financial Services Agency Payment Innovation Project.</p><p style='margin-bottom: 1.25em;'>Canton was also used in July to settle a tokenized US Treasury trade between Franklin Templeton and Virtu Financial, with Tradeweb handling execution and price discovery. The Treasury changed hands against USDCx in real time, which Tradeweb described as an industry first.</p><p style='margin-bottom: 1.25em;'>Canton\u2019s native Canton Coin (CC), which is used to pay fees for transactions through the network\u2019s Global Synchronizer, has a market capitalization of about $4.1 billion and ranks 23rd among cryptocurrencies, according to CoinGecko data. CC is up around 10% over the past week.</p><p style='margin-bottom: 1.25em;'>Source: CoinGecko</p><p style='margin-bottom: 1.25em;'>Magazine: MiCA cracks down on USDT in Europe... but no one else cares</p>"}, {"id": 40, "source": "Yahoo Finance", "category": "markets", "title": "Bitcoin and ethereum prices today, Friday, August 21, 2026: Cryptos continue rally sparked by Treasury repurchase announcement", "link": "https://finance.yahoo.com/personal-finance/investing/article/bitcoin-and-ethereum-prices-today-friday-august-21-2026-cryptos-continue-rally-sparked-by-treasury-repurchase-announcement-161633891.html", "date_str": "Aug 21 \u2022 04:16 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Some offers on this page are from advertisers who pay us, which may affect which products we write about, but not our recommendations. See our Advertiser Disclosure.</p><p style='margin-bottom: 1.25em;'>Bitcoin (BTC-USD) opened at $73,013 on Friday, August 21, 2026, 5.4% higher than Thursday's opening price. As of 9:08 a.m. ET this morning, the price of bitcoin moved up to $77,307.95.</p><p style='margin-bottom: 1.25em;'>Ethereum (ETH-USD) opened at $2,326.60 on Friday, August 21, 2026, up 3.3% from Thursday's opening price. The price of ethereum moved higher this morning to $2,390.81 as of 9:08 a.m. ET.</p><p style='margin-bottom: 1.25em;'>Bitcoin and ethereum prices continued to rise Friday morning. The Treasury announcement to buy back more long-term debt and President Trump's recent call to pass crypto legislation sparked the rally. U.S. Treasury debt repurchases inject liquidity into financial markets and suppress long-term bond yields. Lower yields free up investor cash and prompt greater appetite for risk \u2014 which benefits cryptocurrencies and other volatile assets.</p><p style='margin-bottom: 1.25em;'>Current price of bitcoin and ethereum</p><p style='margin-bottom: 1.25em;'>Bitcoin</p><p style='margin-bottom: 1.25em;'>The price of bitcoin this morning was 5.4% higher than Thursday's opening price. Here's a look at how the opening bitcoin price has changed versus last week, month, and year:</p><p style='margin-bottom: 1.25em;'>-       One week ago: +15.2%</p><p style='margin-bottom: 1.25em;'>-       One month ago: +11.9%</p><p style='margin-bottom: 1.25em;'>-       One year ago: -36.1%</p><p style='margin-bottom: 1.25em;'>The all-time high for bitcoin was $126,198.07 on Oct. 6, 2025. The all-time low value for bitcoin was $0.04865 on July 14, 2010.</p><p style='margin-bottom: 1.25em;'>Ethereum</p><p style='margin-bottom: 1.25em;'>The price of ethereum this morning was 3.3% higher than Thursday's open. Here's a look at how the opening ethereum price has changed versus last week, month, and year:</p><p style='margin-bottom: 1.25em;'>-       One week ago: +23.5%</p><p style='margin-bottom: 1.25em;'>-       One month ago: +22.2%</p><p style='margin-bottom: 1.25em;'>-       One year ago: -46.3%</p><p style='margin-bottom: 1.25em;'>The all-time high for ethereum was $4,953.73 on Aug. 24, 2025. The all-time low value for ethereum was $0.4209 on Oct. 21, 2015.</p><p style='margin-bottom: 1.25em;'>Bitcoin, ethereum, and other cryptocurrencies are rapidly evolving. Follow the latest developments from Yahoo Finance and others here.</p><p style='margin-bottom: 1.25em;'>Can you buy your next house with crypto?</p><p style='margin-bottom: 1.25em;'>So, you put a little mad money into bitcoin a few years ago. Now, your crypto-fueled profit means you have a sweet nest egg to put toward a house.</p><p style='margin-bottom: 1.25em;'>But can you buy a house with crypto rather than using cash or a traditional mortgage loan? What are the roadblocks? And what about taxes?</p><p style='margin-bottom: 1.25em;'>President Trump wants the United States to be \"the crypto capital of the world.\" In that spirit, in late June, Director of the Federal Housing Finance Agency (FHFA) William J. Pulte ordered Fannie Mae and Freddie Mac to \"prepare their businesses to count cryptocurrency as an asset for a mortgage.\"</p><p style='margin-bottom: 1.25em;'>The FHFA supervises Fannie Mae and Freddie Mac, the government-sponsored companies that fund a major portion of the mortgage industry.</p><p style='margin-bottom: 1.25em;'>Pulte said the housing system \"needs a massive upgrade,\" adding, \"I want people who own cryptocurrency to be able to buy homes like everyone else. I believe cryptocurrency is an asset. I believe Americans should be able to use their crypto if they want to. It's time the housing system caught up.\"</p><p style='margin-bottom: 1.25em;'>This signals what could be a fundamental change to how cryptocurrency may be used to qualify for a mortgage.</p><p style='margin-bottom: 1.25em;'>Learn more: Want to buy a house with crypto? Here's what to expect.</p><p style='margin-bottom: 1.25em;'>Bitcoin and ethereum price charts</p><p style='margin-bottom: 1.25em;'>Whether you're brand new to tracking the value of bitcoin and ethereum or a more seasoned crypto investor, Yahoo Finance's price-of-bitcoin chart and price-of-ethereum chart below show a visual history of how the currencies' value continues to move and evolve.</p><p style='margin-bottom: 1.25em;'>More information on crypto from the Yahoo Finance team:</p>"}, {"id": 41, "source": "Cointelegraph", "category": "crypto", "title": "Bitcoin rally sends crypto stocks soaring as miners, treasury companies jump", "link": "https://cointelegraph.com/markets/bitcoin-rally-crypto-stocks-canaan-strive-metaplanet?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 04:11 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitcoin rally sends crypto stocks soaring as miners, treasury companies jump</p><p style='margin-bottom: 1.25em;'>Bitcoin\u2019s rally above $79,000 lifted miners and treasury companies, with Canaan, Strive and Metaplanet posting double-digit gains as crypto stocks surged.</p><p style='margin-bottom: 1.25em;'>Shares of Bitcoin miners and digital asset treasury companies surged toward the end of the week, tracking a broader rally across crypto markets after the US Treasury announced it would double certain long-dated bond buybacks \u2014 a move aimed at supporting liquidity in the Treasury market that also helped bolster risk appetite.</p><p style='margin-bottom: 1.25em;'>Bitcoin (BTC) miner Canaan led crypto-related stocks on Friday, rising more than 25%. MARA Holdings edged higher after gaining nearly 16% during Thursday\u2019s session.</p><p style='margin-bottom: 1.25em;'>Strive, which holds more than 20,000 Bitcoin (BTC) on its balance sheet, jumped more than 16% on Friday. Japan-listed Metaplanet, which recently expanded its Bitcoin treasury strategy by acquiring Nasdaq-listed Super League Enterprise, also gained more than 16%.</p><p style='margin-bottom: 1.25em;'>Shares of crypto exchange Coinbase and brokerage platform Robinhood posted double-digit percentage gains, underscoring how BTC\u2019s recovery spilled over into publicly traded companies with direct exposure to digital assets.</p><p style='margin-bottom: 1.25em;'>Crypto-related stocks were rallying as Bitcoin extended its weekly gain to more than 23% on Friday, briefly topping $79,000, according to CoinMarketCap data. Ether (ETH) gained nearly 30% over the same period, climbing above $2,400.</p><p style='margin-bottom: 1.25em;'>Related: Crypto Biz: Treasury\u2019s \u2018Not-QE\u2019 playbook sends Bitcoin higher</p><p style='margin-bottom: 1.25em;'>Trump adds regulatory tailwinds to crypto rally</p><p style='margin-bottom: 1.25em;'>Digital asset markets also drew support from comments by US President Donald Trump on Thursday, when he renewed calls for Congress to advance the CLARITY Act. The legislation remains stalled after lawmakers failed to move it forward before the August recess.</p><p style='margin-bottom: 1.25em;'>The bill is viewed as a potentially significant step toward establishing a clearer regulatory framework for digital assets in the United States, including defining the respective oversight roles of the Commodity Futures Trading Commission and Securities and Exchange Commission.</p><p style='margin-bottom: 1.25em;'>Trump also revived the prospect of the US government acquiring Bitcoin at a \u201csizable\u201d scale following meetings with crypto industry leaders this week.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin ETFs draw $517M in largest one-day inflow since early May</p>"}, {"id": 42, "source": "Cointelegraph", "category": "crypto", "title": "Crypto Biz: Treasury\u2019s \u2018Not-QE\u2019 playbook sends Bitcoin higher", "link": "https://cointelegraph.com/news/crypto-biz-treasurys-not-qe-playbook-sends-bitcoin-higher?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 03:50 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Crypto Biz: Treasury\u2019s \u2018Not-QE\u2019 playbook sends Bitcoin higher</p><p style='margin-bottom: 1.25em;'>Bitcoin rallied as Treasury bond buybacks fueled the \u201cnot-QE\u201d trade, while Metaplanet expanded to the US and Cypherpunk made a $33 million Zcash mining bet.</p><p style='margin-bottom: 1.25em;'>Bitcoin and the broader digital asset market got a taste of \u201cnot-QE\u201d this week \u2014 and liked it.</p><p style='margin-bottom: 1.25em;'>The price of Bitcoin (BTC) jumped more than 23% toward $79,000 and Ether\u2019s price crossed $2,400 after the US Treasury moved to double certain long-dated bond buybacks, adding fuel to an increasingly important question for digital asset markets. If Washington keeps finding new ways to support liquidity without technically embarking on quantitative easing, could Bitcoin and other risk assets become some of the biggest beneficiaries?</p><p style='margin-bottom: 1.25em;'>That question is already shaping business decisions across crypto. Standard Chartered sees Bitcoin heading toward $100,000, Metaplanet is taking its Bitcoin treasury strategy to the US and Cypherpunk Technologies is making a $33 million bet on Zcash mining.</p><p style='margin-bottom: 1.25em;'>Standard Chartered analyst sees Bitcoin reaching $100,000 as Treasury buybacks expand</p><p style='margin-bottom: 1.25em;'>Standard Chartered analyst Geoff Kendrick said Bitcoin could reach $100,000 by year-end as the US Treasury doubles long-end bond buybacks, a move he described as \u201cexactly the type of thing Bitcoin loves.\u201d</p><p style='margin-bottom: 1.25em;'>Kendrick said in a client note that BTC\u2019s key technical level is $65,500 and breaking above it could confirm the cycle low is in. He cited Wednesday\u2019s Treasury plan to at least double buyback operations for 10- to 20-year and 20- to 30-year coupons. Long-dated yields fell, and Bitcoin\u2019s price immediately climbed more than 6% to nearly $69,000, its highest since early June, per CoinMarketCap.</p><p style='margin-bottom: 1.25em;'>The expanded program runs Sept. 9 through Nov. 4. Kendrick argues Bitcoin tends to benefit from government liquidity interventions and its fixed supply resists monetary debasement. The call still depends on BTC holding above $65,500. Without that, the cycle low cannot be confirmed.</p><p style='margin-bottom: 1.25em;'>Metaplanet expands Bitcoin treasury strategy to US with Super League deal</p><p style='margin-bottom: 1.25em;'>Metaplanet plans to take a controlling stake in Nasdaq-listed Super League Enterprise, expanding its Bitcoin treasury strategy to the US.</p><p style='margin-bottom: 1.25em;'>The Tokyo firm will contribute 2,100 BTC and $2.5 million in cash to Super League, which will be renamed Superplanet. That BTC, worth roughly $145 million, is under 5% of Metaplanet\u2019s 43,000 holdings and comes from existing treasury, not new purchases. CEO Simon Gerovich said the structure gives two capital-raising avenues: Superplanet in US markets and Metaplanet in Japan. Shares of Super League surged over 50% on the news.</p><p style='margin-bottom: 1.25em;'>The deal is expected to close in the fourth quarter, subject to shareholder approval and customary conditions.</p><p style='margin-bottom: 1.25em;'>Cypherpunk launches Zcash mining fleet controlling 18% of network hashrate</p><p style='margin-bottom: 1.25em;'>Cypherpunk Technologies is expanding into Zcash (ZEC) mining after acquiring a fleet from Winklevoss Capital in a $33.33 million equity deal, giving the publicly traded firm roughly 18% of the network\u2019s hashrate.</p><p style='margin-bottom: 1.25em;'>The mining operation is already online at US facilities, producing about 4.2 GSol/s, or roughly 18% of Zcash\u2019s current hashrate. Cypherpunk also holds 323,394 ZEC, about 1.9% of circulating supply, and targets 5% ownership. It has pitched Zcash mining as offering more attractive economics than Bitcoin mining or AI data center workloads.</p><p style='margin-bottom: 1.25em;'>However, those economics depend heavily on ZEC\u2019s price, network hashrate, mining difficulty, and operating costs. The push follows a rally that saw the price of ZEC rise more than 1,300% over 12 months, though it has since corrected. The network implemented its Ironwood upgrade on July 28 to replace the Orchard pool after a flaw that could have allowed counterfeit ZEC creation, though no exploitation was ever detected.</p><p style='margin-bottom: 1.25em;'>CFTC seeks comment on AI compute futures as CME eyes October launch</p><p style='margin-bottom: 1.25em;'>The US Commodity Futures Trading Commission (CFTC) is seeking public comment on futures contracts tied to AI computing capacity, a step that could shape an emerging market for trading and hedging the cost of computing power.</p><p style='margin-bottom: 1.25em;'>Bloomberg reported Monday that the regulator sent a request for comment to the White House Office of Management and Budget. CME Group announced last week it plans to launch two compute futures contracts on Oct. 5, pending regulatory approval, with Silicon Data providing the benchmarks. Estimates from TD Lombard, Goldman Sachs and Bridgewater Associates put AI infrastructure spending at roughly 2% to 2.5% of US GDP this year.</p><p style='margin-bottom: 1.25em;'>The review could complicate the timeline for planned compute products from CME Group and Intercontinental Exchange, which remain subject to regulatory approval. Once the White House review is complete, the CFTC is expected to open a comment period, typically lasting 30 or 60 days, according to Bloomberg.</p><p style='margin-bottom: 1.25em;'>Crypto Biz is your weekly pulse on the business behind blockchain and crypto, delivered directly to your inbox every Thursday.</p>"}, {"id": 43, "source": "Mining.com", "category": "metals", "title": "Europe relies increasingly on Russia for uranium needs, Sprott says", "link": "https://www.mining.com/europe-relies-increasingly-on-russia-for-uranium-needs-sprott-says/", "date_str": "Aug 21 \u2022 03:35 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Europe relies increasingly on Russia for uranium needs, Sprott says</p><p style='margin-bottom: 1.25em;'>European reliance on Russian nuclear fuel increased in 2025 despite efforts to diversify its uranium supply after Russia\u2019s invasion of Ukraine, Sprott Asset Management said in a new report this week.</p><p style='margin-bottom: 1.25em;'>Russian uranium deliveries to EU utilities rose 7%, conversion deliveries rose 9% and uranium enrichment sales gained by 12% last year, Jacob White, director of ETF Product Management wrote in the report titled \u201cOn the Cusp of a New Contracting Cycle.\u201d</p><p style='margin-bottom: 1.25em;'>\u201cEuropean utilities must secure alternative uranium supply and fuel-processing capacity to replace Russian material, increasing competition for production from Western and allied suppliers just as existing contracts begin to roll off,\u201d White said.</p><p style='margin-bottom: 1.25em;'>Competition for uranium</p><p style='margin-bottom: 1.25em;'>Kazakhstan, the world\u2019s top uranium producer, will be central to that competition and in 2025 provided 20% of the uranium delivered to EU utilities, White noted. However, a \u201csignificant share\u201d of the Central Asian country\u2019s output is already destined for China, Russia and increasingly India under long-term contracts.</p><p style='margin-bottom: 1.25em;'>The numbers reveal the vulnerability of the West\u2019s nuclear revival as governments turn to atomic power for reliable electricity and greater energy security. But expanding reactor fleets will also require additional Western uranium mining, conversion and enrichment capacity to reduce dependence on Russia.</p><p style='margin-bottom: 1.25em;'>Russia\u2019s share of European uranium market supply is significant, at 16% overall, 24% of conversion and 23% of enrichment, the report said.</p><p style='margin-bottom: 1.25em;'>A similar dependence affects the United States, which imports the majority of its uranium needs from Canada, Kazakhstan, Australia and Russia. Kazakhstan supplied 28% of the uranium delivered to U.S. utilities last year.</p><p style='margin-bottom: 1.25em;'>Contracting conundrum</p><p style='margin-bottom: 1.25em;'>Through Aug. 10, about 37 million lb. of uranium oxide have been contracted globally for 2026, marking the 14th consecutive year of utilities signing long-term supply contracts for less uranium than they\u2019re consuming.</p><p style='margin-bottom: 1.25em;'>That\u2019s due to utilities benefitting from favourable terms in legacy contracts that gave flexible options, permitting them to increase uranium delivery loads. But as legacy contracts expire that supply buffer will go away and annual contracting below consumption levels defers future demand.</p><p style='margin-bottom: 1.25em;'>\u201cUtilities can defer purchasing, but they cannot shorten the time required to develop a new uranium supply,\u201d White said. \u201cUtilities can return to the market relatively quickly once they decide to purchase. Producers cannot respond on the same timeline,\u201d and their operations take years to bring to production.</p><p style='margin-bottom: 1.25em;'>But producers aren\u2019t likely to reserve long-term delivery unless contract prices compensate them for development costs, inflation and project risks.</p><p style='margin-bottom: 1.25em;'>White noted that Cameco (TSX: CCO)(NYSE: CCJ), in its July earnings call described the uranium market as still in the early stages of a contracting cycle, though the long-term uranium price is already at $94 per lb., its highest in 18 years.</p><p style='margin-bottom: 1.25em;'>Broad demand rise</p><p style='margin-bottom: 1.25em;'>Aside from new reactor construction, another source of uranium demand is existing reactors whose lives have been extended or that have been restarted.</p><p style='margin-bottom: 1.25em;'>\u201cUprates will also increase future uranium demand as utilities look to generate more electricity with the current fleet of reactors,\u201d White said.</p><p style='margin-bottom: 1.25em;'>That trend comes alongside conventional reactors advancing towards operation, especially in China, while India announced in July it plans to spend more than $2 billion on at least five small modular reactors by 2033.</p><p style='margin-bottom: 1.25em;'>Those developments point to more uranium consumption in the coming years, Sprott said.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 44, "source": "Mining.com", "category": "metals", "title": "Gold price gets US bond policy boost", "link": "https://www.mining.com/gold-price-gets-us-bond-policy-boost/", "date_str": "Aug 21 \u2022 03:01 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Gold price gets US bond policy boost</p><p style='margin-bottom: 1.25em;'>Gold\u2019s surge to about $4,600 per oz. this week may have further to run if US policymakers increasingly intervene to hold down long-term borrowing costs, according to the World Gold Council.</p><p style='margin-bottom: 1.25em;'>Bullion climbed to a three-month high Friday after the United States Treasury unexpectedly expanded purchases of longer-dated government bonds, weakening the US dollar and reinforcing investor concerns over Washington\u2019s growing debt burden \u2014 which hit $40 trillion just this week after doubling in less than a decade.</p><p style='margin-bottom: 1.25em;'>The Treasury announced Aug. 19 that it would double buybacks of longer-dated Treasuries after yields climbed to their highest levels in years. The move immediately pushed bond yields and the dollar lower while sending spot gold up more than 3% to nearly $4,500 per oz., its biggest one-day gain since February. By Friday, bullion had climbed above $4,600, extending its rally to a third straight week.</p><p style='margin-bottom: 1.25em;'>Cambridge University economist Mohamed El-Erian said the Treasury\u2019s action was \u201cnot yield-curve control (YCC) but it might be a step in that direction,\u201d a view highlighted by the World Gold Council in a report on Friday examining what the policy shift could mean for bullion investors.</p><p style='margin-bottom: 1.25em;'>The council argues that the Treasury\u2019s announcement reflects a deeper challenge confronting US financial markets. Persistent fiscal deficits require ever-larger bond issuance while a rapidly expanding stock of outstanding debt must also be refinanced. At the same time, some of the market\u2019s traditional buyers are becoming less dependable. Foreign central banks are diversifying reserves, and investors abroad have alternatives offering attractive returns.</p><p style='margin-bottom: 1.25em;'>Hedge funds</p><p style='margin-bottom: 1.25em;'>Banks remain constrained by capital rules and corporate borrowing tied to artificial intelligence and data-centre construction is competing for investor capital, said Johan Palmberg, senior quantitative analyst at the World Gold Council. A growing share of Treasury demand now comes from more price-sensitive investors such as hedge funds.</p><p style='margin-bottom: 1.25em;'>Those pressures have left investors demanding higher compensation for holding long-dated government debt, Palmberg said. The recent rise in Treasury yields suggests markets no longer assume Washington\u2019s expanding debt supply will be absorbed effortlessly, he said. Instead, the balance between supply and demand is becoming an increasingly important driver of bond prices.</p><p style='margin-bottom: 1.25em;'>If market pressures continue, policymakers could eventually consider yield-curve control, under which the US Federal Reserve would buy bonds to cap longer-term interest rates directly, he said. While the Treasury\u2019s approach is being presented as a market-functioning measure, Palmberg suggested the distinction could become blurred.</p><p style='margin-bottom: 1.25em;'>\u201cJust because it walks like a duck and quacks like a duck, doesn\u2019t mean it\u2019s a duck,\u201d he wrote. \u201cIt\u2019s monetary policy\u2019s version of plausible deniability.\u201d</p><p style='margin-bottom: 1.25em;'>The policy was used in the United States during the 1940s and has also been adopted in recent years by Japan and Australia. Unlike quantitative easing, which targets the quantity of bonds purchased and substantially expands a central bank\u2019s balance sheet, yield-curve control targets a specific interest rate and can require much less intervention if markets believe policymakers will defend the ceiling.</p><p style='margin-bottom: 1.25em;'>How gold benefits</p><p style='margin-bottom: 1.25em;'>For gold investors, Palmberg sees three principal benefits if the United States eventually moves in that direction. First, yield-curve control would probably weaken the US dollar by shifting the adjustment away from bond markets and into the currency.</p><p style='margin-bottom: 1.25em;'>\u201cThe expensive US dollar is already facing pressure from several corners and YCC . . . could increasingly force the adjustment through the currency rather than the bond market,\u201d he wrote.</p><p style='margin-bottom: 1.25em;'>Because gold is priced in US dollars, a weaker greenback generally makes bullion cheaper for buyers using other currencies and tends to support prices.</p><p style='margin-bottom: 1.25em;'>Second, capping government bond yields while inflation remains elevated would likely reduce real interest rates. Gold has historically performed well when inflation-adjusted bond yields decline because the opportunity cost of holding a non-yielding asset falls.</p><p style='margin-bottom: 1.25em;'>Third, investors could increasingly view gold as protection against what economists call financial repression \u2014 governments holding borrowing costs below market levels to make debt more manageable.</p><p style='margin-bottom: 1.25em;'>Uncertainty</p><p style='margin-bottom: 1.25em;'>\u201cA Treasury market that clears at an administratively influenced price brings uncertainty because investors don\u2019t know where yields would settle absent intervention,\u201d Palmberg wrote. He added that \u201cmarkets can be relentless. It doesn\u2019t require aggressive short sellers . . . just an absence of buyers.\u201d</p><p style='margin-bottom: 1.25em;'>Palmberg cautioned that the outcome would not necessarily be uniformly positive for bullion. A credible and temporary yield-curve control program could restore confidence in bond markets, compress risk premiums and reduce safe-haven demand for gold despite lower yields.</p><p style='margin-bottom: 1.25em;'>History also suggests such policies can be difficult to maintain. The US experience in the 1940s eventually collided with rising inflation and questions over Federal Reserve independence. Even so, Palmberg believes the broader investment case for gold remains intact.</p><p style='margin-bottom: 1.25em;'>\u201cThe debt mountain concern . . . remains one of the pillars of gold demand and any attempts to manage that burden not involving a reduction of debt or deficits are likely to continue favouring gold.\u201d</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 45, "source": "Cointelegraph", "category": "crypto", "title": "Solana cuts blockchain slot time to 350 milliseconds", "link": "https://cointelegraph.com/news/solana-cuts-blockchain-slot-time-350-milliseconds?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 01:45 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Solana cuts blockchain slot time to 350 milliseconds</p><p style='margin-bottom: 1.25em;'>Solana reduced its slot time for the first time since genesis as it works toward a 200-millisecond target aimed at reducing network latency.</p><p style='margin-bottom: 1.25em;'>Solana reduced its slot time to 350 milliseconds, marking the first such reduction since the inception of the network, according to the Solana Foundation\u2019s vice president of technology, Jacob Creech.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019re in a new era of 350ms. Next stop, 300ms,\u201d Creech said in a Friday X post.</p><p style='margin-bottom: 1.25em;'>Average slot times on Solana stood at 360ms at press time, down from the network\u2019s original 400ms target, according to the Solana slot time explorer.</p><p style='margin-bottom: 1.25em;'>In June, the Solana Foundation shared plans to reduce slot times from 400ms to 200ms, arguing that it would improve latency and accelerate confirmations on the blockchain network. Three further 50ms reductions are planned.</p><p style='margin-bottom: 1.25em;'>All four stages are targeted for mainnet activation in Agave v4.2, a validator client developed by Anza, though the schedule is tentative.</p><p style='margin-bottom: 1.25em;'>SIMD-0525, the proposal establishing the shorter slot times, was approved and merged on May 14.</p><p style='margin-bottom: 1.25em;'>Magazine: Efforts to bulletproof Ethereum are paying off in user metrics</p>"}, {"id": 46, "source": "Cointelegraph", "category": "crypto", "title": "Laser Digital gets Japan\u2019s first crypto exchange approval in 4 years", "link": "https://cointelegraph.com/news/nomuras-laser-digital-japans-first-crypto-exchange-4-years?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 01:08 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Laser Digital gets Japan\u2019s first crypto exchange approval in 4 years</p><p style='margin-bottom: 1.25em;'>Nomura-backed Laser Digital Japan received registration to provide domestic liquidity before expanding into institutional crypto trading.</p><p style='margin-bottom: 1.25em;'>Nomura Group\u2019s digital asset subsidiary, Laser Digital, received authorization to operate as a crypto asset exchange service provider under Japan\u2019s Payment Services Act (PSA)</p><p style='margin-bottom: 1.25em;'>A list issued by Japan\u2019s Financial Services Agency (FSA) on Friday showed that Laser Digital received the country\u2019s first crypto exchange license in four years. The last platform to receive FSA authorization was Binance Japan in October 2022.</p><p style='margin-bottom: 1.25em;'>Japan\u2019s crypto market is entering a \u201cnew phase of maturity,\u201d creating a need for \u201ctrusted counterparties and infrastructure\u201d as \u201cinstitutional investors increase their interest in this asset class,\u201d Jez Mohideen, co-founder and CEO of Laser Digital, said in a Friday press release.</p><p style='margin-bottom: 1.25em;'>In July, Japan\u2019s parliament passed revisions that classify crypto assets as financial assets under Japan\u2019s Financial Instruments and Exchange Act (FIEA).</p><p style='margin-bottom: 1.25em;'>The revisions will move regulation of crypto transactions away from the PSA, where digital assets are currently treated primarily as payment instruments, and introduce insider trading rules and stronger oversight for crypto businesses. The crypto provisions will take effect on a date set by Cabinet order within one year of the amendments\u2019 July 23 promulgation.</p><p style='margin-bottom: 1.25em;'>Japanese Finance Minister Satsuki Katayama signaled the intent to bring crypto under the same umbrella as traditional finance assets in January, to ensure that citizens will \u201cbenefit from digital and blockchain-based assets.\u201d</p><p style='margin-bottom: 1.25em;'>Magazine: How Hong Kong is turning tokenized bonds into real market infrastructure</p>"}, {"id": 47, "source": "Cointelegraph", "category": "crypto", "title": "Binance says employees questioned in UAE cleared and released", "link": "https://cointelegraph.com/news/binance-employees-questioned-uae-released?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 12:48 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Binance says employees questioned in UAE cleared and released</p><p style='margin-bottom: 1.25em;'>Binance\u2019s employees were cleared and released after providing statements to UAE authorities about third-party fund flows through a company client account, a spokesperson told Cointelegraph.</p><p style='margin-bottom: 1.25em;'>Binance employees detained in the United Arab Emirates were cleared and released after providing statements about third-party fund flows through a company client money account, a spokesperson for the exchange told Cointelegraph.</p><p style='margin-bottom: 1.25em;'>The New York Times reported Thursday that two Binance employees were detained after being stopped at airports in the UAE amid police inquiries into possible financial crimes involving the exchange.</p><p style='margin-bottom: 1.25em;'>The employees were not the targets or subjects of what Binance described as \u201croutine inquiries.\u201d</p><p style='margin-bottom: 1.25em;'>\u201cCryptocurrency and the mechanics of institutional client money accounts remain emerging concepts in many jurisdictions; we are working constructively with Dubai Police and authorities across other Emirates to establish clear, appropriate coordination procedures,\u201d the spokesperson said.</p><p style='margin-bottom: 1.25em;'>In 2024, Nigerian authorities detained Tigran Gambaryan, then Binance\u2019s head of financial crime compliance, for eight months while he faced money laundering charges.</p><p style='margin-bottom: 1.25em;'>By October 2024, the Nigerian government had dopped all charges against Gambaryan.</p><p style='margin-bottom: 1.25em;'>Magazine: How the EU\u2019s crypto tax rules are expected to work for users and platforms</p>"}, {"id": 48, "source": "Mining.com", "category": "metals", "title": "Bunker Hill to buy Silver47 in $163M all-stock deal", "link": "https://www.mining.com/bunker-hill-to-buy-silver47-in-163m-all-stock-deal/", "date_str": "Aug 21 \u2022 12:12 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bunker Hill to buy Silver47 in $163M all-stock deal</p><p style='margin-bottom: 1.25em;'>Bunker Hill Mining (TSX: BNKR; OTCQB: BHLL) is buying Silver47 Exploration (TSX-V: AGA; OTCQX: AAGA) in an all-stock deal valued at about $163 million, creating a larger US-focused silver and critical minerals company.</p><p style='margin-bottom: 1.25em;'>Silver47 shareholders will receive 0.1724 Bunker Hill common shares for each share held, Bunker Hill said Friday. The offer represents a 38% premium to Silver47\u2019s Thursday close and about a 30% premium to its 20-day volume-weighted average price.</p><p style='margin-bottom: 1.25em;'>\u201cAs Bunker Hill advances towards commercial production targeted in the fourth quarter of 2026, we are very excited to partner with Silver47,\u201d Bunker Hill executive chairman Richard Williams said. \u201cThis is a \u2018Made in America\u2019 transaction at a time when the US domestic mining industry, its investors and the users of US metals need new, ambitious leaders capable of safely building and operating profitable mines.\u201d</p><p style='margin-bottom: 1.25em;'>The transaction pairs Bunker Hill\u2019s namesake mine in Idaho\u2019s Silver Valley with Silver47\u2019s exploration and development portfolio spanning Alaska, Nevada and New Mexico. It comes as Bunker Hill works towards commercial production later this year and Silver47 shares remain under pressure, having fallen nearly 36% since the start of 2026.</p><p style='margin-bottom: 1.25em;'>Growth platform</p><p style='margin-bottom: 1.25em;'>The combined company will be named Bunker Hill Silver, with existing Bunker Hill shareholders owning 57% and Silver47 investors holding the remaining 43%.</p><p style='margin-bottom: 1.25em;'>Silver47 executive chairman Gary Thompson said combining his company\u2019s exploration portfolio and capabilities with Bunker Hill\u2019s mine-building and operating track record would provide a strong foundation for the growth-focused company.</p><p style='margin-bottom: 1.25em;'>Silver47 shares closed Thursday at C$0.67 ($0.49), setting the reference price for Bunker Hill\u2019s takeover premium.</p><p style='margin-bottom: 1.25em;'>The companies expect to complete the transaction in November, after which the combined company is expected to continue trading on the Toronto Stock Exchange.</p><p style='margin-bottom: 1.25em;'>Fresh funding</p><p style='margin-bottom: 1.25em;'>Bunker Hill has also secured about $11 million in new financing from existing partners as it moves towards commercial production.</p><p style='margin-bottom: 1.25em;'>The funding includes a $10-million concentrate prepayment facility with Ocean Partners UK and a $1-million draw under Bunker Hill\u2019s standby facility with Teck Resources.</p><p style='margin-bottom: 1.25em;'>The financing gives Bunker Hill additional capital ahead of the proposed merger while the enlarged company positions its Idaho mine and Silver47\u2019s US exploration assets as a broader domestic silver and critical minerals platform.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 49, "source": "Cointelegraph", "category": "crypto", "title": "Standard Chartered wavers on $100K Bitcoin year-end call, says it may be \u2018too low\u2019", "link": "https://cointelegraph.com/news/standard-chartered-100k-bitcoin-2026-prediction-low?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 11:58 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Standard Chartered wavers on $100K Bitcoin year-end call, says it may be \u2018too low\u2019</p><p style='margin-bottom: 1.25em;'>Standard Chartered\u2019s Geoff Kendrick said Bitcoin could move toward its $126,000 all-time high after Oct. 6 as spot Bitcoin ETF inflows recover.</p><p style='margin-bottom: 1.25em;'>Bitcoin may move toward its all-time high of $126,000 before the end of the year, with the recovery potentially accelerating after Oct. 6, according to Geoff Kendrick, global head of digital asset research at Standard Chartered.</p><p style='margin-bottom: 1.25em;'>Kendrick said in a Friday note shared with Cointelegraph that the latest rally has been driven largely by short liquidations, while inflows into spot Bitcoin exchange-traded funds have also started to recover. He said low open interest could leave room for more investors to return as prices rise.</p><p style='margin-bottom: 1.25em;'>\u201cFor the first time this year there is now a risk my end year forecast (of USD100k) is too low,\u201d Kendrick wrote.</p><p style='margin-bottom: 1.25em;'>In a Feb. 12 report, Kendrick cut Standard Chartered\u2019s year-end Bitcoin target to $100,000 from $150,000 and its Ether target to $4,000 from $7,500. At the time, he expected Bitcoin to fall to around $50,000 and Ether to $1,400 before recovering during the rest of the year.</p><p style='margin-bottom: 1.25em;'>Other industry watchers have also pointed to signs that the bear market may be nearing an end. Swan Bitcoin CEO Cory Klippsten said Bitcoin may bottom in October, while 10x Research founder Markus Thielen said an August close above $63,000 could confirm a bear-market bottom.</p><p style='margin-bottom: 1.25em;'>Bitcoin traded at $76,844 at the time of writing, up 24% over the past week, according to CoinGecko data.</p><p style='margin-bottom: 1.25em;'>Magazine: How Bitcoin and gold reacted differently to the Iran war shock</p>"}, {"id": 50, "source": "Yahoo Finance", "category": "markets", "title": "Hyundai considers Georgia Metaplant expansion to 800,000 units", "link": "https://finance.yahoo.com/economy/policy/articles/hyundai-considers-georgia-metaplant-expansion-112106415.html", "date_str": "Aug 21 \u2022 11:21 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Hyundai Motor is considering expanding production capacity at its Georgia assembly plant from 500,000 vehicles annually to between 700,000 and 800,000 units by 2028, CEO Jos\u00e9 Mu\u00f1oz told CNBC on Thursday. The South Korean automaker said following publication of the interview that the plans are under consideration but not yet confirmed.</p><p style='margin-bottom: 1.25em;'>At the upper end of that range, the Georgia Metaplant would leapfrog rivals \u2014 among them Tesla and Toyota Motor \u2014 to claim the top spot among U.S. vehicle assembly plants measured by capacity.</p><p style='margin-bottom: 1.25em;'>Mu\u00f1oz said President Donald Trump's tariffs, including a 15% levy on imports from South Korea, have accelerated the company's localization plans. \"Tariffs are helping accelerate our localization plan. That's very, very simple,\" he said. \"The good thing is that we had already started before tariffs were announced. So in a way it's helping us to accelerate.\"</p><p style='margin-bottom: 1.25em;'>Any such expansion would be funded through Hyundai's already-announced $26 billion U.S. investment commitment running to 2028. Hyundai has targeted a domestic production share of at least 80% of the vehicles it moves in the U.S. market by 2030, compared with roughly 40% in 2024. \"For that purpose, we need to add more capacity,\" Mu\u00f1oz said.</p><p style='margin-bottom: 1.25em;'>The $7.6 billion Metaplant, which Hyundai first announced in 2022, is currently turning out the all-electric Ioniq 5 and Ioniq 9 models alongside the Kia Sportage hybrid. The facility is designed to build hybrid and all-electric vehicles for the Hyundai, Genesis, and Kia brands. Under the existing 500,000-unit framework, the Georgia campus would employ upward of 8,500 people directly, with a further 6,900 positions supported at supplier facilities nearby.</p><p style='margin-bottom: 1.25em;'>Hyundai is also evaluating additional investment for body-on-frame vehicles such as trucks and SUVs at a location separate from the Georgia plant, though Mu\u00f1oz declined to provide further details.</p><p style='margin-bottom: 1.25em;'>Mu\u00f1oz, who became the first non-Korean CEO of Hyundai Motor when he took the role last year, framed the U.S. as central to the company's global strategy. \"For us, the USA is the most important market in the world besides Korea, which is our headquarters,\" he said. Hyundai's U.S. market share has grown from 8.4% in 2020 to 11.2% last year, according to CNBC, citing data from Mobility Global.</p>"}, {"id": 51, "source": "Mining.com", "category": "metals", "title": "Metals Exploration locks in $27M as La India first gold nears", "link": "https://www.mining.com/metals-exploration-locks-in-27m-as-la-india-first-gold-nears/", "date_str": "Aug 21 \u2022 11:08 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Metals Exploration locks in $27M as La India first gold nears</p><p style='margin-bottom: 1.25em;'>Metals Exploration (AIM:MTL) has secured $27 million in equipment financing as its La India gold project in Nicaragua closes in on first production, targeted for December 2026.</p><p style='margin-bottom: 1.25em;'>The company has already drawn $20.2 million from the five-year Banco de America Central facility, replenishing cash used to buy its Caterpillar mining fleet as construction advances towards the December target.</p><p style='margin-bottom: 1.25em;'>It said it will use the remaining $6.8 million as additional equipment arrives in Nicaragua.</p><p style='margin-bottom: 1.25em;'>\u201cConstruction at La India continues to make strong progress, with installation of the process plant advancing across multiple fronts,\u201d CEO Darren Bowden said. \u201cThe ball mill is in its final position, the SAG mill is ready to follow, and the CIL tank fit-out is nearing completion.\u201d</p><p style='margin-bottom: 1.25em;'>The financing gives Metals Exploration additional liquidity as it pushes La India towards commissioning while continuing to generate gold from its Runruno mine in the Philippines. Runruno is expected to produce near the upper end of its 40,000-48,000-oz. 2026 guidance because of higher-grade ore from the Stage 5 pit.</p><p style='margin-bottom: 1.25em;'>Build advances</p><p style='margin-bottom: 1.25em;'>Structural, mechanical, piping and electrical installation at La India is about 50% complete, the company said. The grinding building is structurally finished and the ball mill is in its final position, while the SAG mill is being prepared to be lifted into place.</p><p style='margin-bottom: 1.25em;'>Installation of the carbon-in-leach tank rings has reached 53 of 60, or 88%, with the leach tanks about 80% complete and detox tanks roughly 70% finished. All 10 CIL agitators and both detox agitators have been assembled.</p><p style='margin-bottom: 1.25em;'>Bulk earthworks are 93% complete and civil foundations have reached 92%, while pre-stripping of the open pit is 71% finished.</p><p style='margin-bottom: 1.25em;'>Metals Exploration has stockpiled about 244,000 tonnes of ore on the run-of-mine pad ahead of commissioning.</p><p style='margin-bottom: 1.25em;'>Site infrastructure is also nearing completion. The mine and heavy mobile equipment offices are operating, the water treatment plant is finished and camp installation is about 90% complete, the company said. Industrial buildings are roughly 88% complete, while the explosives magazine is awaiting an operating permit.</p><p style='margin-bottom: 1.25em;'>Construction of the tailings storage facility has reached about 60%. A 2-MW grid connection to Nicaragua\u2019s national electricity transmission company ENATREL has been energized and is available for operations and commissioning. The main sub-station remains scheduled for completion in December.</p><p style='margin-bottom: 1.25em;'>Shipping risks</p><p style='margin-bottom: 1.25em;'>Metals Exploration said disruption to international shipping linked to the conflict in Iran has delayed some imported equipment and materials, creating a potential scheduling risk as La India approaches commissioning.</p><p style='margin-bottom: 1.25em;'>The company noted it has managed the impact within the overall construction program so far and is assessing alternative logistics arrangements to reduce the risk of further delays.</p><p style='margin-bottom: 1.25em;'>The financing provides additional flexibility against those pressures. The facility carries an initial annual interest rate of 7%, with a 6.85% floor, and matures on Aug. 17, 2031.</p><p style='margin-bottom: 1.25em;'>Metals Exploration receives a 12-month grace period on principal before repaying the loan over 48 equal monthly instalments plus interest.</p><p style='margin-bottom: 1.25em;'>The company has paid S$30.5 million for its CAT mining fleet, with another $700,000 due next month. The fleet investment sits outside La India\u2019s development and construction budget.</p><p style='margin-bottom: 1.25em;'>With major plant components moving into place and mining already building an ore stockpile, Metals Exploration\u2019s December target increasingly hinges on completing the remaining infrastructure and keeping outstanding equipment deliveries on schedule.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 52, "source": "Cointelegraph", "category": "crypto", "title": "Coldcard strengthens seed generation with firmware update", "link": "https://cointelegraph.com/news/coldcard-upgrade-strengthen-seed-phrase-generation?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 10:13 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Coldcard strengthens seed generation with firmware update</p><p style='margin-bottom: 1.25em;'>Coinkite urged Coldcard users to generate new seed phrases, warning that existing vulnerable seeds remain unsafe despite the security upgrade.</p><p style='margin-bottom: 1.25em;'>Coinkite released a new security upgrade to strengthen seed phrase generation by requiring user-supplied entropy mixed with improved device randomness.</p><p style='margin-bottom: 1.25em;'>Coinkite announced firmware 5.6.1 for Coldcard Mk4 and Mk5 devices and 1.5.1Q for the Coldcard Q in a Thursday blog post.</p><p style='margin-bottom: 1.25em;'>The release requires newly generated seeds to include user-supplied entropy through at least 65 keypresses with unpredictable timing, 50 rolls of a six-sided die or 128 coin flips. That input is combined with randomness from multiple device sources, including its secure elements and hardware random-number generator (RNG).</p><p style='margin-bottom: 1.25em;'>The combined randomness is used to create the wallet\u2019s seed phrase and is intended to keep its private keys unpredictable even if one of the device\u2019s entropy sources fails.</p><p style='margin-bottom: 1.25em;'>Coinkite told users to upgrade immediately, emphasizing that existing seed phrases remain vulnerable even after upgrading and must be replaced with new seeds before migrating funds.</p><p style='margin-bottom: 1.25em;'>Confirmed losses from the Coldcard exploit reached 1,778 Bitcoin (BTC), worth about $112 million, according to an Aug. 14 report by Galaxy Research. This makes the Coldcard hack the third-largest cryptocurrency exploit of 2026, according to data aggregated by DefiLlama.</p><p style='margin-bottom: 1.25em;'>Coldcard adds transaction and USB safeguards</p><p style='margin-bottom: 1.25em;'>The company\u2019s July 31 firmware update had already fixed the seed-generation failure for newly created wallets. Thursday\u2019s release follows three weeks of broader security review and also adds safeguards around USB data handling, transaction signing and hardware randomness.</p><p style='margin-bottom: 1.25em;'>Coinkite said the update addresses a theoretical attack involving a compromised computer USB port by re-verifying transactions immediately before signing. The firmware also introduces additional hardware RNG checks and a boot-time test designed to verify that the wallet is using its intended hardware path.</p><p style='margin-bottom: 1.25em;'>Related: Cybersecurity firm unveils crypto phishing campaign targeting 885,000 phone numbers</p><p style='margin-bottom: 1.25em;'>Other changes restrict USB downloads to the device\u2019s most recent output and require an encrypted session, while certain Bitcoin signature hash modes that allow transaction outputs to remain modifiable are now blocked by default.</p><p style='margin-bottom: 1.25em;'>Coinspect launches weak-seed detection tool</p><p style='margin-bottom: 1.25em;'>Other companies are also launching software to identify wallets potentially exposed by weak seed generation.</p><p style='margin-bottom: 1.25em;'>Blockchain security company Coinspect revealed Unlukey, a free public tool for identifying wallet addresses generated from weak seed phrases. The first iteration of the tool aims to reproduce known weak seed generation and check whether public addresses belong to the affected dataset, Coinspect said in a Friday X post.</p><p style='margin-bottom: 1.25em;'>Weak seed phrase generation was one of the main vulnerabilities that led to the Coldcard exploit. TRM Labs said that a firmware bug from March 2021 weakened seed randomness on some Coldcard wallets, reducing key strength from 128 bits to 40 bits and making them \u201cbrute-forceable without physical access.\u201d</p><p style='margin-bottom: 1.25em;'>Magazine: Inside the \u2018fake police raid\u2019 that forced a $1M Bitcoin transfer</p>"}, {"id": 53, "source": "Cointelegraph", "category": "crypto", "title": "Strategy Bitcoin treasury hits breakeven point as BTC price passes $77K", "link": "https://cointelegraph.com/markets/strategy-bitcoin-treasury-hits-breakeven-point-as-btc-price-passes-77k?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 08:48 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Strategy Bitcoin treasury hits breakeven point as BTC price passes $77K</p><p style='margin-bottom: 1.25em;'>Bitcoin gains 20% in two days as Strategy sees its BTC treasury climb out of the red.</p><p style='margin-bottom: 1.25em;'>Bitcoin (BTC) hit $77,000 on Friday as business intelligence company Strategy\u2019s corporate treasury returned to profit.</p><p style='margin-bottom: 1.25em;'>Key points:</p><p style='margin-bottom: 1.25em;'>- Bitcoin reaches its highest level since May 26 as it revisits $77,000.</p><p style='margin-bottom: 1.25em;'>- Price returns above the cost basis for Strategy\u2019s BTC corporate treasury at $75,385.</p><p style='margin-bottom: 1.25em;'>- Around 11% of the BTC supply constitutes a new band of support below $68,000.</p><p style='margin-bottom: 1.25em;'>Strategy out of the red with Bitcoin at highest since May</p><p style='margin-bottom: 1.25em;'>Data from TradingView showed new local highs above $77,400 prior to the week\u2019s final Wall Street open.</p><p style='margin-bottom: 1.25em;'>BTC/USD one-day chart. Source: Cointelegraph/TradingView</p><p style='margin-bottom: 1.25em;'>Now up around 20% in 48 hours, BTC/USD saw little by way of consolidation as it reclaimed a key level for Strategy, the world\u2019s largest corporate Bitcoin treasury company. Data from monitoring resource BitcoinTreasuries puts the cost basis for Strategy\u2019s holdings of 840,447 BTC at $75,385, currently with a year-to-date gain of approximately $450 million.</p><p style='margin-bottom: 1.25em;'>Strategy Bitcoin treasury cost basis data. Source: BitcoinTreasuries</p><p style='margin-bottom: 1.25em;'>As Cointelegraph reported, between Aug. 3 and Aug. 9, Strategy opted to sell a small portion of its treasury worth 1,690 BTC to repurchase 1.15 million shares of its STRC preferred stock for $108.6 million. The move represented the company\u2019s fourth Bitcoin sale of 2026.</p><p style='margin-bottom: 1.25em;'>Concerns over the long-term viability of the company\u2019s Bitcoin investment thesis accompanied the sales, something that the subsequent BTC price run-up should help alleviate, independent crypto analyst William Clemente suggested.</p><p style='margin-bottom: 1.25em;'>\u201cNot only should Saylor/Strategy fears have been abated for a while once he showed that he was willing to sell BTC to rebuy STRC, but now after this price impulse they are even more over-collateralized by their BTC holdings,\u201d he wrote on X, referring to former CEO Michael Saylor.</p><p style='margin-bottom: 1.25em;'>In an interview with Fox News earlier in August, current CEO Phong Le stated that Strategy would return to buying Bitcoin before the end of the year.</p><p style='margin-bottom: 1.25em;'>New BTC buy wall sits below $68,000</p><p style='margin-bottom: 1.25em;'>Amid misgivings over the durability of Bitcoin\u2019s volatile upside move, analysis from onchain analytics platform Glassnode revealed a new safety net forming below $70,000.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin has \u2018largely purged\u2019 froth that preceded 50% drop from $126K: BlackRock</p><p style='margin-bottom: 1.25em;'>Some 3.44 million BTC now have an onchain cost basis, also known as realized price, between $58,000 and $67,000. Of this, 2.23 million BTC \u2014 equal to around 11% of the total supply \u2014 was added over the past 11 weeks.</p><p style='margin-bottom: 1.25em;'>\u201cIt\u2019s the densest cost-basis cluster below spot \u2014 a key potential support zone on any retracement,\u201d Glassnode cofounder Rafael Schultze-Kraft commented on X.</p><p style='margin-bottom: 1.25em;'>Bitcoin UTXO realized price distribution data. Source: Rafael Schultze-Kraft on X.com</p><p style='margin-bottom: 1.25em;'>BTC/USD broke through several key resistance levels this week, including its 200-day simple moving average (SMA) at $68,967, a key target to reclaim to end the long-term BTC price downtrend.</p>"}, {"id": 54, "source": "Cointelegraph", "category": "crypto", "title": "Bitcoin ETFs draw $608M as Ether ETFs see largest inflow since October", "link": "https://cointelegraph.com/markets/bitcoin-etfs-ether-etfs-largest-inflow-october?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 07:50 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitcoin ETFs draw $608M as Ether ETFs see largest inflow since October</p><p style='margin-bottom: 1.25em;'>Bitcoin ETF inflows pushed August\u2019s total to a 2026 high of $2.07 billion as Bitcoin traded above $75,000 and Ether climbed to $2,357.</p><p style='margin-bottom: 1.25em;'>US spot Bitcoin exchange-traded funds (ETFs) drew $608.3 million in net inflows on Thursday, lifting weekly inflows above $1.6 billion, while spot Ether ETFs logged their largest single-day intake since October.</p><p style='margin-bottom: 1.25em;'>The Bitcoin funds extended their positive streak to four straight sessions after attracting $297.6 million on Monday, $189.3 million on Tuesday and $517.2 million on Wednesday,SoSoValue data shows.</p><p style='margin-bottom: 1.25em;'>August net inflows reached $2.07 billion through Thursday, already surpassing April\u2019s $1.97 billion, the previous monthly high for 2026, with seven trading sessions remaining. Cumulative net inflows stood at $53.4 billion.</p><p style='margin-bottom: 1.25em;'>The inflows accompanied a continued rally in crypto markets as Bitcoin traded at $75,133 at the time of writing on Friday, up 7.9% over the previous 24 hours, according to CoinGecko. Ether gained 4.6% to about $2,357.</p><p style='margin-bottom: 1.25em;'>Spot Ether ETFs attracted $220.8 million on Thursday, their largest daily net inflow across 203 trading sessions spanning 296 calendar days. The funds last recorded a larger intake on Oct. 28, 2025, when they drew about $246 million.</p><p style='margin-bottom: 1.25em;'>The funds have taken in approximately $512.2 million across four trading sessions this week, lifting their August net inflows to about $754.9 million. Total net assets reached $13.58 billion.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin breaks above 200-day moving average for first time since November</p>"}, {"id": 55, "source": "Cointelegraph", "category": "crypto", "title": "South Korean lawmakers seek expanded FIU powers over unregistered crypto firms", "link": "https://cointelegraph.com/news/south-korea-fiu-unregistered-crypto-firms-bill?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 05:47 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>South Korean lawmakers seek expanded FIU powers over unregistered crypto firms</p><p style='margin-bottom: 1.25em;'>The proposal would let the FIU investigate suspected violations and refer unregistered crypto operators directly to law enforcement.</p><p style='margin-bottom: 1.25em;'>A group of South Korean lawmakers has introduced a bill to amend an existing financial law and expand the Financial Intelligence Unit\u2019s (FIU) authority to investigate unregistered crypto businesses.</p><p style='margin-bottom: 1.25em;'>On Thursday, People Power Party lawmaker Eom Tae-young and nine other lawmakers filed the bill, which aims to add a new provision to the Act on Reporting and Using Specified Financial Transaction Information.</p><p style='margin-bottom: 1.25em;'>Under the proposal, anyone could report suspected violations of the law to the FIU. The agency could investigate and analyze alleged violations, file complaints with the relevant authorities, request criminal investigations or provide information to investigators.</p><p style='margin-bottom: 1.25em;'>The bill remains at the introduction stage and must pass the National Assembly before it can amend the existing law.</p><p style='margin-bottom: 1.25em;'>Under the current system, the FIU identifies suspected unregistered operators but relies on police and other authorities to pursue investigations.</p><p style='margin-bottom: 1.25em;'>Police suspended investigations or preliminary inquiries into 23 of 25 unregistered virtual asset service providers referred by the FIU between August 2022 and August 2025, according to Yonhap. The companies and related individuals were reportedly based overseas.</p><p style='margin-bottom: 1.25em;'>Crypto companies serving South Korean customers must register with the FIU. The regulator said in June that 28 providers were registered and that it had referred 40 suspected illegal operators to investigative authorities.</p><p style='margin-bottom: 1.25em;'>Related: South Korea drops Travel Rule threshold for crypto transfers</p>"}, {"id": 56, "source": "Cointelegraph", "category": "crypto", "title": "MANTRA token sinks 18% to record low amid blockchain halt", "link": "https://cointelegraph.com/markets/mantra-token-record-low-blockchain-halt?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 05:04 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>MANTRA token sinks 18% to record low amid blockchain halt</p><p style='margin-bottom: 1.25em;'>The token recovered to about $0.0044 after setting a new low, while exchanges paused deposits and withdrawals from the halted MANTRA Chain.</p><p style='margin-bottom: 1.25em;'>MANTRA\u2019s native token sank 18.5% from its 24-hour high to a record low shortly before MANTRA Chain stopped producing blocks and its team announced a precautionary halt over an unexplained incident.</p><p style='margin-bottom: 1.25em;'>According to CoinGecko, MANTRA fell from $0.005060 to an all-time low of $0.004126 around 11:00 pm UTC on Thursday. It later recovered to about $0.0044 but remained down roughly 10% over 24 hours, while trading volume climbed nearly 600% to $24 million.</p><p style='margin-bottom: 1.25em;'>MANTRA said Friday it was \u201caware of an incident affecting MANTRA Chain\u201d and had halted the network as a precaution while it investigated. \u201cWe don\u2019t have a root cause or timeline to share yet,\u201d the project said, adding that all endpoints and transactions were frozen.</p><p style='margin-bottom: 1.25em;'>The halt prevents assets from moving on MANTRA Chain and has prompted affected exchanges to pause deposits and withdrawals, with no timeline given for either service to resume.</p><p style='margin-bottom: 1.25em;'>MANTRA\u2019s 24-hour price chart. Source: CoinGecko</p><p style='margin-bottom: 1.25em;'>MANTRA Chain remains halted as investigation continues</p><p style='margin-bottom: 1.25em;'>MANTRA\u2019s status page classified the incident as a full outage affecting public endpoints, validators, bridge migration operations and MANTRA-managed Inter-Blockchain Communication relays. The team said it would not restart the network until it was confident it was safe.</p><p style='margin-bottom: 1.25em;'>The network\u2019s public RPC listed block 17,449,398, produced at 11:13 pm UTC on Thursday, as its latest block. MANTRA posted its initial incident notice at 11:44 pm, while CoinGecko showed the token reaching its low around 11:10 pm.</p><p style='margin-bottom: 1.25em;'>MANTRA has not said whether the price movement was related to the incident or whether any assets were lost or placed at risk.</p><p style='margin-bottom: 1.25em;'>Cointelegraph contacted the MANTRA team for additional information but did not receive a response by publication.</p><p style='margin-bottom: 1.25em;'>Related: Mantra says CEO has begun the process of burning his 150M OM tokens</p><p style='margin-bottom: 1.25em;'>The latest decline follows the April 2025 collapse of MANTRA\u2019s former OM token, which plunged more than 90% from about $6.30 to below $0.50 and erased more than $5 billion in market value.</p><p style='margin-bottom: 1.25em;'>In June, Inveniam Capital Partners announced plans to acquire MANTRA after investing $20 million in the project in 2025. The acquisition followed January layoffs and restructuring after CEO John Patrick Mullin described 2025 as the project\u2019s most challenging year.</p><p style='margin-bottom: 1.25em;'>Magazine: 200,000 fake AI \u2018victims\u2019 deployed to scam bait online fraudsters</p>"}, {"id": 57, "source": "Cointelegraph", "category": "crypto", "title": "Capital.com plans UAE spot crypto services after affiliate wins licence", "link": "https://cointelegraph.com/news/capital-com-uae-spot-crypto-license?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 03:33 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Capital.com plans UAE spot crypto services after affiliate wins licence</p><p style='margin-bottom: 1.25em;'>UAE clients will be able to buy and hold crypto through Capital.com\u2019s app, expanding beyond price exposure through contracts for difference.</p><p style='margin-bottom: 1.25em;'>Trading platform and contracts for difference (CFD) broker Capital.com plans to offer spot crypto services to clients in the United Arab Emirates after its affiliate, Capital Vault, secured a virtual-asset license from the country\u2019s Capital Market Authority (CMA).</p><p style='margin-bottom: 1.25em;'>According to an announcement sent to Cointelegraph, the license allows Capital Vault to deal in virtual assets as an agent or matching principal and provide custody on behalf of clients.</p><p style='margin-bottom: 1.25em;'>Once the service goes live, UAE clients will be able to buy and hold actual crypto through the Capital.com app, with Capital Vault providing execution, custody and settlement. This differs from Capital.com\u2019s CFDs, which provide price exposure without ownership of the underlying crypto.</p><p style='margin-bottom: 1.25em;'>Capital Vault operates as a separate regulated entity, with its governance, custody and risk arrangements separated from Capital.com\u2019s other businesses. The affiliate has opened an office in Abu Dhabi and is building a local virtual-asset team.</p><p style='margin-bottom: 1.25em;'>The approval follows the CMA\u2019s introduction of a virtual-asset regulatory framework in April, which expanded the number of regulated activities from three to eight. The framework also established requirements covering business conduct, alternative trading systems, anti-money laundering controls and prudential standards.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin.com integrates UAE-registered US dollar stablecoin into self-custodial wallet</p>"}, {"id": 58, "source": "Mining.com", "category": "metals", "title": "Lassonde-backed Cadillac drilling points to more Ontario gold", "link": "https://www.mining.com/lassonde-backed-cadillac-drilling-points-to-more-ontario-gold/", "date_str": "Aug 20 \u2022 11:45 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Canadian developer Cadillac Mines (TSX: CADY) says new drilling at its past-producing Kerr-Addison property in Ontario could open the door to a larger open-pit gold resource. The stock rose. Standout hole KAD26-428T cut about 23 metres grading 3.08 gold per...</p><p style='margin-bottom: 1.25em;'>You've reached your limit of free weekly articles</p><p style='margin-bottom: 1.25em;'>Keep reading MINING.COM with a TNM NEWS+MARKETS Membership.</p><p style='margin-bottom: 1.25em;'>TNM Memberships is your key to unlocking access to the best news, insights, and data in the mining industry.</p><p style='margin-bottom: 1.25em;'>Get Started with a free 45-day Trial *</p><p style='margin-bottom: 1.25em;'>* Credit card required to begin free trial. Your card will be charged 45 days from signup. You will receive an email notification seven (7) days before the free trial period ends.</p><p style='margin-bottom: 1.25em;'>Already a Member?</p><p style='margin-bottom: 1.25em;'>Sign in</p><p style='margin-bottom: 1.25em;'>Subscribe for Unlimited Access</p><p style='margin-bottom: 1.25em;'>Enjoy unlimited News Stories and Specialty Digests, along with Mining and Metal Market insights as part of your NEWS+MARKETS Membership. Or go even deeper with our Global Mining Data platform, TNM Marco Polo, included with your NEWS+DATA Membership.</p><p style='margin-bottom: 1.25em;'>Explore Full Membership Benefits</p>"}, {"id": 59, "source": "Cointelegraph", "category": "crypto", "title": "Bitcoin breaks above 200-day moving average for first time since November", "link": "https://cointelegraph.com/markets/bitcoin-breaks-200-day-moving-average?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 20 \u2022 09:03 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitcoin breaks above 200-day moving average for first time since November</p><p style='margin-bottom: 1.25em;'>The BTC price reclaimed its 200-day moving average for the first time in nine months as its rally gained momentum after the US Treasury expanded its bond buybacks.</p><p style='margin-bottom: 1.25em;'>Bitcoin\u2019s latest rally has pushed the cryptocurrency above a key long-term technical indicator for the first time in about nine months, offering a potential signal that its broader downtrend is losing momentum.</p><p style='margin-bottom: 1.25em;'>Charting platform Barchart highlighted on Thursday that Bitcoin\u2019s (BTC) price had crossed above its 200-day moving average for the first time since November 2025, roughly a month after BTC reached an all-time high above $126,000.</p><p style='margin-bottom: 1.25em;'>The 200-day moving average is widely used to gauge longer-term market trends, with moves above the indicator often viewed as a sign of bullish momentum. A sustained break above the level could therefore suggest that Bitcoin\u2019s months-long downtrend is beginning to weaken.</p><p style='margin-bottom: 1.25em;'>The move came as Bitcoin climbed to nearly $73,000 on Thursday, according to TradingView data.</p><p style='margin-bottom: 1.25em;'>Source: Barchart</p><p style='margin-bottom: 1.25em;'>Bitcoin has gained more than 13% since Wednesday, when the US Treasury Department announced it would at least double the size of liquidity-support buybacks for longer-dated Treasury securities, raising the maximum from $2 billion to at least $4 billion per operation beginning Sept. 9.</p><p style='margin-bottom: 1.25em;'>The operation aims to improve liquidity at the long end of the Treasury market and initially pushed long-term yields lower, helping bolster risk appetite across financial markets.</p><p style='margin-bottom: 1.25em;'>Following the Treasury\u2019s announcement, Standard Chartered\u2019s Geoff Kendrick said the move could help fuel a broader Bitcoin rally toward $100,000 by year-end.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin ETFs draw $517M in largest one-day inflow since early May</p>"}, {"id": 60, "source": "Mining.com", "category": "metals", "title": "High-grade Ima resource boosts Idaho tungsten revival", "link": "https://www.mining.com/high-grade-ima-resource-boosts-idaho-tungsten-revival/", "date_str": "Aug 20 \u2022 08:40 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>An initial resource for American Tungsten\u2019s (TSXV: TUNG; US-OTC: TUNGF) Ima project in northeast Idaho positions it as the state\u2019s highest grade tungsten project where the critical metal is in the primary commodity. Shares rose. The resource outlines 316,000 indicated...</p><p style='margin-bottom: 1.25em;'>You've reached your limit of free weekly articles</p><p style='margin-bottom: 1.25em;'>Keep reading MINING.COM with a TNM NEWS+MARKETS Membership.</p><p style='margin-bottom: 1.25em;'>TNM Memberships is your key to unlocking access to the best news, insights, and data in the mining industry.</p><p style='margin-bottom: 1.25em;'>Get Started with a free 45-day Trial *</p><p style='margin-bottom: 1.25em;'>* Credit card required to begin free trial. Your card will be charged 45 days from signup. You will receive an email notification seven (7) days before the free trial period ends.</p><p style='margin-bottom: 1.25em;'>Already a Member?</p><p style='margin-bottom: 1.25em;'>Sign in</p><p style='margin-bottom: 1.25em;'>Subscribe for Unlimited Access</p><p style='margin-bottom: 1.25em;'>Enjoy unlimited News Stories and Specialty Digests, along with Mining and Metal Market insights as part of your NEWS+MARKETS Membership. Or go even deeper with our Global Mining Data platform, TNM Marco Polo, included with your NEWS+DATA Membership.</p><p style='margin-bottom: 1.25em;'>Explore Full Membership Benefits</p>"}, {"id": 61, "source": "Federal Reserve - Releases", "category": "economy", "title": "Federal Reserve Board announces approval of application by National Westminster Bank Plc", "link": "https://www.federalreserve.gov/newsevents/pressreleases/orders20260820a.htm", "date_str": "Aug 20 \u2022 08:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>August 20, 2026</p><p style='margin-bottom: 1.25em;'>Federal Reserve Board announces approval of application by National Westminster Bank Plc</p><p style='margin-bottom: 1.25em;'>For release at 4:00 p.m. EDT</p><p style='margin-bottom: 1.25em;'>The Federal Reserve Board on Thursday announced its approval of the application by National Westminster Bank Plc, of London, England, to establish a representative office in Stamford, Connecticut.</p><p style='margin-bottom: 1.25em;'>For media inquiries, please email [email protected] or call 202-452-2955.</p>"}, {"id": 62, "source": "Mining.com", "category": "metals", "title": "BHP, MIT spinout to trial copper recovery tech at historic Arizona mine", "link": "https://www.mining.com/bhp-m
