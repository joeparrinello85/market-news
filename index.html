ortfolio with $34.42 billion in managed 13F securities, according to WhaleWisdom.</p><p style='margin-bottom: 1.25em;'>And it arrives at a moment when The Home Depot just delivered its strongest comparable sales growth since 2022, despite what its own CFO describes as \"frozen housing market conditions.\"</p><p style='margin-bottom: 1.25em;'>Why Gates Trust trimmed Berkshire and opened The Home Depot</p><p style='margin-bottom: 1.25em;'>The Gates Foundation Trust's portfolio is concentrated and deliberate. Its top five holdings include Berkshire Hathaway Class B (BRK.B), Caterpillar (CAT), Canadian National Railway (CNI), Waste Management (WM), and Deere & Company (DE), according to GuruFocus data.</p><p style='margin-bottom: 1.25em;'>These are long-duration bets on essential infrastructure, industrials, and American economic activity.</p><p style='margin-bottom: 1.25em;'>The Home Depot fits that same framework anyway. It's the world's largest home improvement retailer, tied directly to the American housing stock, The Home Depot reports.</p><p style='margin-bottom: 1.25em;'>The trust also opened a new position in FedEx Freight Holding Company (FDXF) worth approximately $180 million in the same quarter, according to the 13F filing. That's another infrastructure-adjacent business that I'll most likely cover next.</p><p style='margin-bottom: 1.25em;'>My understanding is that the trust is rotating toward companies that benefit from domestic economic activity and physical asset maintenance rather than purely financial holdings. Call me crazy, but that sounds like a pretty interesting investment thesis.</p><p style='margin-bottom: 1.25em;'>What The Home Depot's Q2 results show about why this bet makes sense now</p><p style='margin-bottom: 1.25em;'>The Home Depot reported Q2 fiscal 2026 results on Aug. 18 that beat expectations across the board.</p><p style='margin-bottom: 1.25em;'>Net sales of $47.9 billion, up 5.7% year-over-year (YoY)</p><p style='margin-bottom: 1.25em;'>Comparable sales growth of 1.7% \u2014 the highest since 2022</p><p style='margin-bottom: 1.25em;'>Adjusted diluted EPS of $4.92, up from $4.68 in the prior year period</p><p style='margin-bottom: 1.25em;'>Net earnings of $4.8 billion, or $4.79 per diluted share</p><p style='margin-bottom: 1.25em;'>CFO Richard McPhail was candid about the environment in a CNBC interview.</p><p style='margin-bottom: 1.25em;'>\"We continue to operate in what I call frozen housing market conditions,\" he said. \"But we also know that we're taking share and that we're serving our customers better every day.\"</p><p style='margin-bottom: 1.25em;'>That phrase \u2014 taking share in a frozen market \u2014 is the crux of the investment case. The Home Depot's comparable sales growth isn't being driven by a housing recovery. It's being driven by smaller, non-discretionary repair and maintenance projects that homeowners undertake regardless of whether they're buying or selling.</p><p style='margin-bottom: 1.25em;'>When a roof leaks or a water heater fails, it gets replaced. Like it or not, The Home Depot captures that spending whether mortgage rates are at 3% or 7%.</p><p style='margin-bottom: 1.25em;'>The company also received $730 million in tariff refunds during Q2, using $685 million to reduce cost of goods sold, according to McPhail's comments on the earnings call.</p><p style='margin-bottom: 1.25em;'>That pass-through to customers mirrors Walmart's own approach to tariff refunds, as I noted in my previous coverage, highlighting a broader pattern among major retailers navigating the current trade environment.</p><p style='margin-bottom: 1.25em;'>BofA's read on why the stock's underperformance creates an opportunity</p><p style='margin-bottom: 1.25em;'>Bank of America analyst Christopher Nardone reiterated a Buy rating on The Home Depot and adjusted his price target to $407 from $412, according to a note shared with my colleague at TheStreet.</p><p style='margin-bottom: 1.25em;'>The modest target reduction reflects the cautious guidance The Home Depot reaffirmed rather than raised. But the Buy rating holds.</p><p style='margin-bottom: 1.25em;'>The Home Depot's reaffirmed fiscal 2026 guidance calls for total sales growth of 2.5% to 4.5% and comparable sales growth of flat to 2.0%, according to The Home Depot. Gross margin is projected at approximately 33.1%, with operating margin between 12.4% and 12.6%.</p><p style='margin-bottom: 1.25em;'>McPhail described the customer as \"a healthy cohort\" who has \"the means to spend\" but remains hesitant as projects get larger, citing inflation, fuel costs, and general uncertainty, according to his CNBC interview.</p><p style='margin-bottom: 1.25em;'>That hesitancy is real, but it's also temporary. The deferred maintenance and renovation spending building up in the U.S. housing stock doesn't disappear. It accumulates.</p><p style='margin-bottom: 1.25em;'>This is how The Home Depot has performed lately</p><p style='margin-bottom: 1.25em;'>HD shares were trading at $334.49 as of Aug. 20, down 1.41% year-to-date and 14.53% over the past year, according to Yahoo Finance. That's roughly $18 down from where Gates opened their buy position.</p><p style='margin-bottom: 1.25em;'>My read is that the Gates Foundation is buying The Home Depot at a point of maximum pessimism about housing.</p><p style='margin-bottom: 1.25em;'>Bank of America's $407 target implies roughly 22% upside from current levels. The Gates Foundation, apparently, agrees with the direction.</p>"}, {"id": 27, "source": "Mining.com", "category": "metals", "title": "Central Nevada Gold on mine hunt: CEO", "link": "https://www.mining.com/central-nevada-gold-on-mine-hunt-ceo/", "date_str": "Aug 21 \u2022 10:45 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Central Nevada Gold on mine hunt: CEO</p><p style='margin-bottom: 1.25em;'>Privately held developer Central Nevada Gold will look at acquiring other precious metals assets in the state after buying the past-producing Mule Canyon mine from Newmont (NYSE, ASX: NEM; TSX: NGT) earlier this summer, CEO Simon Griffiths said.</p><p style='margin-bottom: 1.25em;'>Having closed the $20-million Mule Canyon acquisition in late June, Central Nevada is now working to advance the asset through prefeasibility and permitting in next year\u2019s second half with the goal of delivering a construction decision in 2028.</p><p style='margin-bottom: 1.25em;'>It expects to announce a new mineral resource estimate for the property in the coming months. An initial public offering is also in the works, possibly as early as the first half of 2027, Griffiths said.</p><p style='margin-bottom: 1.25em;'>\u201cOur priority is Mule Canyon, and that will attract 110% of our attention in the short term, but given the balance sheet, the pedigree of the project we have in our stable already and the shareholder base, we will most certainly be looking and keeping an eye out for other opportunities in Nevada,\u201d Griffiths said in an interview.</p><p style='margin-bottom: 1.25em;'>Discovered in 1986 by Gold Fields (JSE, NYSE: GFI), Mule Canyon was brought into production by Newmont in 1996, churning out about 500,000 oz. of the yellow metal over five years. Mining ended in 2000 due to low gold prices after only two of six zones had been mined and fewer than half of the pre-mining reserves had been extracted, leaving significant unexploited potential.</p><p style='margin-bottom: 1.25em;'>Non-core mines</p><p style='margin-bottom: 1.25em;'>Major gold producers such as Newmont and Barrick Mining (TSX: ABX; NYSE: B) have been selling smaller or non-core mines to take advantage of elevated commodities prices and raise cash that can be ploughed back into to massive, low-cost assets in tier-one jurisdictions. That\u2019s a trend Central Nevada Gold is keen to capitalize on, Griffiths said.</p><p style='margin-bottom: 1.25em;'>\u201cAs larger companies such as Newmont and Barrick go through their restructuring and rationalize their portfolios, most definitely they could be looking to include us on their contact list,\u201d he said. \u201cWe have a very strong relationship with Newmont. We\u2019ve demonstrated our ability to close on this transaction.\u201d</p><p style='margin-bottom: 1.25em;'>Griffiths\u2019 past as a former CEO of silver producer Andean Precious Metals (TSX: APM) means he will also canvass Nevada for silver-rich properties. Another member of Central Nevada\u2019s management team, executive director Fraser Buchan, also held senior leadership roles at Andean.</p><p style='margin-bottom: 1.25em;'>\u201cGold dominates the resource at Mule Canyon, but we do have some silver there. And Fraser and I both did [Andean\u2019s] San Bartolom\u00e9 [mine in Bolivia], so silver is also of interest,\u201d Griffiths said. \u201cThe opportunities are there.\u201d</p><p style='margin-bottom: 1.25em;'>Future IPO</p><p style='margin-bottom: 1.25em;'>Central Nevada\u2019s purchase price for Mule Canyon included a $10-million cash payment at closing. A second cash payment will be made next June or when Central Nevada goes public \u2013 whichever occurs first.</p><p style='margin-bottom: 1.25em;'>An IPO will probably happen \u201cearly next year\u201d after more drilling has been completed, Griffiths said.</p><p style='margin-bottom: 1.25em;'>\u201cOur first priority is metallurgical sampling,\u201d he said. \u201cThat would be the first 20 holes. Those holes will also inform our geological resource model. The second priority will be infill drilling to confirm older [reverse circulation] holes and to upgrade the classification from inferred to indicated or measured, as the case may be. We would like to maximize the upgrade from inferred during this drill program.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019d like to understand what the project looks like before we do the public listing,\u201d he said.</p><p style='margin-bottom: 1.25em;'>Prolific areas</p><p style='margin-bottom: 1.25em;'>Located about 700 km northwest of Las Vegas, Mule Canyon sits in the Shoshone Mountain Range\u2019s historic Argenta mining district, near the prolific Carlin, Battle Mountain and Getchell trends.</p><p style='margin-bottom: 1.25em;'>A discovery drill intercept returned 41.1 meters grading 24.8 grams gold per tonne from an undisclosed depth, Central Nevada says. The company\u2019s database comprises 2,149 drill holes covering more than 335,000 metres.</p><p style='margin-bottom: 1.25em;'>Historical operating data cited by Central Nevada Gold indicate an average head grade of 3.8 grams gold per tonne and metallurgical recoveries of roughly 94%.</p><p style='margin-bottom: 1.25em;'>Subsequent exploration outlined six mineralized zones over 2.5 km, defining 8.2 million tonnes of open-pittable ore at an average grade of 3.81 grams gold per tonne, Central Nevada shareholder Giant Venture Capital says on its website.</p><p style='margin-bottom: 1.25em;'>Big data</p><p style='margin-bottom: 1.25em;'>Mule Canyon was initially designed and permitted to process about 7 to 10 million tons (6.4 to 9.1 million tonnes) of gold-bearing ore by processing 4.1 million tons of low-grade oxide ore by cyanide heap leaching, according to Nevada\u2019s Division of Environmental Protection.</p><p style='margin-bottom: 1.25em;'>\u201cWe bought this asset from the biggest gold mining company in the world. We\u2019ve inherited a huge amount of data, which is a massive advantage to us,\u201d Griffiths said.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019re not looking for an ore body; we\u2019ve already got one. We want to make sure we get through this huge data set and then identify as much information as we can, so that when we do come to the market, our story is more fulsome and we have de-risked many of the unknowns.\u201d</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 28, "source": "Mining.com", "category": "metals", "title": "Greenland Mines gets mineral exploration license for Safartoq project, stock surges", "link": "https://www.mining.com/greenland-mines-gets-mineral-exploration-license-for-sarfartoq-project-stock-surges/", "date_str": "Aug 21 \u2022 10:36 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>Greenland Mines (NASDAQ: GRML) said Friday that the Government of Greenland, through the Ministry of Business and Mineral Resources (Naalakkersuisut), has formally approved the indirect transfer of Mineral Exploration License covering the Sarfartoq carbonatite complex to the company. The stock surged.</p><p style='margin-bottom: 1.25em;'>The approval, granted under the Greenland Mineral Activities Act, satisfies one of the key regulatory closing conditions for the company\u2019s acquisition of the Sarfartoq project from Neo Performance Materials for $35 million.</p><p style='margin-bottom: 1.25em;'>As part of the deal, Neo Performance will receive offtake rights on up to 60% of future ore or mineral concentrate production from Sarfartoq.</p><p style='margin-bottom: 1.25em;'>The company has called the project one of the island\u2019s \u201cmost advanced and compelling rare earth projects,\u201d citing its high-grade nature and favorable Arctic logistics.</p><p style='margin-bottom: 1.25em;'>Located roughly 60 km from Kangerlussuaq in the southeast, the project is the site of a carbonatite-hosted deposit strongly enriched in Neodymium-Praseodymium (Nd-Pr).</p><p style='margin-bottom: 1.25em;'>The project carries a historic NI 43-101 Mineral Resource Estimate and a Preliminary Economic Assessment, is supported by more than 15 years of exploration work and over 23,000 meters of drilling,</p><p style='margin-bottom: 1.25em;'>A historic resource cited by the company showed that it contains roughly 27 million kg of Nd oxides and 8 million kg of Pr oxides, concentrated within one zone holding 5.88 million tonnes of indicated material grading 1.77% TREO (total rare earth oxides) and 2.46 million tonnes inferred grading 1.59% TREO.</p><p style='margin-bottom: 1.25em;'>\u201cThis approval from the Government of Greenland is a fundamental milestone for our company and for the future of Sarfartoq,\u201d Greenland Mines president Bo M\u00f8ller Stensgaard said in a news release.</p><p style='margin-bottom: 1.25em;'>\u201cIt reflects the strength of our relationships in Greenland and the confidence the Government places in our team to advance this project responsibly,\u201d Stensgaard said. \u201cSarfartoq is one of the most important undeveloped neodymium-praseodymium resources in the Western world. This is a foundational step in building a genuine, Western-aligned rare earth supply chain from Greenland.\u201d</p><p style='margin-bottom: 1.25em;'>Greenland Mines stock surged on the news, closing the day up over 22% on the NASDAQ. The company has a $31.4 million market capitalization.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 29, "source": "Cointelegraph", "category": "crypto", "title": "Here\u2019s what happened in crypto today", "link": "https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 08:48 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Here\u2019s what happened in crypto today</p><p style='margin-bottom: 1.25em;'>Need to know what happened in crypto today? Here is the latest news on daily trends and events impacting Bitcoin price, blockchain, DeFi, Web3 and crypto regulation.</p><p style='margin-bottom: 1.25em;'>Today in crypto, Ray Dalio backed gold and \u201ca bit\u201d of Bitcoin as protection against a potential US debt crisis, Standard Chartered said its $100,000 year-end BTC forecast may be too low and MANTRA\u2019s token hit a record low after its blockchain was halted over an unexplained incident.</p><p style='margin-bottom: 1.25em;'>Ray Dalio favors gold, \u2018a bit\u2019 of Bitcoin as US debt risks mount</p><p style='margin-bottom: 1.25em;'>Billionaire investor Ray Dalio is urging investors to favor gold and \u201ca bit of Bitcoin\u201d over bonds as he warns that the United States could face a debt crisis within the next several years.</p><p style='margin-bottom: 1.25em;'>The Bridgewater Associates founder said Friday that investors could consider allocating 10% to 15% of their portfolios to gold to reduce risk, while overweighting gold and Bitcoin relative to debt assets. Dalio pointed to mounting political and geopolitical tensions and estimated that a US debt crisis could emerge in roughly three years, unless the country changes course.</p><p style='margin-bottom: 1.25em;'>Dalio has historically been more cautious on Bitcoin than gold, arguing that the cryptocurrency cannot replace the precious metal as a store of value and raising concerns about privacy and quantum computing. Still, his latest comments continue a gradual shift toward accepting BTC as a portfolio hedge. In 2022, he described a 1% to 2% Bitcoin allocation as \u201creasonable.\u201d</p><p style='margin-bottom: 1.25em;'>Standard Chartered wavers on $100,000 Bitcoin year-end call, says it may be \u2018too low\u2019</p><p style='margin-bottom: 1.25em;'>Bitcoin may move toward its all-time high of $126,000 before the end of the year, with the recovery potentially accelerating after Oct. 6, according to Geoff Kendrick, global head of digital asset research at Standard Chartered.</p><p style='margin-bottom: 1.25em;'>Kendrick said in a Friday note shared with Cointelegraph that the latest rally has been driven largely by short liquidations, while inflows into spot Bitcoin exchange-traded funds have also started to recover. He said low open interest could leave room for more investors to return as prices rise.</p><p style='margin-bottom: 1.25em;'>\u201cFor the first time this year there is now a risk my end year forecast (of USD100k) is too low,\u201d Kendrick wrote.</p><p style='margin-bottom: 1.25em;'>In a Feb. 12 report, Kendrick cut Standard Chartered\u2019s year-end Bitcoin target to $100,000 from $150,000 and its Ether target to $4,000 from $7,500. At the time, he expected Bitcoin to fall to around $50,000 and Ether to $1,400 before recovering during the rest of the year.</p><p style='margin-bottom: 1.25em;'>MANTRA token sinks 18% to record low amid blockchain halt</p><p style='margin-bottom: 1.25em;'>MANTRA\u2019s native token sank 18.5% from its 24-hour high to a record low shortly before MANTRA Chain stopped producing blocks and its team announced a precautionary halt over an unexplained incident.</p><p style='margin-bottom: 1.25em;'>According to CoinGecko, MANTRA fell from $0.005060 to an all-time low of $0.004126 around 11:00 pm UTC on Thursday. It later recovered to about $0.0044 but remained down roughly 10% over 24 hours, while trading volume climbed nearly 600% to $24 million.</p><p style='margin-bottom: 1.25em;'>MANTRA said Friday it was \u201caware of an incident affecting MANTRA Chain\u201d and had halted the network as a precaution while it investigated. \u201cWe don\u2019t have a root cause or timeline to share yet,\u201d the project said, adding that all endpoints and transactions were frozen.</p><p style='margin-bottom: 1.25em;'>The halt prevents assets from moving on MANTRA Chain and has prompted affected exchanges to pause deposits and withdrawals, with no timeline given for either service to resume.</p>"}, {"id": 30, "source": "Mining.com", "category": "metals", "title": "New American Industrial Alliance\u00a0launches \u2018Ground Truth\u2019\u00a0critical minerals readiness survey", "link": "https://www.mining.com/new-american-industrial-alliance-launches-ground-truth-critical-minerals-readiness-survey/", "date_str": "Aug 21 \u2022 08:30 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>New American Industrial Alliance launches \u2018Ground Truth\u2019 critical minerals readiness survey</p><p style='margin-bottom: 1.25em;'>Supply chain AI company Exiger announced it has joined the New American Industrial Alliance, a US trade association founded in 2024 that brings together tech founders, venture capitalists, and manufacturers aiming to rebuild America\u2019s industrial base</p><p style='margin-bottom: 1.25em;'>The Wasghington \u2013based firm, which provides supply chain risk technology to the U.S. Government, said it joins AI and defense tech pioneers including Anduril, Divergent, Google, Hadrian, and Palantir to advance the coalition\u2019s mission to restore domestic manufacturing capacity and bolster national security.</p><p style='margin-bottom: 1.25em;'>NAIA and Exiger also announced their partnership on the launch of Ground Truth: The Exiger-NAIA Critical Minerals Readiness Survey \u2013 an industry snapshot on the current and future state of critical minerals supply that follows the White House\u2019s Executive Order 14415 \u201cSecuring America\u2019s Defense Supply Chains and Ensuring Domestic Acquisition of Critical Materials\u201d last month.</p><p style='margin-bottom: 1.25em;'>The survey of NAIA\u2019s member community and the broader U.S. industrial base will measure the actual state of critical mineral supply against real industrial demand, the company said.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019re excited to welcome Exiger to NAIA and kick off this partnership with a revealing dive into both the pain points and opportunities across the critical minerals landscape for domestic manufacturers,\u201d NAIA senior vice president Micah Murphy said in a news release.</p><p style='margin-bottom: 1.25em;'>\u201cExiger\u2019s leadership in supply chain, readiness, and procurement automation, coupled with their cutting-edge AI, deep data, and domain expertise, makes them a valuable ally in our work to strengthen and secure our most important supply chains.\u201d</p><p style='margin-bottom: 1.25em;'>Ground Truth was designed by the partnership to surface where demand is not being met by domestic or allied supply (down to the spec, grade, alloy, or purity level), where reshoring goals and sourcing capabilities diverge, and which gaps leave companies most exposed.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019re thrilled to partner with NAIA to provide a ground truth at the exact moment policymakers are taking action on critical mineral dependencies,\u201d Exiger\u2019s SVP, product market leadership Derek Lemke said.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019ve seen global bad actors attempt to weaponize the periodic table and leverage their control of critical mineral processing, refining, and exports, and hope the survey results inform policies that drive long-term resilience, including supply chain visibility, raw material traceability, and reduced dependency on adversarial supply.\u201d</p><p style='margin-bottom: 1.25em;'>Survey responses will inform a joint Exiger x NAIA research report, powered by 1EXIGER.AI, that will offer a blueprint for policymakers, federal buyers, investors, and industrial partners targeting where to best direct action and capital to accelerate America\u2019s reindustrialization.</p><p style='margin-bottom: 1.25em;'>The findings will be unveiled on September 16, 2026, in Washington, DC, at NAIA\u2019s The New Industrial Age Forum, which brings leaders from factory floors, laboratories, and construction into conversation with policymakers working to shape America\u2019s manufacturing renaissance, the company said.</p><p style='margin-bottom: 1.25em;'>The survey is here.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 31, "source": "Cointelegraph", "category": "crypto", "title": "Bitget CEO sees Bitcoin near current levels at year-end, doubts US will buy BTC", "link": "https://cointelegraph.com/markets/bitget-ceo-sees-bitcoin-near-current-levels-at-year-end-doubts-us-will-buy-btc?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 08:26 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitget CEO sees Bitcoin near current levels at year-end, doubts US will buy BTC</p><p style='margin-bottom: 1.25em;'>Gracy Chen says macroeconomic uncertainty could keep Bitcoin within $10,000 to $20,000 of current levels, while US government purchases remain unlikely within the next two years.</p><p style='margin-bottom: 1.25em;'>Bitget CEO Gracy Chen expects Bitcoin to remain broadly around current levels through the end of the year despite its recent surge, citing interest rates and broader macroeconomic conditions as key factors shaping the cryptocurrency\u2019s outlook.</p><p style='margin-bottom: 1.25em;'>Speaking on Cointelegraph\u2019s Trade Secrets podcast, Chen said predicting whether Bitcoin (BTC) will finish the year above or below $70,000 is difficult, pointing to the possibility of higher interest rates as one factor that could pressure prices.</p><p style='margin-bottom: 1.25em;'>Cointelegraph host interviews Bitget CEO Gracy Chen. Source: Trade Secrets</p><p style='margin-bottom: 1.25em;'>\u201cIf any of that happens, the price should go down, at least theoretically,\u201d Chen said, adding that BTC has become increasingly integrated with traditional finance and sensitive to broader macroeconomic conditions.</p><p style='margin-bottom: 1.25em;'>\u201cMy guess is maybe around the same range,\u201d Chen said, adding that BTC could finish the year $10,000 to $20,000 above or below current levels, which she described as her \u201cmore responsible\u201d forecast.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin rally sends crypto stocks soaring as miners, treasury companies jump</p><p style='margin-bottom: 1.25em;'>Chen sees US Bitcoin purchases as unlikely</p><p style='margin-bottom: 1.25em;'>Chen was also skeptical that the US government will begin purchasing Bitcoin for its national reserve before the end of President Donald Trump\u2019s term, calling such a move unlikely within the next two years.</p><p style='margin-bottom: 1.25em;'>The Trump administration established a Strategic Bitcoin Reserve in March 2025 using BTC already forfeited to the federal government, while directing officials to explore budget-neutral strategies for acquiring additional BTC.</p><p style='margin-bottom: 1.25em;'>The US government currently holds an estimated 328,372 BTC, according to BitcoinTreasuries.NET, much of it accumulated through law enforcement seizures and asset forfeitures rather than direct purchases.</p><p style='margin-bottom: 1.25em;'>Top 5 government Bitcoin holdings. Source: BitcoinTreasuries.NET</p><p style='margin-bottom: 1.25em;'>Chen said actively purchasing Bitcoin would be a significantly bigger policy decision, requiring debate among lawmakers and political parties despite the administration\u2019s broadly crypto-friendly stance.</p><p style='margin-bottom: 1.25em;'>\u201cFrom a policy perspective, it\u2019s probably unlikely,\u201d Chen said. \u201cI just don\u2019t see it coming right now.\u201d</p><p style='margin-bottom: 1.25em;'>Magazine: Bitcoin to $1M by 2030 is \u2018mathematically impossible\u2019 says Markus Thielen</p>"}, {"id": 32, "source": "Cointelegraph", "category": "crypto", "title": "Ray Dalio says to buy \u2018a bit\u2019 of Bitcoin amid potential debt crisis", "link": "https://cointelegraph.com/news/ray-dalio-buy-bitcoin-debt-crisis?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 08:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Ray Dalio says to buy \u2018a bit\u2019 of Bitcoin amid potential debt crisis</p><p style='margin-bottom: 1.25em;'>The hedge fund founder with an estimated net worth of $15 billion recommended that investors overweight Bitcoin and gold rather than bonds.</p><p style='margin-bottom: 1.25em;'>The founder of the Bridgewater Associates hedge fund, Ray Dalio, called on investors to put money into gold and \u201ca bit of Bitcoin\u201d in response to a looming debt crisis.</p><p style='margin-bottom: 1.25em;'>In a Friday LinkedIn post, Dalio said having between 10% to 15% of one\u2019s portfolio in gold could help reduce risk. He advocated for gold and Bitcoin (BTC) as assets to be overweight compared to debt assets like bonds, citing risks from \u201cinternal political and external geopolitical conflicts.\u201d</p><p style='margin-bottom: 1.25em;'>\u201cMy guess, which I suppose will be a bad one, is that [a US debt crisis] will come in three years, give or take two, if the course we\u2019re on is not changed,\u201d said Dalio.</p><p style='margin-bottom: 1.25em;'>The Bridgewater Associates founder, with an estimated net worth of more than $15 billion, has previously argued that Bitcoin could not replace gold as a store of value and warned about privacy concerns and threats from quantum computing. His Friday comments echoed those from July 2025, when he said he held some, \u201cbut not much\u201d Bitcoin, and recommended holding up to 15% in the cryptocurrency and gold.</p><p style='margin-bottom: 1.25em;'>In 2022, months before a significant crypto market downturn, Dalio said that holding between 1% to 2% of BTC in one\u2019s portfolio was \u201creasonable.\u201d</p><p style='margin-bottom: 1.25em;'>Related: \u2018No privacy\u2019 CBDCs will come, warns billionaire Ray Dalio</p>"}, {"id": 33, "source": "Cointelegraph", "category": "crypto", "title": "Onchain, in court: What happened in crypto legal news this week", "link": "https://cointelegraph.com/news/on-chain-in-court-crypto-legal-news5?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 07:19 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Onchain, in court: What happened in crypto legal news this week</p><p style='margin-bottom: 1.25em;'>The CFTC ordered a trading ban for former Alameda and FTX executives, and US prosecutors opposed a motion from a US soldier accused of profiting from the removal of Nicolas Maduro.</p><p style='margin-bottom: 1.25em;'>Update (Aug. 21, 9:50 pm UTC): This article has been updated to include information about the criminal case against Edward Zimbardi.</p><p style='margin-bottom: 1.25em;'>Former Alameda Research and FTX executives receive 5-year trading bans</p><p style='margin-bottom: 1.25em;'>On Tuesday, the US District Court for the Southern District of New York (SDNY) entered consent orders related to a 2022 enforcement action against former Alameda Research CEO Caroline Ellison and crypto exchange FTX co-founder Zixiao \u201cGary\u201d Wang.</p><p style='margin-bottom: 1.25em;'>The orders imposed by the US Commodity Futures Trading Commission (CFTC) required that Ellison and Wang receive a five-year trading ban related to their roles in the crypto exchange\u2019s collapse. The CFTC also ordered that the Alameda CEO receive a 10-year registration ban, while Wang received an eight-year registration ban.</p><p style='margin-bottom: 1.25em;'>According to CFTC enforcement director David Miller, the orders reflected Wang\u2019s and Ellison\u2019s \u201cmaterial assistance in the Commission\u2019s FTX-related investigations.\u201d The civil case is separate from criminal cases involving the misuse of customer funds at FTX, in which Ellison was sentenced to two years in prison and Wang received time served.</p><p style='margin-bottom: 1.25em;'>US prosecutors file opposition to Polymarket trader over $400,000 Maduro bet</p><p style='margin-bottom: 1.25em;'>On Wednesday, lawyers representing the US government in SDNY filed their opposition to a motion to dismiss from Gannon Ken Van Dyke, a US soldier who allegedly made more than $400,000 using event contracts on prediction market platform Polymarket using nonpublic information. Van Dyke was tied to the military operation that removed Venezuelan President Nicol\u00e1s Maduro in January.</p><p style='margin-bottom: 1.25em;'>Related: Judge stays CFTC\u2019s case against US soldier over prediction market bets</p><p style='margin-bottom: 1.25em;'>The US soldier\u2019s motion to dismiss, filed on July 31, included claims that the Commodity Exchange Act, at the center of three of the charges he faces, was \u201cambiguous\u201d in treating event contracts as \u201cswaps\u201d under the CFTC\u2019s purview. In its Wednesday filing, the US government argued that Van Dyke \u201cadvances hypotheticals, edge cases, and ongoing litigation over state gaming laws\u201d that were unnecessary to decide in order to move forward with the case.</p><p style='margin-bottom: 1.25em;'>\u201cVan Dyke\u2019s motion asks the Court to make a factual determination not appropriate at the motion-to-dismiss stage,\u201d said SDNY Deputy US Attorney Sean Buckley. \u201cHis argument relies on speculative assertions about facts, based on improper inferences from the Indictment and incorrect conclusions about the nature of the charge, to claim that facts do not amount to \u2018property.\u2019\u201d</p><p style='margin-bottom: 1.25em;'>As of Friday, the court had not posted any decision on the motion to the public docket.</p><p style='margin-bottom: 1.25em;'>Judge unseals 25-count indictment against alleged $165 million crypto fraudster</p><p style='margin-bottom: 1.25em;'>On Monday, a Georgia judge ordered an indictment unsealed involving an individual allegedly behind a $165 million cryptocurrency Ponzi scheme.</p><p style='margin-bottom: 1.25em;'>Initially indicted on July 8, Edward Zimbardi will face wire fraud and money laundering charges in the Northern District of Georgia after being deported from Fiji, where he fled after allegedly committing the crypto scheme. According to prosecutors, Zimbardi \u201ctricked thousands of people to invest in his \u2018Crypto Program\u2019 with false promises of enormous returns.\u201d</p><p style='margin-bottom: 1.25em;'>Magistrate Judge Anna Howard ordered Zimbardi\u2019s indictment unsealed this week, showing that the alleged crypto fraudster was being charged with 12 counts of wire fraud, one count of money laundering conspiracy and 11 counts of transactional money laundering based on activities at the Crypto Program between 2022 and 2023.</p><p style='margin-bottom: 1.25em;'>Prosecutors are also seeking the forfeiture of the proceeds of Zimbardi\u2019s alleged wire fraud and money laundering and crypto already seized upon potential conviction. The indictment listed 11.87 Bitcoin (BTC), 2.15 Ether (ETH), 713,344,695 Shiba Inu (SHIB), 47,110 USDt (USDT), 12,095 USDT0, 3.3 million XRP, 1,095 Dogecoin (DOGE), 10.2 million Osaka Protocol (OSAK) and 11.97 Polygon (POL) seized by Dutch authorities in 2024 \u2014 worth about $6 million combined.</p><p style='margin-bottom: 1.25em;'>Magazine: MiCA cracks down on USDT in Europe... but no one else cares</p>"}, {"id": 34, "source": "Cointelegraph", "category": "crypto", "title": "Bitcoin seeks support near $77K as BTC, gold near 100-day highs", "link": "https://cointelegraph.com/markets/bitcoin-seeks-support-near-77k-btc-gold-100-day-highs?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "date_str": "Aug 21 \u2022 07:10 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitcoin seeks support near $77K as BTC, gold near 100-day highs</p><p style='margin-bottom: 1.25em;'>Bitcoin volatility eased after BTC hit its highest level since mid-May, while gold joined the cryptocurrency in approaching three-month highs.</p><p style='margin-bottom: 1.25em;'>Bitcoin (BTC) consolidated above $77,000 after Friday\u2019s Wall Street open as gold joined the crypto rally to hit 14-week highs.</p><p style='margin-bottom: 1.25em;'>Key points:</p><p style='margin-bottom: 1.25em;'>- Bitcoin and gold both hit their highest levels since May 15 against the US dollar.</p><p style='margin-bottom: 1.25em;'>- Analysis ties the strong performance firmly to US government debt policy.</p><p style='margin-bottom: 1.25em;'>- Polymarket odds of Bitcoin reaching $90,000 before 2027 reach 48%.</p><p style='margin-bottom: 1.25em;'>Analysis: Bitcoin and gold gains not \u201csurprise\u201d</p><p style='margin-bottom: 1.25em;'>Data from TradingView showed BTC/USD cooling after reaching its highest levels since May 15, still up nearly 6% on the day.</p><p style='margin-bottom: 1.25em;'>BTC/USD one-hour chart. Source: Cointelegraph/TradingView</p><p style='margin-bottom: 1.25em;'>Gold echoed the move, reaching multi-month highs of $4,632 per ounce, up 2.2% on the day at the time of writing. On a monthly basis, BTC/USD and XAU/USD were up 13% and 16%, respectively.</p><p style='margin-bottom: 1.25em;'>BTC/USD vs. XAU/USD one-day chart. Source: Cointelegraph/TradingView</p><p style='margin-bottom: 1.25em;'>\u201cWhat\u2019s happening now in gold and crypto should not come as a surprise,\u201d market commentary The Kobeissi Letter wrote in a response on X.</p><p style='margin-bottom: 1.25em;'>Kobeissi attributed the rapid gains in precious metals and crypto to a combination of inflation, deficit spending and US Treasury policy. Record government deficit spending and the Treasury Department\u2019s pledge to at least double the size of certain debt buyback operations to $4 billion helped drive the rally in both asset classes, Kobeissi argued.</p><p style='margin-bottom: 1.25em;'>Discussing Bitcoin\u2019s reaction to the current macro landscape, trading company QCP Capital noted that the financial stress signals went beyond the US, highlighting surging Japanese government bond yields after a rare joint currency intervention in the yen earlier this month.</p><p style='margin-bottom: 1.25em;'>\u201cThe most notable cross-asset signal this week has been the divergence after Treasury\u2019s announcement. Treasuries initially rallied before giving back much of the move. BTC and gold did not retrace to the same extent,\u201d it wrote in its latest Market Color analysis, adding:</p><p style='margin-bottom: 1.25em;'>\u201cThat does not establish a new liquidity or monetary regime, but it does highlight the sensitivity of alternative assets to changes in long-end rates and the dollar.\u201d</p><p style='margin-bottom: 1.25em;'>Polymarket 2026 odds of $90,000 BTC near 50%</p><p style='margin-bottom: 1.25em;'>As BTC price upside passed 20% over two days, consensus over potential targets through year-end began to improve.</p><p style='margin-bottom: 1.25em;'>Data from prediction service Polymarket put the odds of BTC/USD hitting $90,000 before 2027 at 48% at the time of writing, up sharply since the start of the week.</p><p style='margin-bottom: 1.25em;'>Odds of BTC/USD hitting $90,000 by Jan. 1, 2027 (screenshot). Source: Polymarket</p><p style='margin-bottom: 1.25em;'>Related: Strategy Bitcoin treasury hits breakeven point as BTC price passes $77K</p><p style='margin-bottom: 1.25em;'>Some market participants, however, remained skeptical. Trader and analyst Rekt Capital stressed that Bitcoin needed to reclaim its 50-week exponential moving average (EMA) at $77,232, a trend line it rejected in January.</p><p style='margin-bottom: 1.25em;'>\u201cBreak the Downtrend and Bitcoin will confirm entry into a new technical Macro Uptrend. Reject from here however and price will maintain its series of Lower Highs,\u201d he told X followers.</p><p style='margin-bottom: 1.25em;'>\u201cHistory suggests there\u2019s still time for price to continue its Downtrend.\u201d</p><p style='margin-bottom: 1.25em;'>BTC/USD one-month chart. Source: Rekt Capital on X.com</p>"}, {"id": 35, "source": "Yahoo Finance", "category": "markets", "title": "U.S. Bank Business Shield Visa review: Solid 0% APR offer, but little long-term rewards value", "link": "https://finance.yahoo.com/personal-finance/credit-cards/review/us-bank-business-shield-visa-card-185336564.html", "date_str": "Aug 21 \u2022 06:53 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Some offers on this page are from advertisers who pay us, which may affect which products we write about, but not our recommendations. See our Advertiser Disclosure.</p><p style='margin-bottom: 1.25em;'>The U.S. Bank Business Shield\u2122 Visa\u00ae Card is a 0% APR card with no annual fee. If you're a business owner who wants to lower interest charges, you can use this card to transfer an existing debt balance or finance new purchases. The tradeoff? You'll get little long-term rewards value.</p><p style='margin-bottom: 1.25em;'>U.S. Bank Business Shield Visa overview</p><p style='margin-bottom: 1.25em;'>- Annual fee$0</p><p style='margin-bottom: 1.25em;'>- Introductory Purchases APR0% intro on purchases for 12 billing cycles</p><p style='margin-bottom: 1.25em;'>- Ongoing Purchases APR16.24% - 25.24% Variable</p><p style='margin-bottom: 1.25em;'>- Introductory Balance Transfer APR0% intro on balance transfers for 12 billing cycles</p><p style='margin-bottom: 1.25em;'>- Ongoing Balance Transfer APR16.24% - 25.24% Variable</p><p style='margin-bottom: 1.25em;'>- Rewards rate5% cash back on prepaid air, hotels, and car rentals booked directly in the Travel Center</p><p style='margin-bottom: 1.25em;'>- Benefits</p><p style='margin-bottom: 1.25em;'>- Earn a $50 annual statement credit after making $5,000 in purchases through the Travel Center</p><p style='margin-bottom: 1.25em;'>- Set up a 3-month $0 fee Extend Pay Plan offer each calendar year after the new account 0% introductory purchase APR offer has expired</p><p style='margin-bottom: 1.25em;'>- Terms & conditions apply</p><p style='margin-bottom: 1.25em;'>Additional info about the U.S. Bank Business Shield Visa Card</p><p style='margin-bottom: 1.25em;'>This card's primary benefit is its 0% introductory APR for purchases and balance transfers, but there are a few more perks for longer-term value:</p><p style='margin-bottom: 1.25em;'>-       $50 annual statement credit: Spend at least $5,000 each account anniversary year on travel booked through the U.S. Bank Travel Center, and you can earn a $50 statement credit to your account.</p><p style='margin-bottom: 1.25em;'>-       U.S. Bank Spend Management: Access U.S. Bank's platform for business owners. You can monitor and track spending across your account (including employee cards), integrate your card account with your accounting software, set permissions and spending limits, and more.</p><p style='margin-bottom: 1.25em;'>-       Purchase Security: Protect your eligible purchases against damage or theft for the first 90 days. This covers repairs, replacement, or reimbursement up to the purchase price with a $10,000 maximum per claim and $50,000 maximum per cardholder.</p><p style='margin-bottom: 1.25em;'>How to earn rewards</p><p style='margin-bottom: 1.25em;'>This card is primarily a 0% APR card, so you won't earn many rewards.</p><p style='margin-bottom: 1.25em;'>Still, you can get 5% cash back on prepaid airfare, hotel bookings, and car rentals booked through the U.S. Bank Travel Center. If you spend $5,000 annually through the Travel Center \u2014 enough to earn the $50 annual statement credit \u2014 you could get up to $250 cash back. Combined with the $50 statement credit, that's significant savings. However, you'll need to be willing to book all of your business travel through the portal.</p><p style='margin-bottom: 1.25em;'>How to redeem rewards</p><p style='margin-bottom: 1.25em;'>You can redeem your cash back rewards as a statement credit to your account or for a deposit into a U.S. Bank savings, checking, or money market account.</p><p style='margin-bottom: 1.25em;'>Minimum redemption amounts may vary, but you can also use Real-Time Rewards to redeem cash back toward a specific eligible purchase.</p><p style='margin-bottom: 1.25em;'>Your points won't expire as long as your account remains active. To keep your account active, you should have rewards, a balance, or purchase activity at least once every 12 billing cycles.</p><p style='margin-bottom: 1.25em;'>Who is the U.S. Bank Business Shield Visa Card best for?</p><p style='margin-bottom: 1.25em;'>The U.S. Bank Business Shield card is best for business owners seeking a 0% APR introductory period.</p><p style='margin-bottom: 1.25em;'>You can use the 0% APR on balance transfers if you have debt you want to pay off without interest. Transfer your debt within 30 days of opening your account, and be prepared to pay a balance transfer fee equal to 5% of the amount you transfer or $5, whichever is greater.</p><p style='margin-bottom: 1.25em;'>The 0% APR on purchases, on the other hand, can be helpful for financing a large purchase you have coming up or for floating your expenses over the intro period without interest.</p><p style='margin-bottom: 1.25em;'>If you take advantage of either 0% APR offer, make sure you have a plan to pay down your balance by the time the intro period ends. Any amount you have left to pay after that will start accruing interest at your card's regular ongoing APR.</p><p style='margin-bottom: 1.25em;'>This card may not be right for you if your primary goal is earning rewards on your business spending. While you can get cash back on U.S. Bank Travel Center purchases, there are plenty of other business credit cards with great rewards on all travel or on everyday expenses like office supplies, cell phone providers, dining out, gas stations, and more.</p><p style='margin-bottom: 1.25em;'>Some other business rewards cards also offer introductory 0% APRs \u2014 so you can use them to pay down your debt and then focus on earning rewards long-term.</p><p style='margin-bottom: 1.25em;'>U.S. Bank Business Shield Visa Card pros</p><p style='margin-bottom: 1.25em;'>-       No annual fee: You won't pay any annual fee to own this card.</p><p style='margin-bottom: 1.25em;'>-       0% APR introductory period: The U.S. Bank Business Shield is competitive among other 0% APR business cards with no annual fee. It has a long intro period and offers a 0% APR on both balance transfers and new purchases.</p><p style='margin-bottom: 1.25em;'>-       $50 annual statement credit: If you can book your business travel through the U.S. Bank Travel Center, you can benefit from this card's $50 statement credit after you spend $5,000 on eligible prepaid trips each year.</p><p style='margin-bottom: 1.25em;'>U.S. Bank Business Shield Visa Card cons</p><p style='margin-bottom: 1.25em;'>-       Limited rewards: You won't get many long-term rewards on your spending with the U.S. Bank Business Shield card. The only rewards category offered is 5% cash back on prepaid travel through the U.S. Bank Travel Center. If you want to earn rewards on business travel, this could limit your booking options.</p><p style='margin-bottom: 1.25em;'>-       No welcome bonus: You can benefit from this card's 0% APR as a new cardholder, but you won't be able to earn any bonus cash via a welcome bonus offer. Plenty of other business cash-back cards with 0% APRs have welcome bonuses.</p><p style='margin-bottom: 1.25em;'>-       Balance transfer fee: Many 0% APR cards charge fees for balance transfers. With this card, you'll pay the greater of 5% of your transferred balance or $5.</p><p style='margin-bottom: 1.25em;'>Where can you use the U.S. Bank Business Shield Visa Card?</p><p style='margin-bottom: 1.25em;'>As a Visa card, the U.S. Bank Business Shield can be used anywhere Visa is accepted online or in-store. Visa is one of the largest and most widely-accepted card networks in the world, so you shouldn't have a problem using it for your business spending.</p><p style='margin-bottom: 1.25em;'>However, this card does charge foreign transaction fees. You'll pay an extra 3% fee on top of your purchase when you use it abroad. If your business frequently takes you on international trips, look instead for a card with no foreign transaction fees.</p><p style='margin-bottom: 1.25em;'>How to make a U.S. Bank Business Shield Visa Card payment</p><p style='margin-bottom: 1.25em;'>-       Log into your online account or U.S. Bank's mobile app to make a payment. You can use a central billing account to make one payment for all cards, including employee cards, on your account.</p><p style='margin-bottom: 1.25em;'>-       Send payments by mail to: U.S. Bank P.O. Box 790408 St. Louis, MO 63179</p><p style='margin-bottom: 1.25em;'>U.S. Bank Business Shield Visa Card customer service info</p><p style='margin-bottom: 1.25em;'>-       Customer service is available 24/7</p><p style='margin-bottom: 1.25em;'>-       Phone number: 866-485-4545 or call the number on the back of your card</p><p style='margin-bottom: 1.25em;'>-       Chat online with a representative after logging into your account or mobile app from 8 am to 8 pm, Monday-Friday Central Time</p><p style='margin-bottom: 1.25em;'>-       Visit a U.S. Bank branch during business hours</p><p style='margin-bottom: 1.25em;'>-       U.S. Bank login page</p><p style='margin-bottom: 1.25em;'>Alternative cards to consider</p><p style='margin-bottom: 1.25em;'>The U.S. Bank Business Shield Visa has a great 0% APR offer for new cardholders. But if it's not right for your business, here are some similar no-annual-fee cards to consider.</p><p style='margin-bottom: 1.25em;'>The American Express Blue Business Cash\u2122 Card</p><p style='margin-bottom: 1.25em;'>- Annual fee$0</p><p style='margin-bottom: 1.25em;'>- Welcome offerEarn a $250 statement credit after you make $3,000 in purchases on your card in your first 3 months</p><p style='margin-bottom: 1.25em;'>- Introductory Purchases APR0% on purchases for 12 months from date of account opening</p><p style='margin-bottom: 1.25em;'>- Ongoing Purchases APR16.74% - 28.49% Variable</p><p style='margin-bottom: 1.25em;'>- Rewards rate</p><p style='margin-bottom: 1.25em;'>- 2% cash back on all eligible purchases on up to $50,000 per calendar year</p><p style='margin-bottom: 1.25em;'>- 1% cash back on all eligible purchases after spending $50,000 per calendar year (cash back earned is automatically credited to your statement)</p><p style='margin-bottom: 1.25em;'>- Benefits0% intro APR on purchases for 12 months from the date of account opening (then variable rate 16.74% - 28.49%, based on your creditworthiness and other factors as determined at the time of account opening; APRs will not exceed 29.99%)</p><p style='margin-bottom: 1.25em;'>Why we like it: The Amex Blue Business Cash card has an introductory APR for new purchases only. Combining that benefit with its cash welcome bonus could help you save significantly on a major upcoming purchase for your business. Long-term, you can use this card to earn a flat 2% cash back on everything you buy. You'll only earn the full 2% on the first $50,000 spent annually, though. After that, every purchase earns 1% cash back.</p><p style='margin-bottom: 1.25em;'>Ink Business Unlimited\u00ae Credit Card</p><p style='margin-bottom: 1.25em;'>- Annual fee$0</p><p style='margin-bottom: 1.25em;'>- Welcome offerEarn $1,000 bonus cash back after spending $8,000 in the first 4 months</p><p style='margin-bottom: 1.25em;'>- Introductory Purchases APR0% Intro APR on Purchases for 12 Months</p><p style='margin-bottom: 1.25em;'>- Ongoing Purchases APR16.74% - 24.74% Variable</p><p style='margin-bottom: 1.25em;'>- Rewards rate1.5% unlimited cash back on every business purchase</p><p style='margin-bottom: 1.25em;'>- Benefits</p><p style='margin-bottom: 1.25em;'>- $0 annual fee</p><p style='margin-bottom: 1.25em;'>- Generous intro APR on purchases</p><p style='margin-bottom: 1.25em;'>- You won't be held responsible for unauthorized charges made with your card or account information</p><p style='margin-bottom: 1.25em;'>Why we like it: With a valuable cash welcome bonus and an introductory APR on new purchases, the Ink Business Unlimited is another good option for financing a large business purchase. You'll also earn long-term rewards with this card. Each purchase earns 1.5% cash back, with no cap on how much you can earn.</p><p style='margin-bottom: 1.25em;'>Ink Business Cash\u00ae Credit Card</p><p style='margin-bottom: 1.25em;'>- Annual fee$0</p><p style='margin-bottom: 1.25em;'>- Welcome offerEarn $1,000 bonus cash back after spending $8,000 in the first 4 months</p><p style='margin-bottom: 1.25em;'>- Introductory Purchases APR0% Intro APR on Purchases for 12 months</p><p style='margin-bottom: 1.25em;'>- Ongoing Purchases APR16.74% - 24.74% Variable</p><p style='margin-bottom: 1.25em;'>- Rewards rate</p><p style='margin-bottom: 1.25em;'>- 5% cash back on the first $25,000 in combined spending at office supply stores and on internet, cable, and phone services each account anniversary year</p><p style='margin-bottom: 1.25em;'>- 2% cash back on the first $25,000 in combined spending on dining and gas each account anniversary year</p><p style='margin-bottom: 1.25em;'>- 1% cash back on all other purchases</p><p style='margin-bottom: 1.25em;'>- Benefits</p><p style='margin-bottom: 1.25em;'>- Get automatically checked for a credit line increase every 6 months or sooner</p><p style='margin-bottom: 1.25em;'>- Set individual spending limits on employee cards and earn rewards even faster</p><p style='margin-bottom: 1.25em;'>- Complimentary three-month lnstacart+ membership</p><p style='margin-bottom: 1.25em;'>Why we like it: The Ink Business Cash has a similarly solid intro APR period and cash welcome bonus, but its long-term rewards work a bit differently. First, get a great 5% cash back on up to $25,000 spent annually at office supply stores and on internet, cable, and phone services. You'll also get 2% cash back on dining and gas purchases up to the same $25,000 cap. Outside of those categories, everything else earns 1% cash back.</p><p style='margin-bottom: 1.25em;'>Editorial Disclosure: The information in this article has not been reviewed or approved by any advertiser. All opinions belong solely to Yahoo Finance and are not those of any other entity. The details on financial products, including card rates and fees, are accurate as of the publish date. All products or services are presented without warranty. Check the bank's website for the most current information. This site doesn't include all currently available offers. Credit score alone does not guarantee or imply approval for any financial product.</p>"}, {"id": 36, "source": "Yahoo Finance", "category": "markets", "title": "U.S. Bank Smartly Visa Signature Card review: Earn 2% cash back or more on every purchase", "link": "https://finance.yahoo.com/personal-finance/credit-cards/review/us-bank-smartly-visa-signature-card-182536863.html", "date_str": "Aug 21 \u2022 06:25 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Some offers on this page are from advertisers who pay us, which may affect which products we write about, but not our recommendations. See our Advertiser Disclosure.</p><p style='margin-bottom: 1.25em;'>The U.S. Bank Smartly\u2122 Visa Signature\u00ae Card makes it easy to maximize every purchase with 2% cash back. But if you have an existing U.S. Bank account with a qualifying balance, you can get even more: up to double the cash back on your spending.</p><p style='margin-bottom: 1.25em;'>U.S. Bank Smartly Visa Signature overview</p><p style='margin-bottom: 1.25em;'>- Annual fee$0</p><p style='margin-bottom: 1.25em;'>- Introductory Purchases APR0% intro on purchases for 12 billing cycles</p><p style='margin-bottom: 1.25em;'>- Ongoing Purchases APR18.24% - 28.24% Variable</p><p style='margin-bottom: 1.25em;'>- Introductory Balance Transfer APR0% intro on balance transfers for 12 billing cycles</p><p style='margin-bottom: 1.25em;'>- Ongoing Balance Transfer APR18.24% - 28.24% Variable</p><p style='margin-bottom: 1.25em;'>- Rewards rate</p><p style='margin-bottom: 1.25em;'>- Unlimited 2% cash back on every purchase</p><p style='margin-bottom: 1.25em;'>- Up to an additional 2% cash back on your first $10,000 in eligible purchases each billing cycle when paired with U.S. Bank Smartly\u00ae Savings account, plus qualifying balances in U.S. Bank Smartly\u00ae Checking and/or Safe Debit account</p><p style='margin-bottom: 1.25em;'>- Benefits</p><p style='margin-bottom: 1.25em;'>- Earn extra cash back on purchases with qualifying U.S. Bank savings and checking acounts</p><p style='margin-bottom: 1.25em;'>- Get your cash back directly deposited into your U.S. Bank checking or savings accounts, as a statement credit, a rewards card, merchant gift cards and more</p><p style='margin-bottom: 1.25em;'>- Terms & conditions apply</p><p style='margin-bottom: 1.25em;'>How to earn rewards</p><p style='margin-bottom: 1.25em;'>Earning rewards with this card is easy. You'll get a flat 2% cash back on every purchase. There's no cap, and you don't need to track spending categories or purchases.</p><p style='margin-bottom: 1.25em;'>The best way to earn rewards with this card, though, is by qualifying for the Smartly Earning Bonus. You can get up to 4% cash back on spending if you already have or open a U.S. Bank Smartly Savings account and you have a qualifying balance in a U.S. Bank Smartly Checking account or Safe Debit account.</p><p style='margin-bottom: 1.25em;'>Here's how much you'll earn with varying qualifying balances:</p><p style='margin-bottom: 1.25em;'>-       2.5% cash back with a qualifying balance between $10,000 and $49,999</p><p style='margin-bottom: 1.25em;'>-       3% cash back with a qualifying balance between $50,000 and $99,999</p><p style='margin-bottom: 1.25em;'>-       4% cash back with a qualifying balance of $100,000 or more</p><p style='margin-bottom: 1.25em;'>You'll earn the bonus rewards you qualify for on up to $10,000 in purchases each billing cycle. If you spend more than that per month, everything else still earns 2% cash back.</p><p style='margin-bottom: 1.25em;'>Some purchases are also excluded from the Smartly Earning Bonus, though they will still earn the standard 2% cash back. Exclusions include education/school, gift cards, insurance, taxes, business-to-business transactions, such as advertising services (even if the purchase isn't for a business purpose), and transactions that use a third-party bill payment service.</p><p style='margin-bottom: 1.25em;'>How to redeem rewards</p><p style='margin-bottom: 1.25em;'>You can redeem your cash back for full value as a deposit into a U.S. Bank account or as a statement credit to your card account.</p><p style='margin-bottom: 1.25em;'>Your rewards won't expire as long as your account is active. That means you must have at least one purchase, reward, or balance activity on your account every 12 billing cycles.</p><p style='margin-bottom: 1.25em;'>Who is the U.S. Bank Smartly Visa Signature Card best for?</p><p style='margin-bottom: 1.25em;'>The U.S. Bank Smartly Visa Signature is an easy pick for U.S. Bank customers with high enough balances to qualify for the Smartly Earning Bonus.</p><p style='margin-bottom: 1.25em;'>Most flat cash-back cards cap rewards at 2%. If you can earn even the lowest bonus rate (2.5% cash back with a qualifying balance between $10,000 and $49,999) your cash back earnings will multiply by a lot over time.</p><p style='margin-bottom: 1.25em;'>For example, say you spend about $20,000 each year on various purchases made with your card. Here's how your rewards would grow as you qualify for different Smartly Earning Bonus tiers:</p><p style='margin-bottom: 1.25em;'>-       Standard 2% cash back: $400 annually</p><p style='margin-bottom: 1.25em;'>-       2.5% cash back: $500 annually</p><p style='margin-bottom: 1.25em;'>-       3% cash back: $600 annually</p><p style='margin-bottom: 1.25em;'>-       4% cash back: $800 annually</p><p style='margin-bottom: 1.25em;'>However, the exclusions for the Smartly Earning Bonus are worth considering, depending on your spending. For example, taxes are excluded from the extra earnings. Paying your taxes with a credit card usually comes with a fee higher than 2% \u2014 so without the bonus, you likely won't earn enough to make up the payment fee.</p><p style='margin-bottom: 1.25em;'>Even if you don't have an eligible U.S. Bank account, this card's regular 2% cash back rate is still a great option for most everyday spending. That's among the highest rewards rates available from flat cash-back cards today.</p><p style='margin-bottom: 1.25em;'>Whether you want a standalone card to help you maximize every purchase or a card to use alongside higher-earning travel or rewards cards, the U.S. Bank Smartly Visa Signature could make a solid addition to your wallet without any added cost.</p><p style='margin-bottom: 1.25em;'>U.S. Bank Smartly Visa Signature Card pros</p><p style='margin-bottom: 1.25em;'>-       No annual fee: You won't have to pay any annual fee to own this card.</p><p style='margin-bottom: 1.25em;'>-       Introductory APR: The U.S. Bank Smartly Visa Signature offers an introductory APR on both new purchases and balance transfers. This can be a great option for earning cash back on an upcoming purchase or for paying down existing debt. After the intro period ends, you can use the card to earn cash back on your regular spending.</p><p style='margin-bottom: 1.25em;'>-       2% cash-back rewards: Flat 2% rewards on every purchase can help you rack up solid savings on your most frequent purchases. Since you won't have to worry about tracking categories or multipliers, this is a great option for simple rewards on spending.</p><p style='margin-bottom: 1.25em;'>U.S. Bank Smartly Visa Signature Card cons</p><p style='margin-bottom: 1.25em;'>-       No added benefits: You won't get many added benefits with this card over the long term. If you're looking for annual credits or travel perks, you may want to consider other rewards cards.</p><p style='margin-bottom: 1.25em;'>-       Need high balance to qualify for bonus rewards: This card offers an outstanding bonus rewards program worth up to 4% cash back on up to $10,000 each billing cycle. But to earn that max bonus, you'll need at least $100,000 in an eligible U.S. Bank account. If you don't bank with U.S. Bank or you don't have enough savings to score the Smartly Earnings Bonus, it'll be difficult to maximize this benefit.</p><p style='margin-bottom: 1.25em;'>-       No welcome bonus: While the U.S. Bank Smartly Visa Signature has great rewards, you won't have the opportunity to earn a welcome bonus with this card. Many other cash-back credit cards offer cash welcome bonuses worth $150 to $250 or even more after meeting a minimum spending requirement.</p><p style='margin-bottom: 1.25em;'>Where can you use the U.S. Bank Smartly Visa Signature Card?</p><p style='margin-bottom: 1.25em;'>The U.S. Bank Smartly Visa Signature is a Visa card, so you can use it at most places that accept credit cards. Visa is one of the most widely accepted card networks worldwide.</p><p style='margin-bottom: 1.25em;'>However, this card does have a 3% foreign transaction fee. When you use your card internationally, the fee you pay will exceed your rewards (unless you're in the highest Smartly Earning Bonus tier). While you can still use this card abroad, you may want to look for one with no foreign transaction fees instead if you travel often.</p><p style='margin-bottom: 1.25em;'>How to make a U.S. Bank Smartly Visa Signature Card payment</p><p style='margin-bottom: 1.25em;'>-       Make a payment through your online account or U.S. Bank's mobile app. In the app, select \"Transfer & pay,\" select your credit card bill, and then choose the checking or savings account you want to use to pay.</p><p style='margin-bottom: 1.25em;'>-       Send your payment by mail: Cardmember Service PO Box 790408 St. Louis, MO 63179</p><p style='margin-bottom: 1.25em;'>U.S. Bank Smartly Visa Signature Card customer service info</p><p style='margin-bottom: 1.25em;'>-       Customer service is available 24/7</p><p style='margin-bottom: 1.25em;'>-       Phone number: 800-285-8585 or call the number on the back of your card</p><p style='margin-bottom: 1.25em;'>-       Navigate to the \"Help center\" through your online account or choose \"Help & services\" then \"Contact us\" within the U.S. Bank mobile app</p><p style='margin-bottom: 1.25em;'>-       Visit a U.S. Bank location during business hours</p><p style='margin-bottom: 1.25em;'>-       U.S. Bank Smartly Visa Signature login page</p><p style='margin-bottom: 1.25em;'>Alternative cards to consider</p><p style='margin-bottom: 1.25em;'>The U.S. Bank Smartly Visa Signature offers great rewards and a 0% APR for no annual fee, but there are other valuable cash-back cards to consider before you apply. These are a few of our top picks:</p><p style='margin-bottom: 1.25em;'>Blue Cash Everyday\u00ae Card from American Express</p><p style='margin-bottom: 1.25em;'>- Annual fee$0</p><p style='margin-bottom: 1.25em;'>- Welcome offerEarn as high as $200 cash back after spending $2,000 within the first 6 months (welcome offers vary and you may not be eligible for an offer; cash back is received as Reward Dollars, redeemable for statement credit or at amazon.com checkout)</p><p style='margin-bottom: 1.25em;'>- Introductory Purchases APR0% on purchases for 15 months</p><p style='margin-bottom: 1.25em;'>- Ongoing Purchases APR19.49%-28.49% Variable</p><p style='margin-bottom: 1.25em;'>- Introductory Balance Transfer APR0% on balance transfers for 15 months</p><p style='margin-bottom: 1.25em;'>- Ongoing Balance Transfer APR19.49%-28.49% Variable</p><p style='margin-bottom: 1.25em;'>- Rewards rate</p><p style='margin-bottom: 1.25em;'>- 3% cash back at U.S. supermarkets (on up to $6,000 per year in eligible purchases, then 1%)</p><p style='margin-bottom: 1.25em;'>- 3% cash back on U.S. online retail purchases (on up to $6,000 per year in eligible purchases, then 1%)</p><p style='margin-bottom: 1.25em;'>- 3% cash back at U.S. gas stations (on up to $6,000 per year in eligible purchases, then 1%)</p><p style='margin-bottom: 1.25em;'>- 1% cash back on all other purchases</p><p style='margin-bottom: 1.25em;'>- Cash back is received in the form of Reward Dollars that can be redeemed as a statement credit or on Amazon.com at checkout</p><p style='margin-bottom: 1.25em;'>- Benefits</p><p style='margin-bottom: 1.25em;'>- Generous intro APR on purchases and balance transfers</p><p style='margin-bottom: 1.25em;'>- Get up to a $7 monthly statement credit after using your enrolled Blue Cash Everyday\u00ae Card for a subscription purchase, including a bundle subscription purchase, at DisneyPlus.com, Hulu.com, or Stream.ESPN.com U.S. websites (subject to auto-renewal)</p><p style='margin-bottom: 1.25em;'>Why we like it: The Blue Cash Everyday from Amex can help you make the most of everyday spending with 3% back (up to limits) across multiple categories, including U.S. supermarkets and U.S. gas stations, as well as U.S. online retailers, which isn't a common cash-back category. It also has no annual fee, a long intro APR offer for purchases and balance transfers, and a cash welcome bonus that you can earn as a new cardholder.</p><p style='margin-bottom: 1.25em;'>Chase Freedom Unlimited\u00ae</p><p style='margin-bottom: 1.25em;'>- Annual fee$0</p><p style='margin-bottom: 1.25em;'>- Welcome offerEarn a $200 bonus after you spend $500 on purchases in the first 3 months from account opening</p><p style='margin-bottom: 1.25em;'>- Introductory Purchases APR0% Intro APR on Purchases for 15 months</p><p style='margin-bottom: 1.25em;'>- Ongoing Purchases APR18.24% - 27.74% Variable</p><p style='margin-bottom: 1.25em;'>- Introductory Balance Transfer APR0% Intro APR on Balance Transfers for 15 months</p><p style='margin-bottom: 1.25em;'>- Rewards rate</p><p style='margin-bottom: 1.25em;'>- Enjoy 5% cash back on travel purchased through Chase Travel\u2120</p><p style='margin-bottom: 1.25em;'>- 3% cash back on drugstore purchases and dining at restaurants (includes takeout and eligible delivery service)</p><p style='margin-bottom: 1.25em;'>- 1.5% on all other purchases</p><p style='margin-bottom: 1.25em;'>- Benefits</p><p style='margin-bottom: 1.25em;'>- No minimum to redeem for cash back; use points to redeem for cash through an account statement credit or an electronic deposit into an eligible Chase account located in the U.S.</p><p style='margin-bottom: 1.25em;'>- Chase Credit Journey helps you monitor your credit with free access to your latest score, alerts, and more</p><p style='margin-bottom: 1.25em;'>- Generous intro APR on purchases and balance transfers</p><p style='margin-bottom: 1.25em;'>Why we like it: The no-annual-fee Chase Freedom Unlimited is a flat cash-back card with 1.5% back on everything. But you'll earn even more across select bonus categories, including travel booked through Chase Travel (5% cash back), and drugstores and restaurants (3% cash back). You can also earn a welcome bonus with this card and take advantage of an introductory APR on new purchases and balance transfers.</p><p style='margin-bottom: 1.25em;'>Wells Fargo Active Cash\u00ae Card</p><p style='margin-bottom: 1.25em;'>- Annual fee$0</p><p style='margin-bottom: 1.25em;'>- Welcome offerEarn a $200 cash rewards bonus after spending $500 within the first 3 months</p><p style='margin-bottom: 1.25em;'>- Introductory APR0% intro APR for 12 months from account opening on qualifying balance transfers (balance transfers made within 120 days qualify for the intro APR and intro balance transfer fee; 18.49%, 24.49%, or 28.49% variable APR after that)</p><p style='margin-bottom: 1.25em;'>- Purchase APR18.49%, 24.49%, or 28.49% variable APR</p><p style='margin-bottom: 1.25em;'>- Introductory Balance Transfer APR0% intro APR for 12 months from account opening on qualifying balance transfers</p><p style='margin-bottom: 1.25em;'>- Ongoing Balance Transfer APR18.49%, 24.49%, or 28.49% Variable APR</p><p style='margin-bottom: 1.25em;'>- Rewards rateUnlimited 2% cash rewards on purchases</p><p style='margin-bottom: 1.25em;'>- Benefits</p><p style='margin-bottom: 1.25em;'>- Get up to $600 of cell phone protection against damage or theft ($25 deductible applies)</p><p style='margin-bottom: 1.25em;'>- Pay-per-use 24/7 roadside dispatch assistance</p><p style='margin-bottom: 1.25em;'>- Auto rental collision damage waiver coverage</p><p style='margin-bottom: 1.25em;'>Why we like it: Simple cash-back rewards are the main benefit of the Wells Fargo Active Cash Card. Like the U.S. Bank Smartly Visa Signature, this card offers a flat 2% cash back on every purchase. It has no annual fee, offers an introductory APR for new purchases and balance transfers, and even comes with a solid cash welcome bonus.</p><p style='margin-bottom: 1.25em;'>Editorial Disclosure: The information in this article has not been reviewed or approved by any advertiser. All opinions belong solely to Yahoo Finance and are not those of any other entity. The details on financial products, including card rates and fees, are accurate as of the publish date. All products or services are presented without warranty. Check the bank's website for the most current information. This site doesn't include all currently available offers. Credit score alone does not guarantee or imply approval for any financial product.</p>"}, {"id": 37, "source": "Mining.com", "category": "metals", "title": "Silver price 20% August surge sends miners soaring", "link": "https://www.mining.com/silver-price-20-august-surge-sends-miners-soaring/", "date_str": "Aug 21 \u2022 05:02 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Silver price 20% August surge sends miners soaring</p><p style='margin-bottom: 1.25em;'>Silver surged about 20% in August to touch $70 an ounce Friday as the US Treasury\u2019s decision to double long-bond buybacks extended a powerful bid for precious metals.</p><p style='margin-bottom: 1.25em;'>Spot silver reached $70 an ounce on August 21 before easing slightly, up from about $57.59 at the end of July. The rapid advance has pushed the metal beyond several banks\u2019 full-year average forecasts while leaving it below many of their more bullish year-end targets.</p><p style='margin-bottom: 1.25em;'>Silver equities have moved even faster, with the largest producers, streamers and junior-focused exchange-traded funds amplifying the metal\u2019s gains as investors pile into the sector.</p><p style='margin-bottom: 1.25em;'>The rally highlights silver\u2019s leverage to shifts in monetary conditions and investor demand. With bullion already at levels that recently looked aggressive, attention is turning to whether miners can sustain their outperformance and how much of Wall Street\u2019s bullish outlook has already been priced in.</p><p style='margin-bottom: 1.25em;'>Miners amplify</p><p style='margin-bottom: 1.25em;'>Hecla Mining (NYSE: HL), the largest US silver producer, led the group with a 47% August gain, more than twice the metal\u2019s advance.</p><p style='margin-bottom: 1.25em;'>Wheaton Precious Metals (TSX, NYSE: WPM) climbed 44%, while Coeur Mining (NYSE: CDE), First Majestic Silver (NYSE: AG) and Fortuna Mining (NYSE: FSM) each gained 42%. Silvercorp Metals (NYSE: SVM) advanced 36%.</p><p style='margin-bottom: 1.25em;'>The Global X Silver Miners ETF (NYSE Arca: SIL) rose 35%, while the ETFMG Prime Junior Silver Miners ETF (NYSE Arca: SILJ), which focuses on smaller developers, added 32%.</p><p style='margin-bottom: 1.25em;'>Pan American Silver (TSX, NYSE: PAAS), the world\u2019s largest primary silver producer, gained 22%. While that was the weakest performance among the group, it still exceeded silver\u2019s roughly 20% advance.</p><p style='margin-bottom: 1.25em;'>The broad outperformance shows how quickly operating and market leverage can flow through silver equities during a sharp metals rally. It also raises the stakes if bullion reverses, because the same leverage that boosts miners during an upswing can magnify losses when prices retreat.</p><p style='margin-bottom: 1.25em;'>Bank targets</p><p style='margin-bottom: 1.25em;'>Major bank forecasts remain widely dispersed, reflecting uncertainty over how far silver\u2019s rally can run after its rapid ascent. Year-end and peak calls stretch from roughly $67 to $118 an ounce, while several institutions see potential for triple-digit prices.</p><p style='margin-bottom: 1.25em;'>UBS targets $80 an ounce at year-end, while J.P. Morgan has an $85 fourth-quarter high and warns of downside risk to $50. Goldman Sachs forecasts a full-year average range of $85 to $100.</p><p style='margin-bottom: 1.25em;'>Citigroup is more bullish, targeting $110 an ounce for the second half and maintaining a medium-term range of $110 to $150. CIBC sees about $105 at year-end, while BNP Paribas targets roughly $100.</p><p style='margin-bottom: 1.25em;'>At the more conservative end, ING forecasts $74 for the fourth quarter and HSBC sees a $75 full-year average. Commerzbank has a $67 year-end target, although it retains a longer-term bullish target of $90.</p><p style='margin-bottom: 1.25em;'>Bank of America has a $85.93 full-year average baseline and sees silver exceeding $100 in the fourth quarter. Its tail-risk scenario stretches from $135 to $309 if the gold-to-silver ratio compresses sharply.</p><p style='margin-bottom: 1.25em;'>BMO Capital Markets forecasts a $74.50 full-year average but retains a $160 fourth-quarter bull case based on similar ratio compression. TD Securities has the highest peak call among the forecasts at $118, alongside a much more bearish $44 full-year average baseline.</p><p style='margin-bottom: 1.25em;'>Scotiabank forecasts a $65 full-year average, while Royal Bank of Canada maintains an outperform view and highlights a central recovery band around $75 extending into 2027. Bain Commodities sees an $85 peak against an annual average near $63.50.</p><p style='margin-bottom: 1.25em;'>The range underscores how dramatically silver\u2019s August rally has changed the debate. At $70, the metal has already overtaken some banks\u2019 baseline expectations, leaving the next leg dependent on whether investment demand can keep pushing prices towards the increasingly crowded cluster of forecasts in the $74-to-$100 range.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 38, "source": "Mining.com", "category": "metals", "title": "Mining\u2019s next biggest challenge is securing talent", "link": "https://www.mining.com/minings-next-biggest-challenge-is-securing-talent/", "date_str": "Aug 21 \u2022 04:37 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Mining\u2019s next biggest challenge is securing talent</p><p style='margin-bottom: 1.25em;'>As gold prices go up and more mining projects receive incentives and approvals, the global mining workforce seems to be going in the opposite direction.</p><p style='margin-bottom: 1.25em;'>A Canadian Mining Industry Human Resources Council (MiHR) survey from 2024 showed that 70% of people aged between 15 and 30 would not consider a career in mining, with concerns ranging from safety and lack of flexibility to environmental concerns. This is becoming a bigger issue as many mining executives report that the talent shortage is starting to affect production levels, innovation and is delaying projects.</p><p style='margin-bottom: 1.25em;'>Industry experts now say their biggest concern is not the cost of assets or project development, but rather how there\u2019s a lack of talent in the pipeline to keep the industry alive.</p><p style='margin-bottom: 1.25em;'>\u201cThere\u2019s a very acute shortage of talent in the industry and it\u2019s a function of two factors. One, there are a lot of people retiring. And two, there\u2019s not many people coming into the industry,\u201d Rob McEwen, Chairman of McEwen Inc. said in a recent interview with MINING.COM host Devan Murugan on Top of Mine.</p><p style='margin-bottom: 1.25em;'>In the US, more than half of the workforce is expected to retire in the next three years.</p><p style='margin-bottom: 1.25em;'>In Canada, 20% of workers are 55 years old or older, while only 5% are under 25 years old. About 46% of Gen-Z workers plan to quit mining and energy-related jobs in the next two years, according to Deloitte.</p><p style='margin-bottom: 1.25em;'>The sector is expanding, as interest in working in it shrinks.</p><p style='margin-bottom: 1.25em;'>This is also related to how mining is perceived by those that don\u2019t have much co
