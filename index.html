 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 70, "source": "Federal Reserve - Releases", "category": "economy", "title": "Federal Reserve Board issues enforcement action with SouthPoint Bancshares, Inc. and announces termination of enforcement action with Deutsche Bank AG, DB USA Corporation, and Deutsche Bank AG New York Branch", "link": "https://www.federalreserve.gov/newsevents/pressreleases/enforcement20260820b.htm", "iso_date": "2026-08-20T15:00:00+00:00", "date_str": "Aug 20 \u2022 03:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>August 20, 2026</p><p style='margin-bottom: 1.25em;'>Federal Reserve Board issues enforcement action with SouthPoint Bancshares, Inc. and announces termination of enforcement action with Deutsche Bank AG, DB USA Corporation, and Deutsche Bank AG New York Branch</p><p style='margin-bottom: 1.25em;'>For release at 11:00 a.m. EDT</p><p style='margin-bottom: 1.25em;'>The Federal Reserve Board on Thursday announced the execution of the following enforcement action listed below:</p><p style='margin-bottom: 1.25em;'>SouthPoint Bancshares, Inc., Birmingham, Alabama</p><p style='margin-bottom: 1.25em;'>Written Agreement dated August 14, 2026</p><p style='margin-bottom: 1.25em;'>The Federal Reserve Board also announced the termination of the enforcement action listed below:</p><p style='margin-bottom: 1.25em;'>Deutsche Bank AG, Frankfurt am Main, Germany, DB USA Corporation, New York, New York, and Deutsche Bank AG New York Branch, New York, New York</p><p style='margin-bottom: 1.25em;'>Cease and Desist Order dated April 20, 2017 (PDF)</p><p style='margin-bottom: 1.25em;'>Terminated August 13, 2026</p><p style='margin-bottom: 1.25em;'>Additional enforcement actions can be searched for here.</p><p style='margin-bottom: 1.25em;'>For media inquiries, please email [email protected] or call 202-452-2955.</p>"}, {"id": 71, "source": "Federal Reserve - Releases", "category": "economy", "title": "Federal Reserve Board issues enforcement actions with former employee of Regions Bank and former employee of United Community Bank", "link": "https://www.federalreserve.gov/newsevents/pressreleases/enforcement20260820a.htm", "iso_date": "2026-08-20T15:00:00+00:00", "date_str": "Aug 20 \u2022 03:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>August 20, 2026</p><p style='margin-bottom: 1.25em;'>Federal Reserve Board issues enforcement actions with former employee of Regions Bank and former employee of United Community Bank</p><p style='margin-bottom: 1.25em;'>For release at 11:00 a.m. EDT</p><p style='margin-bottom: 1.25em;'>The Federal Reserve Board on Thursday announced the execution of the enforcement actions listed below:</p><p style='margin-bottom: 1.25em;'>Consent prohibition against Stephanie R. Kilbert</p><p style='margin-bottom: 1.25em;'>Former employee of Regions Bank, Birmingham, Alabama</p><p style='margin-bottom: 1.25em;'>Misappropriation of customer funds</p><p style='margin-bottom: 1.25em;'>Consent prohibition against Crystal A. Wykle</p><p style='margin-bottom: 1.25em;'>Former employee of United Community Bank, Greenville, South Carolina</p><p style='margin-bottom: 1.25em;'>Misappropriation of customer funds</p><p style='margin-bottom: 1.25em;'>Additional enforcement actions can be searched for here.</p><p style='margin-bottom: 1.25em;'>For media inquiries, please email [email protected] or call 202-452-2955.</p>"}, {"id": 72, "source": "Mining.com", "category": "metals", "title": "Colombia gold mine collapse kills 13 workers", "link": "https://www.mining.com/colombia-gold-mine-collapse-kills-13-worker/", "iso_date": "2026-08-20T14:03:00+00:00", "date_str": "Aug 20 \u2022 02:03 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Colombia gold mine collapse kills 13 workers</p><p style='margin-bottom: 1.25em;'>At least 13 workers have been killed and another seven injured in a landslide at an open pit gold mine in southwestern Colombia, in one of the country\u2019s latest deadly mining accidents.</p><p style='margin-bottom: 1.25em;'>The incident happened on Wednesday night when a slope collapse at the mine located in a rural area of Policarpa, in Nari\u00f1o department, according to local authorities. Firefighters, residents and emergency crews using excavators searched the site until about 2 a.m. Thursday, when officials said all those reported missing had been found.</p><p style='margin-bottom: 1.25em;'>Authorities initially received reports of an explosion, but later determined that a landslide had caused the disaster, according to Radio Caracol. The Nari\u00f1o governor\u2019s office has not said whether the gold operation held mining permits or was operating illegally, an important distinction in a region where authorities regularly target unauthorized mines linked to armed groups and environmental damage.</p><p style='margin-bottom: 1.25em;'>Witnesses said four of those killed belonged to the same Indigenous family. Residents said about 50 people, most of them members of the Quillacinga Indigenous group, regularly worked at the mine near Policarpa.</p><p style='margin-bottom: 1.25em;'>Informal mining</p><p style='margin-bottom: 1.25em;'>Deadly accidents are a recurring risk in Colombia\u2019s mining sector, particularly at unlicensed operations where workers extract precious metals without formal oversight or safety controls. An estimated 200,000 to 400,000 people participate in artisanal mining across the country, with many families relying on sales of gold and gemstones for income.</p><p style='margin-bottom: 1.25em;'>Illegal gold production presents a broader challenge. Criminal organizations, including armed groups and drug cartels, have used gold mining as a source of revenue, moving production through intermediaries and disguising its origins with apparently legitimate documentation before it enters international supply chains.</p><p style='margin-bottom: 1.25em;'>The risks extend beyond mine sites. A recent New York Times investigation found that Colombian gold linked to criminal networks entered the supply chain of the US Mint, which under federal law must use US-mined gold for its investor-grade coins.</p><p style='margin-bottom: 1.25em;'>Previous investigations and enforcement actions have also traced Latin American gold, including supplies originating in Peru and Ecuador, to North American refiners and traders after illicit material was mixed with legitimate production or exported using falsified documents.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}];
    let currentFilter = 'all';
    let currentSearch = '';
    let selectedId = articles.length > 0 ? articles[0].id : null;

    const headlineStream = document.getElementById('headlineStream');
    const detailPane = document.getElementById('detailPane');
    const searchInput = document.getElementById('searchInput');

    function formatLocalTime(isoStr) {
      if (!isoStr) return 'Recent';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return 'Recent';
        return d.toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric'
        }) + ' • ' + d.toLocaleTimeString(undefined, {
          hour: 'numeric',
          minute: '2-digit'
        });
      } catch (e) {
        return 'Recent';
      }
    }

    function renderStream() {
      headlineStream.innerHTML = '';
      
      const filtered = articles.filter(a => {
        const artCat = (a.category || '').toLowerCase().trim();
        const filterCat = (currentFilter || '').toLowerCase().trim();
        const matchesCategory = filterCat === 'all' || artCat === filterCat;
        const matchesSearch = currentSearch === '' || 
          a.title.toLowerCase().includes(currentSearch) || 
          a.source.toLowerCase().includes(currentSearch);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        headlineStream.innerHTML = '<div class="empty-state" style="padding: 30px;">No matching articles in this category.</div>';
        detailPane.innerHTML = '<div class="empty-state">No matching story found.</div>';
        return;
      }

      filtered.forEach(a => {
        const row = document.createElement('div');
        row.className = `headline-row ${a.id === selectedId ? 'active' : ''}`;
        row.onclick = () => selectArticle(a.id);
        row.innerHTML = `
          <div class="row-meta">
            <div class="row-tags">
              <span class="badge badge-${a.category}">${a.category.toUpperCase()}</span>
              <span class="source-label">${a.source}</span>
            </div>
            <span class="time-label">${formatLocalTime(a.iso_date)}</span>
          </div>
          <div class="row-title">${a.title}</div>
        `;
        headlineStream.appendChild(row);
      });

      if (!filtered.some(a => a.id === selectedId) && filtered.length > 0) {
        selectArticle(filtered[0].id);
      }
    }

    function selectArticle(id) {
      selectedId = id;
      const article = articles.find(a => a.id === id);
      if (!article) return;

      renderStream();

      detailPane.innerHTML = `
        <div class="reader-container">
          <div class="detail-meta">
            <span class="badge badge-${article.category}">${article.category.toUpperCase()}</span>
            <span class="source-label" style="font-size: 12px; font-weight: 600;">${article.source}</span>
            <span class="time-label">• ${formatLocalTime(article.iso_date)}</span>
          </div>
          <h2 class="detail-title">${article.title}</h2>
          <div class="detail-body">${article.full_text}</div>
          <div class="action-bar">
            <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="primary-btn">
              Open Original Source ↗
            </a>
          </div>
        </div>
      `;
      detailPane.scrollTop = 0;
    }

    function filterCategory(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.tab-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderStream();
    }

    searchInput.addEventListener('input', () => {
      currentSearch = searchInput.value.toLowerCase().trim();
      renderStream();
    });

    renderStream();
    if (articles.length > 0) {
      selectArticle(articles[0].id);
    }
  </script>
