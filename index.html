tle": "Ukrainian drones hit Ozon warehouse as Russia reports major overnight attack", "link": "https://www.investing.com/news/economy-news/ukrainian-drones-hit-ozon-warehouse-as-russia-reports-major-overnight-attack-4872319", "iso_date": "2026-08-22T08:50:16+00:00", "date_str": "Aug 22 \u2022 08:50 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 28, "source": "Investing.com Indicators", "category": "economy", "title": "Where are central banks keeping their gold?", "link": "https://www.investing.com/news/economy-news/where-are-central-banks-keeping-their-gold-4872312", "iso_date": "2026-08-22T08:03:55+00:00", "date_str": "Aug 22 \u2022 08:03 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 29, "source": "Investing.com Indicators", "category": "economy", "title": "Vatican plans \u20ac100 million agrivoltaic energy plant near Rome", "link": "https://www.investing.com/news/economy-news/vatican-plans-100-million-agrivoltaic-energy-plant-near-rome-4872309", "iso_date": "2026-08-22T07:27:32+00:00", "date_str": "Aug 22 \u2022 07:27 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 30, "source": "Investing.com Indicators", "category": "economy", "title": "U.S. judge strikes down immigrant visa suspension covering 75 countries", "link": "https://www.investing.com/news/economy-news/us-judge-strikes-down-immigrant-visa-suspension-covering-75-countries-4872307", "iso_date": "2026-08-22T06:56:30+00:00", "date_str": "Aug 22 \u2022 06:56 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 31, "source": "Investing.com Indicators", "category": "economy", "title": "China\u2019s robot games evolve from science fair to strategic showcase", "link": "https://www.investing.com/news/economy-news/chinas-robot-games-evolve-from-science-fair-to-strategic-showcase-4872305", "iso_date": "2026-08-22T06:15:32+00:00", "date_str": "Aug 22 \u2022 06:15 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 32, "source": "Investing.com Indicators", "category": "economy", "title": "Reform UK infighting complicates Farage\u2019s push to prepare party to govern", "link": "https://www.investing.com/news/economy-news/reform-uk-infighting-complicates-farages-push-to-prepare-party-to-govern-4872304", "iso_date": "2026-08-22T05:56:35+00:00", "date_str": "Aug 22 \u2022 05:56 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Summary not provided by publisher.</p>"}, {"id": 33, "source": "Yahoo Finance", "category": "markets", "title": "Bill Gates pulls $818M from Berkshire to buy this giant", "link": "https://finance.yahoo.com/markets/stocks/articles/bill-gates-pulls-818m-berkshire-030700591.html", "iso_date": "2026-08-22T03:07:00+00:00", "date_str": "Aug 22 \u2022 03:07 AM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>If there's a habit I've picked up from watching markets, it's that when everyone is looking at the loudest trade, I start wondering what's happening in the quiet corners.</p><p style='margin-bottom: 1.25em;'>The biggest clues aren't always found in a soaring stock that's already overvalued or a famous analyst calling for a breakout. Sometimes they're buried somewhere else that investors never bother to open. I'd put this one in the last category.</p><p style='margin-bottom: 1.25em;'>The latest 13F filing from the Bill & Melinda Gates Foundation Trust shows a new $352.7 million position in The Home Depot (HD). At the same time, the trust cut its stake in Berkshire Hathaway by about $818 million.</p><p style='margin-bottom: 1.25em;'>That's not pocket change, and it's certainly not the kind of portfolio move I'd scroll past without asking why.</p><p style='margin-bottom: 1.25em;'>Why? This is big money moving from one of the market's most iconic investments into a home-improvement giant. There must be a story hiding underneath the numbers. The trust just bought the shares while everyone else seems to be waiting for the housing market to come back to life.</p><p style='margin-bottom: 1.25em;'>The trust now holds 1 million shares of The Home Depot. That's a meaningful opening position for a portfolio with $34.42 billion in managed 13F securities, according to WhaleWisdom.</p><p style='margin-bottom: 1.25em;'>And it arrives at a moment when The Home Depot just delivered its strongest comparable sales growth since 2022, despite what its own CFO describes as \"frozen housing market conditions.\"</p><p style='margin-bottom: 1.25em;'>Why Gates Trust trimmed Berkshire and opened The Home Depot</p><p style='margin-bottom: 1.25em;'>The Gates Foundation Trust's portfolio is concentrated and deliberate. Its top five holdings include Berkshire Hathaway Class B (BRK.B), Caterpillar (CAT), Canadian National Railway (CNI), Waste Management (WM), and Deere & Company (DE), according to GuruFocus data.</p><p style='margin-bottom: 1.25em;'>These are long-duration bets on essential infrastructure, industrials, and American economic activity.</p><p style='margin-bottom: 1.25em;'>The Home Depot fits that same framework anyway. It's the world's largest home improvement retailer, tied directly to the American housing stock, The Home Depot reports.</p><p style='margin-bottom: 1.25em;'>The trust also opened a new position in FedEx Freight Holding Company (FDXF) worth approximately $180 million in the same quarter, according to the 13F filing. That's another infrastructure-adjacent business that I'll most likely cover next.</p><p style='margin-bottom: 1.25em;'>My understanding is that the trust is rotating toward companies that benefit from domestic economic activity and physical asset maintenance rather than purely financial holdings. Call me crazy, but that sounds like a pretty interesting investment thesis.</p><p style='margin-bottom: 1.25em;'>What The Home Depot's Q2 results show about why this bet makes sense now</p><p style='margin-bottom: 1.25em;'>The Home Depot reported Q2 fiscal 2026 results on Aug. 18 that beat expectations across the board.</p><p style='margin-bottom: 1.25em;'>Net sales of $47.9 billion, up 5.7% year-over-year (YoY)</p><p style='margin-bottom: 1.25em;'>Comparable sales growth of 1.7% \u2014 the highest since 2022</p><p style='margin-bottom: 1.25em;'>Adjusted diluted EPS of $4.92, up from $4.68 in the prior year period</p><p style='margin-bottom: 1.25em;'>Net earnings of $4.8 billion, or $4.79 per diluted share</p><p style='margin-bottom: 1.25em;'>CFO Richard McPhail was candid about the environment in a CNBC interview.</p><p style='margin-bottom: 1.25em;'>\"We continue to operate in what I call frozen housing market conditions,\" he said. \"But we also know that we're taking share and that we're serving our customers better every day.\"</p><p style='margin-bottom: 1.25em;'>That phrase \u2014 taking share in a frozen market \u2014 is the crux of the investment case. The Home Depot's comparable sales growth isn't being driven by a housing recovery. It's being driven by smaller, non-discretionary repair and maintenance projects that homeowners undertake regardless of whether they're buying or selling.</p><p style='margin-bottom: 1.25em;'>When a roof leaks or a water heater fails, it gets replaced. Like it or not, The Home Depot captures that spending whether mortgage rates are at 3% or 7%.</p><p style='margin-bottom: 1.25em;'>The company also received $730 million in tariff refunds during Q2, using $685 million to reduce cost of goods sold, according to McPhail's comments on the earnings call.</p><p style='margin-bottom: 1.25em;'>That pass-through to customers mirrors Walmart's own approach to tariff refunds, as I noted in my previous coverage, highlighting a broader pattern among major retailers navigating the current trade environment.</p><p style='margin-bottom: 1.25em;'>BofA's read on why the stock's underperformance creates an opportunity</p><p style='margin-bottom: 1.25em;'>Bank of America analyst Christopher Nardone reiterated a Buy rating on The Home Depot and adjusted his price target to $407 from $412, according to a note shared with my colleague at TheStreet.</p><p style='margin-bottom: 1.25em;'>The modest target reduction reflects the cautious guidance The Home Depot reaffirmed rather than raised. But the Buy rating holds.</p><p style='margin-bottom: 1.25em;'>The Home Depot's reaffirmed fiscal 2026 guidance calls for total sales growth of 2.5% to 4.5% and comparable sales growth of flat to 2.0%, according to The Home Depot. Gross margin is projected at approximately 33.1%, with operating margin between 12.4% and 12.6%.</p><p style='margin-bottom: 1.25em;'>McPhail described the customer as \"a healthy cohort\" who has \"the means to spend\" but remains hesitant as projects get larger, citing inflation, fuel costs, and general uncertainty, according to his CNBC interview.</p><p style='margin-bottom: 1.25em;'>That hesitancy is real, but it's also temporary. The deferred maintenance and renovation spending building up in the U.S. housing stock doesn't disappear. It accumulates.</p><p style='margin-bottom: 1.25em;'>This is how The Home Depot has performed lately</p><p style='margin-bottom: 1.25em;'>HD shares were trading at $334.49 as of Aug. 20, down 1.41% year-to-date and 14.53% over the past year, according to Yahoo Finance. That's roughly $18 down from where Gates opened their buy position.</p><p style='margin-bottom: 1.25em;'>My read is that the Gates Foundation is buying The Home Depot at a point of maximum pessimism about housing.</p><p style='margin-bottom: 1.25em;'>Bank of America's $407 target implies roughly 22% upside from current levels. The Gates Foundation, apparently, agrees with the direction.</p>"}, {"id": 34, "source": "Mining.com", "category": "metals", "title": "Central Nevada Gold on mine hunt: CEO", "link": "https://www.mining.com/central-nevada-gold-on-mine-hunt-ceo/", "iso_date": "2026-08-21T22:45:00+00:00", "date_str": "Aug 21 \u2022 10:45 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Central Nevada Gold on mine hunt: CEO</p><p style='margin-bottom: 1.25em;'>Privately held developer Central Nevada Gold will look at acquiring other precious metals assets in the state after buying the past-producing Mule Canyon mine from Newmont (NYSE, ASX: NEM; TSX: NGT) earlier this summer, CEO Simon Griffiths said.</p><p style='margin-bottom: 1.25em;'>Having closed the $20-million Mule Canyon acquisition in late June, Central Nevada is now working to advance the asset through prefeasibility and permitting in next year\u2019s second half with the goal of delivering a construction decision in 2028.</p><p style='margin-bottom: 1.25em;'>It expects to announce a new mineral resource estimate for the property in the coming months. An initial public offering is also in the works, possibly as early as the first half of 2027, Griffiths said.</p><p style='margin-bottom: 1.25em;'>\u201cOur priority is Mule Canyon, and that will attract 110% of our attention in the short term, but given the balance sheet, the pedigree of the project we have in our stable already and the shareholder base, we will most certainly be looking and keeping an eye out for other opportunities in Nevada,\u201d Griffiths said in an interview.</p><p style='margin-bottom: 1.25em;'>Discovered in 1986 by Gold Fields (JSE, NYSE: GFI), Mule Canyon was brought into production by Newmont in 1996, churning out about 500,000 oz. of the yellow metal over five years. Mining ended in 2000 due to low gold prices after only two of six zones had been mined and fewer than half of the pre-mining reserves had been extracted, leaving significant unexploited potential.</p><p style='margin-bottom: 1.25em;'>Non-core mines</p><p style='margin-bottom: 1.25em;'>Major gold producers such as Newmont and Barrick Mining (TSX: ABX; NYSE: B) have been selling smaller or non-core mines to take advantage of elevated commodities prices and raise cash that can be ploughed back into to massive, low-cost assets in tier-one jurisdictions. That\u2019s a trend Central Nevada Gold is keen to capitalize on, Griffiths said.</p><p style='margin-bottom: 1.25em;'>\u201cAs larger companies such as Newmont and Barrick go through their restructuring and rationalize their portfolios, most definitely they could be looking to include us on their contact list,\u201d he said. \u201cWe have a very strong relationship with Newmont. We\u2019ve demonstrated our ability to close on this transaction.\u201d</p><p style='margin-bottom: 1.25em;'>Griffiths\u2019 past as a former CEO of silver producer Andean Precious Metals (TSX: APM) means he will also canvass Nevada for silver-rich properties. Another member of Central Nevada\u2019s management team, executive director Fraser Buchan, also held senior leadership roles at Andean.</p><p style='margin-bottom: 1.25em;'>\u201cGold dominates the resource at Mule Canyon, but we do have some silver there. And Fraser and I both did [Andean\u2019s] San Bartolom\u00e9 [mine in Bolivia], so silver is also of interest,\u201d Griffiths said. \u201cThe opportunities are there.\u201d</p><p style='margin-bottom: 1.25em;'>Future IPO</p><p style='margin-bottom: 1.25em;'>Central Nevada\u2019s purchase price for Mule Canyon included a $10-million cash payment at closing. A second cash payment will be made next June or when Central Nevada goes public \u2013 whichever occurs first.</p><p style='margin-bottom: 1.25em;'>An IPO will probably happen \u201cearly next year\u201d after more drilling has been completed, Griffiths said.</p><p style='margin-bottom: 1.25em;'>\u201cOur first priority is metallurgical sampling,\u201d he said. \u201cThat would be the first 20 holes. Those holes will also inform our geological resource model. The second priority will be infill drilling to confirm older [reverse circulation] holes and to upgrade the classification from inferred to indicated or measured, as the case may be. We would like to maximize the upgrade from inferred during this drill program.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019d like to understand what the project looks like before we do the public listing,\u201d he said.</p><p style='margin-bottom: 1.25em;'>Prolific areas</p><p style='margin-bottom: 1.25em;'>Located about 700 km northwest of Las Vegas, Mule Canyon sits in the Shoshone Mountain Range\u2019s historic Argenta mining district, near the prolific Carlin, Battle Mountain and Getchell trends.</p><p style='margin-bottom: 1.25em;'>A discovery drill intercept returned 41.1 meters grading 24.8 grams gold per tonne from an undisclosed depth, Central Nevada says. The company\u2019s database comprises 2,149 drill holes covering more than 335,000 metres.</p><p style='margin-bottom: 1.25em;'>Historical operating data cited by Central Nevada Gold indicate an average head grade of 3.8 grams gold per tonne and metallurgical recoveries of roughly 94%.</p><p style='margin-bottom: 1.25em;'>Subsequent exploration outlined six mineralized zones over 2.5 km, defining 8.2 million tonnes of open-pittable ore at an average grade of 3.81 grams gold per tonne, Central Nevada shareholder Giant Venture Capital says on its website.</p><p style='margin-bottom: 1.25em;'>Big data</p><p style='margin-bottom: 1.25em;'>Mule Canyon was initially designed and permitted to process about 7 to 10 million tons (6.4 to 9.1 million tonnes) of gold-bearing ore by processing 4.1 million tons of low-grade oxide ore by cyanide heap leaching, according to Nevada\u2019s Division of Environmental Protection.</p><p style='margin-bottom: 1.25em;'>\u201cWe bought this asset from the biggest gold mining company in the world. We\u2019ve inherited a huge amount of data, which is a massive advantage to us,\u201d Griffiths said.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019re not looking for an ore body; we\u2019ve already got one. We want to make sure we get through this huge data set and then identify as much information as we can, so that when we do come to the market, our story is more fulsome and we have de-risked many of the unknowns.\u201d</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 35, "source": "Mining.com", "category": "metals", "title": "Greenland Mines gets mineral exploration license for Safartoq project, stock surges", "link": "https://www.mining.com/greenland-mines-gets-mineral-exploration-license-for-sarfartoq-project-stock-surges/", "iso_date": "2026-08-21T22:36:10+00:00", "date_str": "Aug 21 \u2022 10:36 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>Greenland Mines (NASDAQ: GRML) said Friday that the Government of Greenland, through the Ministry of Business and Mineral Resources (Naalakkersuisut), has formally approved the indirect transfer of Mineral Exploration License covering the Sarfartoq carbonatite complex to the company. The stock surged.</p><p style='margin-bottom: 1.25em;'>The approval, granted under the Greenland Mineral Activities Act, satisfies one of the key regulatory closing conditions for the company\u2019s acquisition of the Sarfartoq project from Neo Performance Materials for $35 million.</p><p style='margin-bottom: 1.25em;'>As part of the deal, Neo Performance will receive offtake rights on up to 60% of future ore or mineral concentrate production from Sarfartoq.</p><p style='margin-bottom: 1.25em;'>The company has called the project one of the island\u2019s \u201cmost advanced and compelling rare earth projects,\u201d citing its high-grade nature and favorable Arctic logistics.</p><p style='margin-bottom: 1.25em;'>Located roughly 60 km from Kangerlussuaq in the southeast, the project is the site of a carbonatite-hosted deposit strongly enriched in Neodymium-Praseodymium (Nd-Pr).</p><p style='margin-bottom: 1.25em;'>The project carries a historic NI 43-101 Mineral Resource Estimate and a Preliminary Economic Assessment, is supported by more than 15 years of exploration work and over 23,000 meters of drilling,</p><p style='margin-bottom: 1.25em;'>A historic resource cited by the company showed that it contains roughly 27 million kg of Nd oxides and 8 million kg of Pr oxides, concentrated within one zone holding 5.88 million tonnes of indicated material grading 1.77% TREO (total rare earth oxides) and 2.46 million tonnes inferred grading 1.59% TREO.</p><p style='margin-bottom: 1.25em;'>\u201cThis approval from the Government of Greenland is a fundamental milestone for our company and for the future of Sarfartoq,\u201d Greenland Mines president Bo M\u00f8ller Stensgaard said in a news release.</p><p style='margin-bottom: 1.25em;'>\u201cIt reflects the strength of our relationships in Greenland and the confidence the Government places in our team to advance this project responsibly,\u201d Stensgaard said. \u201cSarfartoq is one of the most important undeveloped neodymium-praseodymium resources in the Western world. This is a foundational step in building a genuine, Western-aligned rare earth supply chain from Greenland.\u201d</p><p style='margin-bottom: 1.25em;'>Greenland Mines stock surged on the news, closing the day up over 22% on the NASDAQ. The company has a $31.4 million market capitalization.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 36, "source": "Cointelegraph", "category": "crypto", "title": "Here\u2019s what happened in crypto today", "link": "https://cointelegraph.com/news/what-happened-in-crypto-today?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T20:48:48+00:00", "date_str": "Aug 21 \u2022 08:48 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Here\u2019s what happened in crypto today</p><p style='margin-bottom: 1.25em;'>Need to know what happened in crypto today? Here is the latest news on daily trends and events impacting Bitcoin price, blockchain, DeFi, Web3 and crypto regulation.</p><p style='margin-bottom: 1.25em;'>Today in crypto, Ray Dalio backed gold and \u201ca bit\u201d of Bitcoin as protection against a potential US debt crisis, Standard Chartered said its $100,000 year-end BTC forecast may be too low and MANTRA\u2019s token hit a record low after its blockchain was halted over an unexplained incident.</p><p style='margin-bottom: 1.25em;'>Ray Dalio favors gold, \u2018a bit\u2019 of Bitcoin as US debt risks mount</p><p style='margin-bottom: 1.25em;'>Billionaire investor Ray Dalio is urging investors to favor gold and \u201ca bit of Bitcoin\u201d over bonds as he warns that the United States could face a debt crisis within the next several years.</p><p style='margin-bottom: 1.25em;'>The Bridgewater Associates founder said Friday that investors could consider allocating 10% to 15% of their portfolios to gold to reduce risk, while overweighting gold and Bitcoin relative to debt assets. Dalio pointed to mounting political and geopolitical tensions and estimated that a US debt crisis could emerge in roughly three years, unless the country changes course.</p><p style='margin-bottom: 1.25em;'>Dalio has historically been more cautious on Bitcoin than gold, arguing that the cryptocurrency cannot replace the precious metal as a store of value and raising concerns about privacy and quantum computing. Still, his latest comments continue a gradual shift toward accepting BTC as a portfolio hedge. In 2022, he described a 1% to 2% Bitcoin allocation as \u201creasonable.\u201d</p><p style='margin-bottom: 1.25em;'>Standard Chartered wavers on $100,000 Bitcoin year-end call, says it may be \u2018too low\u2019</p><p style='margin-bottom: 1.25em;'>Bitcoin may move toward its all-time high of $126,000 before the end of the year, with the recovery potentially accelerating after Oct. 6, according to Geoff Kendrick, global head of digital asset research at Standard Chartered.</p><p style='margin-bottom: 1.25em;'>Kendrick said in a Friday note shared with Cointelegraph that the latest rally has been driven largely by short liquidations, while inflows into spot Bitcoin exchange-traded funds have also started to recover. He said low open interest could leave room for more investors to return as prices rise.</p><p style='margin-bottom: 1.25em;'>\u201cFor the first time this year there is now a risk my end year forecast (of USD100k) is too low,\u201d Kendrick wrote.</p><p style='margin-bottom: 1.25em;'>In a Feb. 12 report, Kendrick cut Standard Chartered\u2019s year-end Bitcoin target to $100,000 from $150,000 and its Ether target to $4,000 from $7,500. At the time, he expected Bitcoin to fall to around $50,000 and Ether to $1,400 before recovering during the rest of the year.</p><p style='margin-bottom: 1.25em;'>MANTRA token sinks 18% to record low amid blockchain halt</p><p style='margin-bottom: 1.25em;'>MANTRA\u2019s native token sank 18.5% from its 24-hour high to a record low shortly before MANTRA Chain stopped producing blocks and its team announced a precautionary halt over an unexplained incident.</p><p style='margin-bottom: 1.25em;'>According to CoinGecko, MANTRA fell from $0.005060 to an all-time low of $0.004126 around 11:00 pm UTC on Thursday. It later recovered to about $0.0044 but remained down roughly 10% over 24 hours, while trading volume climbed nearly 600% to $24 million.</p><p style='margin-bottom: 1.25em;'>MANTRA said Friday it was \u201caware of an incident affecting MANTRA Chain\u201d and had halted the network as a precaution while it investigated. \u201cWe don\u2019t have a root cause or timeline to share yet,\u201d the project said, adding that all endpoints and transactions were frozen.</p><p style='margin-bottom: 1.25em;'>The halt prevents assets from moving on MANTRA Chain and has prompted affected exchanges to pause deposits and withdrawals, with no timeline given for either service to resume.</p>"}, {"id": 37, "source": "Mining.com", "category": "metals", "title": "New American Industrial Alliance\u00a0launches \u2018Ground Truth\u2019\u00a0critical minerals readiness survey", "link": "https://www.mining.com/new-american-industrial-alliance-launches-ground-truth-critical-minerals-readiness-survey/", "iso_date": "2026-08-21T20:30:35+00:00", "date_str": "Aug 21 \u2022 08:30 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>New American Industrial Alliance launches \u2018Ground Truth\u2019 critical minerals readiness survey</p><p style='margin-bottom: 1.25em;'>Supply chain AI company Exiger announced it has joined the New American Industrial Alliance, a US trade association founded in 2024 that brings together tech founders, venture capitalists, and manufacturers aiming to rebuild America\u2019s industrial base</p><p style='margin-bottom: 1.25em;'>The Wasghington \u2013based firm, which provides supply chain risk technology to the U.S. Government, said it joins AI and defense tech pioneers including Anduril, Divergent, Google, Hadrian, and Palantir to advance the coalition\u2019s mission to restore domestic manufacturing capacity and bolster national security.</p><p style='margin-bottom: 1.25em;'>NAIA and Exiger also announced their partnership on the launch of Ground Truth: The Exiger-NAIA Critical Minerals Readiness Survey \u2013 an industry snapshot on the current and future state of critical minerals supply that follows the White House\u2019s Executive Order 14415 \u201cSecuring America\u2019s Defense Supply Chains and Ensuring Domestic Acquisition of Critical Materials\u201d last month.</p><p style='margin-bottom: 1.25em;'>The survey of NAIA\u2019s member community and the broader U.S. industrial base will measure the actual state of critical mineral supply against real industrial demand, the company said.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019re excited to welcome Exiger to NAIA and kick off this partnership with a revealing dive into both the pain points and opportunities across the critical minerals landscape for domestic manufacturers,\u201d NAIA senior vice president Micah Murphy said in a news release.</p><p style='margin-bottom: 1.25em;'>\u201cExiger\u2019s leadership in supply chain, readiness, and procurement automation, coupled with their cutting-edge AI, deep data, and domain expertise, makes them a valuable ally in our work to strengthen and secure our most important supply chains.\u201d</p><p style='margin-bottom: 1.25em;'>Ground Truth was designed by the partnership to surface where demand is not being met by domestic or allied supply (down to the spec, grade, alloy, or purity level), where reshoring goals and sourcing capabilities diverge, and which gaps leave companies most exposed.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019re thrilled to partner with NAIA to provide a ground truth at the exact moment policymakers are taking action on critical mineral dependencies,\u201d Exiger\u2019s SVP, product market leadership Derek Lemke said.</p><p style='margin-bottom: 1.25em;'>\u201cWe\u2019ve seen global bad actors attempt to weaponize the periodic table and leverage their control of critical mineral processing, refining, and exports, and hope the survey results inform policies that drive long-term resilience, including supply chain visibility, raw material traceability, and reduced dependency on adversarial supply.\u201d</p><p style='margin-bottom: 1.25em;'>Survey responses will inform a joint Exiger x NAIA research report, powered by 1EXIGER.AI, that will offer a blueprint for policymakers, federal buyers, investors, and industrial partners targeting where to best direct action and capital to accelerate America\u2019s reindustrialization.</p><p style='margin-bottom: 1.25em;'>The findings will be unveiled on September 16, 2026, in Washington, DC, at NAIA\u2019s The New Industrial Age Forum, which brings leaders from factory floors, laboratories, and construction into conversation with policymakers working to shape America\u2019s manufacturing renaissance, the company said.</p><p style='margin-bottom: 1.25em;'>The survey is here.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 38, "source": "Cointelegraph", "category": "crypto", "title": "Bitget CEO sees Bitcoin near current levels at year-end, doubts US will buy BTC", "link": "https://cointelegraph.com/markets/bitget-ceo-sees-bitcoin-near-current-levels-at-year-end-doubts-us-will-buy-btc?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T20:26:16+00:00", "date_str": "Aug 21 \u2022 08:26 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitget CEO sees Bitcoin near current levels at year-end, doubts US will buy BTC</p><p style='margin-bottom: 1.25em;'>Gracy Chen says macroeconomic uncertainty could keep Bitcoin within $10,000 to $20,000 of current levels, while US government purchases remain unlikely within the next two years.</p><p style='margin-bottom: 1.25em;'>Bitget CEO Gracy Chen expects Bitcoin to remain broadly around current levels through the end of the year despite its recent surge, citing interest rates and broader macroeconomic conditions as key factors shaping the cryptocurrency\u2019s outlook.</p><p style='margin-bottom: 1.25em;'>Speaking on Cointelegraph\u2019s Trade Secrets podcast, Chen said predicting whether Bitcoin (BTC) will finish the year above or below $70,000 is difficult, pointing to the possibility of higher interest rates as one factor that could pressure prices.</p><p style='margin-bottom: 1.25em;'>Cointelegraph host interviews Bitget CEO Gracy Chen. Source: Trade Secrets</p><p style='margin-bottom: 1.25em;'>\u201cIf any of that happens, the price should go down, at least theoretically,\u201d Chen said, adding that BTC has become increasingly integrated with traditional finance and sensitive to broader macroeconomic conditions.</p><p style='margin-bottom: 1.25em;'>\u201cMy guess is maybe around the same range,\u201d Chen said, adding that BTC could finish the year $10,000 to $20,000 above or below current levels, which she described as her \u201cmore responsible\u201d forecast.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin rally sends crypto stocks soaring as miners, treasury companies jump</p><p style='margin-bottom: 1.25em;'>Chen sees US Bitcoin purchases as unlikely</p><p style='margin-bottom: 1.25em;'>Chen was also skeptical that the US government will begin purchasing Bitcoin for its national reserve before the end of President Donald Trump\u2019s term, calling such a move unlikely within the next two years.</p><p style='margin-bottom: 1.25em;'>The Trump administration established a Strategic Bitcoin Reserve in March 2025 using BTC already forfeited to the federal government, while directing officials to explore budget-neutral strategies for acquiring additional BTC.</p><p style='margin-bottom: 1.25em;'>The US government currently holds an estimated 328,372 BTC, according to BitcoinTreasuries.NET, much of it accumulated through law enforcement seizures and asset forfeitures rather than direct purchases.</p><p style='margin-bottom: 1.25em;'>Top 5 government Bitcoin holdings. Source: BitcoinTreasuries.NET</p><p style='margin-bottom: 1.25em;'>Chen said actively purchasing Bitcoin would be a significantly bigger policy decision, requiring debate among lawmakers and political parties despite the administration\u2019s broadly crypto-friendly stance.</p><p style='margin-bottom: 1.25em;'>\u201cFrom a policy perspective, it\u2019s probably unlikely,\u201d Chen said. \u201cI just don\u2019t see it coming right now.\u201d</p><p style='margin-bottom: 1.25em;'>Magazine: Bitcoin to $1M by 2030 is \u2018mathematically impossible\u2019 says Markus Thielen</p>"}, {"id": 39, "source": "Cointelegraph", "category": "crypto", "title": "Ray Dalio says to buy \u2018a bit\u2019 of Bitcoin amid potential debt crisis", "link": "https://cointelegraph.com/news/ray-dalio-buy-bitcoin-debt-crisis?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T20:00:47+00:00", "date_str": "Aug 21 \u2022 08:00 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Ray Dalio says to buy \u2018a bit\u2019 of Bitcoin amid potential debt crisis</p><p style='margin-bottom: 1.25em;'>The hedge fund founder with an estimated net worth of $15 billion recommended that investors overweight Bitcoin and gold rather than bonds.</p><p style='margin-bottom: 1.25em;'>The founder of the Bridgewater Associates hedge fund, Ray Dalio, called on investors to put money into gold and \u201ca bit of Bitcoin\u201d in response to a looming debt crisis.</p><p style='margin-bottom: 1.25em;'>In a Friday LinkedIn post, Dalio said having between 10% to 15% of one\u2019s portfolio in gold could help reduce risk. He advocated for gold and Bitcoin (BTC) as assets to be overweight compared to debt assets like bonds, citing risks from \u201cinternal political and external geopolitical conflicts.\u201d</p><p style='margin-bottom: 1.25em;'>\u201cMy guess, which I suppose will be a bad one, is that [a US debt crisis] will come in three years, give or take two, if the course we\u2019re on is not changed,\u201d said Dalio.</p><p style='margin-bottom: 1.25em;'>The Bridgewater Associates founder, with an estimated net worth of more than $15 billion, has previously argued that Bitcoin could not replace gold as a store of value and warned about privacy concerns and threats from quantum computing. His Friday comments echoed those from July 2025, when he said he held some, \u201cbut not much\u201d Bitcoin, and recommended holding up to 15% in the cryptocurrency and gold.</p><p style='margin-bottom: 1.25em;'>In 2022, months before a significant crypto market downturn, Dalio said that holding between 1% to 2% of BTC in one\u2019s portfolio was \u201creasonable.\u201d</p><p style='margin-bottom: 1.25em;'>Related: \u2018No privacy\u2019 CBDCs will come, warns billionaire Ray Dalio</p>"}, {"id": 40, "source": "Cointelegraph", "category": "crypto", "title": "Onchain, in court: What happened in crypto legal news this week", "link": "https://cointelegraph.com/news/on-chain-in-court-crypto-legal-news5?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T19:19:27+00:00", "date_str": "Aug 21 \u2022 07:19 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Onchain, in court: What happened in crypto legal news this week</p><p style='margin-bottom: 1.25em;'>The CFTC ordered a trading ban for former Alameda and FTX executives, and US prosecutors opposed a motion from a US soldier accused of profiting from the removal of Nicolas Maduro.</p><p style='margin-bottom: 1.25em;'>Update (Aug. 21, 9:50 pm UTC): This article has been updated to include information about the criminal case against Edward Zimbardi.</p><p style='margin-bottom: 1.25em;'>Former Alameda Research and FTX executives receive 5-year trading bans</p><p style='margin-bottom: 1.25em;'>On Tuesday, the US District Court for the Southern District of New York (SDNY) entered consent orders related to a 2022 enforcement action against former Alameda Research CEO Caroline Ellison and crypto exchange FTX co-founder Zixiao \u201cGary\u201d Wang.</p><p style='margin-bottom: 1.25em;'>The orders imposed by the US Commodity Futures Trading Commission (CFTC) required that Ellison and Wang receive a five-year trading ban related to their roles in the crypto exchange\u2019s collapse. The CFTC also ordered that the Alameda CEO receive a 10-year registration ban, while Wang received an eight-year registration ban.</p><p style='margin-bottom: 1.25em;'>According to CFTC enforcement director David Miller, the orders reflected Wang\u2019s and Ellison\u2019s \u201cmaterial assistance in the Commission\u2019s FTX-related investigations.\u201d The civil case is separate from criminal cases involving the misuse of customer funds at FTX, in which Ellison was sentenced to two years in prison and Wang received time served.</p><p style='margin-bottom: 1.25em;'>US prosecutors file opposition to Polymarket trader over $400,000 Maduro bet</p><p style='margin-bottom: 1.25em;'>On Wednesday, lawyers representing the US government in SDNY filed their opposition to a motion to dismiss from Gannon Ken Van Dyke, a US soldier who allegedly made more than $400,000 using event contracts on prediction market platform Polymarket using nonpublic information. Van Dyke was tied to the military operation that removed Venezuelan President Nicol\u00e1s Maduro in January.</p><p style='margin-bottom: 1.25em;'>Related: Judge stays CFTC\u2019s case against US soldier over prediction market bets</p><p style='margin-bottom: 1.25em;'>The US soldier\u2019s motion to dismiss, filed on July 31, included claims that the Commodity Exchange Act, at the center of three of the charges he faces, was \u201cambiguous\u201d in treating event contracts as \u201cswaps\u201d under the CFTC\u2019s purview. In its Wednesday filing, the US government argued that Van Dyke \u201cadvances hypotheticals, edge cases, and ongoing litigation over state gaming laws\u201d that were unnecessary to decide in order to move forward with the case.</p><p style='margin-bottom: 1.25em;'>\u201cVan Dyke\u2019s motion asks the Court to make a factual determination not appropriate at the motion-to-dismiss stage,\u201d said SDNY Deputy US Attorney Sean Buckley. \u201cHis argument relies on speculative assertions about facts, based on improper inferences from the Indictment and incorrect conclusions about the nature of the charge, to claim that facts do not amount to \u2018property.\u2019\u201d</p><p style='margin-bottom: 1.25em;'>As of Friday, the court had not posted any decision on the motion to the public docket.</p><p style='margin-bottom: 1.25em;'>Judge unseals 25-count indictment against alleged $165 million crypto fraudster</p><p style='margin-bottom: 1.25em;'>On Monday, a Georgia judge ordered an indictment unsealed involving an individual allegedly behind a $165 million cryptocurrency Ponzi scheme.</p><p style='margin-bottom: 1.25em;'>Initially indicted on July 8, Edward Zimbardi will face wire fraud and money laundering charges in the Northern District of Georgia after being deported from Fiji, where he fled after allegedly committing the crypto scheme. According to prosecutors, Zimbardi \u201ctricked thousands of people to invest in his \u2018Crypto Program\u2019 with false promises of enormous returns.\u201d</p><p style='margin-bottom: 1.25em;'>Magistrate Judge Anna Howard ordered Zimbardi\u2019s indictment unsealed this week, showing that the alleged crypto fraudster was being charged with 12 counts of wire fraud, one count of money laundering conspiracy and 11 counts of transactional money laundering based on activities at the Crypto Program between 2022 and 2023.</p><p style='margin-bottom: 1.25em;'>Prosecutors are also seeking the forfeiture of the proceeds of Zimbardi\u2019s alleged wire fraud and money laundering and crypto already seized upon potential conviction. The indictment listed 11.87 Bitcoin (BTC), 2.15 Ether (ETH), 713,344,695 Shiba Inu (SHIB), 47,110 USDt (USDT), 12,095 USDT0, 3.3 million XRP, 1,095 Dogecoin (DOGE), 10.2 million Osaka Protocol (OSAK) and 11.97 Polygon (POL) seized by Dutch authorities in 2024 \u2014 worth about $6 million combined.</p><p style='margin-bottom: 1.25em;'>Magazine: MiCA cracks down on USDT in Europe... but no one else cares</p>"}, {"id": 41, "source": "Cointelegraph", "category": "crypto", "title": "Bitcoin seeks support near $77K as BTC, gold near 100-day highs", "link": "https://cointelegraph.com/markets/bitcoin-seeks-support-near-77k-btc-gold-100-day-highs?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T19:10:47+00:00", "date_str": "Aug 21 \u2022 07:10 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitcoin seeks support near $77K as BTC, gold near 100-day highs</p><p style='margin-bottom: 1.25em;'>Bitcoin volatility eased after BTC hit its highest level since mid-May, while gold joined the cryptocurrency in approaching three-month highs.</p><p style='margin-bottom: 1.25em;'>Bitcoin (BTC) consolidated above $77,000 after Friday\u2019s Wall Street open as gold joined the crypto rally to hit 14-week highs.</p><p style='margin-bottom: 1.25em;'>Key points:</p><p style='margin-bottom: 1.25em;'>- Bitcoin and gold both hit their highest levels since May 15 against the US dollar.</p><p style='margin-bottom: 1.25em;'>- Analysis ties the strong performance firmly to US government debt policy.</p><p style='margin-bottom: 1.25em;'>- Polymarket odds of Bitcoin reaching $90,000 before 2027 reach 48%.</p><p style='margin-bottom: 1.25em;'>Analysis: Bitcoin and gold gains not \u201csurprise\u201d</p><p style='margin-bottom: 1.25em;'>Data from TradingView showed BTC/USD cooling after reaching its highest levels since May 15, still up nearly 6% on the day.</p><p style='margin-bottom: 1.25em;'>BTC/USD one-hour chart. Source: Cointelegraph/TradingView</p><p style='margin-bottom: 1.25em;'>Gold echoed the move, reaching multi-month highs of $4,632 per ounce, up 2.2% on the day at the time of writing. On a monthly basis, BTC/USD and XAU/USD were up 13% and 16%, respectively.</p><p style='margin-bottom: 1.25em;'>BTC/USD vs. XAU/USD one-day chart. Source: Cointelegraph/TradingView</p><p style='margin-bottom: 1.25em;'>\u201cWhat\u2019s happening now in gold and crypto should not come as a surprise,\u201d market commentary The Kobeissi Letter wrote in a response on X.</p><p style='margin-bottom: 1.25em;'>Kobeissi attributed the rapid gains in precious metals and crypto to a combination of inflation, deficit spending and US Treasury policy. Record government deficit spending and the Treasury Department\u2019s pledge to at least double the size of certain debt buyback operations to $4 billion helped drive the rally in both asset classes, Kobeissi argued.</p><p style='margin-bottom: 1.25em;'>Discussing Bitcoin\u2019s reaction to the current macro landscape, trading company QCP Capital noted that the financial stress signals went beyond the US, highlighting surging Japanese government bond yields after a rare joint currency intervention in the yen earlier this month.</p><p style='margin-bottom: 1.25em;'>\u201cThe most notable cross-asset signal this week has been the divergence after Treasury\u2019s announcement. Treasuries initially rallied before giving back much of the move. BTC and gold did not retrace to the same extent,\u201d it wrote in its latest Market Color analysis, adding:</p><p style='margin-bottom: 1.25em;'>\u201cThat does not establish a new liquidity or monetary regime, but it does highlight the sensitivity of alternative assets to changes in long-end rates and the dollar.\u201d</p><p style='margin-bottom: 1.25em;'>Polymarket 2026 odds of $90,000 BTC near 50%</p><p style='margin-bottom: 1.25em;'>As BTC price upside passed 20% over two days, consensus over potential targets through year-end began to improve.</p><p style='margin-bottom: 1.25em;'>Data from prediction service Polymarket put the odds of BTC/USD hitting $90,000 before 2027 at 48% at the time of writing, up sharply since the start of the week.</p><p style='margin-bottom: 1.25em;'>Odds of BTC/USD hitting $90,000 by Jan. 1, 2027 (screenshot). Source: Polymarket</p><p style='margin-bottom: 1.25em;'>Related: Strategy Bitcoin treasury hits breakeven point as BTC price passes $77K</p><p style='margin-bottom: 1.25em;'>Some market participants, however, remained skeptical. Trader and analyst Rekt Capital stressed that Bitcoin needed to reclaim its 50-week exponential moving average (EMA) at $77,232, a trend line it rejected in January.</p><p style='margin-bottom: 1.25em;'>\u201cBreak the Downtrend and Bitcoin will confirm entry into a new technical Macro Uptrend. Reject from here however and price will maintain its series of Lower Highs,\u201d he told X followers.</p><p style='margin-bottom: 1.25em;'>\u201cHistory suggests there\u2019s still time for price to continue its Downtrend.\u201d</p><p style='margin-bottom: 1.25em;'>BTC/USD one-month chart. Source: Rekt Capital on X.com</p>"}, {"id": 42, "source": "Mining.com", "category": "metals", "title": "Silver price 20% August surge sends miners soaring", "link": "https://www.mining.com/silver-price-20-august-surge-sends-miners-soaring/", "iso_date": "2026-08-21T17:02:33+00:00", "date_str": "Aug 21 \u2022 05:02 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Silver price 20% August surge sends miners soaring</p><p style='margin-bottom: 1.25em;'>Silver surged about 20% in August to touch $70 an ounce Friday as the US Treasury\u2019s decision to double long-bond buybacks extended a powerful bid for precious metals.</p><p style='margin-bottom: 1.25em;'>Spot silver reached $70 an ounce on August 21 before easing slightly, up from about $57.59 at the end of July. The rapid advance has pushed the metal beyond several banks\u2019 full-year average forecasts while leaving it below many of their more bullish year-end targets.</p><p style='margin-bottom: 1.25em;'>Silver equities have moved even faster, with the largest producers, streamers and junior-focused exchange-traded funds amplifying the metal\u2019s gains as investors pile into the sector.</p><p style='margin-bottom: 1.25em;'>The rally highlights silver\u2019s leverage to shifts in monetary conditions and investor demand. With bullion already at levels that recently looked aggressive, attention is turning to whether miners can sustain their outperformance and how much of Wall Street\u2019s bullish outlook has already been priced in.</p><p style='margin-bottom: 1.25em;'>Miners amplify</p><p style='margin-bottom: 1.25em;'>Hecla Mining (NYSE: HL), the largest US silver producer, led the group with a 47% August gain, more than twice the metal\u2019s advance.</p><p style='margin-bottom: 1.25em;'>Wheaton Precious Metals (TSX, NYSE: WPM) climbed 44%, while Coeur Mining (NYSE: CDE), First Majestic Silver (NYSE: AG) and Fortuna Mining (NYSE: FSM) each gained 42%. Silvercorp Metals (NYSE: SVM) advanced 36%.</p><p style='margin-bottom: 1.25em;'>The Global X Silver Miners ETF (NYSE Arca: SIL) rose 35%, while the ETFMG Prime Junior Silver Miners ETF (NYSE Arca: SILJ), which focuses on smaller developers, added 32%.</p><p style='margin-bottom: 1.25em;'>Pan American Silver (TSX, NYSE: PAAS), the world\u2019s largest primary silver producer, gained 22%. While that was the weakest performance among the group, it still exceeded silver\u2019s roughly 20% advance.</p><p style='margin-bottom: 1.25em;'>The broad outperformance shows how quickly operating and market leverage can flow through silver equities during a sharp metals rally. It also raises the stakes if bullion reverses, because the same leverage that boosts miners during an upswing can magnify losses when prices retreat.</p><p style='margin-bottom: 1.25em;'>Bank targets</p><p style='margin-bottom: 1.25em;'>Major bank forecasts remain widely dispersed, reflecting uncertainty over how far silver\u2019s rally can run after its rapid ascent. Year-end and peak calls stretch from roughly $67 to $118 an ounce, while several institutions see potential for triple-digit prices.</p><p style='margin-bottom: 1.25em;'>UBS targets $80 an ounce at year-end, while J.P. Morgan has an $85 fourth-quarter high and warns of downside risk to $50. Goldman Sachs forecasts a full-year average range of $85 to $100.</p><p style='margin-bottom: 1.25em;'>Citigroup is more bullish, targeting $110 an ounce for the second half and maintaining a medium-term range of $110 to $150. CIBC sees about $105 at year-end, while BNP Paribas targets roughly $100.</p><p style='margin-bottom: 1.25em;'>At the more conservative end, ING forecasts $74 for the fourth quarter and HSBC sees a $75 full-year average. Commerzbank has a $67 year-end target, although it retains a longer-term bullish target of $90.</p><p style='margin-bottom: 1.25em;'>Bank of America has a $85.93 full-year average baseline and sees silver exceeding $100 in the fourth quarter. Its tail-risk scenario stretches from $135 to $309 if the gold-to-silver ratio compresses sharply.</p><p style='margin-bottom: 1.25em;'>BMO Capital Markets forecasts a $74.50 full-year average but retains a $160 fourth-quarter bull case based on similar ratio compression. TD Securities has the highest peak call among the forecasts at $118, alongside a much more bearish $44 full-year average baseline.</p><p style='margin-bottom: 1.25em;'>Scotiabank forecasts a $65 full-year average, while Royal Bank of Canada maintains an outperform view and highlights a central recovery band around $75 extending into 2027. Bain Commodities sees an $85 peak against an annual average near $63.50.</p><p style='margin-bottom: 1.25em;'>The range underscores how dramatically silver\u2019s August rally has changed the debate. At $70, the metal has already overtaken some banks\u2019 baseline expectations, leaving the next leg dependent on whether investment demand can keep pushing prices towards the increasingly crowded cluster of forecasts in the $74-to-$100 range.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 43, "source": "Mining.com", "category": "metals", "title": "Mining\u2019s next biggest challenge is securing talent", "link": "https://www.mining.com/minings-next-biggest-challenge-is-securing-talent/", "iso_date": "2026-08-21T16:37:54+00:00", "date_str": "Aug 21 \u2022 04:37 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Mining\u2019s next biggest challenge is securing talent</p><p style='margin-bottom: 1.25em;'>As gold prices go up and more mining projects receive incentives and approvals, the global mining workforce seems to be going in the opposite direction.</p><p style='margin-bottom: 1.25em;'>A Canadian Mining Industry Human Resources Council (MiHR) survey from 2024 showed that 70% of people aged between 15 and 30 would not consider a career in mining, with concerns ranging from safety and lack of flexibility to environmental concerns. This is becoming a bigger issue as many mining executives report that the talent shortage is starting to affect production levels, innovation and is delaying projects.</p><p style='margin-bottom: 1.25em;'>Industry experts now say their biggest concern is not the cost of assets or project development, but rather how there\u2019s a lack of talent in the pipeline to keep the industry alive.</p><p style='margin-bottom: 1.25em;'>\u201cThere\u2019s a very acute shortage of talent in the industry and it\u2019s a function of two factors. One, there are a lot of people retiring. And two, there\u2019s not many people coming into the industry,\u201d Rob McEwen, Chairman of McEwen Inc. said in a recent interview with MINING.COM host Devan Murugan on Top of Mine.</p><p style='margin-bottom: 1.25em;'>In the US, more than half of the workforce is expected to retire in the next three years.</p><p style='margin-bottom: 1.25em;'>In Canada, 20% of workers are 55 years old or older, while only 5% are under 25 years old. About 46% of Gen-Z workers plan to quit mining and energy-related jobs in the next two years, according to Deloitte.</p><p style='margin-bottom: 1.25em;'>The sector is expanding, as interest in working in it shrinks.</p><p style='margin-bottom: 1.25em;'>This is also related to how mining is perceived by those that don\u2019t have much contact or with the industry. Youth that didn\u2019t grow up in a resource community might still see mining as pickaxes and environmental destruction, while the reality is mines today use high technology and put an effort into being more socially and environmentally responsible.</p><p style='margin-bottom: 1.25em;'>\u201cYou don\u2019t have a new group of people coming in at the same time as metal prices are taking off and everybody wants to build a mine. So there\u2019s intense competition for labor right now,\u201d McEwen said.</p><p style='margin-bottom: 1.25em;'>Mining education</p><p style='margin-bottom: 1.25em;'>While there are still many programs and incentives to study mining, many students don\u2019t seem to see it as something they\u2019d like to pursue and build a career in.</p><p style='margin-bottom: 1.25em;'>MiHR reports that for the past 14 years, there has been a decline in enrollments in Canadian mining related programs, going from 1,400 in 2014 to 800 in 2020. From 2016 to 2020 enrollments continue to decrease 10% annually.</p><p style='margin-bottom: 1.25em;'>\u201cOur educational system is discouraging people from entering the industry. They view mining as a very environmentally destructive industry and should be shunned. So enrollment in mining schools, anything related to mining and geology fell precipitously in the last 20 years,\u201d McEwen said.</p><p style='margin-bottom: 1.25em;'>As youth unemployment sits at 12.6% in Canada, a career in mining might become more attractive to the rising generation that wants to beat those statistics.</p><p style='margin-bottom: 1.25em;'>The sector is expected to grow even more as demand grows for critical minerals, rare earth elements and battery metals to support innovation in many different areas, generating more job opportunities, especially for those who are just starting out and are interested in working in the sector for years to come.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 44, "source": "Cointelegraph", "category": "crypto", "title": "Digital Asset, Paul Ryan foundation target US state benefits with Canton pilot", "link": "https://cointelegraph.com/news/paul-ryan-foundation-digital-asset-plan-blockchain-based-benefits-pilot-on-canton?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T16:25:29+00:00", "date_str": "Aug 21 \u2022 04:25 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Digital Asset, Paul Ryan foundation target US state benefits with Canton pilot</p><p style='margin-bottom: 1.25em;'>The RISE program would use the Canton Network to combine and distribute state-administered benefits across three US states beginning in 2027.</p><p style='margin-bottom: 1.25em;'>Digital Asset, the creator of the Canton Network, and former US House Speaker Paul Ryan\u2019s American Idea Foundation plan to pilot a blockchain-based system for distributing state-administered benefits across three US states using the Canton Network.</p><p style='margin-bottom: 1.25em;'>The RISE program is expected to launch in the first quarter of 2027 and would combine multiple benefits into monthly or twice-monthly payments, with spending rules applied to categories including food, child care and cash.</p><p style='margin-bottom: 1.25em;'>According to Friday\u2019s announcement, the system would automatically adjust benefit levels as household income changes and allow participating agencies to track payments, balances, spending and compliance data through Canton. Digital Asset said Canton would coordinate the rules, permissions and transactions used to distribute benefits while limiting access to sensitive information.</p><p style='margin-bottom: 1.25em;'>Ryan said the pilot is intended to reduce penalties that can occur as benefit recipients\u2019 incomes rise:</p><p style='margin-bottom: 1.25em;'>By combining fragmented benefits, reducing penalties as families earn more, and rigorously measuring results, these pilots can help show what a modern safety net should look like.</p><p style='margin-bottom: 1.25em;'>The companies did not name the participating states or specify which benefit programs would be included, and said the pilots remain subject to federal approval.</p><p style='margin-bottom: 1.25em;'>Related: FalconX, Interstice Connect Canton to Ethereum, Solana and Robinhood Chain</p><p style='margin-bottom: 1.25em;'>Canton expands government-linked use cases</p><p style='margin-bottom: 1.25em;'>The RISE program could add a public-benefits use case to Canton, whose recent growth has largely centered on institutional finance, including projects involving government securities.</p><p style='margin-bottom: 1.25em;'>In April, Japan Securities Clearing Corporation, Mizuho, Nomura and Digital Asset launched a proof of concept using Canton to test Japanese government bonds as digital collateral, including for real-time, cross-border transactions. The project was selected for support under Japan\u2019s Financial Services Agency Payment Innovation Project.</p><p style='margin-bottom: 1.25em;'>Canton was also used in July to settle a tokenized US Treasury trade between Franklin Templeton and Virtu Financial, with Tradeweb handling execution and price discovery. The Treasury changed hands against USDCx in real time, which Tradeweb described as an industry first.</p><p style='margin-bottom: 1.25em;'>Canton\u2019s native Canton Coin (CC), which is used to pay fees for transactions through the network\u2019s Global Synchronizer, has a market capitalization of about $4.1 billion and ranks 23rd among cryptocurrencies, according to CoinGecko data. CC is up around 10% over the past week.</p><p style='margin-bottom: 1.25em;'>Source: CoinGecko</p><p style='margin-bottom: 1.25em;'>Magazine: MiCA cracks down on USDT in Europe... but no one else cares</p>"}, {"id": 45, "source": "Cointelegraph", "category": "crypto", "title": "Bitcoin rally sends crypto stocks soaring as miners, treasury companies jump", "link": "https://cointelegraph.com/markets/bitcoin-rally-crypto-stocks-canaan-strive-metaplanet?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T16:11:07+00:00", "date_str": "Aug 21 \u2022 04:11 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Bitcoin rally sends crypto stocks soaring as miners, treasury companies jump</p><p style='margin-bottom: 1.25em;'>Bitcoin\u2019s rally above $79,000 lifted miners and treasury companies, with Canaan, Strive and Metaplanet posting double-digit gains as crypto stocks surged.</p><p style='margin-bottom: 1.25em;'>Shares of Bitcoin miners and digital asset treasury companies surged toward the end of the week, tracking a broader rally across crypto markets after the US Treasury announced it would double certain long-dated bond buybacks \u2014 a move aimed at supporting liquidity in the Treasury market that also helped bolster risk appetite.</p><p style='margin-bottom: 1.25em;'>Bitcoin (BTC) miner Canaan led crypto-related stocks on Friday, rising more than 25%. MARA Holdings edged higher after gaining nearly 16% during Thursday\u2019s session.</p><p style='margin-bottom: 1.25em;'>Strive, which holds more than 20,000 Bitcoin (BTC) on its balance sheet, jumped more than 16% on Friday. Japan-listed Metaplanet, which recently expanded its Bitcoin treasury strategy by acquiring Nasdaq-listed Super League Enterprise, also gained more than 16%.</p><p style='margin-bottom: 1.25em;'>Shares of crypto exchange Coinbase and brokerage platform Robinhood posted double-digit percentage gains, underscoring how BTC\u2019s recovery spilled over into publicly traded companies with direct exposure to digital assets.</p><p style='margin-bottom: 1.25em;'>Crypto-related stocks were rallying as Bitcoin extended its weekly gain to more than 23% on Friday, briefly topping $79,000, according to CoinMarketCap data. Ether (ETH) gained nearly 30% over the same period, climbing above $2,400.</p><p style='margin-bottom: 1.25em;'>Related: Crypto Biz: Treasury\u2019s \u2018Not-QE\u2019 playbook sends Bitcoin higher</p><p style='margin-bottom: 1.25em;'>Trump adds regulatory tailwinds to crypto rally</p><p style='margin-bottom: 1.25em;'>Digital asset markets also drew support from comments by US President Donald Trump on Thursday, when he renewed calls for Congress to advance the CLARITY Act. The legislation remains stalled after lawmakers failed to move it forward before the August recess.</p><p style='margin-bottom: 1.25em;'>The bill is viewed as a potentially significant step toward establishing a clearer regulatory framework for digital assets in the United States, including defining the respective oversight roles of the Commodity Futures Trading Commission and Securities and Exchange Commission.</p><p style='margin-bottom: 1.25em;'>Trump also revived the prospect of the US government acquiring Bitcoin at a \u201csizable\u201d scale following meetings with crypto industry leaders this week.</p><p style='margin-bottom: 1.25em;'>Related: Bitcoin ETFs draw $517M in largest one-day inflow since early May</p>"}, {"id": 46, "source": "Cointelegraph", "category": "crypto", "title": "Crypto Biz: Treasury\u2019s \u2018Not-QE\u2019 playbook sends Bitcoin higher", "link": "https://cointelegraph.com/news/crypto-biz-treasurys-not-qe-playbook-sends-bitcoin-higher?utm_source=rss_feed&amp;utm_medium=rss&amp;utm_campaign=rss_partner_inbound", "iso_date": "2026-08-21T15:50:08+00:00", "date_str": "Aug 21 \u2022 03:50 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Crypto Biz: Treasury\u2019s \u2018Not-QE\u2019 playbook sends Bitcoin higher</p><p style='margin-bottom: 1.25em;'>Bitcoin rallied as Treasury bond buybacks fueled the \u201cnot-QE\u201d trade, while Metaplanet expanded to the US and Cypherpunk made a $33 million Zcash mining bet.</p><p style='margin-bottom: 1.25em;'>Bitcoin and the broader digital asset market got a taste of \u201cnot-QE\u201d this week \u2014 and liked it.</p><p style='margin-bottom: 1.25em;'>The price of Bitcoin (BTC) jumped more than 23% toward $79,000 and Ether\u2019s price crossed $2,400 after the US Treasury moved to double certain long-dated bond buybacks, adding fuel to an increasingly important question for digital asset markets. If Washington keeps finding new ways to support liquidity without technically embarking on quantitative easing, could Bitcoin and other risk assets become some of the biggest beneficiaries?</p><p style='margin-bottom: 1.25em;'>That question is already shaping business decisions across crypto. Standard Chartered sees Bitcoin heading toward $100,000, Metaplanet is taking its Bitcoin treasury strategy to the US and Cypherpunk Technologies is making a $33 million bet on Zcash mining.</p><p style='margin-bottom: 1.25em;'>Standard Chartered analyst sees Bitcoin reaching $100,000 as Treasury buybacks expand</p><p style='margin-bottom: 1.25em;'>Standard Chartered analyst Geoff Kendrick said Bitcoin could reach $100,000 by year-end as the US Treasury doubles long-end bond buybacks, a move he described as \u201cexactly the type of thing Bitcoin loves.\u201d</p><p style='margin-bottom: 1.25em;'>Kendrick said in a client note that BTC\u2019s key technical level is $65,500 and breaking above it could confirm the cycle low is in. He cited Wednesday\u2019s Treasury plan to at least double buyback operations for 10- to 20-year and 20- to 30-year coupons. Long-dated yields fell, and Bitcoin\u2019s price immediately climbed more than 6% to nearly $69,000, its highest since early June, per CoinMarketCap.</p><p style='margin-bottom: 1.25em;'>The expanded program runs Sept. 9 through Nov. 4. Kendrick argues Bitcoin tends to benefit from government liquidity interventions and its fixed supply resists monetary debasement. The call still depends on BTC holding above $65,500. Without that, the cycle low cannot be confirmed.</p><p style='margin-bottom: 1.25em;'>Metaplanet expands Bitcoin treasury strategy to US with Super League deal</p><p style='margin-bottom: 1.25em;'>Metaplanet plans to take a controlling stake in Nasdaq-listed Super League Enterprise, expanding its Bitcoin treasury strategy to the US.</p><p style='margin-bottom: 1.25em;'>The Tokyo firm will contribute 2,100 BTC and $2.5 million in cash to Super League, which will be renamed Superplanet. That BTC, worth roughly $145 million, is under 5% of Metaplanet\u2019s 43,000 holdings and comes from existing treasury, not new purchases. CEO Simon Gerovich said the structure gives two capital-raising avenues: Superplanet in US markets and Metaplanet in Japan. Shares of Super League surged over 50% on the news.</p><p style='margin-bottom: 1.25em;'>The deal is expected to close in the fourth quarter, subject to shareholder approval and customary conditions.</p><p style='margin-bottom: 1.25em;'>Cypherpunk launches Zcash mining fleet controlling 18% of network hashrate</p><p style='margin-bottom: 1.25em;'>Cypherpunk Technologies is expanding into Zcash (ZEC) mining after acquiring a fleet from Winklevoss Capital in a $33.33 million equity deal, giving the publicly traded firm roughly 18% of the network\u2019s hashrate.</p><p style='margin-bottom: 1.25em;'>The mining operation is already online at US facilities, producing about 4.2 GSol/s, or roughly 18% of Zcash\u2019s current hashrate. Cypherpunk also holds 323,394 ZEC, about 1.9% of circulating supply, and targets 5% ownership. It has pitched Zcash mining as offering more attractive economics than Bitcoin mining or AI data center workloads.</p><p style='margin-bottom: 1.25em;'>However, those economics depend heavily on ZEC\u2019s price, network hashrate, mining difficulty, and operating costs. The push follows a rally that saw the price of ZEC rise more than 1,300% over 12 months, though it has since corrected. The network implemented its Ironwood upgrade on July 28 to replace the Orchard pool after a flaw that could have allowed counterfeit ZEC creation, though no exploitation was ever detected.</p><p style='margin-bottom: 1.25em;'>CFTC seeks comment on AI compute futures as CME eyes October launch</p><p style='margin-bottom: 1.25em;'>The US Commodity Futures Trading Commission (CFTC) is seeking public comment on futures contracts tied to AI computing capacity, a step that could shape an emerging market for trading and hedging the cost of computing power.</p><p style='margin-bottom: 1.25em;'>Bloomberg reported Monday that the regulator sent a request for comment to the White House Office of Management and Budget. CME Group announced last week it plans to launch two compute futures contracts on Oct. 5, pending regulatory approval, with Silicon Data providing the benchmarks. Estimates from TD Lombard, Goldman Sachs and Bridgewater Associates put AI infrastructure spending at roughly 2% to 2.5% of US GDP this year.</p><p style='margin-bottom: 1.25em;'>The review could complicate the timeline for planned compute products from CME Group and Intercontinental Exchange, which remain subject to regulatory approval. Once the White House review is complete, the CFTC is expected to open a comment period, typically lasting 30 or 60 days, according to Bloomberg.</p><p style='margin-bottom: 1.25em;'>Crypto Biz is your weekly pulse on the business behind blockchain and crypto, delivered directly to your inbox every Thursday.</p>"}, {"id": 47, "source": "Mining.com", "category": "metals", "title": "Europe relies increasingly on Russia for uranium needs, Sprott says", "link": "https://www.mining.com/europe-relies-increasingly-on-russia-for-uranium-needs-sprott-says/", "iso_date": "2026-08-21T15:35:47+00:00", "date_str": "Aug 21 \u2022 03:35 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Europe relies increasingly on Russia for uranium needs, Sprott says</p><p style='margin-bottom: 1.25em;'>European reliance on Russian nuclear fuel increased in 2025 despite efforts to diversify its uranium supply after Russia\u2019s invasion of Ukraine, Sprott Asset Management said in a new report this week.</p><p style='margin-bottom: 1.25em;'>Russian uranium deliveries to EU utilities rose 7%, conversion deliveries rose 9% and uranium enrichment sales gained by 12% last year, Jacob White, director of ETF Product Management wrote in the report titled \u201cOn the Cusp of a New Contracting Cycle.\u201d</p><p style='margin-bottom: 1.25em;'>\u201cEuropean utilities must secure alternative uranium supply and fuel-processing capacity to replace Russian material, increasing competition for production from Western and allied suppliers just as existing contracts begin to roll off,\u201d White said.</p><p style='margin-bottom: 1.25em;'>Competition for uranium</p><p style='margin-bottom: 1.25em;'>Kazakhstan, the world\u2019s top uranium producer, will be central to that competition and in 2025 provided 20% of the uranium delivered to EU utilities, White noted. However, a \u201csignificant share\u201d of the Central Asian country\u2019s output is already destined for China, Russia and increasingly India under long-term contracts.</p><p style='margin-bottom: 1.25em;'>The numbers reveal the vulnerability of the West\u2019s nuclear revival as governments turn to atomic power for reliable electricity and greater energy security. But expanding reactor fleets will also require additional Western uranium mining, conversion and enrichment capacity to reduce dependence on Russia.</p><p style='margin-bottom: 1.25em;'>Russia\u2019s share of European uranium market supply is significant, at 16% overall, 24% of conversion and 23% of enrichment, the report said.</p><p style='margin-bottom: 1.25em;'>A similar dependence affects the United States, which imports the majority of its uranium needs from Canada, Kazakhstan, Australia and Russia. Kazakhstan supplied 28% of the uranium delivered to U.S. utilities last year.</p><p style='margin-bottom: 1.25em;'>Contracting conundrum</p><p style='margin-bottom: 1.25em;'>Through Aug. 10, about 37 million lb. of uranium oxide have been contracted globally for 2026, marking the 14th consecutive year of utilities signing long-term supply contracts for less uranium than they\u2019re consuming.</p><p style='margin-bottom: 1.25em;'>That\u2019s due to utilities benefitting from favourable terms in legacy contracts that gave flexible options, permitting them to increase uranium delivery loads. But as legacy contracts expire that supply buffer will go away and annual contracting below consumption levels defers future demand.</p><p style='margin-bottom: 1.25em;'>\u201cUtilities can defer purchasing, but they cannot shorten the time required to develop a new uranium supply,\u201d White said. \u201cUtilities can return to the market relatively quickly once they decide to purchase. Producers cannot respond on the same timeline,\u201d and their operations take years to bring to production.</p><p style='margin-bottom: 1.25em;'>But producers aren\u2019t likely to reserve long-term delivery unless contract prices compensate them for development costs, inflation and project risks.</p><p style='margin-bottom: 1.25em;'>White noted that Cameco (TSX: CCO)(NYSE: CCJ), in its July earnings call described the uranium market as still in the early stages of a contracting cycle, though the long-term uranium price is already at $94 per lb., its highest in 18 years.</p><p style='margin-bottom: 1.25em;'>Broad demand rise</p><p style='margin-bottom: 1.25em;'>Aside from new reactor construction, another source of uranium demand is existing reactors whose lives have been extended or that have been restarted.</p><p style='margin-bottom: 1.25em;'>\u201cUprates will also increase future uranium demand as utilities look to generate more electricity with the current fleet of reactors,\u201d White said.</p><p style='margin-bottom: 1.25em;'>That trend comes alongside conventional reactors advancing towards operation, especially in China, while India announced in July it plans to spend more than $2 billion on at least five small modular reactors by 2033.</p><p style='margin-bottom: 1.25em;'>Those developments point to more uranium consumption in the coming years, Sprott said.</p><p style='margin-bottom: 1.25em;'>More News</p><p style='margin-bottom: 1.25em;'>Greenland Mines gets mineral exploration license for Safartoq project, stock surges</p><p style='margin-bottom: 1.25em;'>August 21, 2026 | 03:36 pm</p><p style='margin-bottom: 1.25em;'>{{ commodity.name }}</p><p style='margin-bottom: 1.25em;'>{{ post.title }}</p><p style='margin-bottom: 1.25em;'>{{ post.date }}</p>"}, {"id": 48, "source": "Mining.com", "category": "metals", "title": "Gold price gets US bond policy boost", "link": "https://www.mining.com/gold-price-gets-us-bond-policy-boost/", "iso_date": "2026-08-21T15:01:44+00:00", "date_str": "Aug 21 \u2022 03:01 PM UTC", "full_text": "<p style='margin-bottom: 1.25em;'>Gold price gets US bond policy boost</p><p style='margin-bottom: 1.25em;'>Gold\u2019s surge to about $4,600 per oz. this week may have further to run if US policymakers increasingly intervene to hold down long-term borrowing costs, according to the World Gold Council.</p><p style='margin-bottom: 1.25em;'>Bullion climbed to a three-month high Friday after the United States Treasury unexpectedly expanded purchases of longer-dated government bonds, weakening the US dollar and reinforcing investor concerns over Washington\u2019s growing debt burden \u2014 which hit $40 trillion just this week after doubling in less than a decade.</p><p style='margin-bottom: 1.25em;'>The Treasury announced Aug. 19 that it would double buybacks of longer-dated Treasuries after yields climbed to their highest levels in years. The move immediately pushed bond yields and the dollar lower while sending spot gold up more than 3% to nearly $4,500 per oz., its biggest one-day gain since February. By Friday, bullion had climbed above $4,600, extending its rally to a third straight week.</p><p style='margin-bottom: 1.25em;'>Cambridge University economist Mohamed El-Erian said the Treasury\u2019s action was \u201cnot yield-curve control (YCC) but it might be a step in that direction,\u201d a view highlighted by the World Gold Council in a report on Friday examining what the policy shift could mean for bullion investors.</p><p style='margin-bottom: 1.25em;'>The council argues that the Treasury\u2019s announcement reflects a deeper challenge confronting US financial markets. Persistent fiscal deficits require ever-larger bond issuance while a rapidly expanding stock of outstanding debt must also be refinanced. At the same time, some of the market\u2019s traditional buyers are becoming less dependable. Foreign central banks are diversifying reserves, and investors abroad have alternatives offering attractive returns.</p><p style='margin-bottom: 1.25em;'>Hedge funds</p><p style='margin-bottom: 1.25em;'>Banks remain constrained by capital rules and corporate borrowing tied to artificial intelligence and data-centre construction is competing for investor capital, said Johan Palmberg, senior quantitative analyst at the World Gold Council. A growing share of Treasury demand now comes from more price-sensitive investors such as hedge funds.</p><p style='margin-bottom: 1.25em;'>Those pressures have left investors demanding higher compensation for holding long-dated government debt, Palmberg said. The recent rise in Treasury yields suggests markets no longer assume Washington\u2019s expanding debt supply will be absorbed effortlessly, he said. Instead, the balance between supply and demand is becoming an increasingly important driver of bond prices.</p><p style='margin-bottom: 1.25em;'>If market pressures continue, policymakers could eventually consider yield-curve control, under which the US Federal Reserve would buy bonds to cap longer-term interest rates directly, he said. While the Treasury\u2019s approach is being presented as a market-functioning measure, Palmberg suggested the distinction could become blurred.</p><p style='margin-bottom: 1.25em;'>\u201cJust because it walks like a duck and quacks like a duck, doesn\u2019t mean it\u2019s a duck,\u201d he wrote. \u201cIt\u2019s monetary policy\u2019s version of plausible deniability.\u201d</p><p style='margin-bottom: 1.25em;'>The policy was used in the United States during the 1940s and has also been adopted in recent years by Japan and Australia. Unlike quantitative easing, which targets the quantity of bonds purchased and substantially expands a central bank\u2019s balance sheet, yield-curve control targets a specific interest rate and can require much less intervention if markets believe policymakers will defend the ceiling.</p><p style='margin-bottom: 1.25em;'>How gold benefits</p><p style='margin-bottom: 1.25em;'>For gold investors, Palmberg sees three principal benefits if the United States eventually moves in that direction. First, yield-curve control would probably weaken the US dollar by shifting the adjustment away from bond markets and into the currency.</p><p style='margin-bottom: 1.25em;'>\u201cThe expensive US dollar is already facing pressure from several corners and YCC . . . could increasingly force the adjustment through the currency rather than the bond market,\u201d he wrote.</p><p style='margin-bottom: 1.25em;'>Because gold is priced in US dollars, a weaker greenback generally makes bullion cheaper for buyers using other currencies and tends to support prices.</p><p style='margin-bottom: 1.25em;'>Second, capping government bond yields while inflation remains elevated would likely reduce real interest rates. Gold has historically performed well when inflation-adjusted bond yields decline because the opportunity cost of holding a non-yielding asset falls.</p><p style='margin-bottom: 1.25em;'>Third, investors could increasingly view gold as protection against what economists call financial repression \u2014 governments holding borrowing costs below market levels to make debt more manageable.</p><p style='margin-bottom: 1.25em;'>Uncertainty</p><p style='margin-bottom: 1.25em;'>\u201cA Treasury market that clears at an administratively influenced price brings uncertainty because investors don\u2019t know where yields would settle absent intervention,\u201d Palmberg wrote. He added that \u201cmarkets can be relentless. It doesn\u2019t require aggressive short sellers . . . just an absence of buyers.\u201d</p><p style='margin-bottom: 1.25em;'>Palmberg cautioned that the outcome would not necessarily be uniformly positive for bullion. A credible and temporary yield-curve control program could
